{"id":"s3-rw-conv-11","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The startup exhausted its entire seed funding within a single year ______ its founders remained oddly optimistic about a second round.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[". Its",", its"," its",": its"],"ans":0,"exp":{"why":"Two complete independent clauses can be written as two separate sentences, so a period followed by a capital letter is correct.","traps":{"A":"Correct: a period separates the two independent clauses into complete sentences.","B":"A comma alone between two independent clauses is a comma splice.","C":"With no punctuation, the clauses are fused into a run-on.","D":"A colon requires the second part to explain the first; here it simply adds a contrasting fact."},"skill":"Boundaries","strat":"A period can always separate two independent clauses into two sentences."}},
{"id":"s3-rw-conv-12","sec":"rw","dom":"conv","skill":"Boundaries","dif":"H","type":"mcq","stim":"<p>The three finalists ______ each a veteran of several previous competitions — delivered nearly flawless performances before the judges.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", each"," each","; each"," — each"],"ans":3,"exp":{"why":"The nonessential element is closed with a dash, so it must be opened with a matching dash; paired punctuation must be the same on both sides.","traps":{"A":"A comma cannot pair with the closing dash; paired marks must match.","B":"Omitting the opening dash leaves the interrupting element unbounded.","C":"A semicolon cannot open a mid-sentence nonessential element.","D":"Correct: an opening dash matches the closing dash around the nonessential element."},"skill":"Boundaries","strat":"Set off a nonessential element with a matched pair of the same punctuation marks."}},
{"id":"s3-rw-conv-13","sec":"rw","dom":"conv","skill":"Boundaries","dif":"H","type":"mcq","stim":"<p>The glacier has retreated nearly a mile since the first survey was taken ______ researchers now worry that the valley's streams will run dry.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", ","; "," ",", which "],"ans":1,"exp":{"why":"Both parts are independent clauses, so a semicolon is needed to join them.","traps":{"A":"A comma alone between two independent clauses is a comma splice.","B":"Correct: a semicolon joins the two closely related independent clauses.","C":"With no punctuation, the two clauses form a run-on.","D":"‘Which' has no clear noun to modify and cannot introduce the following full clause."},"skill":"Boundaries","strat":"When both sides are full sentences, a semicolon can join them."}},
{"id":"s3-rw-conv-14","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>The museum's collection of rare Byzantine stamps ______ displayed in the east gallery for only one month each year.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["are","were","is","have been"],"ans":2,"exp":{"why":"The subject is the singular ‘collection,' not the plural object ‘stamps,' so the verb must be singular ‘is.'","traps":{"A":"‘Are' is plural, mistakenly agreeing with ‘stamps' inside the prepositional phrase.","B":"‘Were' is plural and also shifts the tense unnecessarily.","C":"Correct: singular ‘is' agrees with the singular subject ‘collection.'","D":"‘Have been' is plural, again agreeing with ‘stamps' rather than ‘collection.'"},"skill":"Form, Structure & Sense","strat":"Match the verb to the true subject, ignoring words in an interrupting phrase."}},
{"id":"s3-rw-conv-15","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Each of the wilderness volunteers must submit ______ own signed liability waiver before the group departs for the trailhead.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","his or her","there","they're"],"ans":1,"exp":{"why":"‘Each' is grammatically singular, so its pronoun must be the singular ‘his or her.'","traps":{"A":"‘Their' is plural and does not agree with the singular ‘each.'","B":"Correct: singular ‘his or her' agrees with the singular antecedent ‘each.'","C":"‘There' is an adverb of place, not a possessive pronoun.","D":"‘They're' means ‘they are' and is not possessive."},"skill":"Form, Structure & Sense","strat":"‘Each,' ‘every,' and ‘one' are singular and take singular pronouns."}},
{"id":"s3-rw-conv-16","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>By the time the firefighters finally arrived at the scene, the abandoned warehouse ______ nearly to the ground.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["had burned","burned","has burned","burns"],"ans":0,"exp":{"why":"The warehouse's burning was completed before the firefighters arrived, so the earlier past action takes the past perfect ‘had burned.'","traps":{"A":"Correct: past perfect ‘had burned' marks the action completed before the later past event.","B":"Simple past ‘burned' fails to show that the burning preceded the arrival.","C":"Present perfect ‘has burned' clashes with the clearly past time frame.","D":"Present tense ‘burns' contradicts the past-tense narration."},"skill":"Form, Structure & Sense","strat":"Use past perfect for the earlier of two past actions."}},
{"id":"s3-rw-conv-17","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>The summer internship taught her to write code efficiently, to explain technical ideas clearly, and ______ calmly under sudden deadline pressure.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["working","she worked","work","to work"],"ans":3,"exp":{"why":"The series consists of parallel infinitives (‘to write,' ‘to explain'), so the third item must also be an infinitive, ‘to work.'","traps":{"A":"The gerund ‘working' breaks the infinitive pattern of the series.","B":"The clause ‘she worked' is not parallel with the infinitive items.","C":"The bare verb ‘work' omits ‘to' and breaks parallelism.","D":"Correct: ‘to work' keeps the list of infinitives parallel."},"skill":"Form, Structure & Sense","strat":"Items in a list must share the same grammatical form."}},
{"id":"s3-rw-conv-18","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The total rainfall recorded this year was far greater than ______ of any single year in the previous decade.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["that","those","them","it"],"ans":0,"exp":{"why":"The comparison is to the singular noun ‘rainfall,' so the singular ‘that' is required.","traps":{"A":"Correct: singular ‘that' stands in for the singular ‘rainfall.'","B":"‘Those' is plural and cannot replace the singular ‘rainfall.'","C":"‘Them' is an object pronoun and cannot serve as the point of comparison here.","D":"‘It' cannot take the possessive ‘of' construction needed for the comparison."},"skill":"Form, Structure & Sense","strat":"Use ‘that' for a singular noun and ‘those' for a plural noun in comparisons."}},
{"id":"s3-rw-conv-19","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Neither the head coach nor the veteran players ______ satisfied with the referee's controversial final call.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","is","were","has been"],"ans":2,"exp":{"why":"In a ‘neither…nor' subject, the verb agrees with the nearer subject, ‘players,' which is plural, so ‘were' is correct.","traps":{"A":"‘Was' is singular and does not agree with the nearer plural subject ‘players.'","B":"‘Is' is singular and also wrongly shifts to present tense.","C":"Correct: ‘were' agrees with the nearer plural subject ‘players.'","D":"‘Has been' is singular and disagrees with ‘players.'"},"skill":"Form, Structure & Sense","strat":"With ‘neither…nor,' the verb agrees with the subject closer to it."}},
{"id":"s3-rw-conv-20","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>Dr. Okafor is one of those field researchers who ______ never fully satisfied with a single tidy explanation for a phenomenon.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["is","are","was","has been"],"ans":1,"exp":{"why":"In a ‘one of those…who' construction, ‘who' refers to the plural ‘researchers,' so the verb is plural ‘are.'","traps":{"A":"‘Is' wrongly agrees with ‘one' rather than with the plural ‘researchers' that ‘who' refers to.","B":"Correct: ‘are' agrees with the plural ‘researchers,' the antecedent of ‘who.'","C":"‘Was' is singular and also shifts the tense.","D":"‘Has been' is singular and misidentifies the antecedent."},"skill":"Form, Structure & Sense","strat":"In ‘one of those X who,' the verb agrees with the plural X, not with ‘one.'"}},
{"id":"s3-rw-conv-21","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>The hiring committee recommended that the new analyst ______ a senior mentor throughout her first month on the job.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["be assigned","is assigned","was assigned","will be assigned"],"ans":0,"exp":{"why":"After a verb of recommendation, the subordinate clause takes the subjunctive base form ‘be assigned.'","traps":{"A":"Correct: the subjunctive ‘be assigned' follows ‘recommended that.'","B":"‘Is assigned' is indicative, not the required subjunctive form.","C":"‘Was assigned' is indicative past and not subjunctive.","D":"‘Will be assigned' is future indicative, not the subjunctive required after ‘recommended.'"},"skill":"Form, Structure & Sense","strat":"After recommend, require, or suggest that, use the base-form subjunctive verb."}},
{"id":"s3-rw-conv-22","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The lingering disagreement over the annual budget remained strictly between the director and ______.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["I","myself","we","me"],"ans":3,"exp":{"why":"The pronoun is an object of the preposition ‘between,' so the objective-case ‘me' is required.","traps":{"A":"‘I' is subjective case and cannot serve as the object of ‘between.'","B":"‘Myself' is a reflexive pronoun with no antecedent to reflect here.","C":"‘We' is subjective case and cannot be an object.","D":"Correct: objective-case ‘me' follows the preposition ‘between.'"},"skill":"Form, Structure & Sense","strat":"After a preposition like ‘between,' use the objective pronoun (me, him, her, us, them)."}},
{"id":"s3-rw-conv-23","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Walking slowly along the fog-covered shoreline just after dawn, ______.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the lighthouse gradually came into view","a pod of dolphins was spotted offshore","we spotted a pod of dolphins offshore","there were dolphins visible offshore"],"ans":2,"exp":{"why":"The introductory participial phrase must modify the noun that does the walking, so the main clause needs a subject who can walk, ‘we.'","traps":{"A":"This makes the lighthouse the walker, a dangling modifier.","B":"The passive construction leaves the phrase attached to the dolphins, who were not walking.","C":"Correct: ‘we' is the one walking, so the modifier attaches properly.","D":"‘There' cannot be the walker, so the modifier dangles."},"skill":"Form, Structure & Sense","strat":"The noun right after an introductory ‑ing phrase must be the one performing that action."}},
{"id":"s3-rw-conv-24","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>If the city council had approved the transit proposal last spring, construction on the new rail line ______ well underway by now.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["would have been","would be","will be","had been"],"ans":0,"exp":{"why":"The ‘if' clause uses the past-perfect ‘had approved,' signaling a past-unreal conditional, so the result clause takes ‘would have been.'","traps":{"A":"Correct: ‘would have been' completes the past-unreal conditional set up by ‘had approved.'","B":"‘Would be' fits a present-unreal condition, not the past-unreal ‘had approved.'","C":"‘Will be' is future indicative and does not match a contrary-to-fact past condition.","D":"‘Had been' repeats the past-perfect and cannot serve as the result clause."},"skill":"Form, Structure & Sense","strat":"Past-unreal conditionals pair ‘had + participle' with ‘would have + participle.'"}},
{"id":"s3-rw-conv-25","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The jury ______ its unanimous verdict to a hushed and expectant courtroom late this afternoon.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["announce","announces","are announcing","have announced"],"ans":1,"exp":{"why":"The collective noun ‘jury' acts as a single unit here, confirmed by the singular ‘its,' so it takes the singular verb ‘announces.'","traps":{"A":"‘Announce' is plural and clashes with the singular collective subject and ‘its.'","B":"Correct: singular ‘announces' agrees with the collective noun acting as one unit.","C":"‘Are announcing' is plural and conflicts with the singular ‘its.'","D":"‘Have announced' is plural and disagrees with the singular subject."},"skill":"Form, Structure & Sense","strat":"A collective noun acting as one unit takes a singular verb."}},
{"id":"s3-rw-conv-26","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>Among the many artifacts recovered from the sunken merchant ship ______ a single gold coin minted during the reign of a long-forgotten emperor.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["were","are","was","have been"],"ans":2,"exp":{"why":"The sentence is inverted; the true subject is the singular ‘a single gold coin,' so the verb must be singular ‘was.'","traps":{"A":"‘Were' is plural, wrongly agreeing with ‘artifacts' in the opening phrase.","B":"‘Are' is plural and also shifts to present tense.","C":"Correct: singular ‘was' agrees with the true subject ‘a single gold coin.'","D":"‘Have been' is plural and again agrees with ‘artifacts' instead of the real subject."},"skill":"Form, Structure & Sense","strat":"In an inverted sentence, find the subject that follows the verb and match it."}},
{"id":"s3-rw-expr-01","sec":"rw","dom":"expr","skill":"Transitions","dif":"E","type":"mcq","stim":"<p>The city installed hundreds of new bike lanes along its busiest corridors last spring. ______ the number of cyclists commuting downtown rose sharply within a few months.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["For example,","As a result,","However,","Similarly,"],"ans":1,"exp":{"why":"The first sentence names a cause (new bike lanes) and the second states its effect (more cyclists), so a cause-and-effect transition is needed.","traps":{"A":"‘For example,’ signals an illustration of a prior claim, but the second sentence is an outcome, not an instance.","B":"Correct: ‘As a result,’ marks the rise in cyclists as the consequence of building the lanes.","C":"‘However,’ signals contrast, yet the two ideas agree rather than conflict.","D":"‘Similarly,’ signals comparison, but no second parallel situation is offered."},"skill":"Transitions","strat":"Ask whether the second sentence is the result of the first; if so, choose a cause/effect transition."}},
{"id":"s3-rw-expr-02","sec":"rw","dom":"expr","skill":"Transitions","dif":"E","type":"mcq","stim":"<p>Many gardeners assume that nearly all insects harm their plants. ______ a large share of insects are pollinators or predators that actually protect crops.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["However,","Therefore,","In addition,","For instance,"],"ans":0,"exp":{"why":"The second sentence corrects the mistaken assumption in the first, so a contrast transition is required.","traps":{"A":"Correct: ‘However,’ sets the reality of helpful insects against the common assumption.","B":"‘Therefore,’ signals a conclusion, but the second idea opposes rather than follows from the first.","C":"‘In addition,’ signals more of the same point, yet the sentences conflict.","D":"‘For instance,’ signals an example, but the second sentence reverses the claim instead of illustrating it."},"skill":"Transitions","strat":"When a sentence overturns a stated belief, reach for a contrast word."}},
{"id":"s3-rw-expr-03","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>The experimental alloy resists corrosion far better than ordinary steel. ______ it weighs nearly a third less, which makes it well suited for aircraft.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","Moreover,","For example,","Meanwhile,"],"ans":1,"exp":{"why":"The second sentence supplies an additional advantage (lighter weight) on top of the first advantage (corrosion resistance), so an addition transition fits.","traps":{"A":"‘Nevertheless,’ signals contrast, but both sentences praise the alloy.","B":"Correct: ‘Moreover,’ stacks a second benefit onto the first.","C":"‘For example,’ signals an instance of one claim, but lighter weight is a separate property, not an illustration.","D":"‘Meanwhile,’ signals simultaneous events, which does not match two listed traits."},"skill":"Transitions","strat":"If the second sentence adds another point in the same direction, choose an addition transition."}},
{"id":"s3-rw-expr-04","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>Several desert animals have evolved striking ways to conserve water. ______ the kangaroo rat can survive without ever drinking, drawing moisture from the dry seeds it eats.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["By contrast,","For example,","Therefore,","Nonetheless,"],"ans":1,"exp":{"why":"The second sentence gives a specific instance of the general claim about water-conserving desert animals, so an example transition fits.","traps":{"A":"‘By contrast,’ signals opposition, but the kangaroo rat supports the general claim.","B":"Correct: ‘For example,’ presents the kangaroo rat as one case of the stated adaptation.","C":"‘Therefore,’ signals a conclusion, but the sentence illustrates rather than concludes.","D":"‘Nonetheless,’ signals concession, yet there is no obstacle being overcome."},"skill":"Transitions","strat":"A named specific case following a broad statement calls for an example transition."}},
{"id":"s3-rw-expr-05","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>Renaissance painters in Florence favored balanced, carefully symmetrical compositions. ______ Venetian artists of the same era emphasized vivid color and dramatic contrasts of light.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["As a result,","In addition,","By contrast,","For instance,"],"ans":2,"exp":{"why":"The two sentences set Florentine priorities against Venetian priorities, so a contrast transition is needed.","traps":{"A":"‘As a result,’ signals cause and effect, but Venetian practice is not caused by Florentine practice.","B":"‘In addition,’ signals agreement, yet the two schools are being distinguished.","C":"Correct: ‘By contrast,’ highlights the opposing artistic emphasis of the two cities.","D":"‘For instance,’ signals an example, but the Venetian sentence is a counterpart, not an illustration."},"skill":"Transitions","strat":"When two groups are compared and their traits differ, select a contrast transition."}},
{"id":"s3-rw-expr-06","sec":"rw","dom":"expr","skill":"Transitions","dif":"H","type":"mcq","stim":"<p>The polar expedition lost two of its supply sledges in a storm and faced dwindling rations. ______ the team pressed on and reached the far coast ahead of schedule.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Consequently,","Likewise,","Nonetheless,","For example,"],"ans":2,"exp":{"why":"The team succeeded in spite of serious setbacks, so a concession transition that signals ‘despite this’ is required.","traps":{"A":"‘Consequently,’ would make the success a result of the losses, which is illogical.","B":"‘Likewise,’ signals similarity, but success and hardship are opposed.","C":"Correct: ‘Nonetheless,’ shows the team advancing despite the storm and shortages.","D":"‘For example,’ signals an instance, but the second sentence is an outcome, not an illustration."},"skill":"Transitions","strat":"If a good result follows named obstacles, use a concession word meaning ‘in spite of that.’"}},
{"id":"s3-rw-expr-07","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>In the laboratory, one group of researchers analyzed the soil samples for bacteria. ______ a second group hundreds of miles away tested water drawn from the same river.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Therefore,","Meanwhile,","In other words,","However,"],"ans":1,"exp":{"why":"The sentences describe two parallel activities happening at the same time in different places, so a transition of simultaneity fits.","traps":{"A":"‘Therefore,’ signals a consequence, but the second task is not caused by the first.","B":"Correct: ‘Meanwhile,’ marks the second group working at the same time elsewhere.","C":"‘In other words,’ signals restatement, but the second sentence introduces new activity.","D":"‘However,’ signals contrast, yet the two efforts complement rather than oppose each other."},"skill":"Transitions","strat":"Two simultaneous, parallel actions call for a transition of concurrent time."}},
{"id":"s3-rw-expr-08","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>The composer refused to repeat any melodic phrase exactly across the entire symphony. ______ no listener would ever hear the same musical idea stated twice.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["By contrast,","For example,","In other words,","Meanwhile,"],"ans":2,"exp":{"why":"The second sentence restates the first idea in plainer terms, so a restatement transition is required.","traps":{"A":"‘By contrast,’ signals opposition, but the sentences express the same point.","B":"‘For example,’ signals a specific case, yet the second sentence is a rephrasing, not an instance.","C":"Correct: ‘In other words,’ recasts the composer’s rule as its practical effect on listeners.","D":"‘Meanwhile,’ signals simultaneity, which does not match a restated idea."},"skill":"Transitions","strat":"If the second sentence says the same thing more simply, choose a restatement transition."}},
{"id":"s3-rw-expr-09","sec":"rw","dom":"expr","skill":"Transitions","dif":"E","type":"mcq","stim":"<p>Heavy rains saturated the steep hillside for three straight days. ______ the loosened soil eventually gave way in a sudden landslide.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["However,","Likewise,","For example,","Thus,"],"ans":3,"exp":{"why":"The saturated soil is the cause and the landslide is the effect, so a cause/effect transition fits.","traps":{"A":"‘However,’ signals contrast, but the landslide follows logically from the rain.","B":"‘Likewise,’ signals similarity, yet no second comparable situation appears.","C":"‘For example,’ signals an instance, but the landslide is a result, not an illustration.","D":"Correct: ‘Thus,’ presents the landslide as the outcome of the soaking rains."},"skill":"Transitions","strat":"Rain that produces a slide is cause-then-effect, so pick a consequence transition."}},
{"id":"s3-rw-expr-10","sec":"rw","dom":"expr","skill":"Transitions","dif":"H","type":"mcq","stim":"<p>Early reviewers dismissed the novel as clumsy and overlong when it first appeared. ______ it has since become a fixture on university reading lists around the world.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Therefore,","Nevertheless,","Similarly,","For instance,"],"ans":1,"exp":{"why":"The book’s later acclaim runs counter to its early rejection, so a contrast transition is needed.","traps":{"A":"‘Therefore,’ signals a consequence, but lasting fame does not result from the harsh reviews.","B":"Correct: ‘Nevertheless,’ contrasts the novel’s enduring standing with its poor reception.","C":"‘Similarly,’ signals agreement, yet the two outcomes are opposed.","D":"‘For instance,’ signals an example, but the second sentence reverses rather than illustrates the first."},"skill":"Transitions","strat":"A reputation that reverses over time signals contrast, not consequence."}},
{"id":"s3-rw-expr-11","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>The new scholarship covers the full cost of tuition for each of its recipients. ______ it provides a monthly stipend to help with housing and textbooks.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Otherwise,","However,","In addition,","For example,"],"ans":2,"exp":{"why":"The second sentence names a further benefit beyond tuition, so an addition transition fits.","traps":{"A":"‘Otherwise,’ signals an alternative outcome, which does not match a second listed benefit.","B":"‘However,’ signals contrast, but both sentences describe advantages.","C":"Correct: ‘In addition,’ adds the stipend to the tuition coverage already mentioned.","D":"‘For example,’ signals an instance of one point, but the stipend is a separate benefit."},"skill":"Transitions","strat":"A second benefit layered onto the first calls for an addition transition."}},
{"id":"s3-rw-expr-12","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"E","type":"mcq","stim":"<p>While researching desert-adapted plants, a student took the following notes:</p><ul><li>The baobab is a tree found in dry regions of Africa and Australia.</li><li>Its swollen trunk can store a large amount of water.</li><li>The stored water helps the tree survive long droughts.</li><li>Some baobabs live for more than a thousand years.</li></ul>","prompt":"The student wants to explain the purpose of the baobab’s swollen trunk. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The baobab, which can live for more than a thousand years, is found in Africa and Australia.","The baobab’s trunk is swollen and able to hold a large amount of water.","The baobab stores water in its swollen trunk so that it can survive the long droughts of its dry habitat.","Baobab trees grow in the dry regions of both Africa and Australia."],"ans":2,"exp":{"why":"The goal asks for the purpose of the trunk; only the choice that links water storage to surviving droughts states why the trunk matters.","traps":{"A":"Combines lifespan and location, neither of which explains the trunk’s function.","B":"Describes the trunk’s capacity but stops short of naming its purpose.","C":"Correct: ties the water-storing trunk to drought survival, giving its purpose.","D":"Reports only where baobabs grow, ignoring the trunk entirely."},"skill":"Rhetorical Synthesis","strat":"For a purpose goal, pick the choice that answers ‘why does this feature exist?’"}},
{"id":"s3-rw-expr-13","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>A student is comparing two sources of renewable electricity and has taken the following notes:</p><ul><li>Solar panels generate electricity only during daylight hours.</li><li>Geothermal plants generate electricity continuously, day and night.</li><li>Solar panels can be installed on rooftops in most locations.</li><li>Geothermal plants require sites where underground heat lies near the surface.</li></ul>","prompt":"The student wants to emphasize a difference between solar and geothermal power generation. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Both solar panels and geothermal plants generate electricity from renewable sources.","Solar panels can be installed on rooftops in most locations.","Geothermal plants require sites where underground heat lies near the surface.","Unlike solar panels, which produce electricity only in daylight, geothermal plants generate power continuously, day and night."],"ans":3,"exp":{"why":"The goal is to emphasize a difference; only the choice that contrasts daytime-only solar output with round-the-clock geothermal output does so.","traps":{"A":"Stresses what the two share, the opposite of emphasizing a difference.","B":"Gives a single fact about solar without any comparison.","C":"Gives a single fact about geothermal without any comparison.","D":"Correct: directly contrasts when each source can generate electricity."},"skill":"Rhetorical Synthesis","strat":"For a contrast goal, choose the option that sets one item against the other with ‘unlike’ or ‘whereas.’"}},
{"id":"s3-rw-expr-14","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>While studying patterns in art, a student took the following notes:</p><ul><li>A tessellation is a pattern of shapes that fit together with no gaps or overlaps.</li><li>Tessellations can be found in tiled floors and in honeycombs.</li><li>The artist M. C. Escher created famous tessellations of birds and fish.</li><li>Escher was born in the Netherlands in 1898.</li></ul>","prompt":"The student wants to introduce the concept of tessellation to an audience unfamiliar with the term. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["A tessellation is a pattern of shapes that fit together perfectly, with no gaps or overlaps, as seen in tiled floors and honeycombs.","M. C. Escher, who was born in the Netherlands in 1898, created famous tessellations.","Escher’s tessellations depict interlocking birds and fish.","Tessellations can be found in tiled floors and in honeycombs."],"ans":0,"exp":{"why":"An unfamiliar audience needs a definition; only the choice that says what a tessellation is, with a familiar example, introduces the concept.","traps":{"A":"Correct: defines the term and grounds it in everyday examples.","B":"Assumes the reader already knows what a tessellation is and adds only biography.","C":"Describes Escher’s images without explaining the term.","D":"Lists examples but never defines the concept for a newcomer."},"skill":"Rhetorical Synthesis","strat":"To introduce an unfamiliar term, favor the choice that defines it plainly."}},
{"id":"s3-rw-expr-15","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>A student researching sleep and learning took the following notes:</p><ul><li>Students who slept eight hours recalled more vocabulary words than those who slept only four.</li><li>The study included only 30 participants.</li><li>All participants were college students at a single university.</li><li>The vocabulary test was given the morning after participants slept.</li></ul>","prompt":"The student wants to present the study’s finding while noting a limitation. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Students who slept eight hours recalled more vocabulary words than those who slept only four.","Students who slept eight hours recalled more words than those who slept four, though the study included only 30 participants.","The study involved 30 college students at a single university.","The vocabulary test was given the morning after participants had slept."],"ans":1,"exp":{"why":"The goal requires both the finding and a limitation; only the choice that reports the recall result and flags the small sample does both.","traps":{"A":"States the finding but includes no limitation.","B":"Correct: pairs the recall result with the limitation of a small sample.","C":"Gives a limitation but omits the finding.","D":"Reports a procedural detail that is neither the finding nor a limitation."},"skill":"Rhetorical Synthesis","strat":"A finding-plus-limitation goal needs one clause of result and one clause of caveat."}},
{"id":"s3-rw-expr-16","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>A student comparing two ancient writing systems took the following notes:</p><ul><li>Egyptian hieroglyphs used pictures to represent both sounds and ideas.</li><li>Mayan glyphs also used pictures to represent both sounds and ideas.</li><li>Egyptian hieroglyphs were written on stone and papyrus.</li><li>Mayan glyphs were carved on monuments and written in bark books.</li></ul>","prompt":"The student wants to emphasize a similarity between the two writing systems. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Egyptian hieroglyphs were written on both stone and papyrus.","Mayan glyphs were carved on monuments and written in bark books.","Egyptian hieroglyphs and Mayan glyphs arose on different continents.","Like Egyptian hieroglyphs, Mayan glyphs used pictures to represent both sounds and ideas."],"ans":3,"exp":{"why":"The goal is to emphasize a similarity; only the choice that shows both systems used pictures for sounds and ideas does so.","traps":{"A":"Reports one fact about hieroglyphs only, drawing no parallel.","B":"Reports one fact about Mayan glyphs only, drawing no parallel.","C":"Points to a difference in geography rather than a shared trait.","D":"Correct: uses ‘like’ to link the shared picture-based method of both systems."},"skill":"Rhetorical Synthesis","strat":"For a similarity goal, choose the option that names a trait both items share."}},
{"id":"s3-rw-expr-17","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"H","type":"mcq","stim":"<p>A student researching the spread of television took the following notes:</p><ul><li>In 1950, fewer than 1 percent of homes in the country had a television.</li><li>By 1960, about 87 percent of homes had a television.</li><li>Early televisions displayed only black-and-white images.</li><li>Color broadcasts became common in the late 1960s.</li></ul>","prompt":"The student wants to emphasize how rapidly television ownership changed during the 1950s. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["By 1960, about 87 percent of homes in the country had a television.","Early televisions showed only black-and-white images, and color broadcasts spread in the late 1960s.","Television ownership rose dramatically over the decade, from fewer than 1 percent of homes in 1950 to about 87 percent by 1960.","In 1950, fewer than 1 percent of homes in the country had a television."],"ans":2,"exp":{"why":"Emphasizing rapid change requires both endpoints; only the choice that pairs the 1950 and 1960 figures shows the growth across the decade.","traps":{"A":"Gives only the ending figure, so no change is visible.","B":"Describes a change in picture quality, not in ownership, and spans the wrong years.","C":"Correct: contrasts the 1950 and 1960 percentages to dramatize the surge.","D":"Gives only the starting figure, so no change is visible."},"skill":"Rhetorical Synthesis","strat":"For change-over-time, select the choice that reports the start and end values together."}},
{"id":"s3-rw-expr-18","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"H","type":"mcq","stim":"<p>A student writing about building materials took the following notes:</p><ul><li>Bamboo grows quickly and is inexpensive to harvest.</li><li>Bamboo is as strong in tension as some types of steel.</li><li>Untreated bamboo can be damaged by insects and moisture.</li><li>Treating bamboo with borax protects it from insects and moisture.</li></ul>","prompt":"The student wants to argue for using bamboo in construction while acknowledging a drawback. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Although untreated bamboo can be damaged by insects and moisture, a simple borax treatment makes this fast-growing, remarkably strong material a practical choice for construction.","Bamboo grows quickly, costs little to harvest, and is as strong in tension as some types of steel.","Untreated bamboo can be damaged by both insects and moisture.","Bamboo can be treated with borax to guard it against insects and moisture."],"ans":0,"exp":{"why":"The goal is to make a case yet concede a drawback; only the choice that names the vulnerability and still argues for bamboo satisfies both parts.","traps":{"A":"Correct: concedes the insect-and-moisture drawback, then argues bamboo is practical because it can be treated.","B":"Lists only advantages and never acknowledges any drawback.","C":"States only the drawback and makes no case for bamboo.","D":"Notes the treatment as a bare fact without arguing for bamboo or conceding a downside."},"skill":"Rhetorical Synthesis","strat":"For make-a-case-despite-a-drawback, look for a choice that admits the flaw and still recommends the item."}},
{"id":"s3-rw-expr-19","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>A student studying insect communication took the following notes:</p><ul><li>Returning honeybees perform a movement called the waggle dance.</li><li>The angle of the dance indicates the direction of a food source.</li><li>The duration of the dance indicates the distance to the food.</li><li>Other bees follow the dancer to reach the food.</li></ul>","prompt":"The student wants to explain the purpose of the waggle dance. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The waggle dance involves a bee moving at a particular angle for a certain length of time.","Returning honeybees perform a movement known as the waggle dance.","Other bees watch the dancing bee closely.","Honeybees perform the waggle dance to tell other bees the direction and distance of a food source."],"ans":3,"exp":{"why":"The purpose goal calls for why bees dance; only the choice stating that the dance communicates direction and distance explains its function.","traps":{"A":"Describes the mechanics of the dance without stating its purpose.","B":"Merely names the behavior, giving no purpose.","C":"Notes an observer’s action but not the reason for the dance.","D":"Correct: states that the dance conveys direction and distance, its purpose."},"skill":"Rhetorical Synthesis","strat":"For a purpose goal, pick the option that says what the behavior accomplishes."}},
{"id":"s3-rw-expr-20","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"E","type":"mcq","stim":"<p>A student writing about musical instruments took the following notes:</p><ul><li>The kalimba is a small musical instrument from Africa.</li><li>It has metal tines that are plucked with the thumbs.</li><li>It is sometimes called a thumb piano.</li><li>Players hold it in both hands.</li></ul>","prompt":"The student wants to introduce the kalimba to readers who have never heard of it. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Players hold the kalimba in both hands and pluck its tines with their thumbs.","The kalimba is a small African musical instrument, sometimes called a thumb piano, whose metal tines are plucked with the thumbs.","The kalimba is sometimes called a thumb piano.","The kalimba’s tines are made of metal."],"ans":1,"exp":{"why":"New readers need an overview; only the choice that identifies what the kalimba is, its nickname, and how it is played introduces it fully.","traps":{"A":"Describes how it is held and played but never says what the instrument is.","B":"Correct: gives a compact introduction covering identity, nickname, and playing method.","C":"Offers only the nickname, too little for an introduction.","D":"States a single detail about the tines, not an overview."},"skill":"Rhetorical Synthesis","strat":"To introduce something unfamiliar, choose the option that identifies and briefly characterizes it."}},
{"id":"s3-rw-expr-21","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>A student comparing two dinosaurs took the following notes:</p><ul><li>Triceratops had a beak and rows of grinding teeth for chewing plants.</li><li>Tyrannosaurus had large, serrated teeth for tearing meat.</li><li>Both dinosaurs lived during the Late Cretaceous period.</li><li>Both are frequently displayed in natural history museums.</li></ul>","prompt":"The student wants to emphasize a difference between the two dinosaurs. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Both Triceratops and Tyrannosaurus lived during the Late Cretaceous period.","Both dinosaurs are frequently displayed in natural history museums.","Whereas Triceratops used a beak and grinding teeth to chew plants, Tyrannosaurus tore meat with large, serrated teeth.","Triceratops had a beak and rows of grinding teeth."],"ans":2,"exp":{"why":"The goal is to emphasize a difference; only the choice that contrasts the plant-chewing and meat-tearing teeth accomplishes it.","traps":{"A":"Stresses a shared time period, a similarity rather than a difference.","B":"Stresses a shared museum presence, another similarity.","C":"Correct: uses ‘whereas’ to set the two diets and dentitions against each other.","D":"Gives one fact about Triceratops alone, drawing no contrast."},"skill":"Rhetorical Synthesis","strat":"For a difference goal, choose the option that juxtaposes the two items’ opposing traits."}},
{"id":"s3-rw-expr-22","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"H","type":"mcq","stim":"<p>A student studying a mountain glacier took the following notes:</p><ul><li>In 1980, the glacier’s edge reached the village’s old stone pier.</li><li>By 2020, the glacier’s edge had retreated nearly two kilometers inland.</li><li>The glacier feeds a river on which the village depends.</li><li>Researchers photograph the glacier every summer.</li></ul>","prompt":"The student wants to emphasize how much the glacier changed between 1980 and 2020. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Between 1980 and 2020, the glacier retreated dramatically, its edge moving from the village’s old pier to a point nearly two kilometers inland.","The glacier feeds a river on which the village depends.","Researchers photograph the glacier every summer.","By 2020, the glacier’s edge had retreated nearly two kilometers inland."],"ans":0,"exp":{"why":"Emphasizing change requires both the 1980 and 2020 positions; only the choice that traces the edge from the pier to two kilometers inland shows the extent of the change.","traps":{"A":"Correct: pairs the earlier and later positions to convey the dramatic retreat.","B":"Explains the glacier’s importance but shows no change over time.","C":"Notes a research routine unrelated to how the glacier changed.","D":"Gives only the 2020 position, so the change from 1980 is not shown."},"skill":"Rhetorical Synthesis","strat":"For change-over-time, choose the option that anchors both the earlier and later states."}},
{"id":"s3-ma-alg-01","sec":"math","dom":"alg","skill":"Linear equations","dif":"E","type":"mcq","prompt":"What is the solution to the equation 3x + 7 = 22?","choices":["5","15","29/3","−5"],"ans":0,"exp":{"why":"Subtract 7 from both sides: 3x = 15. Divide both sides by 3: x = 5.","traps":{"A":"Correct: 3x = 15, so x = 5.","B":"This is 3x = 15 without dividing by 3.","C":"This comes from adding 7 to 22 first, (22 + 7)/3 = 29/3, instead of subtracting.","D":"Sign error when isolating x."},"skill":"Linear equations","strat":"Undo addition first, then undo multiplication."}},
{"id":"s3-ma-alg-02","sec":"math","dom":"alg","skill":"Linear equations","dif":"E","type":"mcq","prompt":"What value of x satisfies 5(x − 2) = 20?","choices":["6","2","4","30"],"ans":0,"exp":{"why":"Divide both sides by 5: x − 2 = 4. Add 2: x = 6.","traps":{"A":"Correct: x − 2 = 4, so x = 6.","B":"Results from 5x = 10 after mishandling the −10 term.","C":"This is 20/5 = 4, forgetting the −2.","D":"Forgot to divide by 5."},"skill":"Linear equations","strat":"Divide out the common factor before isolating x."}},
{"id":"s3-ma-alg-03","sec":"math","dom":"alg","skill":"Linear equations","dif":"E","type":"spr","prompt":"Solve for x:  (x/4) + 3 = 10.","ans":["28"],"exp":{"why":"Subtract 3: x/4 = 7. Multiply both sides by 4: x = 28.","skill":"Linear equations","strat":"Clear the constant, then multiply by the denominator."}},
{"id":"s3-ma-alg-04","sec":"math","dom":"alg","skill":"Linear equations","dif":"M","type":"mcq","prompt":"What is the solution to (2x)/3 − 5 = 1?","choices":["9","−6","6","18"],"ans":0,"exp":{"why":"Add 5 to both sides: (2x)/3 = 6. Multiply by 3: 2x = 18. Divide by 2: x = 9.","traps":{"A":"Correct: (2x)/3 = 6, then 2x = 18, so x = 9.","B":"Comes from subtracting 5 instead of adding it: (2x)/3 = −4.","C":"Stops at (2x)/3 = 6 and reads x = 6.","D":"Stops at 2x = 18 without dividing by 2."},"skill":"Linear equations","strat":"Add the constant, clear the fraction, then divide."}},
{"id":"s3-ma-alg-05","sec":"math","dom":"alg","skill":"Linear equations","dif":"H","type":"mcq","prompt":"Solve for x:  (x + 2)/3 = (x − 4)/2.","choices":["16","−16","4","8"],"ans":0,"exp":{"why":"Cross-multiply: 2(x + 2) = 3(x − 4), so 2x + 4 = 3x − 12. Subtract 2x: 4 = x − 12. Add 12: x = 16.","traps":{"A":"Correct: 2x + 4 = 3x − 12 gives x = 16.","B":"Sign error moving terms across the equals sign.","C":"Results from dropping the constants during cross-multiplication.","D":"Arithmetic slip combining 4 and 12 as a difference."},"skill":"Linear equations","strat":"Cross-multiply to clear both denominators, then collect like terms."}},
{"id":"s3-ma-alg-06","sec":"math","dom":"alg","skill":"Linear equations","dif":"M","type":"mcq","prompt":"What value of x satisfies 4x − 9 = 2x + 7?","choices":["8","−1","1","16"],"ans":0,"exp":{"why":"Subtract 2x from both sides: 2x − 9 = 7. Add 9: 2x = 16. Divide by 2: x = 8.","traps":{"A":"Correct: 2x = 16, so x = 8.","B":"Sign error when moving the variable terms together.","C":"Comes from mishandling the constants, e.g. 2x = 2.","D":"Stops at 2x = 16 without dividing by 2."},"skill":"Linear equations","strat":"Gather variables on one side and constants on the other, then divide."}},
{"id":"s3-ma-alg-07","sec":"math","dom":"alg","skill":"Linear equations","dif":"M","type":"mcq","stim":"<p>The perimeter of a rectangle is given by P = 2L + 2W, where L is the length and W is the width.</p>","prompt":"Which expression gives W in terms of P and L?","choices":["(P − 2L)/2","P − 2L","(P − 2L)/4","(2L − P)/2"],"ans":0,"exp":{"why":"Start with P = 2L + 2W. Subtract 2L: P − 2L = 2W. Divide both sides by 2: W = (P − 2L)/2.","traps":{"A":"Correct: subtract 2L, then divide by 2.","B":"Forgot to divide by 2 after isolating 2W.","C":"Divided the whole equation by 4 instead of 2.","D":"Subtracted in the wrong order, giving the negative of the answer."},"skill":"Linear equations","strat":"Isolate the 2W term, then divide by its coefficient."}},
{"id":"s3-ma-alg-08","sec":"math","dom":"alg","skill":"Linear equations","dif":"H","type":"mcq","prompt":"Solve for x:  (2x + 1)/3 − (x − 1)/2 = 1.","choices":["1","−1","5","11"],"ans":0,"exp":{"why":"Multiply every term by the LCD 6: 2(2x + 1) − 3(x − 1) = 6. Expand: 4x + 2 − 3x + 3 = 6, so x + 5 = 6. Therefore x = 1.","traps":{"A":"Correct: x + 5 = 6 gives x = 1.","B":"Sign error distributing −3 across (x − 1).","C":"Results from forgetting to multiply the right side by 6.","D":"Comes from multiplying only one fraction by the LCD."},"skill":"Linear equations","strat":"Multiply through by the least common denominator to clear fractions before expanding."}},
{"id":"s3-ma-alg-09","sec":"math","dom":"alg","skill":"Linear equations","dif":"H","type":"mcq","stim":"<p>In the equation a(x − h) = k, the quantities a, h, and k are constants and a ≠ 0.</p>","prompt":"Which expression is equal to x?","choices":["(k + ah)/a","(k − ah)/a","ak + h","(k + h)/a"],"ans":0,"exp":{"why":"Divide both sides by a: x − h = k/a. Add h: x = k/a + h = (k + ah)/a.","traps":{"A":"Correct: x = k/a + h, written over a common denominator as (k + ah)/a.","B":"Subtracted h instead of adding it.","C":"Multiplied by a instead of dividing by it.","D":"Added h before dividing, misplacing the term inside the fraction."},"skill":"Linear equations","strat":"Divide by the coefficient first, then add the constant back."}},
{"id":"s3-ma-alg-10","sec":"math","dom":"alg","skill":"Linear equations","dif":"M","type":"mcq","prompt":"Solve for x:  0.2(x − 3) = 0.5x − 2.1.","choices":["5","3","−5","7"],"ans":0,"exp":{"why":"Distribute: 0.2x − 0.6 = 0.5x − 2.1. Subtract 0.2x: −0.6 = 0.3x − 2.1. Add 2.1: 1.5 = 0.3x. Divide by 0.3: x = 5.","traps":{"A":"Correct: 1.5 = 0.3x gives x = 5.","B":"Arithmetic slip with the decimals.","C":"Sign error isolating the variable.","D":"Misadded the constant terms."},"skill":"Linear equations","strat":"Distribute, gather x-terms, then divide by the decimal coefficient."}},
{"id":"s3-ma-alg-11","sec":"math","dom":"alg","skill":"Linear functions","dif":"E","type":"mcq","prompt":"What is the slope of the line that passes through the points (2, 3) and (6, 11)?","choices":["2","1/2","4","−2"],"ans":0,"exp":{"why":"Slope = (11 − 3)/(6 − 2) = 8/4 = 2.","traps":{"A":"Correct: rise 8 over run 4 equals 2.","B":"Inverted the ratio, computing run over rise.","C":"Used only the change in y (8/2) or miscounted the run.","D":"Sign error in one of the differences."},"skill":"Linear functions","strat":"Use slope = (y₂ − y₁)/(x₂ − x₁)."}},
{"id":"s3-ma-alg-12","sec":"math","dom":"alg","skill":"Linear functions","dif":"E","type":"mcq","stim":"<p>The function f is defined by f(x) = 3x − 4.</p>","prompt":"What is the value of f(5)?","choices":["11","19","7","−11"],"ans":0,"exp":{"why":"Substitute x = 5: f(5) = 3(5) − 4 = 15 − 4 = 11.","traps":{"A":"Correct: 15 − 4 = 11.","B":"Added 4 instead of subtracting: 15 + 4 = 19.","C":"Computed 3 + 4 rather than 3(5) − 4.","D":"Sign error on the final value."},"skill":"Linear functions","strat":"Replace x with the input value and follow order of operations."}},
{"id":"s3-ma-alg-13","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"spr","stim":"<p>A line has slope 4 and passes through the point (0, −3).</p>","prompt":"What is the value of y on the line when x = 2?","ans":["5"],"exp":{"why":"The line is y = 4x − 3. At x = 2: y = 4(2) − 3 = 8 − 3 = 5.","skill":"Linear functions","strat":"Write y = mx + b using the given slope and y-intercept, then evaluate."}},
{"id":"s3-ma-alg-14","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"mcq","prompt":"Which equation represents the line through (1, 2) that is parallel to y = 3x + 5?","choices":["y = 3x − 1","y = 3x + 2","y = −(1/3)x + 2","y = (1/3)x − 1"],"ans":0,"exp":{"why":"Parallel lines share slope 3. Using point-slope: y − 2 = 3(x − 1), so y = 3x − 3 + 2 = 3x − 1.","traps":{"A":"Correct: y = 3x − 1 has slope 3 and passes through (1, 2).","B":"Used the y-value 2 as the intercept without adjusting for the point.","C":"Used the perpendicular slope −1/3 instead of the parallel slope.","D":"Used the reciprocal slope 1/3."},"skill":"Linear functions","strat":"Parallel means equal slope; substitute the point to find the intercept."}},
{"id":"s3-ma-alg-15","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"mcq","prompt":"Which equation represents the line through (4, −1) that is perpendicular to y = (2/3)x + 1?","choices":["y = −(3/2)x + 5","y = (2/3)x + 5","y = −(3/2)x − 5","y = −(2/3)x + 5"],"ans":0,"exp":{"why":"The perpendicular slope is the negative reciprocal of 2/3, which is −3/2. Point-slope: y + 1 = −(3/2)(x − 4), so y = −(3/2)x + 6 − 1 = −(3/2)x + 5.","traps":{"A":"Correct: slope −3/2 through (4, −1) gives y = −(3/2)x + 5.","B":"Kept the original slope instead of taking the negative reciprocal.","C":"Correct slope but a sign error on the intercept.","D":"Negated the slope without taking the reciprocal."},"skill":"Linear functions","strat":"Perpendicular slope is the negative reciprocal; then use the given point."}},
{"id":"s3-ma-alg-16","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"spr","stim":"<p>The function f is defined by f(x) = 2x + 7.</p>","prompt":"For what value of x does f(x) = 1?","ans":["-3"],"exp":{"why":"Set 2x + 7 = 1. Subtract 7: 2x = −6. Divide by 2: x = −3.","skill":"Linear functions","strat":"Set the function equal to the output value and solve for x."}},
{"id":"s3-ma-alg-17","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"mcq","stim":"<p>A taxi charges according to C = 15 + 0.2m, where C is the total cost in dollars and m is the number of miles driven.</p>","prompt":"What does the number 0.2 represent in this model?","choices":["The cost increases by $0.20 for each additional mile driven.","The base fee for the ride is $0.20.","The total cost of the ride is $0.20.","Each dollar charged pays for 0.2 miles of travel."],"ans":0,"exp":{"why":"In C = 15 + 0.2m the coefficient of m is the rate of change. Each additional mile adds $0.20 to the cost, so 0.2 is the cost per mile.","traps":{"A":"Correct: 0.2 is the slope, the cost added per mile.","B":"The base fee is the constant 15, not 0.2.","C":"0.2 is a rate, not a total cost.","D":"Reverses the meaning of the rate."},"skill":"Linear functions","strat":"In y = b + mx the coefficient of the variable is the rate of change per unit."}},
{"id":"s3-ma-alg-18","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"mcq","prompt":"What is the x-intercept of the line 4x − 3y = 12?","choices":["(3, 0)","(0, −4)","(4, 0)","(−3, 0)"],"ans":0,"exp":{"why":"At the x-intercept, y = 0: 4x − 3(0) = 12, so 4x = 12 and x = 3. The x-intercept is (3, 0).","traps":{"A":"Correct: setting y = 0 gives x = 3.","B":"This is the y-intercept, found by setting x = 0.","C":"Divided 12 by 3 instead of by the coefficient 4.","D":"Sign error solving 4x = 12."},"skill":"Linear functions","strat":"Set y = 0 to find the x-intercept."}},
{"id":"s3-ma-alg-19","sec":"math","dom":"alg","skill":"Linear functions","dif":"H","type":"mcq","prompt":"A line passes through the points (−2, 5) and (4, −7). Which equation represents this line?","choices":["y = −2x + 1","y = −2x − 3","y = 2x + 9","y = −2x + 5"],"ans":0,"exp":{"why":"Slope = (−7 − 5)/(4 − (−2)) = −12/6 = −2. Using (−2, 5): y − 5 = −2(x + 2), so y = −2x − 4 + 5 = −2x + 1.","traps":{"A":"Correct: slope −2 with intercept 1.","B":"Sign error when finding the intercept.","C":"Dropped the negative sign on the slope.","D":"Used the y-value 5 directly as the intercept."},"skill":"Linear functions","strat":"Find the slope from two points, then substitute one point for the intercept."}},
{"id":"s3-ma-alg-20","sec":"math","dom":"alg","skill":"Linear functions","dif":"H","type":"spr","stim":"<p>The function f is linear, with f(1) = 4 and f(4) = 16.</p>","prompt":"What is the value of f(0)?","ans":["0"],"exp":{"why":"Slope = (16 − 4)/(4 − 1) = 12/3 = 4, so f(x) = 4x + b. From f(1) = 4: 4(1) + b = 4, so b = 0. Then f(0) = 0.","skill":"Linear functions","strat":"Find the slope from the two values, then solve for the intercept, which is f(0)."}},
{"id":"s3-ma-alg-21","sec":"math","dom":"alg","skill":"Systems of equations","dif":"E","type":"mcq","stim":"<p>x + y = 10 and x − y = 4.</p>","prompt":"What is the value of x?","choices":["7","3","14","5"],"ans":0,"exp":{"why":"Add the equations: (x + y) + (x − y) = 10 + 4, so 2x = 14 and x = 7.","traps":{"A":"Correct: 2x = 14 gives x = 7.","B":"This is the value of y, not x.","C":"Stopped at 2x = 14 without dividing by 2.","D":"Split the total 10 evenly, ignoring the second equation."},"skill":"Systems of equations","strat":"Add the equations to eliminate y."}},
{"id":"s3-ma-alg-22","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"spr","stim":"<p>y = 2x and x + y = 9.</p>","prompt":"What is the value of y?","ans":["6"],"exp":{"why":"Substitute y = 2x into x + y = 9: x + 2x = 9, so 3x = 9 and x = 3. Then y = 2(3) = 6.","skill":"Systems of equations","strat":"Substitute the expression for y, solve for x, then back-substitute."}},
{"id":"s3-ma-alg-23","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"mcq","stim":"<p>2x + 3y = 12 and 2x − y = 4.</p>","prompt":"What is the value of x?","choices":["3","2","5","1"],"ans":0,"exp":{"why":"Subtract the second equation from the first: (2x + 3y) − (2x − y) = 12 − 4, so 4y = 8 and y = 2. Substitute into 2x − 2 = 4: 2x = 6, x = 3.","traps":{"A":"Correct: x = 3.","B":"This is the value of y.","C":"Arithmetic slip solving 2x = 6.","D":"Mishandled the elimination step."},"skill":"Systems of equations","strat":"Subtract to eliminate x's matching term, solve for y, then back-substitute."}},
{"id":"s3-ma-alg-24","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"mcq","stim":"<p>A theater sold 20 tickets for a total of $130. Adult tickets cost $8 each and child tickets cost $5 each.</p>","prompt":"How many adult tickets were sold?","choices":["10","5","15","8"],"ans":0,"exp":{"why":"Let a be adult tickets and c child tickets. Then a + c = 20 and 8a + 5c = 130. Substitute c = 20 − a: 8a + 5(20 − a) = 130, so 3a + 100 = 130, 3a = 30, a = 10.","traps":{"A":"Correct: 3a = 30 gives a = 10.","B":"This is the number of child tickets.","C":"Sign or substitution error in the total equation.","D":"Used the ticket price 8 instead of solving the system."},"skill":"Systems of equations","strat":"Write a count equation and a value equation, then substitute."}},
{"id":"s3-ma-alg-25","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"spr","stim":"<p>The sum of two numbers is 40 and their difference is 8.</p>","prompt":"What is the larger of the two numbers?","ans":["24"],"exp":{"why":"Let the numbers be x and y with x + y = 40 and x − y = 8. Add: 2x = 48, so x = 24. (Then y = 16.) The larger number is 24.","skill":"Systems of equations","strat":"Add the sum and difference equations to isolate the larger number."}},
{"id":"s3-ma-alg-26","sec":"math","dom":"alg","skill":"Systems of equations","dif":"H","type":"mcq","stim":"<p>2x + ky = 5 and 4x + 6y = 9, where k is a constant.</p>","prompt":"For what value of k does the system have no solution?","choices":["3","6","−3","12"],"ans":0,"exp":{"why":"A system has no solution when the lines are parallel: the coefficient ratios match but the constants do not. Set 2/4 = k/6, so k/6 = 1/2 and k = 3. The constants 5 and 9 do not follow this ratio (5/9 ≠ 1/2), confirming no solution.","traps":{"A":"Correct: k = 3 makes the coefficients proportional.","B":"Matched k to the 6 in the second equation directly.","C":"Sign error on the proportion.","D":"Multiplied instead of taking the proportion."},"skill":"Systems of equations","strat":"No solution requires equal coefficient ratios but unequal constant ratio."}},
{"id":"s3-ma-alg-27","sec":"math","dom":"alg","skill":"Systems of equations","dif":"H","type":"mcq","stim":"<p>3x − 2y = 7 and 9x − 6y = c, where c is a constant.</p>","prompt":"For what value of c does the system have infinitely many solutions?","choices":["21","7","3","63"],"ans":0,"exp":{"why":"Infinitely many solutions occur when one equation is a multiple of the other. Multiplying 3x − 2y = 7 by 3 gives 9x − 6y = 21, so c = 21.","traps":{"A":"Correct: c = 3 × 7 = 21.","B":"Kept the original constant without scaling.","C":"Used the multiplier 3 as the answer.","D":"Multiplied 7 by 9 instead of by 3."},"skill":"Systems of equations","strat":"The two equations must be identical multiples; scale the constant by the same factor."}},
{"id":"s3-ma-alg-28","sec":"math","dom":"alg","skill":"Systems of equations","dif":"H","type":"mcq","stim":"<p>A boat travels 36 miles downstream in 3 hours and the same 36 miles upstream in 6 hours. Let b be the boat's speed in still water and c the current's speed, both in miles per hour.</p>","prompt":"What is the boat's speed in still water?","choices":["9","3","6","12"],"ans":0,"exp":{"why":"Downstream speed is 36/3 = 12, so b + c = 12. Upstream speed is 36/6 = 6, so b − c = 6. Add the equations: 2b = 18, giving b = 9.","traps":{"A":"Correct: 2b = 18 gives b = 9.","B":"This is the current speed c = 3.","C":"This is the upstream speed, not the still-water speed.","D":"This is the downstream speed b + c."},"skill":"Systems of equations","strat":"Downstream speed is b + c and upstream is b − c; add to find b."}},
{"id":"s3-ma-alg-29","sec":"math","dom":"alg","skill":"Systems of equations","dif":"H","type":"spr","stim":"<p>3x + 2y = 4 and 5x − 2y = 12.</p>","prompt":"What is the value of x + y?","ans":["1"],"exp":{"why":"Add the equations: 8x = 16, so x = 2. Substitute into 3(2) + 2y = 4: 6 + 2y = 4, so 2y = −2 and y = −1. Then x + y = 2 + (−1) = 1.","skill":"Systems of equations","strat":"Add to eliminate y, solve for x, back-substitute, then combine."}},
{"id":"s3-ma-alg-30","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"mcq","stim":"<p>At a store, 3 pens and 2 notebooks cost $13, while 2 pens and 5 notebooks cost $16.</p>","prompt":"What is the cost of one notebook?","choices":["$2","$3","$5","$4"],"ans":0,"exp":{"why":"Let p and n be the prices. Then 3p + 2n = 13 and 2p + 5n = 16. Multiply the first by 2 and the second by 3: 6p + 4n = 26 and 6p + 15n = 48. Subtract: 11n = 22, so n = 2.","traps":{"A":"Correct: a notebook costs $2.","B":"This is the price of a pen.","C":"Mismatched the elimination multipliers.","D":"Arithmetic error solving 11n = 22."},"skill":"Systems of equations","strat":"Scale each equation so a variable's coefficients match, then eliminate."}},
{"id":"s3-ma-alg-31","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"E","type":"mcq","prompt":"What is the solution to 2x + 3 > 11?","choices":["x > 4","x < 4","x > 7","x > 8"],"ans":0,"exp":{"why":"Subtract 3: 2x > 8. Divide by 2: x > 4.","traps":{"A":"Correct: 2x > 8 gives x > 4.","B":"Flipped the inequality sign without dividing by a negative.","C":"Subtracted the wrong constant, using 2x > 14.","D":"Stopped at 2x > 8 and read x > 8."},"skill":"Linear inequalities","strat":"Solve like an equation; the sign flips only when dividing by a negative."}},
{"id":"s3-ma-alg-32","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"E","type":"mcq","prompt":"What is the solution to −3x ≤ 12?","choices":["x ≥ −4","x ≤ −4","x ≥ 4","x ≤ 4"],"ans":0,"exp":{"why":"Divide both sides by −3 and flip the inequality: x ≥ −4.","traps":{"A":"Correct: dividing by a negative flips ≤ to ≥, giving x ≥ −4.","B":"Forgot to flip the inequality sign.","C":"Dropped the negative sign on −4.","D":"Both forgot to flip and dropped the sign."},"skill":"Linear inequalities","strat":"Reverse the inequality sign when dividing by a negative number."}},
{"id":"s3-ma-alg-33","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"M","type":"spr","prompt":"What is the least value of x that satisfies 5x − 2 ≥ 13?","ans":["3"],"exp":{"why":"Add 2: 5x ≥ 15. Divide by 5: x ≥ 3. The least value of x is 3.","skill":"Linear inequalities","strat":"Solve the inequality; the boundary value is the least allowed since it is included."}},
{"id":"s3-ma-alg-34","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"M","type":"mcq","prompt":"What is the solution to (x/2) − 4 < 1?","choices":["x < 10","x < 6","x > 10","x < −6"],"ans":0,"exp":{"why":"Add 4: x/2 < 5. Multiply by 2: x < 10.","traps":{"A":"Correct: x/2 < 5 gives x < 10.","B":"Added instead of multiplying, or stopped at x/2 < 5 reading 5 + 1.","C":"Flipped the inequality unnecessarily.","D":"Subtracted 4 instead of adding it."},"skill":"Linear inequalities","strat":"Clear the constant, then multiply out the fraction."}},
{"id":"s3-ma-alg-35","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"M","type":"mcq","prompt":"What is the solution to the compound inequality −3 < 2x − 1 ≤ 5?","choices":["−1 < x ≤ 3","−1 ≤ x < 3","−2 < x ≤ 6","−1 < x ≤ 6"],"ans":0,"exp":{"why":"Add 1 to all three parts: −2 < 2x ≤ 6. Divide all parts by 2: −1 < x ≤ 3.","traps":{"A":"Correct: −1 < x ≤ 3.","B":"Swapped which endpoint is inclusive.","C":"Added 1 but did not divide by 2.","D":"Divided only the left side by 2."},"skill":"Linear inequalities","strat":"Apply each operation to all three parts of the compound inequality."}},
{"id":"s3-ma-alg-36","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"M","type":"spr","stim":"<p>Maria has $50. She buys a gift for $12 and then spends $4 on each carnival ride.</p>","prompt":"What is the greatest number of rides Maria can go on?","ans":["9"],"exp":{"why":"Let r be the number of rides: 12 + 4r ≤ 50. Subtract 12: 4r ≤ 38. Divide by 4: r ≤ 9.5. Since r must be a whole number, the greatest is 9.","skill":"Linear inequalities","strat":"Model the budget as ≤, solve, then round down to the greatest whole number."}},
{"id":"s3-ma-alg-37","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"M","type":"mcq","stim":"<p>A club needs to raise at least $500. It already has $200 and earns $15 for each new member who joins.</p>","prompt":"What is the least number of new members needed to reach the goal?","choices":["20","19","21","33"],"ans":0,"exp":{"why":"Let m be new members: 200 + 15m ≥ 500. Subtract 200: 15m ≥ 300. Divide by 15: m ≥ 20. The least whole number is 20.","traps":{"A":"Correct: m ≥ 20, so 20 members are needed.","B":"Rounded down when the goal requires rounding up.","C":"Added an extra member unnecessarily.","D":"Divided 500 by 15 without subtracting the $200 already raised."},"skill":"Linear inequalities","strat":"Model the goal as ≥, solve, then round up to meet the requirement."}},
{"id":"s3-ma-alg-38","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"H","type":"mcq","prompt":"What is the solution to 3(x − 2) ≤ 5x + 4?","choices":["x ≥ −5","x ≤ −5","x ≥ 5","x ≤ 5"],"ans":0,"exp":{"why":"Distribute: 3x − 6 ≤ 5x + 4. Subtract 3x: −6 ≤ 2x + 4. Subtract 4: −10 ≤ 2x. Divide by 2: −5 ≤ x, i.e. x ≥ −5.","traps":{"A":"Correct: −5 ≤ x, so x ≥ −5.","B":"Flipped the inequality when it should not be flipped.","C":"Dropped the negative sign on −5.","D":"Both flipped the sign and dropped the negative."},"skill":"Linear inequalities","strat":"Distribute, move variables to one side; the sign flips only when dividing by a negative."}},
{"id":"s3-ma-alg-39","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"H","type":"spr","stim":"<p>A phone plan costs $30 per month plus $0.10 for each text message. A user wants the monthly bill to be at most $45.</p>","prompt":"What is the greatest number of text messages the user can send in a month?","ans":["150"],"exp":{"why":"Let t be the number of texts: 30 + 0.10t ≤ 45. Subtract 30: 0.10t ≤ 15. Divide by 0.10: t ≤ 150. The greatest whole number is 150.","skill":"Linear inequalities","strat":"Set up the cost as ≤ the budget and solve for the variable."}},
{"id":"s3-ma-alg-40","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"H","type":"mcq","prompt":"What is the solution to −2 ≤ (3 − x)/2 < 4?","choices":["−5 < x ≤ 7","−5 ≤ x < 7","−7 ≤ x < 5","−7 < x ≤ 5"],"ans":0,"exp":{"why":"Multiply all parts by 2: −4 ≤ 3 − x < 8. Subtract 3: −7 ≤ −x < 5. Multiply by −1 and flip both inequalities: 7 ≥ x > −5, which is −5 < x ≤ 7.","traps":{"A":"Correct: −5 < x ≤ 7.","B":"Did not swap which endpoint is inclusive after flipping.","C":"Forgot to flip the inequality signs after multiplying by −1.","D":"Flipped signs but kept the wrong inclusivity."},"skill":"Linear inequalities","strat":"Clear the fraction, isolate −x, then multiply by −1 and reverse both inequality signs."}},
{"id":"s3-ma-adv-01","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"E","type":"mcq","stim":"","prompt":"What are the solutions to x² − 5x + 6 = 0?","choices":["x = 2 and x = 3","x = −2 and x = −3","x = 1 and x = 6","x = −1 and x = −6"],"ans":0,"exp":{"why":"Factor x² − 5x + 6 = (x − 2)(x − 3) = 0. Setting each factor to 0 gives x = 2 and x = 3. Check: 2·3 = 6 (constant) and 2 + 3 = 5 (matches −(−5)).","traps":{"A":"Correct: factors are (x − 2)(x − 3).","B":"Sign error; these are roots of x² + 5x + 6.","C":"Product is 6 but sum is 7, not 5.","D":"Wrong signs and wrong sum."},"skill":"Quadratics & nonlinear","strat":"Find two numbers that multiply to the constant and add to the middle coefficient."}},
{"id":"s3-ma-adv-02","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"E","type":"spr","stim":"","prompt":"If (x − 4)² = 49, what is the greatest value of x?","ans":["11"],"exp":{"why":"Take the square root of both sides: x − 4 = ±7. So x = 4 + 7 = 11 or x = 4 − 7 = −3. The greatest value is 11.","skill":"Quadratics & nonlinear","strat":"Use the square-root method and keep both the + and − roots."}},
{"id":"s3-ma-adv-03","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"M","type":"mcq","stim":"","prompt":"What are the solutions to 2x² + 3x − 5 = 0?","choices":["x = 1 and x = −5/2","x = −1 and x = 5/2","x = 1 and x = 5/2","x = −1 and x = −5/2"],"ans":0,"exp":{"why":"Factor: 2x² + 3x − 5 = (2x + 5)(x − 1) = 0. Then x − 1 = 0 gives x = 1, and 2x + 5 = 0 gives x = −5/2. (Quadratic formula gives the same roots.)","traps":{"A":"Correct roots x = 1 and x = −5/2.","B":"Both signs flipped.","C":"Sign error on the −5/2 root.","D":"Sign error on the x = 1 root."},"skill":"Quadratics & nonlinear","strat":"Factor the quadratic, or apply the quadratic formula and simplify."}},
{"id":"s3-ma-adv-04","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"M","type":"spr","stim":"","prompt":"What is the sum of the solutions to x² − 8x + 3 = 0?","ans":["8"],"exp":{"why":"For ax² + bx + c = 0, the sum of the roots is −b/a. Here −b/a = −(−8)/1 = 8. (You never need to solve for the individual roots.)","skill":"Quadratics & nonlinear","strat":"Use sum of roots = −b/a instead of solving the equation."}},
{"id":"s3-ma-adv-05","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"M","type":"mcq","stim":"","prompt":"What is the product of the solutions to 3x² − 12x + 9 = 0?","choices":["3","−3","4","−4"],"ans":0,"exp":{"why":"For ax² + bx + c = 0, the product of the roots is c/a = 9/3 = 3. (The roots are x = 1 and x = 3, and 1·3 = 3.)","traps":{"A":"Correct: product = c/a = 9/3 = 3.","B":"Sign error on c/a.","C":"Used b/a magnitude (12/3) incorrectly.","D":"Sign and value error."},"skill":"Quadratics & nonlinear","strat":"Use product of roots = c/a."}},
{"id":"s3-ma-adv-06","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"M","type":"mcq","stim":"","prompt":"What is the vertex of the graph of y = x² − 6x + 11?","choices":["(3, 2)","(−3, 2)","(3, −2)","(6, 11)"],"ans":0,"exp":{"why":"The x-coordinate of the vertex is −b/(2a) = −(−6)/2 = 3. Then y = 3² − 6·3 + 11 = 9 − 18 + 11 = 2. Vertex is (3, 2).","traps":{"A":"Correct vertex (3, 2).","B":"Sign error on x = −b/(2a).","C":"Arithmetic sign error in y.","D":"Read off coefficients instead of computing the vertex."},"skill":"Quadratics & nonlinear","strat":"Find x = −b/(2a), then substitute to get y."}},
{"id":"s3-ma-adv-07","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"H","type":"spr","stim":"","prompt":"In the equation x² + kx + 25 = 0, k is a positive constant. If the equation has exactly one real solution, what is the value of k?","ans":["10"],"exp":{"why":"Exactly one real solution means the discriminant b² − 4ac = 0. Here k² − 4(1)(25) = k² − 100 = 0, so k² = 100 and k = ±10. Since k is positive, k = 10.","skill":"Quadratics & nonlinear","strat":"Set the discriminant equal to 0 for exactly one real solution."}},
{"id":"s3-ma-adv-08","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"H","type":"mcq","stim":"","prompt":"For which value of c does 3x² + 6x + c = 0 have two distinct real solutions?","choices":["2","3","4","5"],"ans":0,"exp":{"why":"Two distinct real solutions require discriminant b² − 4ac > 0: 6² − 4(3)c = 36 − 12c > 0, so c < 3. Only c = 2 satisfies c < 3.","traps":{"A":"Correct: 2 < 3, so the discriminant is positive.","B":"c = 3 gives discriminant 0 (exactly one solution).","C":"c = 4 gives a negative discriminant (no real solutions).","D":"c = 5 gives a negative discriminant (no real solutions)."},"skill":"Quadratics & nonlinear","strat":"Require b² − 4ac > 0 and test the choices."}},
{"id":"s3-ma-adv-09","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"H","type":"spr","stim":"<p>A ball is launched upward and its height, in feet, after t seconds is h(t) = −16t² + 64t + 80.</p>","prompt":"How many seconds after launch does the ball hit the ground?","ans":["5"],"exp":{"why":"The ball hits the ground when h(t) = 0: −16t² + 64t + 80 = 0. Divide by −16: t² − 4t − 5 = 0, which factors to (t − 5)(t + 1) = 0. So t = 5 or t = −1. Time must be positive, so t = 5 seconds.","skill":"Quadratics & nonlinear","strat":"Set height to 0 and discard the negative time solution."}},
{"id":"s3-ma-adv-10","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"H","type":"mcq","stim":"<p>An object's height, in feet, after t seconds is h(t) = −16t² + 48t + 6.</p>","prompt":"What is the maximum height, in feet, reached by the object?","choices":["42","48","6","1.5"],"ans":0,"exp":{"why":"Maximum height occurs at the vertex time t = −b/(2a) = −48/(2·−16) = 1.5 s. Then h(1.5) = −16(2.25) + 48(1.5) + 6 = −36 + 72 + 6 = 42 feet.","traps":{"A":"Correct maximum height, 42 feet.","B":"Used the coefficient 48 rather than computing the height.","C":"That is the initial height (t = 0), not the maximum.","D":"That is the time of the maximum, not the height."},"skill":"Quadratics & nonlinear","strat":"Find the vertex time t = −b/(2a), then evaluate h(t)."}},
{"id":"s3-ma-adv-11","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"E","type":"mcq","stim":"","prompt":"Which expression is equivalent to (x + 3)(x − 3)?","choices":["x² − 9","x² + 9","x² − 6x + 9","x² + 6x − 9"],"ans":0,"exp":{"why":"This is a difference of squares: (x + 3)(x − 3) = x² − 3² = x² − 9. The middle terms +3x and −3x cancel.","traps":{"A":"Correct difference of squares, x² − 9.","B":"Forgot the negative from the product of opposite signs.","C":"This is (x − 3)², not the product of a sum and difference.","D":"Middle terms do not cancel here; sign error."},"skill":"Equivalent expressions","strat":"Recognize (a + b)(a − b) = a² − b²."}},
{"id":"s3-ma-adv-12","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"E","type":"mcq","stim":"","prompt":"Which expression is equivalent to (2x + 1)²?","choices":["4x² + 4x + 1","4x² + 1","4x² + 2x + 1","2x² + 2x + 1"],"ans":0,"exp":{"why":"(2x + 1)² = (2x)² + 2(2x)(1) + 1² = 4x² + 4x + 1.","traps":{"A":"Correct expansion.","B":"Forgot the middle term 2·(2x)·1.","C":"Middle term should be 4x, not 2x.","D":"Squared the coefficient incorrectly (2² = 4, not 2)."},"skill":"Equivalent expressions","strat":"Use (a + b)² = a² + 2ab + b²."}},
{"id":"s3-ma-adv-13","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"M","type":"mcq","stim":"","prompt":"Which of the following is the factored form of x² − 49?","choices":["(x − 7)(x + 7)","(x + 7)²","(x − 7)²","(x − 49)(x + 1)"],"ans":0,"exp":{"why":"x² − 49 = x² − 7² is a difference of squares, which factors as (x − 7)(x + 7).","traps":{"A":"Correct difference of squares.","B":"(x + 7)² = x² + 14x + 49, not x² − 49.","C":"(x − 7)² = x² − 14x + 49, not x² − 49.","D":"This product does not expand to x² − 49."},"skill":"Equivalent expressions","strat":"Apply a² − b² = (a − b)(a + b)."}},
{"id":"s3-ma-adv-14","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"M","type":"mcq","stim":"","prompt":"Which of the following is the factored form of 3x² − 10x + 8?","choices":["(3x − 4)(x − 2)","(3x + 4)(x − 2)","(3x − 2)(x − 4)","(3x − 8)(x − 1)"],"ans":0,"exp":{"why":"Expand (3x − 4)(x − 2) = 3x² − 6x − 4x + 8 = 3x² − 10x + 8. This matches.","traps":{"A":"Correct factorization.","B":"Expands to 3x² − 2x − 8.","C":"Expands to 3x² − 14x + 8.","D":"Expands to 3x² − 11x + 8."},"skill":"Equivalent expressions","strat":"Test factor pairs by expanding to match the middle term."}},
{"id":"s3-ma-adv-15","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"M","type":"mcq","stim":"","prompt":"Which expression is equivalent to (2x³y²)³?","choices":["8x⁹y⁶","6x⁹y⁶","8x⁶y⁵","2x⁹y⁶"],"ans":0,"exp":{"why":"Raise each factor to the 3rd power: 2³ = 8, (x³)³ = x⁹, (y²)³ = y⁶. So (2x³y²)³ = 8x⁹y⁶.","traps":{"A":"Correct: 2³ = 8 and exponents multiply.","B":"Multiplied 2·3 = 6 instead of computing 2³.","C":"Added exponents instead of multiplying them.","D":"Forgot to cube the coefficient 2."},"skill":"Equivalent expressions","strat":"Distribute the outer exponent and multiply exponents."}},
{"id":"s3-ma-adv-16","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"M","type":"mcq","stim":"","prompt":"For x ≠ 0, which expression is equivalent to (x⁵ · x⁻²)/x?","choices":["x²","x⁴","x⁸","x⁻⁴"],"ans":0,"exp":{"why":"Add exponents in the numerator: x⁵ · x⁻² = x³. Then divide by x: x³/x = x^(3−1) = x². ","traps":{"A":"Correct: 5 + (−2) − 1 = 2.","B":"Forgot to subtract for dividing by x.","C":"Ignored the negative exponent (5 + 2 + 1).","D":"Sign errors in combining exponents."},"skill":"Equivalent expressions","strat":"Add exponents when multiplying, subtract when dividing."}},
{"id":"s3-ma-adv-17","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"H","type":"mcq","stim":"","prompt":"Which expression is equivalent to 4x² − 12x + 9?","choices":["(2x − 3)²","(2x + 3)²","(2x − 3)(2x + 3)","(4x − 3)²"],"ans":0,"exp":{"why":"4x² − 12x + 9 is a perfect-square trinomial: (2x)² − 2(2x)(3) + 3² = (2x − 3)². Check: (2x − 3)² = 4x² − 12x + 9.","traps":{"A":"Correct perfect square.","B":"(2x + 3)² = 4x² + 12x + 9 (wrong sign on the middle term).","C":"That product = 4x² − 9, missing the −12x.","D":"(4x − 3)² = 16x² − 24x + 9, wrong leading term."},"skill":"Equivalent expressions","strat":"Check whether the trinomial fits (a − b)² = a² − 2ab + b²."}},
