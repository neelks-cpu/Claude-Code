{"id":"s2-rw-craft-14","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>Coral reefs cover less than one percent of the ocean floor. Yet they shelter roughly a quarter of all known marine species, providing food and refuge to creatures found nowhere else. To lose them would be to lose one of the planet's richest storehouses of life.</p>","prompt":"Which choice best describes the function of the final sentence?","choices":["It introduces a new statistic that contradicts the earlier ones.","It proposes a specific plan for protecting coral reefs.","It questions the accuracy of the data presented earlier.","It emphasizes the stakes by underscoring what the preceding facts imply."],"ans":3,"exp":{"why":"After two factual sentences about how little area reefs occupy yet how many species they support, the final sentence draws out the stakes, stressing what losing the reefs would mean.","traps":{"A":"The final sentence adds no statistic and contradicts nothing.","B":"It names no plan or method for protecting reefs.","C":"It builds on the earlier data rather than doubting it."},"skill":"Text Structure & Purpose","strat":"A closing sentence often converts the preceding facts into a takeaway about why they matter."}},
{"id":"s2-rw-craft-15","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>When the printing press first arrived in Europe, few observers predicted its consequences. At first it merely reproduced familiar religious texts more cheaply than scribes could. Over the following decades, however, it enabled pamphlets, newspapers, and scientific treatises to circulate widely, reshaping politics, religion, and knowledge alike.</p>","prompt":"Which choice best describes the overall structure of the text?","choices":["It traces how an invention's impact grew from modest to transformative.","It weighs the advantages and disadvantages of a technology.","It contrasts two competing accounts of a historical event.","It defines a term and then lists its synonyms."],"ans":0,"exp":{"why":"The text follows the press over time, from cheaply copying religious texts to reshaping politics and knowledge. It traces a shift from a modest early role to a transformative one.","traps":{"B":"Only the expanding benefits are discussed; no drawbacks are weighed.","C":"A single narrative is offered, not two rival accounts.","D":"No term is defined and no synonyms are listed."},"skill":"Text Structure & Purpose","strat":"Words like at first and over the decades mark a change-over-time structure."}},
{"id":"s2-rw-craft-16","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"H","type":"mcq","stim":"<p>Advocates of the four-day workweek often point to gains in productivity, citing studies in which output holds steady or even rises. But focusing solely on output misses the point. The strongest case for the shorter week rests not on efficiency at all but on well-being: workers report less burnout, better health, and more time for family and community.</p>","prompt":"Which choice best describes the function of the sentence But focusing solely on output misses the point in the text?","choices":["It concedes that productivity is the most important measure of the workweek.","It signals a pivot from a common argument to the one the author considers stronger.","It provides statistical evidence for the author's central claim.","It restates the proponents' argument in different words."],"ans":1,"exp":{"why":"The sentence rejects focusing only on output and turns the text from the common productivity argument to the well-being case the author calls strongest. It marks the pivot between the two lines of reasoning.","traps":{"A":"It does the opposite, downplaying productivity rather than crowning it the key measure.","C":"It offers a redirection, not statistics; the numbers appear elsewhere.","D":"It counters the proponents' emphasis instead of restating it."},"skill":"Text Structure & Purpose","strat":"A but sentence between two arguments usually announces the writer's shift to the view they favor."}},
{"id":"s2-rw-craft-17","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"H","type":"mcq","stim":"<p>To call jazz improvisation purely spontaneous is only half the truth. A soloist may indeed invent a melody on the spot, but that invention draws on years of absorbed scales, memorized standards, and internalized harmonic rules. What sounds to the audience like pure freedom is, in fact, freedom shaped and steadied by deep preparation.</p>","prompt":"What is the main purpose of the text?","choices":["To argue that jazz solos are entirely planned in advance.","To trace the historical origins of jazz improvisation.","To complicate a common view by showing that improvisation depends on prior training.","To compare jazz with other improvisational art forms."],"ans":2,"exp":{"why":"The text challenges the idea that improvisation is purely spontaneous, arguing that the soloist's on-the-spot invention rests on years of training. Its purpose is to complicate that common view.","traps":{"A":"The text says solos are invented on the spot, only shaped by training, not fully preplanned.","B":"No historical origins are traced.","D":"No other art forms are brought in for comparison."},"skill":"Text Structure & Purpose","strat":"When a text says a familiar idea is only half true, its purpose is usually to qualify or complicate it."}},
{"id":"s2-rw-craft-18","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"E","type":"mcq","stim":"<p><b>Text 1</b></p><p>Adding protected bike lanes is among the cheapest ways a city can cut both congestion and pollution. When commuters feel safe cycling to work, many leave their cars at home, easing traffic for everyone who remains on the road.</p><p><b>Text 2</b></p><p>Bike lanes deliver benefits only where people actually ride. In cities with long, harsh winters, costly lanes often sit empty for months at a stretch, and planners must weigh that seasonal reality before committing scarce public funds.</p>","prompt":"Based on the texts, how would the author of Text 2 most likely respond to the argument in Text 1?","choices":["By denying that cycling reduces traffic under any conditions.","By agreeing that bike lanes should never be built.","By arguing that cars are more environmentally friendly than bicycles.","By noting that the benefits Text 1 describes may not materialize in all climates."],"ans":3,"exp":{"why":"Text 2 argues that bike lanes help only where people ride and that in harsh-winter cities they sit empty. It would respond to Text 1's optimism by cautioning that the promised benefits may not appear in every climate.","traps":{"A":"Text 2 accepts that lanes deliver benefits where people ride, so it does not deny the effect entirely.","B":"Text 2 urges weighing costs, not imposing a blanket ban on lanes.","C":"Text 2 makes no claim that cars are cleaner than bicycles."},"skill":"Cross-Text Connections","strat":"Identify the second author's core caveat, then apply it directly to the first author's claim."}},
{"id":"s2-rw-craft-19","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"E","type":"mcq","stim":"<p><b>Text 1</b></p><p>Sleep is not idle time. During the deepest stages of sleep, the brain consolidates memories, moving the day's fragile experiences into more durable long-term storage.</p><p><b>Text 2</b></p><p>Researchers once pictured sleep as the brain simply switching off. We now know that the sleeping brain is remarkably busy, flushing out cellular waste and strengthening the neural connections that underlie new learning.</p>","prompt":"Based on the texts, both authors would most likely agree with which statement?","choices":["Sleep is primarily a period of complete rest.","The brain remains actively at work during sleep.","Memory formation occurs mainly while a person is awake.","Sleep serves no measurable biological function."],"ans":1,"exp":{"why":"Text 1 says the brain consolidates memories during sleep, and Text 2 says the sleeping brain clears waste and strengthens connections. Both present the brain as actively working while a person sleeps.","traps":{"A":"Text 2 explicitly rejects the idea that the brain switches off into pure rest.","C":"Text 1 places memory consolidation during sleep, not mainly during waking hours.","D":"Both texts describe important functions, contradicting this statement."},"skill":"Cross-Text Connections","strat":"For agreement questions, find the single idea each passage independently supports."}},
{"id":"s2-rw-craft-20","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>Many popular diet guides insist that eating late at night causes weight gain, urging readers to finish their last meal several hours before going to bed.</p><p><b>Text 2</b></p><p>In a carefully controlled study, participants who consumed identical calories either early or late in the day gained nearly the same amount of weight. What mattered for their weight was total intake, not the position of the meal on the clock.</p>","prompt":"How does the finding in Text 2 relate to the claim in Text 1?","choices":["It confirms the claim with additional experimental evidence.","It explains why late eating slows the body's metabolism.","It challenges the claim by suggesting that timing matters less than total consumption.","It restates the claim using more scientific terminology."],"ans":2,"exp":{"why":"Text 2's study found equal weight gain regardless of meal timing and points to total intake as decisive. That result challenges Text 1's claim that eating late is itself the cause of weight gain.","traps":{"A":"The finding contradicts, rather than confirms, the timing claim.","B":"The study found no timing effect, so it offers no mechanism for late eating slowing metabolism.","D":"It opposes the claim instead of merely rephrasing it."},"skill":"Cross-Text Connections","strat":"Compare what each text credits as the cause, then judge whether the evidence supports or undercuts it."}},
{"id":"s2-rw-craft-21","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>The completion of the transcontinental railroad is often credited to the vision of a handful of powerful financiers, men who secured the funding, lobbied the government, and pushed the project forward against long odds.</p><p><b>Text 2</b></p><p>The rails themselves were laid by tens of thousands of laborers, many of them Chinese immigrants, whose grueling and often deadly work through mountains and deserts rarely appears in the celebratory accounts of the line's completion.</p>","prompt":"Which choice best describes the relationship between the two texts?","choices":["Text 2 shifts attention to a group overlooked in the emphasis of Text 1.","Text 2 provides financial data that supports Text 1.","Text 2 argues that the railroad was ultimately a failure.","Text 2 restates Text 1's explanation in greater detail."],"ans":0,"exp":{"why":"Text 1 credits a few financiers, while Text 2 redirects attention to the many laborers, especially Chinese immigrants, left out of celebratory accounts. Text 2 shifts the focus toward an overlooked group.","traps":{"B":"Text 2 offers no financial data and does not reinforce the financiers' credit.","C":"Text 2 questions who gets the credit, not whether the railroad succeeded.","D":"It introduces a different focus rather than elaborating on the financiers."},"skill":"Cross-Text Connections","strat":"Notice which people or factors each text foregrounds; a shift in focus is itself the relationship."}},
{"id":"s2-rw-craft-22","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>Introducing a top predator into an ecosystem can restore a lost balance. After wolves returned to Yellowstone, herds stopped overgrazing the valleys, and willows and aspens along the streams began to recover.</p><p><b>Text 2</b></p><p>Reintroductions do not always succeed. Predators may fail to establish a stable population, prey may already be too scarce to sustain them, or the surrounding landscape may have changed too much to support the old relationships.</p>","prompt":"Based on the texts, how would the author of Text 2 most likely characterize the Yellowstone example in Text 1?","choices":["As proof that reintroductions never work","As evidence that the wolves harmed the ecosystem","As an example that Text 2 fully endorses without reservation","As one possible outcome rather than a guaranteed result"],"ans":3,"exp":{"why":"Text 2 stresses that reintroductions do not always succeed and lists ways they can fail. It would treat Yellowstone's recovery as one possible outcome, not a result reintroductions are guaranteed to produce.","traps":{"A":"Text 2 says not always, which allows that reintroductions sometimes work, as at Yellowstone.","B":"Neither text claims the wolves caused harm; Text 1 reports recovery.","C":"Text 2's whole point is to attach reservations, so it would not endorse the case without them."},"skill":"Cross-Text Connections","strat":"A text that stresses variation would frame a single success as contingent, not inevitable."}},
{"id":"s2-rw-craft-23","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"H","type":"mcq","stim":"<p><b>Text 1</b></p><p>The spread of emoji shows a language growing poorer. More and more, we drop in a small cartoon face where we once reached for the precise words that could name a feeling exactly, and that habit dulls our command of language.</p><p><b>Text 2</b></p><p>Emoji do not so much replace words as supply what plain text has always lacked: the tone, the gesture, and the facial expression of face-to-face talk. Far from thinning our writing, they make it fuller and less easy to misread.</p>","prompt":"Which choice best describes how the two authors differ in their view of emoji?","choices":["Both authors believe emoji have no real effect on written communication.","Both authors agree that emoji will eventually replace written words.","Text 1 sees emoji as impoverishing language, whereas Text 2 sees them as enriching it.","Text 1 praises emoji for adding tone, whereas Text 2 criticizes their vagueness."],"ans":2,"exp":{"why":"Text 1 argues emoji make language poorer by displacing precise words, while Text 2 argues they add tone and expression that make writing fuller. The authors reach opposite evaluations of the same trend.","traps":{"A":"Both authors think emoji significantly affect writing, so neither sees no effect.","B":"Neither predicts full replacement; Text 2 explicitly denies that emoji replace words.","D":"This reverses the two authors, since Text 1 criticizes and Text 2 praises."},"skill":"Cross-Text Connections","strat":"Pin down each author's overall verdict, positive or negative, before matching it to an answer."}},
{"id":"s2-rw-craft-24","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"H","type":"mcq","stim":"<p><b>Text 1</b></p><p>Some economists argue that raising the minimum wage inevitably reduces employment. Businesses facing higher labor costs, they reason, must respond by hiring fewer workers or cutting the hours of those they already employ.</p><p><b>Text 2</b></p><p>One influential study compared employment in neighboring counties on either side of a state line, one that had raised its wage floor and one that had not. In the years after the change, the researchers found no measurable difference in employment between the two.</p>","prompt":"How does the evidence in Text 2 bear on the argument in Text 1?","choices":["It is largely irrelevant to the claim made in Text 1.","It undercuts the argument by finding no employment loss where the theory predicts one.","It strengthens the argument with a real-world example of job losses.","It confirms that higher wages always increase employment."],"ans":1,"exp":{"why":"Text 1 predicts that a higher minimum wage reduces employment. Text 2's cross-border comparison found no measurable employment difference after the wage rose, undercutting that prediction with a real-world test.","traps":{"A":"The employment comparison directly tests Text 1's claim, so it is highly relevant.","C":"The study found no job losses, so it does not supply an example of them.","D":"The study found no difference, not an increase, so it does not support this stronger claim."},"skill":"Cross-Text Connections","strat":"Check whether the second text's data confirm or fail to confirm the first text's predicted effect."}},
{"id":"s2-rw-info-01","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"E","type":"mcq","stim":"<p>The mimic octopus, found in Indo-Pacific waters, does more than blend into its surroundings. By folding its arms and shifting its color, it can impersonate other sea creatures—flattening itself to resemble a poisonous flatfish or trailing its arms to imitate a venomous sea snake. Researchers note that the animal appears to choose which creature to mimic based on the predator threatening it at the moment, selecting whichever disguise best deters that particular hunter.</p>","prompt":"Which choice best states the main idea of the text?","choices":["The mimic octopus can imitate several dangerous animals and seems to select its disguise to match the threat it faces.","The mimic octopus lives only in the Indo-Pacific and manages to avoid all predators.","The mimic octopus is the only sea creature capable of changing its color.","The mimic octopus prefers imitating flatfish over sea snakes."],"ans":0,"exp":{"why":"The passage describes several disguises the octopus can adopt and states it appears to choose one based on the predator present. Choice A captures both the range of mimicry and the selective behavior that the text emphasizes.","traps":{"B":"Narrows the idea to a habitat detail and overstates matters by claiming the octopus avoids all predators, which the text never says.","C":"The text does not claim the octopus is unique in changing color; other creatures also do so.","D":"The passage says it selects a disguise based on the predator, not that it prefers one disguise."},"skill":"Central Ideas & Details","strat":"Choose the option that captures the passage's full point rather than one narrow detail."}},
{"id":"s2-rw-info-02","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>In the medieval city of Timbuktu, scholarship flourished alongside commerce. Traders crossing the Sahara brought not only salt and gold but also paper and books, and the city's private libraries came to hold hundreds of thousands of manuscripts on subjects ranging from astronomy to law. Rather than serving as a mere waystation for goods, Timbuktu functioned as an intellectual center where knowledge itself was copied, debated, and preserved for later generations.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Timbuktu was valuable chiefly because of the salt and gold that passed through it.","Timbuktu was a center of learning as well as trade, preserving manuscripts across many fields.","Most of Timbuktu's manuscripts concerned astronomy rather than law.","Timbuktu's libraries were owned by the government rather than by individuals."],"ans":1,"exp":{"why":"The passage insists that Timbuktu was more than a trading post, functioning as an intellectual center that preserved manuscripts on many subjects. Choice B joins the commercial and scholarly roles the text describes.","traps":{"A":"Directly contradicts the claim that Timbuktu was more than a mere waystation for goods.","C":"The text gives astronomy and law as endpoints of a range, not as a majority claim.","D":"The passage says the libraries were private, contradicting the idea of government ownership."},"skill":"Central Ideas & Details","strat":"Watch for a contrast signal like 'rather than' that reveals the author's true emphasis."}},
{"id":"s2-rw-info-03","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>Kelp forests grow rapidly, and their dense canopies shelter fish, invertebrates, and marine mammals. When sea otters vanish from a region, populations of sea urchins—one of the otters' main prey—can explode. The urchins then graze so intensively on kelp that lush forests are reduced to barren rock. Where otters return, urchin numbers fall and the kelp recovers, showing how a single predator can shape an entire underwater community.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Sea urchins matter more to kelp forests than any other species does.","By keeping sea urchins in check, sea otters play a decisive role in sustaining kelp forests.","Kelp forests grow too quickly for urchins to affect them.","Marine mammals rarely rely on kelp forests for shelter."],"ans":1,"exp":{"why":"The passage traces how otters limit urchins, which in turn allows kelp to persist, and ends by stressing that one predator shapes the community. Choice B names the otter as that decisive predator.","traps":{"A":"Reverses the logic; urchins destroy kelp, while the otters are the pivotal species.","C":"Contradicts the text, which says urchins can reduce forests to bare rock.","D":"Contradicts the statement that the canopies shelter marine mammals."},"skill":"Central Ideas & Details","strat":"Identify which element the passage credits with the largest effect on the whole system."}},
{"id":"s2-rw-info-04","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"E","type":"mcq","stim":"<p>A comet is often described as a dirty snowball—a mix of ice, dust, and rock. For most of its orbit it stays dark and frozen in the outer solar system. But as it nears the Sun, the ice warms and turns directly to gas, releasing trapped dust. Sunlight and the solar wind push this material away from the Sun, so a comet's glowing tail always points away from the Sun rather than trailing behind the comet's path.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Comets are composed entirely of ice.","A comet's tail forms as the Sun heats it and always points away from the Sun.","Comets glow steadily throughout their entire orbit.","A comet's tail trails behind the direction in which it travels."],"ans":1,"exp":{"why":"The passage explains that solar heating releases gas and dust and that sunlight and solar wind push this material so the tail points away from the Sun. Choice B states both the cause and the direction.","traps":{"A":"The text calls a comet a mix of ice, dust, and rock, not pure ice.","C":"The passage says a comet stays dark for most of its orbit.","D":"Contradicts the closing statement that the tail points away from the Sun, not behind the comet."},"skill":"Central Ideas & Details","strat":"Prefer the choice that matches an explicit statement over a plausible-sounding assumption."}},
{"id":"s2-rw-info-05","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>In a handful of mountainous and forested regions, people have developed whistled forms of their spoken languages. By varying pitch and rhythm, a whistler can encode the vowels and consonants of ordinary speech into tones that carry across valleys far better than shouting. These whistled languages are not separate codes but faithful renderings of the local tongue, letting herders and farmers exchange detailed messages over distances where normal conversation would be impossible.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Whistled languages are secret codes unrelated to local speech.","Whistled languages let people carry their ordinary language over long distances by turning speech into far-reaching tones.","Whistling is always clearer than speaking at close range.","Only herders are able to learn whistled languages."],"ans":1,"exp":{"why":"The passage says whistling encodes ordinary speech into tones that travel across valleys, calling these forms faithful renderings of the local tongue. Choice B captures both the function and the purpose.","traps":{"A":"Contradicts the statement that the whistled forms are faithful renderings, not separate codes.","C":"The advantage described is over long distances, not at close range.","D":"The text names herders and farmers, so it is not limited to herders."},"skill":"Central Ideas & Details","strat":"Match the answer to the specific advantage the passage highlights."}},
{"id":"s2-rw-info-06","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"H","type":"mcq","stim":"<p>People often treat money differently depending on where it came from, even though one dollar is interchangeable with any other. A shopper who would never touch savings for a luxury may spend an unexpected tax refund freely on the very same item, mentally filing the refund as found money. Economists argue that this habit of sorting funds into separate psychological categories, though it defies the logic that all money is equal, can nonetheless help some people restrain impulsive spending.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Sorting money into mental categories is irrational and always leads to overspending.","Although treating identical dollars differently defies strict logic, the habit can sometimes curb impulsive spending.","Tax refunds are the only kind of money people ever treat as found money.","People spend savings and refunds in exactly the same way."],"ans":1,"exp":{"why":"The passage acknowledges that the habit violates the logic of interchangeable money yet notes it can help restrain spending. Choice B balances both the illogic and the practical benefit the economists describe.","traps":{"A":"Contradicts the claim that the habit can restrain, not increase, impulsive spending.","C":"The refund is one example of found money, not the only one.","D":"Contradicts the passage, which shows people treat the two sources differently."},"skill":"Central Ideas & Details","strat":"When a text concedes a flaw yet adds a benefit, the main idea usually holds both."}},
{"id":"s2-rw-info-07","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>Before the Renaissance, many European painters rendered figures with flat, even lighting that gave little sense of depth. The technique known as chiaroscuro changed this by using strong contrasts between light and shadow to make painted forms seem to swell into three dimensions. A face lit from one side, its far cheek sinking into darkness, appeared to occupy real space. Through such contrasts, artists conjured the illusion of solid bodies on a flat surface.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Renaissance painters abandoned the use of light in their work entirely.","Chiaroscuro used contrasts of light and shadow to give painted figures a convincing sense of depth.","Flat, even lighting produced the most realistic images.","Chiaroscuro was used only for painting faces."],"ans":1,"exp":{"why":"The passage defines chiaroscuro as the use of strong light-and-shadow contrast to make flat forms appear three-dimensional. Choice B restates that central purpose.","traps":{"A":"Contradicts the text, which says painters used strong contrasts of light, not none.","C":"The passage says flat lighting gave little sense of depth, not the most realistic images.","D":"The face is offered as one example, not the sole application of the technique."},"skill":"Central Ideas & Details","strat":"Treat an example in the passage as support, not as the boundary of the idea."}},
{"id":"s2-rw-info-08","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>Deep in ancient rock formations lie striking layers of red and gray called banded iron formations. Geologists read them as a record of Earth's changing atmosphere. Long ago, the oceans held dissolved iron and little oxygen. When early microbes began releasing oxygen through photosynthesis, the gas reacted with the iron, which rusted and sank to the seafloor in bands. These layers thus mark the period when oxygen first began to build up on our planet.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Banded iron formations are prized mainly as a modern source of metal.","Banded iron formations record the era when oxygen produced by early life first accumulated on Earth.","Ancient oceans have always contained abundant oxygen.","Microbes created the bands by physically stacking layers of rock."],"ans":1,"exp":{"why":"The passage presents the formations as a record of atmospheric change, marking when oxygen from early microbes began to accumulate. Choice B states this historical significance.","traps":{"A":"The text frames the formations as an atmospheric record, not as a metal resource.","C":"Contradicts the statement that early oceans held little oxygen.","D":"The bands formed from iron rusting and sinking, not from microbes stacking rock."},"skill":"Central Ideas & Details","strat":"Keep the passage's stated causal chain intact when choosing the summary."}},
{"id":"s2-rw-info-09","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"E","type":"mcq","stim":"<p>A student grew identical seedlings under lamps of different colors for three weeks, measuring the average height of each group. She hypothesized that seedlings grown under red light would grow taller than those grown under any other color. Her results are shown below.</p><table><tr><th>Light color</th><th>Average height (cm)</th></tr><tr><td>Blue</td><td>9</td></tr><tr><td>Green</td><td>6</td></tr><tr><td>Red</td><td>14</td></tr><tr><td>White</td><td>11</td></tr></table>","prompt":"Which finding from the table best supports the student's hypothesis?","choices":["Seedlings under red light reached 14 cm, taller than those under any other color.","Seedlings under green light reached only 6 cm.","Seedlings under white light reached 11 cm.","Seedlings under blue light reached 9 cm."],"ans":0,"exp":{"why":"The hypothesis is that red light produces the tallest seedlings. Only choice A compares red with the other colors and confirms 14 cm exceeds every other value, directly supporting the claim.","traps":{"B":"Identifies the shortest group but does not establish that red was the tallest.","C":"Reports one other color's height without comparing it to red.","D":"Reports the blue value alone, which is irrelevant to the claim about red."},"skill":"Command of Evidence","strat":"Pick the data point that directly tests the specific comparison the hypothesis makes."}},
{"id":"s2-rw-info-10","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>A researcher tested whether students who read a passage on paper recalled more details than those who read the same passage on a screen. Two groups read identical texts and then answered ten comprehension questions. The researcher was especially interested in whether any paper advantage grew larger for longer passages. The table shows the average number of questions answered correctly.</p><table><tr><th>Group</th><th>Avg. correct (of 10)</th></tr><tr><td>Paper, short passage</td><td>8.1</td></tr><tr><td>Screen, short passage</td><td>7.9</td></tr><tr><td>Paper, long passage</td><td>7.4</td></tr><tr><td>Screen, long passage</td><td>5.8</td></tr></table>","prompt":"Which finding best supports the claim that the paper advantage is greater for longer passages?","choices":["For the long passage, paper readers averaged 7.4 correct versus 5.8 for screen readers, a wider gap than the 8.1 versus 7.9 seen for the short passage.","Paper readers scored higher than screen readers for the short passage.","Screen readers scored 5.8 on the long passage.","Short-passage readers scored higher overall than long-passage readers."],"ans":0,"exp":{"why":"The short-passage gap is 8.1 minus 7.9, or 0.2, while the long-passage gap is 7.4 minus 5.8, or 1.6. Choice A cites both gaps and shows the advantage is larger for the long passage.","traps":{"B":"Shows a paper advantage only for the short passage and never compares it to the long passage.","C":"Gives a single value with no comparison of the two gaps.","D":"Compares passage lengths overall rather than the size of the paper advantage."},"skill":"Command of Evidence","strat":"For a claim about a growing difference, compare the sizes of the two gaps, not single scores."}},
{"id":"s2-rw-info-11","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>Ornithologists tracked the date on which a songbird species first arrived at a northern breeding site over four decades, along with the average spring temperature. They proposed that warmer springs were associated with earlier arrivals. The table summarizes the data (arrival date is given as day of the year).</p><table><tr><th>Decade</th><th>Avg. spring temp (°C)</th><th>Avg. arrival (day of year)</th></tr><tr><td>1980s</td><td>6.2</td><td>118</td></tr><tr><td>1990s</td><td>6.9</td><td>112</td></tr><tr><td>2000s</td><td>7.5</td><td>107</td></tr><tr><td>2010s</td><td>8.1</td><td>101</td></tr></table>","prompt":"Which finding best supports the researchers' proposal?","choices":["As average spring temperature rose each decade from 6.2°C to 8.1°C, the average arrival date grew earlier, moving from day 118 to day 101.","The average arrival date in the 1980s was day 118.","Spring temperatures rose steadily over the four decades.","The birds arrived on day 107 during the 2000s."],"ans":0,"exp":{"why":"The proposal links warmer springs to earlier arrivals. Choice A tracks both variables across all four decades, showing that rising temperature accompanies progressively earlier arrival dates.","traps":{"B":"Gives one arrival date with no reference to temperature.","C":"Describes only the temperature trend, omitting the link to arrival timing.","D":"Reports a single data point that shows no relationship."},"skill":"Command of Evidence","strat":"Support for an association needs evidence that both variables move together across the data."}},
{"id":"s2-rw-info-12","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"H","type":"mcq","stim":"<p>A company claimed that its new coating kills at least 90 percent of bacteria on a surface within one hour, regardless of the bacterial species. Independent testers applied the coating to samples contaminated with four species and, after one hour, counted the percentage of bacteria killed. Their results appear below.</p><table><tr><th>Species</th><th>Percent killed in 1 hour</th></tr><tr><td>Species W</td><td>94</td></tr><tr><td>Species X</td><td>96</td></tr><tr><td>Species Y</td><td>71</td></tr><tr><td>Species Z</td><td>92</td></tr></table>","prompt":"Which finding most directly weakens the company's claim?","choices":["Species Y showed only 71 percent killed after one hour, below the 90 percent the company claimed for every species.","Species X showed 96 percent killed, the highest of the four.","Three of the four species exceeded 90 percent killed.","Species W and Species Z were killed at similar rates."],"ans":0,"exp":{"why":"The claim promises at least 90 percent for every species. Species Y at 71 percent falls below that threshold, so choice A provides a counterexample that undermines the universal claim.","traps":{"B":"A high result supports the claim rather than weakening it.","C":"Three species clearing 90 percent tends to support the claim, not challenge it.","D":"Comparing two species' rates says nothing about the 90 percent threshold."},"skill":"Command of Evidence","strat":"To weaken a claim that holds for all cases, find the single case that fails it."}},
{"id":"s2-rw-info-13","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>A literary scholar argues that in her poems the writer Amara Okonkwo repeatedly transforms ordinary household objects into vessels for grand themes of memory and grief, treating the domestic with the seriousness usually reserved for the epic.</p>","prompt":"Which quotation from Okonkwo's poetry, if genuine, would most directly support the scholar's argument?","choices":["The cracked teacup on the shelf still holds my grandmother's last unfinished sentence.","I write each morning at my desk before the light grows too bright to think.","The city roared with traffic as the crowds surged past the station gates.","Poetry, the critics say, should never stoop to speak of common things."],"ans":0,"exp":{"why":"The scholar claims Okonkwo turns household objects into vessels for memory and grief. Choice A links a domestic object, the cracked teacup, to a departed grandmother, exactly the transformation described.","traps":{"B":"Describes a writing routine, not a household object charged with grief or memory.","C":"Depicts an urban scene with no domestic object or theme of loss.","D":"Comments abstractly on poetry and even resists elevating common things."},"skill":"Command of Evidence","strat":"The supporting quotation should embody every element of the claim, not just its subject."}},
{"id":"s2-rw-info-14","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>A historian of science contends that the astronomer Yara Delacroix valued careful, repeated observation over elegant theory, insisting that any model must yield to what the sky actually showed.</p>","prompt":"Which quotation from Delacroix's writings would most strongly support the historian's contention?","choices":["A hypothesis, however beautiful, must be set aside the moment a single reliable measurement contradicts it.","The heavens are best understood by reasoning from first principles, without the tedium of measurement.","I have always preferred the company of poets to that of my fellow astronomers.","Funding for new instruments has never been adequate in my lifetime."],"ans":0,"exp":{"why":"The historian says Delacroix put observation above elegant theory. Choice A states that even a beautiful hypothesis must be abandoned when a reliable measurement contradicts it, placing evidence above theory as claimed.","traps":{"B":"Expresses the opposite view, favoring reasoning over measurement.","C":"Reveals a personal preference unrelated to method.","D":"Concerns funding, not the priority of observation over theory."},"skill":"Command of Evidence","strat":"The best quotation directly asserts the very priority the claim describes."}},
{"id":"s2-rw-info-15","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"E","type":"mcq","stim":"<p>A teacher claims that the novelist Behruz Sadeghi believed that reading widely was essential preparation for writing well.</p>","prompt":"Which quotation from Sadeghi would best support the teacher's claim?","choices":["No one who has not first lost himself in a thousand other books can hope to write a single good one.","I never revise; the first draft is always the truest.","Writers are born, not made, and no amount of study can change that.","The best stories come from travel, not from libraries."],"ans":0,"exp":{"why":"The claim is that Sadeghi saw wide reading as essential to good writing. Choice A ties reading many books to the ability to write a good one, matching the claim directly.","traps":{"B":"Addresses revision, not reading as preparation.","C":"Contradicts the claim by denying that study can help a writer.","D":"Elevates travel over reading, opposing the claim."},"skill":"Command of Evidence","strat":"Choose the quotation whose stated cause matches the claim's stated cause."}},
{"id":"s2-rw-info-16","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"H","type":"mcq","stim":"<p>A researcher hypothesizes that the architect Ingrid Halvorsen designed buildings to shape the behavior of the people inside them, not merely to shelter them. To test this, the researcher looks for statements in which Halvorsen describes intending a specific human response as the purpose of a design choice.</p>","prompt":"Which quotation from Halvorsen would most directly support the researcher's hypothesis?","choices":["I widened the central stair and narrowed the corridors so that residents would linger together in the open and hurry through the private halls.","I chose the pale limestone because it weathers gracefully and needs little upkeep over the decades.","The roof was pitched steeply to shed the heavy snows of the northern winters.","The building rose three stories to match the height of its neighbors along the avenue."],"ans":0,"exp":{"why":"The researcher wants a statement tying a design choice to an intended human response. Choice A links the stair and corridor dimensions to residents lingering or hurrying, precisely the behavioral purpose sought.","traps":{"B":"Explains a material choice by durability and maintenance, not human behavior.","C":"Gives a practical, weather-driven reason unrelated to how people act.","D":"Justifies height by matching neighbors, not by influencing occupants."},"skill":"Command of Evidence","strat":"For a hypothesis about intended effects on people, require a quotation naming the human response as the goal."}},
{"id":"s2-rw-info-17","sec":"rw","dom":"info","skill":"Inferences","dif":"E","type":"mcq","stim":"<p>The tuatara, a reptile native to New Zealand, has an extraordinarily slow metabolism. It keeps growing until about age 35 and can live well beyond a century. By contrast, most lizards mature within a few years and rarely survive a decade, so the tuatara reaches its milestones on a vastly extended timescale. This suggests that, relative to typical lizards, the tuatara _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["ages and develops far more slowly.","is far more common in the wild.","requires much warmer temperatures to survive.","produces many more offspring each year."],"ans":0,"exp":{"why":"The passage describes late growth, a long lifespan, and a slow metabolism compared with quick-maturing lizards. The logical completion is that the tuatara ages and develops far more slowly.","traps":{"B":"The text says nothing about how common the tuatara is.","C":"Temperature requirements are never discussed.","D":"Reproductive rate is not mentioned in the passage."},"skill":"Inferences","strat":"Complete the blank using only the comparison the passage actually draws."}},
{"id":"s2-rw-info-18","sec":"rw","dom":"info","skill":"Inferences","dif":"M","type":"mcq","stim":"<p>Archaeologists excavating a 3,000-year-old coastal settlement found bones from fish species that live only in deep offshore waters, along with the remains of large, sturdily built canoes. No such deep-water fish bones appear at neighboring inland sites of the same period. Taken together, these finds suggest that the coastal community _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["had developed the means to travel and fish far from shore.","relied entirely on farming rather than on fishing.","had no contact whatsoever with the inland settlements.","preferred shellfish above all other foods."],"ans":0,"exp":{"why":"Deep-water fish bones plus large, sturdy canoes point to the ability to reach and fish offshore waters. Choice A follows directly from that combination of evidence.","traps":{"B":"Contradicts the clear evidence of fishing at the site.","C":"Overreaches; the absence of deep-water bones inland does not prove there was no contact.","D":"Shellfish are never mentioned in the passage."},"skill":"Inferences","strat":"Let the two pieces of physical evidence, combined, point to a single supported conclusion."}},
{"id":"s2-rw-info-19","sec":"rw","dom":"info","skill":"Inferences","dif":"H","type":"mcq","stim":"<p>A study of a coral species found that colonies exposed to brief, repeated pulses of warmer water later survived a severe heat wave at much higher rates than colonies that had never experienced such pulses. The previously exposed colonies also showed elevated levels of certain protective proteins, which are known to help cells withstand heat stress. The findings suggest that prior exposure to mild heat may _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["prime some corals to better endure later, more extreme heat.","permanently prevent corals from ever bleaching.","make corals more vulnerable to any future warming.","have no measurable effect on the survival of corals."],"ans":0,"exp":{"why":"Exposed colonies survived better and carried more heat-protective proteins, so mild prior exposure appears to prepare corals for harsher heat. Choice A captures this priming effect without overstating it.","traps":{"B":"Overreaches; higher survival is not the same as permanent immunity from bleaching.","C":"Contradicts the finding of improved survival among exposed colonies.","D":"Contradicts the clear difference in survival the study reports."},"skill":"Inferences","strat":"Choose the measured inference over an absolute claim the data cannot guarantee."}},
{"id":"s2-rw-info-20","sec":"rw","dom":"info","skill":"Inferences","dif":"M","type":"mcq","stim":"<p>In a series of trials, participants asked to explain a complex policy in their own words before stating an opinion tended to express more moderate views than those asked for an opinion right away. When required to spell out the mechanisms step by step, many discovered gaps in their understanding. This pattern suggests that trying to explain how something works can _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["make people more aware of the limits of their own knowledge.","increase people's confidence in their initial opinions.","eliminate all disagreement about complex policies.","prevent people from forming any opinion at all."],"ans":0,"exp":{"why":"Participants who had to explain the mechanisms found gaps in their understanding and moderated their views, indicating heightened awareness of what they did not know. Choice A follows directly.","traps":{"B":"Contradicts the result, which showed moderation and revealed gaps rather than added confidence.","C":"Overreaches; nothing suggests all disagreement vanished.","D":"Overreaches; participants still formed opinions, only more moderate ones."},"skill":"Inferences","strat":"Match the inference to the specific outcome, avoiding sweeping words like all or any."}},
{"id":"s2-rw-info-21","sec":"rw","dom":"info","skill":"Inferences","dif":"H","type":"mcq","stim":"<p>A linguist observed that in one community, older speakers use a wide array of distinct words for local plants, while younger speakers, who spend far less time farming, tend to group many of the same plants under a few general terms. The linguist also found that the detailed vocabulary survives mainly in traditional songs that younger people seldom learn. These observations suggest that, in this community, the specialized plant vocabulary _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["may fade as younger generations engage less with the practices that sustained it.","is expanding rapidly among the youngest speakers.","was never actually used in everyday life.","originated in a neighboring community's language."],"ans":0,"exp":{"why":"The detailed vocabulary is tied to farming and songs that younger people rarely take up, while they favor general terms. This points to a likely decline as those practices weaken, which choice A states.","traps":{"B":"Contradicts the observation that younger speakers use fewer, more general terms.","C":"Contradicts the fact that older speakers use it and it appears in songs.","D":"Introduces an origin claim the passage never addresses."},"skill":"Inferences","strat":"Trace the trend the observations imply rather than reversing or inventing facts."}},
{"id":"s2-rw-info-22","sec":"rw","dom":"info","skill":"Inferences","dif":"H","type":"mcq","stim":"<p>Engineers testing a new bridge design subjected scale models to simulated winds. Models with a slight gap running along the center of the roadway swayed far less in strong gusts than solid models did. The gap appeared to let air pass through rather than push against a continuous surface. Because excessive swaying in wind has caused real bridges to fail, the engineers concluded that adding such a gap could _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["improve a bridge's stability under strong winds.","reduce the amount of traffic a bridge can carry.","make bridges more likely to collapse in gusts.","eliminate the need for any supporting cables."],"ans":0,"exp":{"why":"The gapped models swayed less, and excessive sway has caused bridges to fail, so a gap that reduces sway should make a bridge more stable in wind. Choice A follows directly from this reasoning.","traps":{"B":"Traffic capacity is never discussed in the passage.","C":"Contradicts the finding that the gap reduced swaying.","D":"Overreaches; the passage says nothing about eliminating cables or supports."},"skill":"Inferences","strat":"Follow the stated cause and effect to its supported conclusion without adding new claims."}},
{"id":"s2-rw-info-23","sec":"rw","dom":"info","skill":"Inferences","dif":"M","type":"mcq","stim":"<p>Nutrition researchers noticed that residents of a mountain village, who regularly ate a fermented vegetable dish, had unusually diverse communities of gut bacteria. When some residents moved to cities and stopped eating the dish, samples taken a year later showed markedly less diverse gut bacteria. The researchers suspect that the fermented dish _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["contributed to the diversity of the residents' gut bacteria.","was the only food eaten in the mountain village.","caused the residents to move away from the village.","had no relationship to gut bacteria at all."],"ans":0,"exp":{"why":"Diversity was high while residents ate the dish and dropped after they stopped, so the researchers reasonably suspect the dish contributed to that diversity. Choice A captures this suspected link.","traps":{"B":"Overreaches; nothing says the dish was the only food eaten.","C":"Reverses the situation; the move led to a change in diet, not the other way around.","D":"Contradicts the clear pattern connecting the dish to bacterial diversity."},"skill":"Inferences","strat":"Infer the relationship the before-and-after change most directly implies."}},
{"id":"s2-rw-info-24","sec":"rw","dom":"info","skill":"Inferences","dif":"E","type":"mcq","stim":"<p>The Venus flytrap grows in bogs where the soil provides very little nitrogen, a nutrient that plants need. Unlike most plants, it captures and digests insects, absorbing nutrients from their bodies. This unusual diet lets it thrive where the ground alone cannot meet its needs. It is reasonable to conclude that the flytrap's insect-eating habit helps it _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["obtain nutrients that its poor soil lacks.","avoid any need for sunlight.","grow taller than all nearby plants.","survive with no water at all."],"ans":0,"exp":{"why":"The soil is low in nitrogen, and digesting insects supplies nutrients the plant cannot get from the ground. Choice A states that the habit provides the nutrients the poor soil lacks.","traps":{"B":"Overreaches; eating insects does not replace the need for sunlight.","C":"Height compared with other plants is never discussed.","D":"Water is not addressed, and bogs are in fact wet environments."},"skill":"Inferences","strat":"Complete the blank with the exact need the passage says the behavior meets."}},
{"id":"s2-rw-conv-01","sec":"rw","dom":"conv","skill":"Boundaries","dif":"E","type":"mcq","stim":"<p>The museum's east wing closed for repairs last spring ______ its west wing remained open to visitors throughout the season.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", its","; its"," its",": its"],"ans":1,"exp":{"why":"Two independent clauses ('The museum's east wing closed…' and 'its west wing remained open…') must be joined by a semicolon, a period, or a comma plus a coordinating conjunction. A semicolon correctly links them.","traps":{"A":"A comma alone between two independent clauses creates a comma splice.","C":"With no punctuation the clauses fuse into a run-on.","D":"A colon must introduce an explanation or list after a complete clause; the second clause here is a contrasting statement, not an explanation."},"skill":"Boundaries","strat":"Two complete sentences need a semicolon, period, or comma plus FANBOYS — never a comma alone."}},
{"id":"s2-rw-conv-02","sec":"rw","dom":"conv","skill":"Boundaries","dif":"E","type":"mcq","stim":"<p>After the volunteers sorted the donated books by genre ______ they shelved them in the community reading room.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", they"," they","; they",": they"],"ans":0,"exp":{"why":"The sentence opens with an introductory dependent clause ('After the volunteers sorted the donated books by genre'); a comma must separate it from the main clause that follows.","traps":{"B":"Omitting the comma runs the introductory clause into the main clause.","C":"A semicolon cannot join a dependent clause to an independent clause.","D":"A colon is not used after an introductory adverbial clause."},"skill":"Boundaries","strat":"Put a comma after an introductory clause or phrase, before the main clause begins."}},
{"id":"s2-rw-conv-03","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The composer's final symphony, completed only weeks before her death ______ premiered to a standing ovation in Vienna.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["death, premiered","death premiered","death; premiered","death: premiered"],"ans":0,"exp":{"why":"The phrase 'completed only weeks before her death' is a nonessential element; because it opens with a comma, it must close with a comma before the verb 'premiered.'","traps":{"B":"Without the closing comma, the nonessential element is left unbounded on one side.","C":"A semicolon would wrongly separate the subject ('symphony') from its verb ('premiered').","D":"A colon cannot fall between a subject and its verb."},"skill":"Boundaries","strat":"A nonessential element needs matching punctuation on both sides."}},
{"id":"s2-rw-conv-04","sec":"rw","dom":"conv","skill":"Boundaries","dif":"E","type":"mcq","stim":"<p>The campfire recipe called for only three pantry staples ______ flour, honey, and a generous pinch of salt.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[": flour",", flour","; flour"," flour"],"ans":0,"exp":{"why":"A colon follows a complete independent clause to introduce a list. 'The campfire recipe called for only three pantry staples' is complete, so a colon correctly introduces the items.","traps":{"B":"A comma is too weak here and is ambiguous alongside the commas already inside the list.","C":"A semicolon must be followed by an independent clause, not a list of nouns.","D":"Omitting punctuation leaves the list without any introduction."},"skill":"Boundaries","strat":"Use a colon after a complete sentence to introduce a list or explanation."}},
{"id":"s2-rw-conv-05","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The debate tournament drew competitors from Austin, Texas ______ Reno, Nevada; and Mobile, Alabama.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["; Reno",", Reno",": Reno"," Reno"],"ans":0,"exp":{"why":"When items in a series already contain internal commas (city, state), semicolons must separate the items so the boundaries between them stay clear.","traps":{"B":"A comma is ambiguous because commas already separate each city from its state.","C":"A colon does not separate items within a series.","D":"Omitting punctuation fuses two list items together."},"skill":"Boundaries","strat":"Use semicolons to separate list items that contain their own commas."}},
{"id":"s2-rw-conv-06","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The hikers reached the summit by noon ______ they still had four hours of daylight left for the descent.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["so they",", so they","; so, they",": so they"],"ans":1,"exp":{"why":"Two independent clauses joined by the coordinating conjunction 'so' require a comma before the conjunction.","traps":{"A":"Dropping the comma before 'so' when it joins two independent clauses creates a run-on.","C":"A semicolon is not used before a coordinating conjunction, and the comma after 'so' is incorrect.","D":"A colon does not precede a coordinating conjunction that links two clauses."},"skill":"Boundaries","strat":"Comma plus a FANBOYS conjunction joins two complete sentences."}},
{"id":"s2-rw-conv-07","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>Three of the interns—all recent graduates of the same design program ______ were assigned to the museum's archival project.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["program—were","program, were","program were","program; were"],"ans":0,"exp":{"why":"The interrupting element is introduced with a dash, so it must be closed with a matching dash; punctuation marks framing an interrupter must be the same type.","traps":{"B":"A comma cannot pair with an opening dash to enclose the interrupter.","C":"With no closing punctuation, the interrupter runs straight into the verb.","D":"A semicolon would separate the subject from its verb and cannot pair with a dash."},"skill":"Boundaries","strat":"Enclose an interrupter with a matching pair — two dashes or two commas, never one of each."}},
{"id":"s2-rw-conv-08","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The employees ______ completed the advanced safety certification received a year-end bonus, while their colleagues did not.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["who",", who","; who","who,"],"ans":0,"exp":{"why":"The clause 'who completed the advanced safety certification' is essential — it identifies which employees earned the bonus — so it takes no commas.","traps":{"B":"A comma before 'who' wrongly signals a nonessential clause and would need a matching comma to close it.","C":"A semicolon cannot introduce a relative clause.","D":"A comma after 'who' incorrectly interrupts the relative clause."},"skill":"Boundaries","strat":"Essential (restrictive) clauses take no commas."}},
{"id":"s2-rw-conv-09","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The observatory hosts free public viewing nights every Friday ______ amateur astronomers often bring their own telescopes to share with visitors.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[". Amateur",", amateur"," amateur",", plus amateur"],"ans":0,"exp":{"why":"The two independent clauses can be split into separate sentences with a period after 'Friday' (a semicolon would also work).","traps":{"B":"A comma between two independent clauses is a comma splice.","C":"With no punctuation the clauses fuse into a run-on.","D":"'Plus' is not a coordinating conjunction and cannot join two independent clauses after a comma."},"skill":"Boundaries","strat":"When two complete thoughts collide, a period is always a safe boundary."}},
{"id":"s2-rw-conv-10","sec":"rw","dom":"conv","skill":"Boundaries","dif":"H","type":"mcq","stim":"<p>The overseas shipment cleared customs a full week behind schedule ______ therefore, the boutique missed the holiday sales window entirely.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["; therefore,",", therefore,"," therefore,",": therefore,"],"ans":0,"exp":{"why":"'Therefore' is a conjunctive adverb, not a conjunction; two independent clauses joined around it need a semicolon before it (and a comma after).","traps":{"B":"A comma before 'therefore' joining two clauses produces a comma splice.","C":"With no punctuation, the two clauses fuse into a run-on.","D":"A colon does not precede a conjunctive adverb that links two independent clauses."},"skill":"Boundaries","strat":"Semicolon before a conjunctive adverb (however, therefore, thus); comma after it."}},
{"id":"s2-rw-conv-11","sec":"rw","dom":"conv","skill":"Boundaries","dif":"H","type":"mcq","stim":"<p>Whisk the eggs and sugar until the mixture pales ______ then fold in the sifted flour a little at a time.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["; then",", then"," then",": then"],"ans":0,"exp":{"why":"'Then' is an adverb, not a coordinating conjunction, so it cannot join two independent commands with only a comma; a semicolon (or period) is required.","traps":{"B":"A comma before 'then' between two independent clauses is a comma splice.","C":"Omitting punctuation fuses the two commands into a run-on.","D":"A colon is not used to link two parallel commands joined by 'then.'"},"skill":"Boundaries","strat":"'Then' can't fix a comma splice — treat it like any adverb and use a semicolon or period."}},
{"id":"s2-rw-conv-12","sec":"rw","dom":"conv","skill":"Boundaries","dif":"H","type":"mcq","stim":"<p>The city council reviewed the cycling proposal for nearly two months ______ and eventually approved the new protected bike lanes.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[" and",", and","; and",": and"],"ans":0,"exp":{"why":"'reviewed… and eventually approved' is a compound predicate sharing one subject ('The city council'), so no comma precedes the conjunction joining the two verbs.","traps":{"B":"A comma before 'and' wrongly implies a second independent clause, but 'approved the new lanes' has no subject of its own.","C":"A semicolon must separate two independent clauses; the second verb phrase is not a clause.","D":"A colon cannot join two verbs in a compound predicate."},"skill":"Boundaries","strat":"Don't put a comma before 'and' when it joins two verbs that share one subject."}},
{"id":"s2-rw-conv-13","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>The box of antique brass doorknobs ______ far heavier than it looks.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["is","are","were","have been"],"ans":0,"exp":{"why":"The subject is 'box,' which is singular; the prepositional phrase 'of antique brass doorknobs' does not change the subject's number, so the verb must be singular 'is.'","traps":{"B":"'Are' is plural and disagrees with the singular subject 'box.'","C":"'Were' is plural and also shifts the sentence into the past.","D":"'Have been' is plural and disagrees with 'box.'"},"skill":"Form, Structure & Sense","strat":"Ignore the words between the subject and verb; match the verb to the true subject."}},
{"id":"s2-rw-conv-14","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>Each of the city's science museums extended ______ hours during the week of the festival.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","its","it's","they're"],"ans":1,"exp":{"why":"'Each' is always singular, so the possessive pronoun referring to it must be singular: 'its.'","traps":{"A":"'Their' is plural and disagrees with the singular 'Each.'","C":"'It's' is a contraction of 'it is' and cannot show possession.","D":"'They're' means 'they are' and is neither singular nor possessive."},"skill":"Form, Structure & Sense","strat":"'Each,' 'every,' and 'one' are singular — use singular pronouns and verbs."}},
{"id":"s2-rw-conv-15","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>By the time the ferry finally docked, the afternoon storm ______ already passed out to sea.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["had","has","will have","have"],"ans":0,"exp":{"why":"The storm's passing occurred before the past-tense docking, so the earlier action takes the past perfect: 'had passed.'","traps":{"B":"'Has' is present perfect and clashes with the past-tense 'docked.'","C":"'Will have' is future and cannot describe an action already completed in the past.","D":"'Have' is plural and present, disagreeing with the singular past context."},"skill":"Form, Structure & Sense","strat":"Use past perfect (had + participle) for the earlier of two past events."}},
{"id":"s2-rw-conv-16","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Neither the shift manager nor the two new assistants ______ aware of the scheduling error until Friday.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","were","has been","is"],"ans":1,"exp":{"why":"In 'neither…nor' constructions the verb agrees with the subject nearer to it. 'The two new assistants' is plural, so the verb is 'were.'","traps":{"A":"'Was' is singular, but the nearer subject 'assistants' is plural.","C":"'Has been' is singular and disagrees with the plural nearer subject.","D":"'Is' is singular and present, disagreeing in both number and tense."},"skill":"Form, Structure & Sense","strat":"With neither/nor (or either/or), match the verb to the closer subject."}},
{"id":"s2-rw-conv-17","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>At dawn the flock of migrating geese ______ silently across the misty field toward the river.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["move","moves","have moved","are moving"],"ans":1,"exp":{"why":"'Flock' is a singular collective noun acting as one unit, so it takes the singular verb 'moves'; the phrase 'of migrating geese' does not change its number.","traps":{"A":"'Move' is plural and disagrees with the singular 'flock.'","C":"'Have moved' is plural and shifts the tense away from the ongoing scene.","D":"'Are moving' is plural and disagrees with the singular subject."},"skill":"Form, Structure & Sense","strat":"A collective noun acting as one unit takes a singular verb."}},
{"id":"s2-rw-conv-18","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The printmaking workshop taught us to sketch quickly, to mix colors boldly, and ______ steadily under pressure.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["working","to work","worked","that we work"],"ans":1,"exp":{"why":"The sentence lists parallel infinitive phrases ('to sketch,' 'to mix'), so the final item must also be an infinitive: 'to work.'","traps":{"A":"'Working' is a gerund and breaks the 'to + verb' pattern.","C":"'Worked' is a past-tense verb and is not parallel with the infinitives.","D":"'That we work' introduces a clause rather than a parallel phrase."},"skill":"Form, Structure & Sense","strat":"Items in a series must share the same grammatical form."}},
{"id":"s2-rw-conv-19","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Balanced carefully on one fingertip, ______</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the crowd gasped as the basketball spun for nearly a minute.","the basketball spun for nearly a minute atop the performer's hand.","there was a basketball spinning for nearly a minute.","it was impressive how long the basketball kept spinning."],"ans":1,"exp":{"why":"The opening modifier 'Balanced carefully on one fingertip' must be followed immediately by the noun it describes — the basketball. Only choice B places 'the basketball' right after the modifier.","traps":{"A":"This makes 'the crowd' the thing balanced on a fingertip, an illogical dangling modifier.","C":"'There' cannot be balanced on a fingertip, so the modifier has no logical subject.","D":"'It' is an empty subject that the modifier cannot logically describe."},"skill":"Form, Structure & Sense","strat":"Put the noun a modifying phrase describes right after the comma."}},
{"id":"s2-rw-conv-20","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The regional science award was shared equally between Marcus and ______ after the final tally.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["I","me","myself","he"],"ans":1,"exp":{"why":"The pronoun is an object of the preposition 'between,' so it must be in the objective case: 'me.'","traps":{"A":"'I' is subject case and cannot serve as the object of 'between.'","C":"'Myself' is a reflexive pronoun with no antecedent in the sentence to reflect.","D":"'He' is subject case and is incorrect as an object."},"skill":"Form, Structure & Sense","strat":"After a preposition, use object pronouns: me, him, her, us, them."}},
{"id":"s2-rw-conv-21","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>Priya is one of those engineers who ______ never satisfied with a first draft of a design.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["is","are","was","has been"],"ans":1,"exp":{"why":"In 'one of those engineers who…,' the relative pronoun 'who' refers to the plural noun 'engineers,' so the verb is plural: 'are.'","traps":{"A":"'Is' is singular, but 'who' refers to plural 'engineers,' not to 'one.'","C":"'Was' is singular and shifts the sentence into the past.","D":"'Has been' is singular and disagrees with the plural antecedent."},"skill":"Form, Structure & Sense","strat":"In 'one of those ___ who,' the verb agrees with the plural noun, not with 'one.'"}},
{"id":"s2-rw-conv-22","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>If the negotiators had reached an agreement sooner, the factory ______ its full workforce through the winter.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["would retain","would have retained","had retained","will retain"],"ans":1,"exp":{"why":"A past contrary-to-fact condition ('had reached') pairs with 'would have + past participle' in the result clause: 'would have retained.'","traps":{"A":"'Would retain' lacks the perfect form needed for a past unreal result.","C":"'Had retained' is the form for the if-clause, not the result clause.","D":"'Will retain' is future and cannot describe a past unreal outcome."},"skill":"Form, Structure & Sense","strat":"If…had + participle, then would have + participle."}},
{"id":"s2-rw-conv-23","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>The board recommended that each new director ______ the ethics training before the first quarterly meeting.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["completes","complete","completed","will complete"],"ans":1,"exp":{"why":"After a verb of recommendation ('recommended that'), Standard English uses the subjunctive, which takes the base form 'complete' regardless of subject.","traps":{"A":"'Completes' is indicative, not the required subjunctive.","C":"'Completed' is past indicative and does not fit the subjunctive construction.","D":"'Will complete' is future indicative rather than the base subjunctive form."},"skill":"Form, Structure & Sense","strat":"After recommend, require, or insist that, use the base verb form."}},
{"id":"s2-rw-conv-24","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The revised turbine is far more energy-efficient than ______ of the previous model.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["that","those","the one","it"],"ans":0,"exp":{"why":"The comparison is between two turbines; the singular pronoun 'that' stands in for 'the turbine,' giving 'more efficient than that of the previous model.'","traps":{"B":"'Those' is plural but must stand for the singular 'turbine.'","C":"'The one' is wordy and unidiomatic in this comparison of features.","D":"'It' cannot show the possessive 'of the previous model' comparison cleanly and leaves the comparison illogical."},"skill":"Form, Structure & Sense","strat":"Use 'that' (singular) or 'those' (plural) to compare like nouns cleanly."}},
{"id":"s2-rw-expr-01","sec":"rw","dom":"expr","skill":"Transitions","dif":"E","type":"mcq","stim":"<p>The café’s ovens broke down on the morning of the harvest festival. ______ the staff could not prepare the trays of pastries they had promised to sell at their booth.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Therefore,","However,","For example,","Meanwhile,"],"ans":0,"exp":{"why":"Cause and effect: broken ovens are the cause, and the inability to prepare pastries is the direct result, so ‘Therefore’ is uniquely correct.","traps":{"B":"‘However’ signals contrast, but the second sentence continues logically from the first rather than opposing it.","C":"‘For example’ signals an illustration, yet the second sentence states a consequence, not an instance of the first.","D":"‘Meanwhile’ signals simultaneity, but no separate concurrent action is described."},"skill":"Transitions","strat":"Ask whether the second sentence results from the first; if so, choose a cause-effect transition."}},
{"id":"s2-rw-expr-02","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>Marine biologists once assumed that creatures of the deep sea lived in near-total darkness. ______ a great many of these species generate their own glow through a chemical process called bioluminescence.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["However,","Therefore,","In addition,","For instance,"],"ans":0,"exp":{"why":"Contrast: the second sentence overturns the old assumption of darkness, so ‘However’ is uniquely correct.","traps":{"B":"‘Therefore’ signals a consequence, but the glowing species contradict rather than follow from the assumption.","C":"‘In addition’ adds a similar point, yet the second sentence opposes the first.","D":"‘For instance’ introduces an example, but the sentence corrects the earlier claim rather than illustrating it."},"skill":"Transitions","strat":"When the second sentence undercuts an earlier belief, use a contrast transition."}},
{"id":"s2-rw-expr-03","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>The new protected bicycle lane cut the number of traffic accidents along the avenue nearly in half. ______ it encouraged hundreds of residents to begin commuting without their cars.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","In addition,","For example,","In other words,"],"ans":1,"exp":{"why":"Addition: the second sentence supplies a further benefit of the lane alongside the first, so ‘In addition’ is uniquely correct.","traps":{"A":"‘Nevertheless’ signals contrast, but both sentences describe positive outcomes that agree.","C":"‘For example’ signals an instance of the first point, yet the second is a separate benefit, not an example of reduced accidents.","D":"‘In other words’ restates a prior idea, but the second sentence adds new information."},"skill":"Transitions","strat":"When both sentences list benefits pointing the same direction, choose an addition transition."}},
{"id":"s2-rw-expr-04","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>Some plants defend themselves with chemistry rather than with thorns or spines. ______ the milkweed floods its leaves with a bitter, toxic sap that discourages hungry insects from feeding.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["However,","For example,","As a result,","Meanwhile,"],"ans":1,"exp":{"why":"Illustration: the milkweed is a specific instance of a plant that defends itself chemically, so ‘For example’ is uniquely correct.","traps":{"A":"‘However’ signals contrast, but the second sentence supports rather than opposes the first.","C":"‘As a result’ signals a consequence, yet the milkweed is an example, not an effect, of the general claim.","D":"‘Meanwhile’ signals a concurrent event, which does not fit an example."},"skill":"Transitions","strat":"If the second sentence names one specific case of a general claim, use an example transition."}},
{"id":"s2-rw-expr-05","sec":"rw","dom":"expr","skill":"Transitions","dif":"H","type":"mcq","stim":"<p>The expedition’s navigation instruments had been ruined during the storm, and more than half the crew argued that the ship should turn back. ______ the captain resolved to press on toward the uncharted coast.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","Consequently,","Similarly,","In short,"],"ans":0,"exp":{"why":"Concession: despite the damage and the crew’s objections, the captain does the opposite of what those obstacles would suggest, so ‘Nevertheless’ is uniquely correct.","traps":{"B":"‘Consequently’ signals that pressing on results from the obstacles, but it happens in spite of them.","C":"‘Similarly’ signals a comparison, yet the two sentences pull in opposite directions.","D":"‘In short’ signals a summary, but the second sentence introduces a new, contrary decision."},"skill":"Transitions","strat":"When an action defies the obstacles just described, choose a concession transition."}},
