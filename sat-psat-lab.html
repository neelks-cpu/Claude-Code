function exportData(){
  try{
    const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='scorelab-progress.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ toast('Export not available here'); }
}

/* ---------------------------------------------------------------------------
   PRINTABLE SCORE REPORT
   ------------------------------------------------------------------------- */
function buildReport(){
  const v=el('view'); CURRENT='report'; renderNav();
  const scale=CONFIG.scales[STATE.target];
  const total=projectedTotal(), rw=projectedSection('rw'), math=projectedSection('math');
  const answered=STATE.log.length;
  const acc=answered?Math.round(100*STATE.log.filter(r=>r.correct).length/answered):0;
  const bars=DOM_ORDER.map(d=>{
    const info=CONFIG.domains[d]; const {m,seen}=domainMastery(d);
    return `<div class="mastery-row"><div class="lbl">${info.name}<small>${(info.wt*100)|0}% wt</small></div>
      <div class="bar"><i style="width:${(m*100).toFixed(0)}%"></i></div>
      <div class="pct">${seen?(m*100).toFixed(0)+'%':'—'}</div></div>`;
  }).join('');
  const runs=STATE.history.slice(-6).reverse().map(h=>`<tr><td>${CONFIG.sections[h.sec]||h.sec}</td>
    <td>${h.est}</td><td>${h.correct}/${h.total}</td><td>${h.route}</td></tr>`).join('')
    || `<tr><td colspan="4" class="muted">No full-length runs yet</td></tr>`;
  const dt=new Date();
  v.innerHTML=`<div class="card report-print">
    <div class="no-print btnrow" style="justify-content:flex-end;margin-bottom:8px">
      <button class="btn" onclick="if(typeof window!=='undefined'&&window.print)window.print()">Print / Save PDF</button>
      <button class="btn ghost" onclick="go('dashboard')">Close</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div><h2 style="font-size:22px">ScoreLab report</h2>
      <div class="muted">${esc(STATE.name||'Student')} · target ${scale.name} · ${dt.toLocaleDateString?dt.toLocaleDateString():todayStr()}</div></div>
      <div class="center"><div class="gauge-score" style="font-size:44px">${total}</div><div class="muted">projected ${scale.name}</div></div>
    </div>
    <div class="kpi" style="margin:16px 0">
      <div class="k"><div class="v">${rw}</div><div class="l">Reading/Writing</div></div>
      <div class="k"><div class="v">${math}</div><div class="l">Math</div></div>
      <div class="k"><div class="v">${answered}</div><div class="l">Questions done</div></div>
      <div class="k"><div class="v">${acc}%</div><div class="l">Overall accuracy</div></div>
    </div>
    <h3 style="margin:8px 0">Domain mastery (blueprint-weighted)</h3>
    ${bars}
    <h3 style="margin:16px 0 6px">Recent full-length runs</h3>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="text-align:left;color:var(--muted)"><th style="padding:6px">Section</th><th>Est.</th><th>Raw</th><th>Route</th></tr></thead>
      <tbody>${runs}</tbody>
    </table>
    <p class="muted" style="font-size:12px;margin-top:14px">Projection = base (${scale.base}) + difficulty-weighted mastery × 600 per section, clamped to the ${scale.name} scale. Estimates are practice indicators, not official scores.</p>
  </div>`;
  if(typeof window!=='undefined' && window.scrollTo) window.scrollTo(0,0);
}

/* ---------------------------------------------------------------------------
   BOOT
   ------------------------------------------------------------------------- */
function boot(){ renderNav(); go('dashboard'); }
if(hasDoc){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}

/* expose for smoke harness / console */
if(typeof window!=='undefined'){
  window.ScoreLab={ QUESTIONS, CONFIG, parseNum, sprCorrect, projectedTotal, projectedSection,
    domainMastery, sectionMastery, recordAttempt, mistakeIds, get STATE(){return STATE;}, go, buildReport,
    mathHTML, mathText, buildModule1, buildModule2, fillModule, routeDecision, estimateSectionScore,
    weightedDraw, FULL_SPEC, formPools, FORMS };
}
if(typeof module!=='undefined' && module.exports){
  module.exports={ QUESTIONS, CONFIG, parseNum, sprCorrect, projectedTotal, projectedSection,
    domainMastery, sectionMastery, mistakeIds };
}
</script>
