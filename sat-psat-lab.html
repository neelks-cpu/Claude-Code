{"id":"s2-rw-expr-06","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>Throughout the morning, the geologists carefully mapped the exposed rock along the eastern ridge. ______ their colleagues gathered soil samples from the valley floor far below.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Therefore,","Meanwhile,","However,","In other words,"],"ans":1,"exp":{"why":"Simultaneity: two groups perform different tasks at the same time, so ‘Meanwhile’ is uniquely correct.","traps":{"A":"‘Therefore’ signals cause and effect, but neither activity causes the other.","C":"‘However’ signals contrast, yet the tasks simply occur together without opposing each other.","D":"‘In other words’ restates an idea, but the second sentence describes a separate action."},"skill":"Transitions","strat":"When two actions happen at once, use a transition of simultaneity."}},
{"id":"s2-rw-expr-07","sec":"rw","dom":"expr","skill":"Transitions","dif":"E","type":"mcq","stim":"<p>The parks in the city’s oldest district are small and scattered among crowded blocks. ______ the newer suburbs boast sprawling green spaces linked together by long walking trails.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["By contrast,","As a result,","For example,","In addition,"],"ans":0,"exp":{"why":"Contrast: cramped old parks are set against spacious new ones, so ‘By contrast’ is uniquely correct.","traps":{"B":"‘As a result’ signals a consequence, but the suburbs’ parks are not caused by the old district’s.","C":"‘For example’ signals an instance, yet the second sentence describes a different case, not an example of the first.","D":"‘In addition’ adds a similar point, but the two descriptions oppose each other."},"skill":"Transitions","strat":"When the two sentences describe opposite conditions, choose a contrast transition."}},
{"id":"s2-rw-expr-08","sec":"rw","dom":"expr","skill":"Transitions","dif":"M","type":"mcq","stim":"<p>The recommendation engine assigns every user a score drawn from thousands of past clicks, pauses, and searches. ______ it tries to guess what you will want to watch before you have decided yourself.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["However,","In other words,","Meanwhile,","For instance,"],"ans":1,"exp":{"why":"Restatement: the second sentence recasts the technical description in plainer terms, so ‘In other words’ is uniquely correct.","traps":{"A":"‘However’ signals contrast, but the second sentence agrees with and clarifies the first.","C":"‘Meanwhile’ signals simultaneity, which does not fit a restatement.","D":"‘For instance’ introduces an example, yet the second sentence rephrases the whole idea rather than giving one case."},"skill":"Transitions","strat":"When the second sentence says the same thing more simply, choose a restatement transition."}},
{"id":"s2-rw-expr-09","sec":"rw","dom":"expr","skill":"Transitions","dif":"H","type":"mcq","stim":"<p>Honeybees can sense the faint electric charge that flowers build up and then shed as visitors carry away their pollen. ______ a foraging bee can often tell at a glance whether a blossom has just been emptied by another insect.</p>","prompt":"Which choice completes the text with the most logical transition?","choices":["Thus,","Nevertheless,","By contrast,","In addition,"],"ans":0,"exp":{"why":"Cause and effect: the bee’s ability to judge a flower follows directly from its sensitivity to electric charge, so ‘Thus’ is uniquely correct.","traps":{"B":"‘Nevertheless’ signals contrast, but the second sentence is a logical consequence of the first.","C":"‘By contrast’ signals opposition, yet the two sentences agree.","D":"‘In addition’ adds a separate point, but the second sentence explains a result of the ability just described."},"skill":"Transitions","strat":"When the second sentence states what the first ability makes possible, choose a cause-effect transition."}},
{"id":"s2-rw-expr-10","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"E","type":"mcq","stim":"<p>While researching West African music, a student took the following notes:</p><ul><li>The kora is a stringed musical instrument from West Africa.</li><li>It has 21 strings.</li><li>Its rounded body is made from a large calabash gourd.</li><li>It is traditionally played by griots, hereditary storytellers and musicians.</li></ul>","prompt":"The student wants to introduce the kora to an audience unfamiliar with the instrument. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Griots, unlike most other musicians, have passed the kora down through their families for generations.","The kora has 21 strings, which is more than many other stringed instruments.","The kora is a 21-stringed West African instrument, built around a large calabash gourd, that is traditionally played by griots.","Because it is shaped from a calabash gourd, the kora produces its famously warm and distinctive tone."],"ans":2,"exp":{"why":"Introducing an unfamiliar instrument calls for a clear identifying definition; choice C names what the kora is, where it comes from, its structure, and who plays it.","traps":{"A":"Focuses on griots and assumes the reader already knows what a kora is.","B":"Gives a single detail and compares it to unnamed instruments rather than introducing the kora.","D":"Asserts a ‘famously warm’ tone not in the notes and presumes familiarity with the instrument’s sound."},"skill":"Rhetorical Synthesis","strat":"To introduce something unfamiliar, choose the option that plainly defines what it is."}},
{"id":"s2-rw-expr-11","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>While studying coffee production, a student took the following notes:</p><ul><li>In washed coffee, the fruit is removed from the beans before they are dried.</li><li>In natural coffee, the beans are dried while the fruit is still attached.</li><li>Washed coffee tends to taste bright and clean.</li><li>Natural coffee tends to taste fruity and heavy.</li></ul>","prompt":"The student wants to emphasize a contrast between washed coffee and natural coffee. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Washed coffee and natural coffee are both made by drying coffee beans.","In natural coffee, the beans are dried while the fruit is still attached to them.","Coffee beans can be prepared for roasting in more than one way.","Whereas washed coffee, with its fruit removed before drying, tastes bright and clean, natural coffee, dried with the fruit attached, tastes fruity and heavy."],"ans":3,"exp":{"why":"The goal is contrast; choice D uses ‘whereas’ to set the two processing methods and their opposite flavors directly against each other.","traps":{"A":"Highlights what the two methods share, which emphasizes similarity rather than contrast.","B":"Describes only one method, providing nothing to contrast it with.","C":"States a vague generality without naming any contrasting difference."},"skill":"Rhetorical Synthesis","strat":"For a contrast goal, pick the option that places two differing items side by side with a contrast marker."}},
{"id":"s2-rw-expr-12","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>While reviewing a sleep study, a student took the following notes:</p><ul><li>Researchers gave a memory game to 200 volunteers.</li><li>Volunteers who napped for 20 minutes scored higher than those who stayed awake.</li><li>The study lasted only a single afternoon.</li><li>All of the volunteers were college students.</li></ul>","prompt":"The student wants to present the study’s main finding while noting a limitation of the study. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The study, which lasted only a single afternoon, involved 200 volunteers, all of them college students.","Volunteers who took a 20-minute nap outscored those who stayed awake, though the study lasted only a single afternoon.","Volunteers who napped for 20 minutes scored higher on the memory game than those who stayed awake.","The study showed that taking a short nap will improve anyone’s memory."],"ans":1,"exp":{"why":"The goal requires a finding plus a limitation; choice B reports the higher nap scores (finding) and notes the single-afternoon span (limitation).","traps":{"A":"Lists limitations only and omits the finding about nappers’ scores.","C":"States the finding but includes no limitation.","D":"Overgeneralizes to ‘anyone’ and mentions no limitation."},"skill":"Rhetorical Synthesis","strat":"For finding-plus-limitation goals, verify the choice contains both a result and a caveat."}},
{"id":"s2-rw-expr-13","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>While researching the history of engineering, a student took the following notes:</p><ul><li>The Iron Bridge in England opened in 1779.</li><li>It was the first major bridge built of cast iron.</li><li>The Eads Bridge in the United States opened in 1874.</li><li>It was the first major bridge built largely of steel.</li></ul>","prompt":"The student wants to emphasize a similarity between the two bridges. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Iron Bridge opened in 1779, nearly a century before the Eads Bridge opened in 1874.","The Eads Bridge was the first major bridge to be built largely of steel.","Both the Iron Bridge and the Eads Bridge were pioneers, each being the first major bridge built from a new structural metal.","Unlike the Iron Bridge, the Eads Bridge was built in the United States rather than in England."],"ans":2,"exp":{"why":"The goal is similarity; choice C shows that each bridge shared the same distinction of being the first major bridge in a new structural metal.","traps":{"A":"Stresses the gap in dates, emphasizing difference rather than similarity.","B":"Describes only one bridge, so no similarity is drawn.","D":"Uses ‘unlike’ to point out a difference in location."},"skill":"Rhetorical Synthesis","strat":"For a similarity goal, choose the option that shows both items sharing the same trait."}},
{"id":"s2-rw-expr-14","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"H","type":"mcq","stim":"<p>While reviewing a town proposal, a student took the following notes:</p><ul><li>A town proposed replacing its streetlights with new LED fixtures.</li><li>The LED fixtures use about 50 percent less electricity than the old bulbs.</li><li>Installing the new fixtures would cost the town 1.2 million dollars upfront.</li><li>The town would recover that cost through energy savings within eight years.</li></ul>","prompt":"The student wants to argue in favor of switching to the LED fixtures while acknowledging a drawback. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Installing the new LED fixtures would cost the town 1.2 million dollars upfront.","The LED fixtures use about 50 percent less electricity and would pay for themselves within eight years.","The town proposed replacing its aging streetlights with LED fixtures that use less electricity.","Although the LED fixtures would cost 1.2 million dollars upfront, they use half the electricity of the old bulbs and would pay for themselves within eight years."],"ans":3,"exp":{"why":"The goal is to make a case despite a drawback; choice D concedes the high upfront cost with ‘although’ and then argues for the switch using the savings.","traps":{"A":"Presents only the drawback and makes no case for the switch.","B":"Makes the case but never acknowledges the upfront-cost drawback.","C":"Stays neutral, neither arguing for the switch nor naming a drawback."},"skill":"Rhetorical Synthesis","strat":"For make-a-case-despite-a-drawback goals, require both a concession and a supporting argument."}},
{"id":"s2-rw-expr-15","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>While studying a bay’s ecosystem, a student took the following notes:</p><ul><li>In 1990, coral covered about 60 percent of the bay’s floor.</li><li>By 2010, coral coverage had fallen to about 35 percent.</li><li>By 2023, coverage was about 20 percent.</li><li>Warmer water is the suspected cause of the decline.</li></ul>","prompt":"The student wants to convey how the bay’s coral coverage changed over time. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Warmer water is suspected to be the main cause of the bay’s coral decline.","In 1990, coral covered about 60 percent of the bay’s floor.","Coral coverage in the bay fell steadily from about 60 percent in 1990 to 35 percent in 2010 and just 20 percent by 2023.","Today, coral covers only about 20 percent of the bay’s floor."],"ans":2,"exp":{"why":"The goal is change over time; choice C traces the coverage across all three dated points to show a clear downward trend.","traps":{"A":"Explains a suspected cause rather than describing the change itself.","B":"Captures a single early snapshot with no later comparison.","D":"Reports only the most recent figure, conveying no change."},"skill":"Rhetorical Synthesis","strat":"For change-over-time goals, pick the option that links multiple time points to show a trend."}},
{"id":"s2-rw-expr-16","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"E","type":"mcq","stim":"<p>While reading about crop conservation, a student took the following notes:</p><ul><li>The Arncliffe Seed Store is a facility built into a hillside.</li><li>It holds duplicate samples of seeds collected from around the region.</li><li>Its purpose is to preserve crop varieties in case they are lost elsewhere.</li><li>It is kept cold so the seeds stay viable for decades.</li></ul>","prompt":"The student wants to explain the main purpose of the Arncliffe Seed Store to readers unfamiliar with it. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Arncliffe Seed Store is kept cold so that its seeds stay viable for decades.","The Arncliffe Seed Store, a facility built into a hillside, preserves duplicate crop seeds so that varieties lost elsewhere can be restored.","The Arncliffe Seed Store holds duplicate samples of seeds collected from around the region.","Built into a hillside, the Arncliffe Seed Store is an impressive feat of modern engineering."],"ans":1,"exp":{"why":"The goal is to explain the store’s purpose; choice B states plainly that it preserves duplicate seeds so lost varieties can be restored.","traps":{"A":"Describes how the store operates, not why it exists.","C":"Notes what it holds but omits the preservation purpose.","D":"Praises the engineering, an editorial claim not found in the notes, and skips the purpose."},"skill":"Rhetorical Synthesis","strat":"For a purpose goal, choose the option that answers ‘why does it exist?’"}},
{"id":"s2-rw-expr-17","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"M","type":"mcq","stim":"<p>While researching paleontology, a student took the following notes:</p><ul><li>For decades, paleontologists pictured most dinosaurs as scaly reptiles.</li><li>Fossils discovered since the 1990s show feather impressions on many species.</li><li>Some feathered dinosaurs were not capable of flight.</li><li>Their feathers may have served for insulation or display.</li></ul>","prompt":"The student wants to emphasize how the newer fossil discoveries changed the earlier view of dinosaurs. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Some feathered dinosaurs could not fly, and their feathers may have aided insulation or display.","Fossils discovered since the 1990s show feather impressions on many dinosaur species.","Paleontologists have studied dinosaur fossils carefully for many decades.","Once pictured as scaly reptiles, many dinosaurs are now known, thanks to fossils found since the 1990s, to have had feathers."],"ans":3,"exp":{"why":"The goal is to contrast the old and new views; choice D pairs the former ‘scaly reptiles’ picture with the newer feather evidence to show the shift.","traps":{"A":"Adds detail about flightlessness without referring to the earlier view.","B":"Reports the new evidence alone, so no change from the old view is shown.","C":"Offers a vague statement that captures neither the old view nor the change."},"skill":"Rhetorical Synthesis","strat":"To show a changed view, choose the option that states both the old belief and the new finding."}},
{"id":"s2-rw-expr-18","sec":"rw","dom":"expr","skill":"Rhetorical Synthesis","dif":"H","type":"mcq","stim":"<p>While reading about linguistics, a student took the following notes:</p><ul><li>A linguist analyzed 500 hours of recordings of an endangered language.</li><li>She identified 12 previously undocumented grammatical features.</li><li>The recordings came from only three elderly speakers.</li><li>All three speakers were from the same village.</li></ul>","prompt":"The student wants to present the linguist’s finding while acknowledging a limitation of the data. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Analyzing 500 hours of recordings from three elderly speakers, the linguist set out to study an endangered language.","The linguist identified 12 previously undocumented grammatical features in the endangered language.","The linguist documented 12 previously unrecorded grammatical features, though her recordings captured only three elderly speakers from a single village.","Because all three speakers came from one village, the linguist’s recordings were limited in scope."],"ans":2,"exp":{"why":"The goal is finding plus limitation; choice C reports the 12 new features (finding) and notes the narrow sample of three speakers from one village (limitation).","traps":{"A":"Describes the method and aim but states no finding or limitation.","B":"Gives the finding without acknowledging any limitation of the data.","D":"Names the limitation but omits the finding about the 12 features."},"skill":"Rhetorical Synthesis","strat":"For finding-plus-limitation goals, confirm the choice reports a result and flags a weakness in the data."}},
{"id":"s2-ma-alg-01","sec":"math","dom":"alg","skill":"Linear equations","dif":"E","type":"mcq","prompt":"If 3x + 7 = 22, what is the value of x?","choices":["5","15","29/3","22/3"],"ans":0,"exp":{"why":"Subtract 7 from both sides: 3x = 15. Divide both sides by 3: x = 5.","traps":{"B":"Stopped at 3x = 15 and reported 15 without dividing by 3.","C":"Added 7 instead of subtracting, getting 3x = 29.","D":"Divided 22 by 3 before subtracting the 7."},"skill":"Linear equations","strat":"Isolate the variable term, then divide by its coefficient."}},
{"id":"s2-ma-alg-02","sec":"math","dom":"alg","skill":"Linear equations","dif":"M","type":"spr","prompt":"Solve for x: 2(x − 4) = 5x + 7.","ans":["-5"],"exp":{"why":"Distribute the left side: 2x − 8 = 5x + 7. Subtract 2x from both sides: −8 = 3x + 7. Subtract 7: −15 = 3x. Divide by 3: x = −5.","skill":"Linear equations","strat":"Distribute, gather variables on one side and constants on the other, then divide."}},
{"id":"s2-ma-alg-03","sec":"math","dom":"alg","skill":"Linear equations","dif":"M","type":"mcq","prompt":"If (2x − 1)/3 = (x + 4)/2, what is the value of x?","choices":["14","6","−14","13"],"ans":0,"exp":{"why":"Cross-multiply: 2(2x − 1) = 3(x + 4), so 4x − 2 = 3x + 12. Subtract 3x: x − 2 = 12. Add 2: x = 14. Check: (2·14 − 1)/3 = 27/3 = 9 and (14 + 4)/2 = 9. ✓","traps":{"B":"Distributed the 3 only to x, using 3x + 4 instead of 3x + 12.","C":"Sign error when moving terms across the equals sign.","D":"Distributed the left side as 4x − 1 instead of 4x − 2."},"skill":"Linear equations","strat":"Cross-multiply to clear the fractions, then solve the resulting linear equation."}},
{"id":"s2-ma-alg-04","sec":"math","dom":"alg","skill":"Linear functions","dif":"E","type":"mcq","prompt":"A line passes through the point (0, 3) and has a slope of 2. Which equation represents the line?","choices":["y = 2x + 3","y = 3x + 2","y = 2x − 3","y = 3x − 2"],"ans":0,"exp":{"why":"In slope-intercept form y = mx + b, the slope m = 2 and the y-intercept b = 3 (since the line passes through (0, 3)). So y = 2x + 3.","traps":{"B":"Swapped the slope and the y-intercept.","C":"Used the wrong sign for the y-intercept.","D":"Swapped slope and intercept and used the wrong sign."},"skill":"Linear functions","strat":"Place the slope as m and the y-intercept as b in y = mx + b."}},
{"id":"s2-ma-alg-05","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"mcq","prompt":"The function f is linear, with f(2) = 5 and f(6) = 17. What is the value of f(0)?","choices":["−1","1","3","5"],"ans":0,"exp":{"why":"Slope = (17 − 5)/(6 − 2) = 12/4 = 3, so f(x) = 3x + b. Using f(2) = 5: 3(2) + b = 5, so 6 + b = 5 and b = −1. Then f(0) = b = −1.","traps":{"B":"Sign error when solving 6 + b = 5 for b.","C":"Reported the slope, 3, instead of f(0).","D":"Reported f(2) = 5 rather than f(0)."},"skill":"Linear functions","strat":"Find the slope from two points, solve for the y-intercept, which equals f(0)."}},
{"id":"s2-ma-alg-06","sec":"math","dom":"alg","skill":"Linear functions","dif":"H","type":"mcq","stim":"<p>Line ℓ has equation 4x − 3y = 12. Line m is perpendicular to ℓ and passes through the point (2, −1).</p>","prompt":"What is the y-intercept of line m?","choices":["1/2","5/2","−1/2","−11/3"],"ans":0,"exp":{"why":"Write ℓ as y = (4/3)x − 4, so its slope is 4/3. The perpendicular slope is the negative reciprocal, −3/4. For line m: y − (−1) = −3/4(x − 2), so y + 1 = −3/4 x + 3/2, giving y = −3/4 x + 1/2. The y-intercept is 1/2.","traps":{"B":"Used the point as (2, 1), a sign error, giving intercept 5/2.","C":"Correct magnitude but wrong sign on the intercept.","D":"Used the parallel slope 4/3 instead of the perpendicular slope."},"skill":"Linear functions","strat":"Take the negative reciprocal slope, apply point-slope form, and read off b."}},
{"id":"s2-ma-alg-07","sec":"math","dom":"alg","skill":"Linear functions","dif":"M","type":"spr","stim":"<p>A candle burns at a constant rate. After 2 hours it is 18 cm tall, and after 5 hours it is 9 cm tall.</p>","prompt":"What was the height of the candle, in centimeters, at the moment it was first lit (t = 0)?","ans":["24"],"exp":{"why":"Rate = (9 − 18)/(5 − 2) = −9/3 = −3 cm per hour. Height h = −3t + b. Using t = 2, h = 18: −6 + b = 18, so b = 24. At t = 0, h = 24 cm.","skill":"Linear functions","strat":"Compute the constant rate as slope, then back-solve for the starting value b."}},
{"id":"s2-ma-alg-08","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"mcq","prompt":"If 2x + 3y = 12 and x − y = 1, what is the value of x?","choices":["3","2","5","−1"],"ans":0,"exp":{"why":"From x − y = 1, x = y + 1. Substitute: 2(y + 1) + 3y = 12, so 2y + 2 + 3y = 12, giving 5y = 10 and y = 2. Then x = y + 1 = 3. Check: 2(3) + 3(2) = 12. ✓","traps":{"B":"Reported y = 2 instead of x.","C":"Reported x + y = 5 instead of x.","D":"Sign error while substituting."},"skill":"Systems of equations","strat":"Solve one equation for a variable and substitute into the other."}},
{"id":"s2-ma-alg-09","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"spr","prompt":"If 3x + 2y = 16 and 5x − 2y = 8, what is the value of y?","ans":["7/2","3.5"],"exp":{"why":"Add the equations to eliminate y: 8x = 24, so x = 3. Substitute into 3x + 2y = 16: 9 + 2y = 16, so 2y = 7 and y = 7/2 = 3.5. Check: 5(3) − 2(3.5) = 15 − 7 = 8. ✓","skill":"Systems of equations","strat":"Add the equations to eliminate the opposite y-terms, then back-substitute."}},
{"id":"s2-ma-alg-10","sec":"math","dom":"alg","skill":"Systems of equations","dif":"H","type":"mcq","stim":"<p>The system of equations below has infinitely many solutions.</p><p>4x + 6y = 14<br>kx + 3y = 7</p>","prompt":"What is the value of the constant k?","choices":["2","3","1","6"],"ans":0,"exp":{"why":"Infinitely many solutions means the two equations are equivalent. Dividing the first by 2 gives 2x + 3y = 7, which must match kx + 3y = 7. Therefore k = 2.","traps":{"B":"Used the y-coefficient 3 instead of the x-coefficient.","C":"Guessed a ratio of 1 without scaling the equation.","D":"Used the original coefficient 4… wait, reported 6 from the untouched first equation."},"skill":"Systems of equations","strat":"Scale one equation so both match; equal constants force equal variable coefficients."}},
{"id":"s2-ma-alg-11","sec":"math","dom":"alg","skill":"Systems of equations","dif":"M","type":"mcq","stim":"<p>A jar contains only nickels and dimes. There are 30 coins in total, worth $2.30.</p>","prompt":"How many dimes are in the jar?","choices":["16","14","20","10"],"ans":0,"exp":{"why":"Let n = nickels and d = dimes. Then n + d = 30 and 0.05n + 0.10d = 2.30, i.e. 5n + 10d = 230. Substitute n = 30 − d: 5(30 − d) + 10d = 230, so 150 + 5d = 230, giving 5d = 80 and d = 16. Check: 14 nickels + 16 dimes = $0.70 + $1.60 = $2.30. ✓","traps":{"B":"Solved for the number of nickels (14) instead of dimes.","C":"Miscounted the coin split.","D":"Miscounted the coin split."},"skill":"Systems of equations","strat":"Set up a count equation and a value equation, then substitute."}},
{"id":"s2-ma-alg-12","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"E","type":"mcq","prompt":"Which of the following describes all solutions to 3x − 4 ≤ 11?","choices":["x ≤ 5","x ≥ 5","x ≤ 7/3","x ≥ 7/3"],"ans":0,"exp":{"why":"Add 4 to both sides: 3x ≤ 15. Divide by 3 (positive, so the inequality direction is unchanged): x ≤ 5.","traps":{"B":"Flipped the inequality even though dividing by a positive number.","C":"Subtracted 4 instead of adding it, using 3x ≤ 7.","D":"Subtracted instead of added and flipped the inequality."},"skill":"Linear inequalities","strat":"Isolate x; only flip the inequality when dividing by a negative number."}},
{"id":"s2-ma-alg-13","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"M","type":"mcq","stim":"<p>A gym charges a $25 membership fee plus $4 for each class. A member wants to spend no more than $100 in total.</p>","prompt":"What is the greatest number of classes the member can take?","choices":["18","19","18.75","25"],"ans":0,"exp":{"why":"Let c be the number of classes: 25 + 4c ≤ 100. Subtract 25: 4c ≤ 75. Divide by 4: c ≤ 18.75. Since c must be a whole number of classes, the greatest value is 18.","traps":{"B":"Rounded 18.75 up instead of down.","C":"Left the answer as 18.75 without rounding to a whole class.","D":"Ignored the $25 fee and computed 100 ÷ 4."},"skill":"Linear inequalities","strat":"Model the total cost, solve the inequality, and round down to a whole count."}},
{"id":"s2-ma-alg-14","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"H","type":"mcq","prompt":"Which of the following describes all values of x that satisfy −3 < 2x − 5 ≤ 7?","choices":["1 < x ≤ 6","1 ≤ x < 6","−1 < x ≤ 1","1 < x ≤ 12"],"ans":0,"exp":{"why":"Add 5 to all three parts: −3 + 5 < 2x ≤ 7 + 5, so 2 < 2x ≤ 12. Divide all parts by 2: 1 < x ≤ 6.","traps":{"B":"Swapped which endpoint is strict and which is inclusive.","C":"Arithmetic/sign error when adding 5 to the outer bounds.","D":"Added 5 but forgot to divide the bounds by 2."},"skill":"Linear inequalities","strat":"Perform the same operation on all three parts of the compound inequality."}},
{"id":"s2-ma-alg-15","sec":"math","dom":"alg","skill":"Linear inequalities","dif":"M","type":"spr","prompt":"What is the least integer value of x that satisfies 5 − 2x ≤ −9?","ans":["7"],"exp":{"why":"Subtract 5: −2x ≤ −14. Divide by −2 and flip the inequality (dividing by a negative): x ≥ 7. The least integer satisfying this is 7. Check: 5 − 2(7) = −9 ≤ −9. ✓","skill":"Linear inequalities","strat":"Isolate x, flip the inequality when dividing by a negative, then take the smallest allowed integer."}},
{"id":"s2-ma-adv-01","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"M","type":"mcq","prompt":"What is the sum of the solutions to x² − 5x + 6 = 0?","choices":["5","−5","6","1"],"ans":0,"exp":{"why":"Factor: (x − 2)(x − 3) = 0, so x = 2 or x = 3. Their sum is 2 + 3 = 5. (Equivalently, the sum of roots equals −b/a = −(−5)/1 = 5.)","traps":{"B":"Used the wrong sign for −b/a.","C":"Reported the product of the roots (the constant 6) instead of the sum.","D":"Took the difference of the roots instead of the sum."},"skill":"Quadratics & nonlinear","strat":"Factor to find the roots, or use sum of roots = −b/a."}},
{"id":"s2-ma-adv-02","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"H","type":"mcq","prompt":"What is the minimum value of the function y = x² − 6x + 5?","choices":["−4","4","3","5"],"ans":0,"exp":{"why":"The vertex occurs at x = −b/(2a) = 6/2 = 3. Substitute: y = 3² − 6(3) + 5 = 9 − 18 + 5 = −4. Since the parabola opens upward, the minimum value is −4.","traps":{"B":"Sign error when evaluating the vertex, giving 4 instead of −4.","C":"Reported the x-coordinate of the vertex (3) rather than the minimum y-value.","D":"Reported the y-intercept (5) instead of the minimum."},"skill":"Quadratics & nonlinear","strat":"Find the vertex x = −b/(2a), then substitute to get the minimum y-value."}},
{"id":"s2-ma-adv-03","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"E","type":"spr","prompt":"If (x − 3)² = 16 and x > 0, what is the value of x?","ans":["7"],"exp":{"why":"Take the square root of both sides: x − 3 = ±4, so x = 7 or x = −1. Since x > 0, x = 7.","skill":"Quadratics & nonlinear","strat":"Take the square root of both sides, keep both signs, then apply the constraint."}},
{"id":"s2-ma-adv-04","sec":"math","dom":"adv","skill":"Quadratics & nonlinear","dif":"M","type":"mcq","stim":"<p>A ball is thrown upward, and its height in feet after t seconds is h = −16t² + 48t.</p>","prompt":"For what value of t > 0 does the ball return to the ground (h = 0)?","choices":["3","1.5","48","0"],"ans":0,"exp":{"why":"Set h = 0: −16t² + 48t = 0. Factor: −16t(t − 3) = 0, so t = 0 or t = 3. Since t > 0, the ball returns to the ground at t = 3 seconds.","traps":{"B":"Found the time of maximum height (the vertex at t = 1.5) instead of when h = 0.","C":"Used the coefficient 48 directly.","D":"Gave the launch time t = 0 rather than the positive solution."},"skill":"Quadratics & nonlinear","strat":"Set the height to zero and factor to find the nonzero root."}},
{"id":"s2-ma-adv-05","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"E","type":"mcq","prompt":"Which expression is equivalent to 3(2x − 4) + 5x?","choices":["11x − 12","11x − 4","6x − 12","11x + 12"],"ans":0,"exp":{"why":"Distribute: 3(2x − 4) = 6x − 12. Add 5x: 6x − 12 + 5x = 11x − 12.","traps":{"B":"Failed to distribute the 3 to the −4, leaving −4.","C":"Forgot to add the 5x term.","D":"Used the wrong sign on the constant term."},"skill":"Equivalent expressions","strat":"Distribute fully, then combine like terms."}},
{"id":"s2-ma-adv-06","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"M","type":"mcq","prompt":"Which expression is equivalent to (x + 4)(x − 3)?","choices":["x² + x − 12","x² − x − 12","x² + 7x − 12","x² + x + 12"],"ans":0,"exp":{"why":"Use FOIL: x·x = x², x·(−3) = −3x, 4·x = 4x, 4·(−3) = −12. Combine: x² + (−3x + 4x) − 12 = x² + x − 12.","traps":{"B":"Sign error on the middle term (−x instead of +x).","C":"Added the outer numbers (4 + 3) for the middle term instead of combining −3x + 4x.","D":"Wrong sign on the constant term (+12 instead of −12)."},"skill":"Equivalent expressions","strat":"Multiply with FOIL and carefully combine the like middle terms."}},
{"id":"s2-ma-adv-07","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"H","type":"mcq","prompt":"For x ≠ 3, which expression is equivalent to (x² − 9)/(x² − x − 6)?","choices":["(x + 3)/(x + 2)","(x − 3)/(x − 2)","(x + 3)/(x − 2)","(x − 3)/(x + 2)"],"ans":0,"exp":{"why":"Factor numerator: x² − 9 = (x − 3)(x + 3). Factor denominator: x² − x − 6 = (x − 3)(x + 2). Cancel the common (x − 3): (x + 3)/(x + 2).","traps":{"B":"Factored the numerator incorrectly and canceled the wrong factor.","C":"Correct numerator factor kept but denominator mis-factored as (x − 2).","D":"Canceled (x + 3) by mistake, leaving (x − 3) on top."},"skill":"Equivalent expressions","strat":"Factor top and bottom, then cancel the shared factor."}},
{"id":"s2-ma-adv-08","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"M","type":"spr","prompt":"If (2x + 3)² = 4x² + bx + 9 for all values of x, what is the value of b?","ans":["12"],"exp":{"why":"Expand (2x + 3)² = (2x)² + 2(2x)(3) + 3² = 4x² + 12x + 9. Matching with 4x² + bx + 9 gives b = 12.","skill":"Equivalent expressions","strat":"Expand the square and match the coefficient of x on both sides."}},
{"id":"s2-ma-adv-09","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"H","type":"mcq","stim":"<p>The function f is defined by f(x) = 2x² − 3.</p>","prompt":"Which expression is equal to f(x + 1) − f(x)?","choices":["4x + 2","4x − 2","2x + 2","4x"],"ans":0,"exp":{"why":"f(x + 1) = 2(x + 1)² − 3 = 2(x² + 2x + 1) − 3 = 2x² + 4x + 2 − 3 = 2x² + 4x − 1. Then f(x + 1) − f(x) = (2x² + 4x − 1) − (2x² − 3) = 4x + 2.","traps":{"B":"Sign error when subtracting the constants (−1 − (−3) = +2, not −2).","C":"Forgot to distribute the factor of 2 over (x + 1)².","D":"Dropped the constant +2 from the expansion."},"skill":"Nonlinear functions","strat":"Expand f(x + 1) carefully, then subtract f(x) term by term."}},
{"id":"s2-ma-adv-10","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"M","type":"mcq","prompt":"What is the minimum value of the function g(x) = (x − 2)² + 1?","choices":["1","2","−1","5"],"ans":0,"exp":{"why":"The squared term (x − 2)² is always ≥ 0 and equals 0 when x = 2. So the smallest value of g is 0 + 1 = 1, occurring at x = 2.","traps":{"B":"Reported the x-value of the vertex (2) instead of the minimum output.","C":"Used the wrong sign on the constant.","D":"Evaluated g(0) = 4 + 1 = 5 instead of finding the minimum."},"skill":"Nonlinear functions","strat":"In vertex form a(x − h)² + k, the minimum value is k (for a > 0)."}},
{"id":"s2-ma-adv-11","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"H","type":"mcq","stim":"<p>The function f(x) = x² + bx + c has zeros at x = −2 and x = 5.</p>","prompt":"What is the value of b?","choices":["−3","3","−10","10"],"ans":0,"exp":{"why":"With zeros −2 and 5, f(x) = (x + 2)(x − 5) = x² − 3x − 10. Comparing with x² + bx + c gives b = −3 (and c = −10). (Sum of roots = −b, so −2 + 5 = 3 = −b, giving b = −3.)","traps":{"B":"Used the wrong sign; 3 is the sum of the roots, not b itself.","C":"Reported the constant c = −10 instead of b.","D":"Wrong sign on the product of the roots."},"skill":"Nonlinear functions","strat":"Build the factored form from the zeros, expand, and match coefficients."}},
{"id":"s2-ma-adv-12","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"H","type":"spr","stim":"<p>The parabola y = a(x − 2)(x + 4) passes through the point (0, −16).</p>","prompt":"What is the value of a?","ans":["2"],"exp":{"why":"Substitute the point (0, −16): −16 = a(0 − 2)(0 + 4) = a(−2)(4) = −8a. Solve: a = −16 / −8 = 2.","skill":"Nonlinear functions","strat":"Plug the known point into the factored form and solve for a."}},
{"id":"s2-ma-adv-13","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"E","type":"mcq","stim":"<p>A population of bacteria starts at 300 and doubles every year.</p>","prompt":"Which function models the population P after t years?","choices":["P = 300 · 2ᵗ","P = 300 · t²","P = 2 · 300ᵗ","P = 300 + 2t"],"ans":0,"exp":{"why":"Exponential growth with a starting value of 300 and a doubling factor of 2 per year is P = 300 · 2ᵗ. At t = 1 it gives 600 (doubled), at t = 2 it gives 1200, as required.","traps":{"B":"Used a power function t² instead of exponential growth.","C":"Put the starting value in the exponent and the growth factor as the coefficient.","D":"Modeled linear growth (adding 2 each year) instead of doubling."},"skill":"Exponential & rational","strat":"Use P = (initial)·(growth factor)ᵗ for repeated multiplication."}},
{"id":"s2-ma-adv-14","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"M","type":"mcq","prompt":"If 2^(x + 1) = 32, what is the value of x?","choices":["4","5","16","31"],"ans":0,"exp":{"why":"Write 32 as a power of 2: 32 = 2⁵. So 2^(x + 1) = 2⁵ means x + 1 = 5, giving x = 4. Check: 2^(4 + 1) = 2⁵ = 32. ✓","traps":{"B":"Solved for the exponent x + 1 = 5 but forgot to subtract 1.","C":"Computed 32 ÷ 2 = 16.","D":"Computed 32 − 1 = 31."},"skill":"Exponential & rational","strat":"Express both sides as powers of the same base and equate exponents."}},
{"id":"s2-ma-adv-15","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"spr","prompt":"Solve for x: 2/(x − 1) = 3/(x + 4).","ans":["11"],"exp":{"why":"Cross-multiply: 2(x + 4) = 3(x − 1), so 2x + 8 = 3x − 3. Subtract 2x: 8 = x − 3. Add 3: x = 11. Check: 2/(11 − 1) = 2/10 = 0.2 and 3/(11 + 4) = 3/15 = 0.2. ✓","skill":"Exponential & rational","strat":"Cross-multiply the proportion and solve the resulting linear equation."}},
{"id":"s2-ma-psda-01","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"E","type":"mcq","stim":"<p>A printer produces pages at a constant rate.</p>","prompt":"A printer prints 84 pages in 6 minutes. At this rate, how many pages does it print in 15 minutes?","choices":["126","175","210","252"],"ans":2,"exp":{"why":"The unit rate is 84 ÷ 6 = 14 pages per minute. In 15 minutes it prints 14 × 15 = 210 pages.","traps":{"A":"Multiplies the rate 14 by 9 (15 − 6) instead of 15.","B":"Misscales the proportion, treating the rate as 11.67/min.","D":"Uses 18 minutes instead of 15 (14 × 18)."},"skill":"Ratios, rates & proportions","strat":"Find the unit rate (pages per minute), then multiply by the new time."}},
{"id":"s2-ma-psda-02","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"M","type":"mcq","stim":"<p>A recipe uses flour and sugar in a fixed ratio.</p>","prompt":"A recipe uses flour and sugar in the ratio 5 : 2. If a baker uses 35 cups of flour, how many cups of sugar are needed?","choices":["10","14","17.5","87.5"],"ans":1,"exp":{"why":"Set up 5/2 = 35/s. Divide 35 by the flour part: 35 ÷ 5 = 7. Multiply the sugar part by 7: 2 × 7 = 14 cups.","traps":{"A":"Keeps the raw ratio number 5:2 and reports 10 without scaling correctly.","C":"Divides 35 by 2 instead of scaling the ratio.","D":"Multiplies 35 by 2.5, inverting the ratio."},"skill":"Ratios, rates & proportions","strat":"Scale the ratio: divide the known quantity by its ratio part, then multiply the other part."}},
{"id":"s2-ma-psda-03","sec":"math","dom":"psda","skill":"Percentages","dif":"E","type":"mcq","stim":"<p>A store discount is applied to a jacket.</p>","prompt":"A jacket originally priced at $80 is on sale for 25% off. What is the sale price?","choices":["$20","$55","$60","$100"],"ans":2,"exp":{"why":"25% of $80 is 0.25 × 80 = $20 discount. Sale price = 80 − 20 = $60 (equivalently 0.75 × 80).","traps":{"A":"Reports the discount amount instead of the sale price.","B":"Subtracts 25 dollars from 80.","D":"Adds 25% instead of subtracting it."},"skill":"Percentages","strat":"Compute the discount, then subtract from the original price (or multiply by 0.75)."}},
{"id":"s2-ma-psda-04","sec":"math","dom":"psda","skill":"Percentages","dif":"M","type":"spr","stim":"<p>A population changes over one year.</p>","prompt":"A town's population increased from 2,400 to 2,760 in one year. What was the percent increase? (Enter the number of percent.)","ans":["15"],"exp":{"why":"Increase = 2,760 − 2,400 = 360. Percent increase = 360 ÷ 2,400 = 0.15 = 15%.","skill":"Percentages","strat":"Percent change = (new − old) ÷ old × 100."}},
{"id":"s2-ma-psda-05","sec":"math","dom":"psda","skill":"Percentages","dif":"H","type":"mcq","stim":"<p>Two successive percentage changes are applied.</p>","prompt":"The price of an item is increased by 20%, and then the new price is decreased by 20%. The final price is what percent of the original price?","choices":["96%","98%","100%","104%"],"ans":0,"exp":{"why":"Start from 100: after +20% it is 120. After −20% of 120: 120 × 0.80 = 96. So the final price is 96% of the original.","traps":{"B":"Incorrectly subtracts a flat 2% from 100.","C":"Assumes the two 20% changes cancel exactly.","D":"Adds the net effect the wrong way."},"skill":"Percentages","strat":"Apply the multipliers in sequence: 1.20 × 0.80 = 0.96."}},
{"id":"s2-ma-psda-06","sec":"math","dom":"psda","skill":"Data & statistics","dif":"E","type":"mcq","stim":"<p>A student records five quiz scores.</p>","prompt":"The five quiz scores are 12, 15, 15, 18, and 20. What is the median of the scores?","choices":["15","16","18","20"],"ans":0,"exp":{"why":"In order the scores are 12, 15, 15, 18, 20. The middle (third) value is 15, so the median is 15.","traps":{"B":"Gives the mean (80 ÷ 5 = 16) instead of the median.","C":"Picks the fourth value by miscounting the middle.","D":"Gives the maximum value."},"skill":"Data & statistics","strat":"Order the values and take the middle one."}},
{"id":"s2-ma-psda-07","sec":"math","dom":"psda","skill":"Data & statistics","dif":"M","type":"mcq","stim":"<p>The table shows the number of books read by members of a club in one month.</p><table><tr><th>Books read</th><th>Number of members</th></tr><tr><td>0</td><td>3</td></tr><tr><td>1</td><td>5</td></tr><tr><td>2</td><td>7</td></tr><tr><td>3</td><td>5</td></tr></table>","prompt":"Using the table, what is the mean number of books read per member? (There are 20 members.)","choices":["1.5","1.7","1.8","2.0"],"ans":1,"exp":{"why":"Total books = 0×3 + 1×5 + 2×7 + 3×5 = 0 + 5 + 14 + 15 = 34. Mean = 34 ÷ 20 = 1.7.","traps":{"A":"Averages the four book values (0,1,2,3) instead of weighting by members.","C":"Miscomputes the total as 36 (36 ÷ 20 = 1.8).","D":"Rounds up to a whole-ish estimate rather than dividing."},"skill":"Data & statistics","strat":"Multiply each value by its frequency, sum, and divide by the total count."}},
{"id":"s2-ma-psda-08","sec":"math","dom":"psda","skill":"Data & statistics","dif":"H","type":"spr","stim":"<p>A data set has an unknown value.</p>","prompt":"The mean of the four numbers 8, 14, x, and 22 is 16. What is the value of x?","ans":["20"],"exp":{"why":"Mean = 16 means the sum is 16 × 4 = 64. So 8 + 14 + x + 22 = 64, giving 44 + x = 64, so x = 20.","skill":"Data & statistics","strat":"Multiply the mean by the count to get the total sum, then solve for the missing value."}},
{"id":"s2-ma-psda-09","sec":"math","dom":"psda","skill":"Data & statistics","dif":"M","type":"mcq","stim":"<p>A researcher wants to estimate the average commute time of employees at a large company.</p>","prompt":"Which of the following sampling methods is most likely to produce an unbiased estimate of the mean commute time for all employees?","choices":["Surveying only employees who arrive before 7:00 a.m.","Surveying a randomly selected group of employees from the full company roster","Surveying only employees who drive to work","Surveying employees who volunteer to respond to an online post"],"ans":1,"exp":{"why":"A random selection from the entire employee roster gives every employee an equal chance of being chosen, avoiding systematic bias. It is the only listed method that samples the whole population fairly.","traps":{"A":"Early arrivers may have atypical commutes — biased.","C":"Excludes non-drivers, who may have different commute times — biased.","D":"Voluntary response over-represents people with strong opinions — biased."},"skill":"Data & statistics","strat":"Choose a random sample of the entire target population to avoid selection bias."}},
{"id":"s2-ma-psda-10","sec":"math","dom":"psda","skill":"Probability","dif":"M","type":"mcq","stim":"<p>A bag contains colored marbles.</p>","prompt":"A bag contains 4 red, 6 blue, and 10 green marbles. If one marble is drawn at random, what is the probability that it is NOT green?","choices":["1/2","2/5","1/5","3/5"],"ans":0,"exp":{"why":"Total marbles = 4 + 6 + 10 = 20. Not green = red + blue = 4 + 6 = 10. Probability = 10/20 = 1/2.","traps":{"B":"Uses 8/20 by miscounting red + blue.","C":"Uses only red (4/20 = 1/5).","D":"Computes P(green) = 10/20 but mislabels, or uses 12/20."},"skill":"Probability","strat":"Count favorable outcomes (non-green) over total outcomes; or use 1 − P(green)."}},
{"id":"s2-ma-geo-01","sec":"math","dom":"geo","skill":"Area & volume","dif":"E","type":"mcq","stim":"<p>A rectangular garden has given dimensions.</p>","prompt":"A rectangle has a length of 12 cm and a width of 5 cm. What is its area?","choices":["17 cm²","34 cm²","60 cm²","120 cm²"],"ans":2,"exp":{"why":"Area of a rectangle = length × width = 12 × 5 = 60 cm².","traps":{"A":"Adds length and width instead of multiplying.","B":"Computes the perimeter, 2(12 + 5) = 34.","D":"Doubles the correct area."},"skill":"Area & volume","strat":"Area of a rectangle is length times width."}},
{"id":"s2-ma-geo-02","sec":"math","dom":"geo","skill":"Area & volume","dif":"M","type":"mcq","stim":"<p>A triangle has a base and height.</p>","prompt":"A triangle has a base of 14 in and a height of 9 in. What is its area?","choices":["23 in²","63 in²","126 in²","252 in²"],"ans":1,"exp":{"why":"Area of a triangle = ½ × base × height = ½ × 14 × 9 = ½ × 126 = 63 in².","traps":{"A":"Adds base and height.","C":"Forgets the factor of ½ (gives base × height = 126).","D":"Multiplies base × height × 2."},"skill":"Area & volume","strat":"Triangle area is one-half base times height."}},
{"id":"s2-ma-geo-03","sec":"math","dom":"geo","skill":"Area & volume","dif":"H","type":"spr","stim":"<p>A cylindrical tank is described.</p>","prompt":"A right circular cylinder has a radius of 3 m and a height of 10 m. What is its volume, in terms of π? (Enter the coefficient of π.)","ans":["90"],"exp":{"why":"Volume of a cylinder = πr²h = π × 3² × 10 = π × 9 × 10 = 90π. The coefficient is 90.","skill":"Area & volume","strat":"Cylinder volume is π times radius squared times height."}},
{"id":"s2-ma-geo-04","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"E","type":"mcq","stim":"<p>A triangle has two known angles.</p>","prompt":"Two angles of a triangle measure 55° and 65°. What is the measure of the third angle?","choices":["50°","60°","70°","120°"],"ans":1,"exp":{"why":"The angles of a triangle sum to 180°. Third angle = 180 − 55 − 65 = 180 − 120 = 60°.","traps":{"A":"Subtracts from 170 or otherwise mis-adds to get 50.","C":"Miscomputes 180 − 110.","D":"Gives the sum of the two known angles instead of the third angle."},"skill":"Lines, angles & triangles","strat":"Subtract the two known angles from 180°."}},
{"id":"s2-ma-geo-05","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"M","type":"mcq","stim":"<p>An isosceles triangle has a vertex angle.</p>","prompt":"In an isosceles triangle, the vertex (apex) angle measures 40°. What is the measure of each of the two equal base angles?","choices":["40°","50°","70°","140°"],"ans":2,"exp":{"why":"The two base angles are equal. Their sum is 180 − 40 = 140°, so each base angle is 140 ÷ 2 = 70°.","traps":{"A":"Assumes the base angles equal the vertex angle.","B":"Treats the base angle as the complement of 40°.","D":"Gives the combined sum of the two base angles."},"skill":"Lines, angles & triangles","strat":"Subtract the vertex angle from 180° and halve the remainder."}},
{"id":"s2-ma-geo-06","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"M","type":"mcq","stim":"<p>Two parallel lines are cut by a transversal.</p>","prompt":"Two parallel lines are cut by a transversal. One of the eight angles formed measures 110°. What is the measure of its co-interior (same-side interior) angle?","choices":["55°","70°","110°","180°"],"ans":1,"exp":{"why":"Co-interior (same-side interior) angles between parallel lines are supplementary, summing to 180°. So the co-interior angle = 180 − 110 = 70°.","traps":{"A":"Halves 110 instead of taking the supplement.","C":"Treats them as equal (that would be alternate or corresponding angles).","D":"Gives the sum rather than the missing angle."},"skill":"Lines, angles & triangles","strat":"Same-side interior angles are supplementary; subtract from 180°."}},
{"id":"s2-ma-geo-07","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"H","type":"mcq","stim":"<p>A right triangle has two known legs.</p>","prompt":"A right triangle has legs of length 9 and 12. What is the length of the hypotenuse?","choices":["15","21","√63","225"],"ans":0,"exp":{"why":"By the Pythagorean theorem, hypotenuse = √(9² + 12²) = √(81 + 144) = √225 = 15. (This is a 3-4-5 triangle scaled by 3.)","traps":{"B":"Adds the legs (9 + 12) instead of using the Pythagorean theorem.","C":"Subtracts under the root: √(144 − 81) = √63.","D":"Stops at 9² + 12² = 225 without taking the square root."},"skill":"Lines, angles & triangles","strat":"Hypotenuse = √(leg₁² + leg₂²)."}},
{"id":"s2-ma-geo-08","sec":"math","dom":"geo","skill":"Circles","dif":"E","type":"mcq","stim":"<p>A circle has a known radius.</p>","prompt":"A circle has a radius of 5. What is its area, in terms of π?","choices":["10π","25π","50π","100π"],"ans":1,"exp":{"why":"Area of a circle = πr² = π × 5² = 25π.","traps":{"A":"Computes circumference (2πr = 10π) instead of area.","C":"Doubles the correct area.","D":"Uses the diameter (10) as the radius: π × 10² = 100π."},"skill":"Circles","strat":"Circle area is π times radius squared."}},
{"id":"s2-ma-geo-09","sec":"math","dom":"geo","skill":"Circles","dif":"M","type":"mcq","stim":"<p>A circular sector is described.</p>","prompt":"A circle has a radius of 6. A sector of the circle has a central angle of 90°. What is the area of the sector, in terms of π?","choices":["3π","9π","12π","36π"],"ans":1,"exp":{"why":"Full circle area = π × 6² = 36π. A 90° sector is 90/360 = 1/4 of the circle. Sector area = (1/4) × 36π = 9π.","traps":{"A":"Applies the wrong fraction or uses radius instead of area.","C":"Uses arc-length reasoning (1/4 of 2πr = 3π) then mislabels, or 12π from radius × 2.","D":"Gives the full circle area without applying the 1/4 fraction."},"skill":"Circles","strat":"Sector area = (central angle ÷ 360°) × πr²."}},
{"id":"s2-ma-geo-10","sec":"math","dom":"geo","skill":"Right-triangle trig","dif":"H","type":"mcq","stim":"<p>A right triangle contains a 30° angle.</p>","prompt":"In a right triangle, one acute angle measures 30° and the hypotenuse has length 10. What is the length of the side opposite the 30° angle?","choices":["5","5√3","10","5√2"],"ans":0,"exp":{"why":"sin(30°) = opposite ÷ hypotenuse = opposite ÷ 10. Since sin(30°) = 1/2, opposite = 10 × 1/2 = 5. (In a 30-60-90 triangle the side opposite 30° is half the hypotenuse.)","traps":{"B":"Gives the side opposite 60° (10 × √3/2 = 5√3).","C":"Confuses the opposite side with the hypotenuse.","D":"Uses sin(45°) = √2/2 by mistaking the angle."},"skill":"Right-triangle trig","strat":"Use sin(30°) = opposite/hypotenuse, with sin(30°) = 1/2."}},

/* ===================== SET 3 — agent-authored, validated (214 items) ===================== */
{"id":"s3-rw-craft-01","sec":"rw","dom":"craft","skill":"Words in Context","dif":"E","type":"mcq","stim":"<p>Early daguerreotype portraits required subjects to sit motionless for several minutes. Because even a small twitch would blur the image, studios built padded braces to hold a sitter's head perfectly still. The process was so ______ that a single sneeze could ruin an entire afternoon's work.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["affordable","portable","unforgiving","colorful"],"ans":2,"exp":{"why":"The passage says a tiny twitch blurs the image and a single sneeze ruins hours of work, so the process leaves no room for error. 'Unforgiving' captures this intolerance of the smallest mistake.","traps":{"A":"About cost, which the passage never discusses.","B":"About mobility; nothing suggests the equipment moved.","C":"Correct: matches the zero tolerance for small motions.","D":"Daguerreotypes were monochrome, and color is irrelevant here."},"skill":"Words in Context","strat":"Pick the word that matches the concrete consequence the sentence describes."}},
{"id":"s3-rw-craft-02","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"E","type":"mcq","stim":"<p>Geologists once puzzled over boulders the size of houses stranded far from any mountain. The rocks did not match the local bedrock, so they could not have formed where they lay. Eventually researchers realized that ancient glaciers had carried the boulders across great distances before melting and dropping them. These erratics, as they are called, now serve as markers of where vast ice sheets once reached.</p>","prompt":"Which choice best describes the main purpose of the text?","choices":["To explain how a geological puzzle was resolved and what the answer reveals","To argue that glaciers are more powerful than rivers","To describe the process by which bedrock forms underground","To compare two competing theories about boulder size"],"ans":0,"exp":{"why":"The text opens with a mystery (misplaced boulders), reports the solution (glaciers carried them), and notes what erratics now tell us about ice sheets. That arc is a puzzle-and-resolution purpose.","traps":{"A":"Correct: puzzle stated, solved, and its significance given.","B":"Rivers are never mentioned or compared.","C":"Bedrock formation is not the passage's subject.","D":"Only one explanation is offered, not two rival ones."},"skill":"Text Structure & Purpose","strat":"Trace the sequence of moves the paragraph makes to find its overall aim."}},
{"id":"s3-rw-craft-03","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>Planners increasingly favor compact neighborhoods built around train and bus lines. When homes, shops, and offices cluster within walking distance of transit, residents drive far less, cutting both traffic and emissions. Density, in this view, is the surest path to a sustainable city.</p><p><b>Text 2</b></p><p>Compact design can indeed reduce driving, but crowding people together without accessible parks and plazas carries a cost. Studies link a lack of nearby green space to higher stress and poorer sleep. A dense district, Ramos argues, succeeds only when it reserves generous room for open, shared outdoor space.</p>","prompt":"Based on the texts, how would Ramos (Text 2) most likely respond to the claim in Text 1 that density is 'the surest path to a sustainable city'?","choices":["By denying that compact neighborhoods reduce car use at all","By insisting that transit lines matter more than housing density","By agreeing that density lowers driving but adding that it must be paired with green space to truly benefit residents","By concluding that cities should abandon compact development entirely"],"ans":2,"exp":{"why":"Ramos concedes that compact design 'can indeed reduce driving' but insists density succeeds only when it reserves room for green space. His response therefore accepts Text 1's benefit while adding a condition.","traps":{"A":"Ramos explicitly grants that density reduces driving.","B":"He stresses green space, not a transit-versus-density ranking.","C":"Correct: agrees on the benefit, adds the green-space caveat.","D":"He wants density done well, not abandoned."},"skill":"Cross-Text Connections","strat":"Note what the second author concedes before identifying what they add."}},
{"id":"s3-rw-craft-04","sec":"rw","dom":"craft","skill":"Words in Context","dif":"E","type":"mcq","stim":"<p>Bowhead whales may live more than two centuries, making them among the longest-lived mammals on Earth. Scientists estimate their age partly from stone harpoon tips embedded in living whales, relics of hunts abandoned generations ago. Such findings suggest the animals are remarkably ______, surviving injuries that would kill most creatures.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["aggressive","resilient","social","migratory"],"ans":1,"exp":{"why":"The clue is that these whales survive injuries fatal to most animals and live for centuries. 'Resilient' names the capacity to recover from and endure such harm.","traps":{"A":"Nothing describes hostility or attacking.","B":"Correct: fits surviving otherwise fatal injuries.","C":"Group behavior is not discussed.","D":"Movement patterns are not the point of the sentence."},"skill":"Words in Context","strat":"Let the trait the evidence demonstrates dictate the missing word."}},
{"id":"s3-rw-craft-05","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>When two communities that speak different languages trade regularly, they sometimes develop a pidgin: a stripped-down mix of vocabulary from both tongues, used only for business. A pidgin has no native speakers and only simple grammar. But if children grow up hearing it, they unconsciously enrich it, adding tenses and complex sentences until it becomes a full language called a creole. What began as a makeshift tool becomes a mother tongue.</p>","prompt":"Which choice best states the function of the last sentence in the text?","choices":["It introduces a new example that contradicts the earlier claim","It defines the term pidgin for the first time","It questions whether creoles are real languages","It summarizes the transformation the passage has traced, from temporary tool to native language"],"ans":3,"exp":{"why":"The passage traces a pidgin becoming a creole as children enrich it. The final sentence compresses that whole arc into one line: a makeshift tool becomes a mother tongue.","traps":{"A":"It reinforces, rather than contradicts, the passage.","B":"The pidgin was defined earlier, not here.","C":"It affirms the creole is a full language, not doubts it.","D":"Correct: it restates the tool-to-mother-tongue transformation."},"skill":"Text Structure & Purpose","strat":"Ask whether a closing sentence adds, contrasts, or sums up what came before."}},
{"id":"s3-rw-craft-06","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>The most productive planet hunters watch for tiny, regular dips in a star's brightness. When a planet crosses in front of its star, it blocks a sliver of light. By timing these dips, astronomers can measure a planet's size and the length of its year.</p><p><b>Text 2</b></p><p>A star and its planets orbit a shared center of mass, so a planet's gravity makes its star wobble slightly. Astronomers detect this wobble as small shifts in the star's light, which reveal the planet's mass. The heavier the planet, the larger the wobble.</p>","prompt":"Based on the texts, the methods described in Text 1 and Text 2 are best understood as","choices":["contradictory, since they cannot both be true of the same planet","complementary, since one reveals a planet's size and the other its mass","identical, since both simply measure a star's brightness dips","obsolete, since neither can detect planets around distant stars"],"ans":1,"exp":{"why":"Text 1's transit method yields a planet's size and orbital period; Text 2's wobble method yields its mass. Because each supplies a different property, the methods complement one another.","traps":{"A":"Both can apply to one planet; they do not conflict.","B":"Correct: size from one, mass from the other.","C":"Only Text 1 measures brightness dips; the wobble differs.","D":"Neither text calls the methods outdated or unusable."},"skill":"Cross-Text Connections","strat":"Compare exactly what each method outputs before labeling the relationship."}},
{"id":"s3-rw-craft-07","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>Medieval swordsmiths prized a type of steel whose surface showed wavy, watery patterns. The metal was unusually hard yet did not shatter, a combination that seemed almost paradoxical. Modern analysis shows that trace impurities formed microscopic structures that made the blades both strong and ______, able to bend under stress rather than snap.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["brittle","corroded","ornamental","ductile"],"ans":3,"exp":{"why":"The blank is defined by the following phrase: 'able to bend under stress rather than snap.' That is the meaning of 'ductile,' a property paired here with strength.","traps":{"A":"Brittle means it would snap, the opposite of the clue.","B":"Corroded describes rust, not flexibility.","C":"Ornamental refers to decoration, not mechanical behavior.","D":"Correct: bending rather than snapping is ductility."},"skill":"Words in Context","strat":"When a phrase restates the blank, match the word to that restatement."}},
{"id":"s3-rw-craft-08","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"E","type":"mcq","stim":"<p>Flamenco is often mistaken for a single fixed dance, but it is really a living conversation. The guitarist, singer, and dancer each respond to one another in the moment, speeding up or pausing on subtle cues. A stamp of the dancer's heel may signal the guitarist to change rhythm. No two performances unfold in quite the same way.</p>","prompt":"Which choice best describes the overall structure of the text?","choices":["It lists the historical origins of a dance in chronological order","It compares flamenco with a different dance tradition","It argues that flamenco should be performed only by experts","It corrects a common misconception and then explains the reality"],"ans":3,"exp":{"why":"The first sentence names a mistaken belief (flamenco is fixed) and pivots with 'but' to the truth (it is improvised conversation), which the rest of the passage illustrates. That is a correction-then-explanation structure.","traps":{"A":"No dates or historical sequence appear.","B":"No second dance is brought in for comparison.","C":"The passage never discusses who should perform it.","D":"Correct: it overturns a misconception and explains reality."},"skill":"Text Structure & Purpose","strat":"Watch for a 'but' that flips a stated belief into the passage's real claim."}},
{"id":"s3-rw-craft-09","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"H","type":"mcq","stim":"<p><b>Text 1</b></p><p>Raising the minimum wage, its supporters contend, puts more money in the pockets of low-income workers, who quickly spend it on necessities. That spending circulates through local shops and services, so the increase can lift an entire community's economy rather than merely one paycheck.</p><p><b>Text 2</b></p><p>Economist Dvorak does not dispute that higher wages boost the earnings of those who keep their jobs. Her surveys of small firms, however, find that some owners respond by trimming hours or delaying new hires. The net effect on a community, she concludes, depends heavily on how many such adjustments occur.</p>","prompt":"Which choice best describes how Dvorak's position in Text 2 relates to the argument in Text 1?","choices":["It rejects the claim that minimum-wage workers spend their earnings locally","It provides additional evidence that fully confirms Text 1's optimistic forecast","It argues that wages have no measurable effect on local economies","It accepts one of Text 1's premises while introducing a factor that complicates its conclusion"],"ans":3,"exp":{"why":"Dvorak grants that higher wages raise the earnings of workers who keep their jobs (a Text 1 premise) but adds that some employers cut hours or delay hiring, making the community-wide result uncertain. She complicates rather than confirms or rejects Text 1.","traps":{"A":"She never disputes that workers spend locally.","B":"She questions, rather than confirms, the rosy forecast.","C":"She sees real effects; the net one is just uncertain.","D":"Correct: accepts a premise, adds a complicating factor."},"skill":"Cross-Text Connections","strat":"Separate what the second author concedes from the qualification they add."}},
{"id":"s3-rw-craft-10","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>In many oral traditions, a single storyteller was expected to recite epics thousands of lines long. Rather than memorizing every word, skilled bards relied on stock phrases and repeated formulas that they could ______ as needed, weaving fixed building blocks into a performance that felt freshly spontaneous.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["recombine","memorize verbatim","abandon","translate"],"ans":0,"exp":{"why":"The bards weave 'fixed building blocks' into performances that feel spontaneous, so they must rearrange the same formulas in new ways. 'Recombine' captures reassembling set pieces into fresh patterns.","traps":{"A":"Correct: rearranging set formulas into new performances.","B":"Contradicts 'Rather than memorizing every word.'","C":"They rely on the formulas, not discard them.","D":"No shift between languages is described."},"skill":"Words in Context","strat":"Choose the verb consistent with the whole sentence's contrast, not just one phrase."}},
{"id":"s3-rw-craft-11","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>For centuries, farmers planted the same crop in a field year after year, and yields steadily declined. The soil, they eventually learned, was being drained of nitrogen. The remedy was crop rotation: alternating a grain with a legume, such as beans, whose roots host bacteria that replenish nitrogen. By changing what grew where, farmers let the land restore itself.</p>","prompt":"Which choice best describes the function of the second sentence ('The soil ... nitrogen') in the text?","choices":["It identifies the cause of the problem introduced in the first sentence","It offers a solution that the rest of the passage rejects","It provides a statistic to measure the decline in yields","It introduces an unrelated fact about bacteria"],"ans":0,"exp":{"why":"The first sentence presents falling yields; the second explains why, by naming nitrogen depletion as the cause. It links problem to reason before the solution appears.","traps":{"A":"Correct: it gives the cause of the declining yields.","B":"The solution comes later and is embraced, not rejected.","C":"No numbers or statistics are offered.","D":"Bacteria appear later and are entirely relevant."},"skill":"Text Structure & Purpose","strat":"Ask what job a middle sentence does between the problem and its fix."}},
{"id":"s3-rw-craft-12","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>Modern pianos are tuned in equal temperament, which divides the octave into twelve identical steps. This compromise makes every interval slightly imperfect, but it lets a musician move freely from one key to any other without retuning. Versatility is its great advantage.</p><p><b>Text 2</b></p><p>Just intonation tunes intervals to the pure ratios of the natural harmonic series, producing chords of striking sweetness. The trouble is that an instrument tuned this way sounds beautiful in one key but noticeably sour in distant ones. Purity comes at the price of flexibility.</p>","prompt":"Based on the texts, both authors would most likely agree that","choices":["equal temperament produces more beautiful chords than just intonation","musicians should always prefer just intonation","a tuning system involves a trade-off between purity of sound and freedom to change keys","the octave cannot be divided into equal steps"],"ans":2,"exp":{"why":"Text 1 trades slight imperfection for the freedom to change keys; Text 2 trades flexibility for pure, sweet chords. Both frame tuning as a trade-off between purity and key-changing freedom.","traps":{"A":"Text 2 credits just intonation with sweeter chords.","B":"Text 1 favors equal temperament's versatility.","C":"Correct: both present a purity-versus-flexibility trade-off.","D":"Text 1 says the octave is divided into twelve equal steps."},"skill":"Cross-Text Connections","strat":"Find the shared framing both passages assume, not the side each takes."}},
{"id":"s3-rw-craft-13","sec":"rw","dom":"craft","skill":"Words in Context","dif":"E","type":"mcq","stim":"<p>Long before coins existed, merchants along desert caravan routes relied on barter, swapping salt for gold or cloth for spices. Because no common currency linked the traders, the value of any good was not fixed but ______, settled through bargaining at each stop.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["permanent","illegal","negotiable","identical"],"ans":2,"exp":{"why":"The sentence contrasts 'not fixed' with the blank and adds that value was 'settled through bargaining.' 'Negotiable' means open to being set by bargaining.","traps":{"A":"Permanent means fixed, the very thing being negated.","B":"Legality is never at issue in the passage.","C":"Correct: value set through bargaining is negotiable.","D":"Bargaining implies varying, not identical, values."},"skill":"Words in Context","strat":"Use the 'not X but ___' frame to seek the opposite of X."}},
{"id":"s3-rw-craft-14","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"H","type":"mcq","stim":"<p>The cosmic microwave background, a faint glow filling the sky, is often called the afterglow of the Big Bang. Yet the phrase can mislead. The radiation was not released at the very beginning but roughly 380,000 years later, when the cooling universe first became transparent to light. Before that moment, the cosmos was an opaque fog through which no light could travel freely. The 'afterglow,' then, is a snapshot of the universe's first clear morning, not its birth.</p>","prompt":"Which choice best describes the main rhetorical purpose of the text?","choices":["To reject the theory of the Big Bang as unsupported","To qualify a popular description by clarifying what the phenomenon actually represents","To trace the complete history of the universe in sequence","To argue that light cannot travel through fog"],"ans":1,"exp":{"why":"The passage accepts the Big Bang but warns that calling the radiation an 'afterglow' can mislead, then clarifies that it dates to 380,000 years later. Its purpose is to refine, not overturn, the popular label.","traps":{"A":"It affirms the Big Bang while correcting a phrase.","B":"Correct: it qualifies the term and explains the reality.","C":"It focuses on one moment, not the full history.","D":"The fog is an illustration, not the argument's point."},"skill":"Text Structure & Purpose","strat":"Distinguish rejecting a claim from merely sharpening a description of it."}},
{"id":"s3-rw-craft-15","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"H","type":"mcq","stim":"<p><b>Text 1</b></p><p>The earliest known writing, from ancient Sumer, consists overwhelmingly of receipts: tallies of grain, livestock, and labor. This record suggests that writing was born from the mundane demands of commerce and taxation, a bookkeeping tool that only later stretched to poetry and law.</p><p><b>Text 2</b></p><p>In several other societies, the oldest inscriptions appear on temple walls and ritual objects, naming gods and rulers. Where such evidence dominates, some scholars argue, writing arose to record sacred and political authority, not accounts. Its first purpose was to command awe, not to count sheep.</p>","prompt":"Which choice best describes the relationship between the two texts?","choices":["Text 2 presents evidence supporting a different account of writing's origins than the one favored in Text 1","Text 2 provides additional data that confirms the conclusion of Text 1","Text 2 restates Text 1's argument using different examples","Text 2 concedes that Text 1's explanation applies to every early society"],"ans":0,"exp":{"why":"Text 1 argues writing began as bookkeeping; Text 2 cites temple and ritual inscriptions to argue it began recording sacred and political authority. Text 2 backs a rival origin story with different evidence.","traps":{"A":"Correct: rival origin account with distinct evidence.","B":"It challenges, not confirms, Text 1's conclusion.","C":"It reaches a different conclusion, not a restatement.","D":"It implies Text 1 does not fit every society."},"skill":"Cross-Text Connections","strat":"Check whether the second text's evidence points to the same conclusion or a competing one."}},
{"id":"s3-rw-craft-16","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>A skilled documentary photographer often waits hours for a single frame, letting a scene unfold until its elements align. The finest images rarely come from staging; instead they are ______, captured in the fleeting instant when light, gesture, and background momentarily cohere.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["fabricated","seized","rehearsed","overlooked"],"ans":1,"exp":{"why":"The blank contrasts with 'staging' and is restated as 'captured in the fleeting instant.' 'Seized' conveys grabbing a passing moment, matching that restatement.","traps":{"A":"Fabricated implies staging, which the sentence rules out.","B":"Correct: seizing a fleeting instant fits 'captured.'","C":"Rehearsed also implies staging, contradicting the clue.","D":"Overlooked means missed, opposite of captured."},"skill":"Words in Context","strat":"Match the blank to the appositive phrase that renames it."}},
{"id":"s3-rw-craft-17","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>Volcanic eruptions are usually pictured as fiery explosions, but many are surprisingly quiet. In Hawaii, lava often oozes out in slow, glowing rivers a person can outwalk. The difference lies in the magma: thin, runny magma lets gas escape gently, while thick, sticky magma traps gas until it bursts. Chemistry, not chance, decides whether a volcano whispers or roars.</p>","prompt":"Which choice best states the main idea of the text?","choices":["All volcanic eruptions are more dangerous than they appear","Hawaiian volcanoes never pose any threat to people","The composition of magma determines whether an eruption is gentle or explosive","Scientists cannot predict how a volcano will behave"],"ans":2,"exp":{"why":"The passage attributes the contrast between quiet and explosive eruptions to magma thickness and gas escape, closing that 'chemistry, not chance' decides the outcome. The main idea is that magma composition governs eruption style.","traps":{"A":"The passage stresses that many eruptions are gentle.","B":"It never claims Hawaiian volcanoes are harmless.","C":"Correct: magma composition sets the eruption style.","D":"The 'chemistry, not chance' line implies predictability."},"skill":"Text Structure & Purpose","strat":"Let the concluding generalization anchor your choice of main idea."}},
{"id":"s3-rw-craft-18","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>Many small fish swim in tight schools that swirl and split when a predator approaches. To a hunting fish, the shimmering mass makes it hard to fix on any single target. Safety, for these species, lies in confusing numbers.</p><p><b>Text 2</b></p><p>Migrating geese fly in a V formation for a practical reason: each bird rides the updraft shed by the one ahead, easing the effort of flight. By taking turns at the tiring front position, the flock as a whole travels farther than any goose could alone.</p>","prompt":"Based on the texts, the group behaviors described differ primarily in that","choices":["the fish save energy, whereas the geese avoid predators","both behaviors serve exactly the same purpose","neither behavior offers any benefit to the individual","the fish gain protection from predators, whereas the geese conserve energy"],"ans":3,"exp":{"why":"Schooling fish gain safety by confusing predators, while V-formation geese save flight energy through shared updrafts. The behaviors serve different benefits: protection versus efficiency.","traps":{"A":"It reverses the two benefits.","B":"The purposes differ, so they are not the same.","C":"Each behavior clearly benefits its group.","D":"Correct: fish get protection, geese save energy."},"skill":"Cross-Text Connections","strat":"Pair each behavior with its stated benefit before comparing."}},
{"id":"s3-rw-craft-19","sec":"rw","dom":"craft","skill":"Words in Context","dif":"H","type":"mcq","stim":"<p>Consumers often assume that a higher price signals higher quality, and marketers exploit this belief. In one study, an identical wine was rated as tastier when labeled expensive. Such findings reveal how readily perception can be ______ by cues that have nothing to do with the product itself.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["substantiated","standardized","suspended","swayed"],"ans":3,"exp":{"why":"The study shows a price label altering how the same wine is judged, so perception is being influenced by an irrelevant cue. 'Swayed' means moved or influenced, fitting this manipulation.","traps":{"A":"Substantiated means proven true, not manipulated.","B":"Standardized means made uniform, unrelated here.","C":"Suspended means halted, not shifted.","D":"Correct: perception is influenced, i.e., swayed."},"skill":"Words in Context","strat":"For influence-of-cue sentences, pick the verb meaning 'nudged,' not 'proven.'"}},
{"id":"s3-rw-craft-20","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"H","type":"mcq","stim":"<p>Archaeologists studying a Bronze Age shipwreck found ingots of copper from one region, tin from another, and pottery from a third. Some read this cargo as proof of a single vast trading empire. Yet the goods need not have traveled together from the start. A more cautious reading holds that each item passed through many hands, changing owners at port after port, so the ship represents not one empire but a long chain of independent exchanges.</p>","prompt":"Which choice best describes the function of the sentence beginning 'Yet the goods need not'?","choices":["It introduces new archaeological findings from a second shipwreck","It signals a turn toward an alternative interpretation of the same evidence","It concedes that the empire theory is certainly correct","It defines the technical meaning of the word ingot"],"ans":1,"exp":{"why":"After presenting the 'single empire' reading, 'Yet' pivots to a rival explanation of the same cargo: goods changing hands port by port. The sentence marks the turn to that alternative interpretation.","traps":{"A":"No second shipwreck or new finds are introduced.","B":"Correct: it pivots to a competing reading of the evidence.","C":"It questions, rather than confirms, the empire theory.","D":"It does not define 'ingot.'"},"skill":"Text Structure & Purpose","strat":"Treat a mid-paragraph 'Yet' as the hinge into a counter-reading."}},
