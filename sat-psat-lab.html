rectly. Graphing on Desmos shows the turning point at (3, 2) too.","check":"Check symmetry: at x = 2, y = 4 − 12 + 11 = 3, and at x = 4, y = 16 − 24 + 11 = 3 — equal heights on both sides of x = 3, confirming the vertex sits at x = 3 with y = 2 below them. ✓"},"s3-ma-adv-07":{"concept":"The discriminant is the part under the square root in the quadratic formula, b² − 4ac. It counts real solutions: positive means two, zero means exactly one (a repeated root where the parabola just touches the x-axis), negative means none. “Exactly one real solution” therefore means set the discriminant equal to 0 and solve for the unknown constant.","steps":["Identify a = 1, b = k, c = 25.","Set the discriminant to zero for one solution: b² − 4ac = k² − 4(1)(25) = 0.","Simplify: k² − 100 = 0, so k² = 100.","Take square roots: k = ±10.","Since k is positive, k = 10."],"alt":"Think of the perfect-square condition. One solution means x² + kx + 25 is a perfect square (x + m)² = x² + 2mx + m². Matching the constant: m² = 25 so m = 5, and the middle term k = 2m = 10 (taking the positive value). Same k = 10.","check":"With k = 10 the equation is x² + 10x + 25 = (x + 5)² = 0, which has the single repeated solution x = −5 — exactly one real solution, as required. ✓"},"s3-ma-adv-08":{"concept":"The discriminant b² − 4ac tells you how many real solutions a quadratic has: greater than 0 gives two distinct real solutions. So “two distinct real solutions” means set up the inequality b² − 4ac > 0 and solve for the allowed values of c, then pick the choice that satisfies it.","steps":["Identify a = 3, b = 6, c is the unknown.","Require two distinct real roots: b² − 4ac > 0, i.e. 6² − 4(3)c > 0.","Simplify: 36 − 12c > 0.","Solve: 36 > 12c → 3 > c, so c < 3.","Among the choices (2, 3, 4, 5), only c = 2 is less than 3 — the answer is A) 2."],"alt":"Test the smallest choice directly. With c = 2: discriminant = 36 − 12(2) = 36 − 24 = 12, which is > 0, so two distinct real solutions ✓. Check c = 3: 36 − 36 = 0 (only one solution, not two), and larger c makes it negative — so only 2 works.","check":"Confirm c = 2 gives a positive discriminant (12 > 0), guaranteeing two different real roots, while every other choice yields 0 or negative. ✓"},"s3-ma-adv-09":{"concept":"“Hits the ground” means the height equals zero, so we set h(t) = 0 and solve. This is a quadratic equation (highest power of t is 2), and solving it means finding the t-values that make the expression equal 0 — these are called the roots or zeros. The cleanest tool here is factoring: if a product of two things equals 0, then at least one of them must be 0 (the Zero Product Property).","steps":["Set height to zero: −16t² + 64t + 80 = 0.","Every term is divisible by −16, so divide through to simplify: t² − 4t − 5 = 0.","Factor: find two numbers that multiply to −5 and add to −4 → those are −5 and +1, giving (t − 5)(t + 1) = 0.","Zero Product Property: t − 5 = 0 or t + 1 = 0, so t = 5 or t = −1.","Time cannot be negative, so reject t = −1. The ball lands at t = 5 seconds."],"alt":"Use the Desmos graphing calculator: type y = −16x² + 64x + 80 and look at where the curve crosses the x-axis (the horizontal line where height = 0). You will see it cross at x = −1 and x = 5. Only the positive crossing makes physical sense, so t = 5. You can also just test values: at t = 5, h = −16(25) + 64(5) + 80 = −400 + 320 + 80 = 0. It works.","check":"Substitute t = 5 back into the original: −16(5²) + 64(5) + 80 = −400 + 320 + 80 = 0. Height is exactly 0, confirming the ball is on the ground."},"s3-ma-adv-10":{"concept":"A parabola that opens downward (because the coefficient of t² is negative) has a single highest point called the vertex. That vertex is the maximum. The t-value of the vertex is found with the formula t = −b/(2a), where a and b come from at² + bt + c. Once you know WHEN the max happens, plug that t back into h(t) to get the actual maximum height.","steps":["Identify a = −16, b = 48, c = 6.","Find the vertex time: t = −b/(2a) = −48/(2·−16) = −48/−32 = 1.5 seconds.","Plug t = 1.5 into h: h(1.5) = −16(1.5²) + 48(1.5) + 6.","Compute 1.5² = 2.25, so −16(2.25) = −36; and 48(1.5) = 72.","Add: −36 + 72 + 6 = 42 feet. The answer is A) 42."],"alt":"Graph y = −16x² + 48x + 6 in Desmos and hover over the top of the curve; Desmos labels the maximum point as (1.5, 42), so the maximum height is 42. Notice the trap answers: 1.5 is the TIME of the max (not the height), and 6 is the starting height at t = 0 — neither is the max height.","check":"Test a nearby time to confirm 42 is truly the peak: h(1) = −16 + 48 + 6 = 38 and h(2) = −64 + 96 + 6 = 38. Both are below 42, so 42 is indeed the maximum."},"s3-ma-adv-11":{"concept":"This is the difference of squares pattern. When you multiply two binomials that are identical except for the sign in the middle — (a + b)(a − b) — the two middle terms cancel and you are left with a² − b². It works because (a + b)(a − b) = a² − ab + ab − b² = a² − b². Recognizing this pattern saves time.","steps":["Match the pattern: a = x and b = 3.","Apply (a + b)(a − b) = a² − b²: this gives x² − 3².","Compute 3² = 9, so the result is x² − 9.","The answer is A) x² − 9."],"alt":"Just FOIL it out to be sure: (x + 3)(x − 3) = x·x + x·(−3) + 3·x + 3·(−3) = x² − 3x + 3x − 9. The −3x and +3x cancel, leaving x² − 9. This is why the middle disappears.","check":"Pick an easy number, say x = 2: original (2 + 3)(2 − 3) = (5)(−1) = −5, and x² − 9 = 4 − 9 = −5. They match, so A is correct."},"s3-ma-adv-12":{"concept":"Squaring a binomial means multiplying it by itself: (2x + 1)² = (2x + 1)(2x + 1). The perfect-square pattern is (a + b)² = a² + 2ab + b². A very common mistake is to only square each term and forget the middle 2ab term — but the middle term is real and required.","steps":["Identify a = 2x and b = 1.","Square the first term: a² = (2x)² = 4x².","Double the product of the two terms: 2ab = 2·(2x)·(1) = 4x².","Square the last term: b² = 1² = 1.","Combine: 4x² + 4x + 1. The answer is A) 4x² + 4x + 1."],"alt":"FOIL directly: (2x + 1)(2x + 1) = 4x² + 2x + 2x + 1 = 4x² + 4x + 1. Notice choice B (4x² + 1) is the classic error of forgetting the middle term — avoid it.","check":"Let x = 1: original (2·1 + 1)² = 3² = 9, and 4(1) + 4(1) + 1 = 4 + 4 + 1 = 9. Match confirms A."},"s3-ma-adv-13":{"concept":"Factoring reverses multiplication: it rewrites an expression as a product. The difference of squares says any expression of the form a² − b² factors into (a − b)(a + b). To use it, recognize that both pieces are perfect squares separated by a minus sign.","steps":["Recognize x² is a perfect square (x²) and 49 is a perfect square (7²).","There is a minus sign between them, so this is a difference of squares: x² − 7².","Apply a² − b² = (a − b)(a + b) with a = x, b = 7.","Result: (x − 7)(x + 7). The answer is A) (x − 7)(x + 7)."],"alt":"Back-solve by expanding the choices. (x − 7)(x + 7) = x² + 7x − 7x − 49 = x² − 49. That matches. Meanwhile (x − 7)² = x² − 14x + 49 has an unwanted middle term, so it is wrong.","check":"Try x = 10: original 10² − 49 = 100 − 49 = 51, and (10 − 7)(10 + 7) = (3)(17) = 51. Match confirms A."},"s3-ma-adv-14":{"concept":"Factoring a quadratic with a leading coefficient other than 1 (here 3x²) means finding two binomials that multiply back to the original. Since the answers are given, the fastest reliable method is to expand each choice and see which one reproduces 3x² − 10x + 8. The signs matter: two negatives multiply to a positive constant (+8) and add to a negative middle (−10x).","steps":["Expand choice A: (3x − 4)(x − 2).","Use FOIL: 3x·x = 3x²; 3x·(−2) = −6x; (−4)·x = −4x; (−4)·(−2) = +8.","Combine the middle terms: −6x − 4x = −10x.","Result: 3x² − 10x + 8, which matches exactly.","The answer is A) (3x − 4)(x − 2)."],"alt":"Reason about signs to eliminate: the constant +8 is positive and the middle −10x is negative, so both binomial constants must be negative. That rules out (3x + 4)(x − 2). Between the remaining negatives, test which gives −10x: (3x − 4)(x − 2) gives −6x − 4x = −10x ✓, while (3x − 2)(x − 4) gives −12x − 2x = −14x ✗.","check":"Plug x = 1 into the original: 3 − 10 + 8 = 1. Now (3·1 − 4)(1 − 2) = (−1)(−1) = 1. Match confirms A."},"s3-ma-adv-15":{"concept":"When a product inside parentheses is raised to a power, that outer power distributes to every factor — this is the power-of-a-product rule: (abc)ⁿ = aⁿbⁿcⁿ. And when a power is raised to another power, you multiply the exponents: (xᵐ)ⁿ = x^(m·n). Apply both rules together.","steps":["Distribute the outer exponent 3 to each factor: (2)³ · (x³)³ · (y²)³.","Compute the number: 2³ = 8.","Multiply exponents for x: (x³)³ = x^(3·3) = x⁹.","Multiply exponents for y: (y²)³ = y^(2·3) = y⁶.","Combine: 8x⁹y⁶. The answer is A) 8x⁹y⁶."],"alt":"Sanity-check the trap answers. Choice B (6x⁹y⁶) comes from wrongly doing 2·3 = 6 instead of 2³ = 8 — remember the exponent means 2·2·2, not 2·3. Choice D (2x⁹y⁶) forgets to raise the 2 at all. Only A treats the coefficient correctly.","check":"Test with x = 1, y = 1: original (2·1·1)³ = 2³ = 8, and 8·1⁹·1⁶ = 8. Match confirms A."},"s3-ma-adv-16":{"concept":"Two exponent rules handle this. When you multiply powers with the same base, you ADD exponents: xᵃ·xᵇ = x^(a+b). When you divide, you SUBTRACT: xᵃ/xᵇ = x^(a−b). A negative exponent just means the term would be in the denominator, but for combining you treat −2 like any other exponent to add.","steps":["Combine the numerator by adding exponents: x⁵ · x⁻² = x^(5 + (−2)) = x³.","Now divide by x, which is x¹: x³/x¹.","Subtract exponents: x^(3 − 1) = x².","The answer is A) x²."],"alt":"Think of x = 2 as a test number. Numerator: 2⁵·2⁻² = 32 · (1/4) = 8; that is 2³ ✓. Divide by 2: 8/2 = 4 = 2². The result behaves exactly like x², confirming the rule.","check":"Plug x = 3 into the original: (3⁵·3⁻²)/3 = (243/9)/3 = 27/3 = 9. And x² = 3² = 9. Match confirms A."},"s3-ma-adv-17":{"concept":"A perfect-square trinomial is what you get from squaring a binomial: (a − b)² = a² − 2ab + b². To recognize one, check that the first and last terms are perfect squares and the middle term equals ±2 times the product of their square roots. Here 4x² = (2x)² and 9 = 3², and the middle −12x should equal −2·(2x)·(3).","steps":["Take square roots of the outer terms: √(4x²) = 2x and √9 = 3.","Test the middle term: 2·(2x)·(3) = 12x, and it appears as −12x, so the sign is minus.","That fits (a − b)² with a = 2x, b = 3.","So 4x² − 12x + 9 = (2x − 3)². The answer is A) (2x − 3)²."],"alt":"Back-solve by expanding: (2x − 3)² = (2x)² − 2(2x)(3) + 3² = 4x² − 12x + 9 ✓. Compare with the difference-of-squares distractor (2x − 3)(2x + 3) = 4x² − 9, which has no middle term, so it cannot be right.","check":"Let x = 2: original 4(4) − 12(2) + 9 = 16 − 24 + 9 = 1, and (2·2 − 3)² = (1)² = 1. Match confirms A."},"s3-ma-adv-18":{"concept":"“Completely factored” means you keep applying difference of squares until nothing else factors over the integers. The key facts: a difference of squares a² − b² = (a − b)(a + b) always factors, but a SUM of squares a² + b² does NOT factor over the integers. So factor once, then look at each piece and factor again if it is still a difference of squares.","steps":["Recognize 16x⁴ = (4x²)² and 1 = 1², so 16x⁴ − 1 = (4x²)² − 1².","First difference of squares: (4x² − 1)(4x² + 1).","Look at 4x² − 1 = (2x)² − 1²; it is another difference of squares → (2x − 1)(2x + 1).","Look at 4x² + 1; it is a SUM of squares, which does not factor over the integers — leave it.","Fully factored: (2x − 1)(2x + 1)(4x² + 1). The answer is A)."],"alt":"Eliminate wrong choices by the ‘finished?’ test. Choice B (4x² − 1)(4x² + 1) is not complete because 4x² − 1 still factors. Choice A is the only one with every factor fully broken down, and it correctly leaves 4x² + 1 alone.","check":"Multiply back with x = 1: (2−1)(2+1)(4+1) = (1)(3)(5) = 15, and 16(1) − 1 = 15. Match confirms A."},"s3-ma-adv-19":{"concept":"This matches the sum-of-cubes pattern: a³ + b³ = (a + b)(a² − ab + b²). The second factor (a² − ab + b²) is exactly what appears here with a = x and b = 2. Recognizing it lets you jump straight to the answer, but you can always expand to confirm.","steps":["Match the pattern: a = x, b = 2, since (x + 2) is (a + b) and (x² − 2x + 4) is (a² − ab + b²).","Confirm b² = 2² = 4 ✓ and ab = x·2 = 2x ✓ (the middle term is −2x ✓).","Apply a³ + b³: result is x³ + 2³ = x³ + 8.","The answer is A) x³ + 8."],"alt":"If you do not remember the pattern, just distribute term by term: x·(x² − 2x + 4) = x³ − 2x² + 4x, and 2·(x² − 2x + 4) = 2x² − 4x + 8. Add them: x³ + (−2x² + 2x²) + (4x − 4x) + 8 = x³ + 8. Everything in the middle cancels.","check":"Test x = 1: original (1 + 2)(1 − 2 + 4) = (3)(3) = 9, and x³ + 8 = 1 + 8 = 9. Match confirms A."},"s3-ma-adv-20":{"concept":"Completing the square rewrites x² + bx + c in vertex form (x + h)² + k. The idea: (x + b/2)² already produces x² + bx plus an extra (b/2)². So you take half of the x-coefficient, square it, and adjust. This form is useful because it reveals the vertex and minimum of the parabola directly.","steps":["Focus on x² + 8x. Half of 8 is 4, and 4² = 16, so (x + 4)² = x² + 8x + 16.","That is 16 too big, so x² + 8x = (x + 4)² − 16.","Substitute back into the full expression: x² + 8x + 10 = (x + 4)² − 16 + 10.","Combine constants: −16 + 10 = −6.","Result: (x + 4)² − 6. The answer is A) (x + 4)² − 6."],"alt":"Back-solve by expanding choices. (x + 4)² − 6 = x² + 8x + 16 − 6 = x² + 8x + 10 ✓. Compare choice C (x + 4)² − 16 = x² + 8x, which is missing the +10, so it is wrong.","check":"Let x = 0: original 0 + 0 + 10 = 10, and (0 + 4)² − 6 = 16 − 6 = 10. Match confirms A."},"s3-ma-adv-21":{"concept":"Function notation f(x) is just a rule with an input slot. f(3) means “replace every x in the formula with 3, then compute.” Follow order of operations (exponents first, then multiplication, then addition/subtraction) and keep track of signs carefully.","steps":["Write the rule: f(x) = x² − 4x + 1.","Replace each x with 3: f(3) = 3² − 4(3) + 1.","Exponent first: 3² = 9.","Multiplication: 4·3 = 12.","Combine left to right: 9 − 12 + 1 = −2. The answer is −2."],"alt":"Graph y = x² − 4x + 1 in Desmos and trace to x = 3; the curve sits at y = −2. Seeing the point (3, −2) on the parabola confirms the arithmetic visually.","check":"Recompute carefully: 9 − 12 = −3, then −3 + 1 = −2. Consistent, so f(3) = −2."},"s3-ma-adv-22":{"concept":"To evaluate f at a more complicated input like x + 1, substitute the WHOLE expression x + 1 wherever x appears. Since f(x) = x², we get f(x + 1) = (x + 1)². Then subtract f(x) = x². This kind of ‘difference’ measures how much the function grows when the input increases by 1.","steps":["Compute f(x + 1) by replacing x with (x + 1): f(x + 1) = (x + 1)².","Expand: (x + 1)² = x² + 2x + 1.","Subtract f(x) = x²: (x² + 2x + 1) − x².","The x² terms cancel, leaving 2x + 1. The answer is A) 2x + 1."],"alt":"Plug in an easy number, say x = 3. Then f(4) − f(3) = 16 − 9 = 7. Now test the choices at x = 3: 2x + 1 = 7 ✓, while 2x = 6 ✗ and 1 ✗. Only A gives 7.","check":"Try another value x = 5: f(6) − f(5) = 36 − 25 = 11, and 2(5) + 1 = 11. Match confirms A."},"s3-ma-adv-23":{"concept":"The zeros (also called roots or x-intercepts) of a function are the x-values that make it 0. A quadratic with zeros r and s and leading coefficient 1 can be built as f(x) = (x − r)(x − s), because plugging in r or s makes one factor 0. Note the sign flip: a zero at x = −2 gives the factor (x + 2).","steps":["Zeros are x = −2 and x = 5, so the factors are (x − (−2)) = (x + 2) and (x − 5).","Write f(x) = (x + 2)(x − 5).","Expand with FOIL: x·x = x²; x·(−5) = −5x; 2·x = 2x; 2·(−5) = −10.","Combine middle terms: −5x + 2x = −3x.","Result: x² − 3x − 10. The answer is A) x² − 3x − 10."],"alt":"Back-solve: the correct function must give 0 at both x = −2 and x = 5. Test choice A at x = 5: 25 − 15 − 10 = 0 ✓, and at x = −2: 4 + 6 − 10 = 0 ✓. It passes both, so A is correct.","check":"Verify the constant term: for (x + 2)(x − 5), the constant is 2·(−5) = −10, matching x² − 3x − 10. Also both zeros check out to 0 as shown."},"s3-ma-adv-24":{"concept":"When you know a parabola’s x-intercepts p and q, you can write it in factored form f(x) = a(x − p)(x − q). The unknown a is a vertical stretch that you find using one more known point on the curve. Here the intercepts are 1 and 4, and the extra point (0, 8) pins down a.","steps":["Write f(x) = a(x − 1)(x − 4) using the intercepts 1 and 4.","Use the point (0, 8): f(0) = a(0 − 1)(0 − 4) = a(−1)(−4) = 4a.","Set 4a = 8, so a = 2.","Substitute a = 2: f(x) = 2(x − 1)(x − 4).","Expand: (x − 1)(x − 4) = x² − 5x + 4, then times 2 = 2x² − 10x + 8. The answer is A)."],"alt":"Back-solve using the given point. The correct function must give f(0) = 8. Test choice A: 2(0) − 10(0) + 8 = 8 ✓. Test choice B: 0 − 0 + 4 = 4 ✗. Choice B has the right zeros but the wrong stretch, so only A fits all conditions.","check":"Confirm a zero: f(1) = 2(1) − 10(1) + 8 = 2 − 10 + 8 = 0 ✓, and f(4) = 2(16) − 40 + 8 = 32 − 40 + 8 = 0 ✓. Both intercepts and the point work."},"s3-ma-adv-25":{"concept":"g(f(2)) is a composition: you work from the inside out. First evaluate the inner function f at 2 to get a number, then feed that number into g. Think of it as two machines in a row — the output of the first becomes the input of the second.","steps":["Start inside: f(2) = 2(2) + 1 = 4 + 1 = 5.","Now use that result as the input to g: g(f(2)) = g(5).","Apply g(x) = x²: g(5) = 5² = 25.","The answer is 25."],"alt":"Build the composite formula first: g(f(x)) = (2x + 1)². Then plug in x = 2: (2·2 + 1)² = (5)² = 25. Same answer, showing order matters — g(f(x)) is not f(g(x)).","check":"Re-do the inside independently: 2·2 + 1 = 5, and 5 squared is 25. Consistent, so g(f(2)) = 25."},"s3-ma-adv-26":{"concept":"This just asks you to evaluate the function at two inputs and subtract. f(x) = x² + x means for any input you square it and add the input itself. Compute f(4) and f(3) separately, then take the difference. Careful arithmetic and order of operations is all that is needed.","steps":["Compute f(4): 4² + 4 = 16 + 4 = 20.","Compute f(3): 3² + 3 = 9 + 3 = 12.","Subtract: f(4) − f(3) = 20 − 12 = 8.","The answer is 8."],"alt":"Notice f(x) = x² + x = x(x + 1), the product of two consecutive integers. So f(4) = 4·5 = 20 and f(3) = 3·4 = 12; difference 20 − 12 = 8. A quick way to double-check each value.","check":"Recompute f(4) − f(3) as (16 + 4) − (9 + 3) = 20 − 12 = 8. Consistent, so the answer is 8."},"s3-ma-adv-27":{"concept":"Vertex form a(x − h)² + k reveals the minimum or maximum instantly. The squared part (x + 1)² can never be negative — the smallest it can be is 0. Since a = 2 is positive, 2(x + 1)² is also smallest (0) at that point, so the whole function is smallest when the squared term is 0. What remains is the constant k, here −5.","steps":["Recognize the form 2(x + 1)² − 5, where the squared term is always ≥ 0.","The squared term equals 0 when x + 1 = 0, i.e., x = −1.","At that point, 2·(0) − 5 = −5.","Since 2 > 0, the parabola opens up and −5 is the lowest value. The minimum is −5."],"alt":"Graph y = 2(x + 1)² − 5 in Desmos; the lowest point of the U-shape is the vertex at (−1, −5). The y-coordinate −5 is the minimum value, matching the reasoning.","check":"Test a value near x = −1, like x = 0: 2(1)² − 5 = 2 − 5 = −3, which is greater than −5. And x = −2 gives 2(1) − 5 = −3 also. Both exceed −5, confirming −5 is the minimum."},"s3-ma-adv-28":{"concept":"Vertex form f(x) = a(x − h)² + k uses the vertex (h, k) directly. Given the vertex (2, −1), you write f(x) = a(x − 2)² − 1, leaving only a unknown. Use the second point (0, 3) to solve for a, then the function is fully known and you can evaluate f(5).","steps":["Plug the vertex into vertex form: f(x) = a(x − 2)² − 1.","Use the point (0, 3): 3 = a(0 − 2)² − 1 = a(4) − 1.","Solve: 4a − 1 = 3 → 4a = 4 → a = 1.","So f(x) = (x − 2)² − 1. Now evaluate at 5: f(5) = (5 − 2)² − 1 = 3² − 1.","Compute: 9 − 1 = 8. The answer is A) 8."],"alt":"Back-solve conceptually with symmetry. The vertex is at x = 2, and x = 0 is 2 units left of it giving y = 3 (which is 4 above the vertex’s −1). The point x = 5 is 3 units right of the vertex; using f(x) = (x−2)² − 1, that is 3² − 1 = 8. The value 8 matches choice A.","check":"Verify the given point with a = 1: f(0) = (0 − 2)² − 1 = 4 − 1 = 3 ✓. Since the function reproduces the known point, f(5) = 8 is trustworthy."},"s3-ma-adv-29":{"concept":"Replacing x with (x − 3) inside a function shifts its graph HORIZONTALLY. The counterintuitive rule: f(x − 3) moves the graph to the RIGHT by 3, not left. Why? Because the graph now reaches a given output when x is 3 larger than before — every point slides right. Subtracting inside means moving right; adding inside means moving left.","steps":["Write g(x) = f(x − 3) = (x − 3)² since f(x) = x².","Compare vertices: f(x) = x² has its vertex at (0, 0).","g(x) = (x − 3)² has its vertex where x − 3 = 0, i.e., x = 3, so vertex (3, 0).","The vertex moved from x = 0 to x = 3 — that is 3 units to the right. The answer is A)."],"alt":"Memory device: set the inside equal to zero. x − 3 = 0 gives x = 3, a POSITIVE number, so the graph shifts to the positive side (right). If it were x + 3 = 0, x = −3 would mean a shift left. This ‘solve the inside = 0’ trick tells you the direction every time.","check":"Pick a point: on f, the vertex is (0,0). On g, g(3) = (3 − 3)² = 0, so (3, 0) is on g. The bottom of the parabola moved from x = 0 to x = 3, confirming a rightward shift of 3."},"s3-ma-adv-30":{"concept":"Average rate of change over an interval [a, b] is the slope of the straight line connecting the two points on the curve: (f(b) − f(a))/(b − a). It measures the average steepness — how much the output changed per unit of input across that stretch. It is exactly the ‘rise over run’ idea from linear slope, applied to a curve’s endpoints.","steps":["Identify the interval: from x = 1 to x = 4, so a = 1, b = 4.","Compute the outputs: f(1) = 1² = 1 and f(4) = 4² = 16.","Find the change in output (rise): 16 − 1 = 15.","Find the change in input (run): 4 − 1 = 3.","Divide: 15/3 = 5. The answer is 5."],"alt":"Picture it on a graph: plot (1, 1) and (4, 16) on y = x², draw the line between them, and find its slope. Rise 15 over run 3 gives slope 5 — that line is the average rate of change over the interval.","check":"Re-verify the points and slope: f(4) − f(1) = 16 − 1 = 15, over 4 − 1 = 3, equals 5. Reasonable since the parabola is getting steeper across this interval."},"s3-ma-adv-31":{"concept":"Exponential growth by a fixed percent each period is modeled by P = (initial)·(growth factor)ᵗ. The growth factor is 1 + r, where r is the rate as a decimal. Growing by 3% means you keep 100% of the population and add 3%, so you multiply by 1 + 0.03 = 1.03 each year. The exponent t counts the number of years.","steps":["Initial population = 200, so that is the number in front.","Growth rate 3% = 0.03 as a decimal.","Growth factor = 1 + 0.03 = 1.03 (you keep the whole thing plus 3% more).","Model: P = 200(1.03)ᵗ. The answer is A) P = 200(1.03)ᵗ."],"alt":"Test t = 1 (after one year): the population should be 200 plus 3% of 200 = 200 + 6 = 206. Choice A gives 200(1.03) = 206 ✓. Choice B gives 200(0.03) = 6 (way too small ✗), and choice C gives 200(1.3) = 260 (too big ✗). Only A behaves correctly.","check":"After 1 year A predicts 206, which is exactly a 3% increase (6 more than 200). The model matches the described growth, so A is correct."},"s3-ma-adv-32":{"concept":"To solve an exponential equation, rewrite both sides as powers of the SAME base. Once the bases match, the exponents must be equal, so you can set them equal and solve a simple linear equation. Here the base is 2, and 8 is a power of 2.","steps":["Rewrite 8 as a power of 2: 8 = 2·2·2 = 2³.","So the equation becomes 2^(x + 1) = 2³.","Same base means equal exponents: x + 1 = 3.","Solve: x = 3 − 1 = 2. The answer is 2."],"alt":"Test-and-check: try x = 2 in the original. 2^(2 + 1) = 2³ = 8 ✓. That is exactly the right-hand side, so x = 2 works.","check":"Substitute x = 2 back: 2^(2+1) = 2³ = 8, which equals the given 8. Confirmed."},"s3-ma-adv-33":{"concept":"Same idea as any exponential equation: express both sides with the same base, then match exponents. The base here is 5, and 125 is a power of 5 (5·5·5 = 125). Once the bases agree, set the exponents equal and solve.","steps":["Rewrite 125 as a power of 5: 125 = 5·5·5 = 5³.","The equation becomes 5^(x − 1) = 5³.","Equal bases → equal exponents: x − 1 = 3.","Solve: x = 3 + 1 = 4. The answer is A) 4."],"alt":"Back-solve with the choices. Try x = 4: 5^(4 − 1) = 5³ = 125 ✓, matching the right side. Try x = 3: 5^(3−1) = 5² = 25 ✗. Only x = 4 hits 125.","check":"Plug x = 4 back in: 5^(4 − 1) = 5³ = 125, equal to the given value. Confirmed."},"s3-ma-adv-34":{"concept":"Exponential DECAY by a fixed percent uses P = (initial)·(decay factor)ᵗ, where the decay factor is 1 − r. Losing 15% each year means you keep 85% of the value, so you multiply by 1 − 0.15 = 0.85 each year. The base being less than 1 (but positive) is the signature of decay.","steps":["Initial value = $24,000, the number in front.","Loses 15% per year, so it keeps 100% − 15% = 85% = 0.85 each year.","Decay factor = 1 − 0.15 = 0.85.","Model: V = 24000(0.85)ᵗ. The answer is A) V = 24000(0.85)ᵗ."],"alt":"Test t = 1: after one year the car should be worth 24000 minus 15% of 24000 = 24000 − 3600 = 20400. Choice A gives 24000(0.85) = 20400 ✓. Choice B gives 24000(0.15) = 3600 (that is only the amount lost ✗), and choice C (base 1.15) would grow the value ✗.","check":"After 1 year A predicts 20400, exactly a 15% drop from 24000. The model matches ‘loses 15% each year,’ so A is correct."},"s3-ma-adv-35":{"concept":"A rational expression is just a fraction with polynomials on top and bottom. To simplify one, you factor the top and bottom into products, then cancel any factor that appears in both — exactly like reducing 6/8 to 3/4 by cancelling a shared 2. This works because a factor divided by itself equals 1. Two key factoring patterns here: a “difference of squares” a² − b² = (a − b)(a + b), and a quadratic x² + bx + c that factors into (x + m)(x + n) where m and n multiply to c and add to b.","steps":["Factor the top: x² − 4 is a difference of squares (x² minus 2²), so it becomes (x − 2)(x + 2).","Factor the bottom: x² − x − 2. Find two numbers that multiply to −2 and add to −1: those are −2 and +1. So it factors to (x − 2)(x + 1).","Rewrite the whole fraction: (x − 2)(x + 2) / [(x − 2)(x + 1)].","Cancel the common factor (x − 2) from top and bottom (allowed since x ≠ 2 keeps it nonzero).","What remains is (x + 2)/(x + 1), which is choice A."],"alt":"Plug in an easy number the problem allows, say x = 0. The original expression is (0 − 4)/(0 − 0 − 2) = −4/−2 = 2. Now test the choices at x = 0: A gives (0+2)/(0+1) = 2/1 = 2 ✓. B gives (−2)/(−1) = 2 also — a tie, so try a second number. At x = 3: original = (9−4)/(9−3−2) = 5/4. A gives 5/4 ✓; B gives 1/2 ✗. Only A matches both, confirming A.","check":"Substitute x = 1 into both the original and your answer. Original: (1 − 4)/(1 − 1 − 2) = −3/−2 = 3/2. Answer A: (1 + 2)/(1 + 1) = 3/2. They agree, so the simplification is correct."},"s3-ma-adv-36":{"concept":"When an equation has the variable in a denominator, the denominator can NEVER equal zero — division by zero is undefined, so any x that makes a denominator zero is forbidden. The standard method is to multiply both sides by the denominator to clear the fractions, solve the resulting equation, and then CHECK whether the answer is actually allowed. A solution that appears algebraically but violates the domain is called “extraneous” and must be thrown out.","steps":["Notice the forbidden value first: x − 4 = 0 when x = 4, so x = 4 can never be a valid solution.","Multiply every term by (x − 4): x = 4 + 2(x − 4).","Distribute the 2: x = 4 + 2x − 8, which simplifies to x = 2x − 4.","Subtract 2x from both sides: −x = −4, so x = 4.","But x = 4 is exactly the forbidden value — it makes the denominators zero. It is extraneous.","Since the only candidate is disallowed, there is No solution (choice A)."],"alt":"Think intuitively. Both fractions share the denominator (x − 4). Rewrite the equation as x/(x − 4) − 4/(x − 4) = 2, which combines to (x − 4)/(x − 4) = 2. But (x − 4)/(x − 4) always equals 1 (whenever it is defined), and 1 can never equal 2. So the equation is impossible — no solution — without even solving.","check":"Try to plug x = 4 back into the original: x/(x − 4) = 4/0, which is undefined. Since the only value algebra produced breaks the equation, confirming there is genuinely no valid solution."},"s3-ma-adv-37":{"concept":"A proportion is a statement that two fractions are equal. The fastest way to solve a/b = c/d is “cross-multiplication”: multiply each numerator by the other fraction’s denominator to get a·d = b·c. This is legal because it is really just multiplying both sides by both denominators at once, which clears the fractions. After solving, always confirm no denominator became zero.","steps":["Start with 2/(x − 1) = 3/(x + 1).","Cross-multiply: 2 · (x + 1) = 3 · (x − 1).","Distribute both sides: 2x + 2 = 3x − 3.","Get variables on one side: subtract 2x from both sides to get 2 = x − 3.","Add 3 to both sides: x = 5, which is choice A."],"alt":"Back-solve by testing choices. Try x = 5: left side 2/(5 − 1) = 2/4 = 1/2; right side 3/(5 + 1) = 3/6 = 1/2. Both equal 1/2, so x = 5 works. A quick scan shows x = 1 (choice C) is illegal because it makes x − 1 = 0, so it can be eliminated instantly.","check":"Substitute x = 5 into both original fractions: 2/4 = 0.5 and 3/6 = 0.5. The two sides match and neither denominator is zero, so x = 5 is valid."},"s3-ma-adv-38":{"concept":"An exponential equation asks: to what power must a base be raised? The core trick is to rewrite both sides with the SAME base, because if b^m = b^n (with the same base b), then the exponents must be equal: m = n. To do that you use the power-of-a-power rule (b^m)^n = b^(m·n), meaning you multiply exponents when a power is raised to another power. Here 4 is a power of 2, so everything can become base 2.","steps":["Rewrite 4 as 2²: so 4^x = (2²)^x.","Apply the power-of-a-power rule: (2²)^x = 2^(2·x) = 2^(2x).","The equation becomes 2^(2x) = 2^(x + 3).","Same base, so set exponents equal: 2x = x + 3.","Subtract x from both sides: x = 3, which is choice A."],"alt":"Test the answer choices directly. Try x = 3: left side 4^3 = 64; right side 2^(3 + 3) = 2^6 = 64. They match, so x = 3 is correct. This avoids the base-conversion algebra entirely if you’re comfortable computing the powers.","check":"Plug x = 3 back in: 4³ = 64 and 2^(3+3) = 2⁶ = 64. Both sides equal 64, confirming the answer."},"s3-ma-adv-39":{"concept":"Just like the previous problem, the strategy for an exponential equation is to express both sides with one common base and then equate the exponents. Here 8 and 4 are both powers of 2: 8 = 2³ and 4 = 2². Use the power-of-a-power rule (b^m)^n = b^(m·n) — multiply the exponents — to convert each side to base 2, and don’t forget to distribute when an exponent is a sum like (x + 1).","steps":["Write 8 as 2³: 8^x = (2³)^x = 2^(3x).","Write 4 as 2²: 4^(x + 1) = (2²)^(x + 1) = 2^(2(x + 1)) = 2^(2x + 2).","The equation is now 2^(3x) = 2^(2x + 2).","Same base means exponents are equal: 3x = 2x + 2.","Subtract 2x from both sides: x = 2, which is choice A."],"alt":"Back-solve. Try x = 2: left side 8² = 64; right side 4^(2 + 1) = 4³ = 64. Both equal 64, so x = 2 checks out — no base conversion needed if you just compute.","check":"Substitute x = 2: 8² = 64 and 4^(2+1) = 4³ = 64. Equal on both sides, so x = 2 is confirmed."},"s3-ma-adv-40":{"concept":"“Doubling” is exponential growth: each fixed time period, the quantity is multiplied by 2. The general model is Amount = (starting amount) × 2^(number of doubling periods). To find the number of doubling periods, divide the total elapsed time by the length of one doubling period. The exponent counts how many times you’ve doubled — not the number of hours.","steps":["Find how many doubling periods fit in 12 hours: 12 ÷ 4 = 3 periods.","Set up the model: Amount = 300 × 2³.","Compute 2³ = 2 × 2 × 2 = 8.","Multiply: 300 × 8 = 2,400 cells, which is choice A."],"alt":"Double step by step. Start: 300. After 4 hours (1st double): 600. After 8 hours (2nd double): 1,200. After 12 hours (3rd double): 2,400. Counting the doublings by hand lands on 2,400, matching choice A.","check":"Reasonableness: after 3 doublings the population should be 8 times the start (2×2×2). 8 × 300 = 2,400, so the answer is consistent. Watch the trap answer 1,200 — that’s only 2 doublings (8 hours)."},"ma-psda-01":{"concept":"A ratio compares quantities in fixed proportion. The ratio 3 to 2 (written 3:2) means the two amounts always come in “bundles” — for every 3 units of the first, there are 2 units of the second. To scale a ratio up, you find the multiplier that turns the given part into the real amount, then apply that SAME multiplier to the other part, keeping the proportion intact.","steps":["The flour part of the ratio is 3, and the real flour is 9 cups.","Find the multiplier: 9 ÷ 3 = 3.","Apply the same multiplier to the sugar part: 2 × 3 = 6 cups.","So the recipe uses 6 cups of sugar, which is choice B."],"alt":"Set up a proportion: 3/2 = 9/s (flour over sugar equals flour over sugar). Cross-multiply: 3s = 2 × 9 = 18, so s = 6. Both methods give 6 cups of sugar.","check":"Verify the ratio holds: flour to sugar is 9 to 6. Divide both by 3 and you get 3 to 2 — the original ratio. It matches, so 6 is correct."},"ma-psda-02":{"concept":"“Percent” means “per hundred,” so 20% literally means 20 out of 100, or the decimal 0.20. The word “of” in math almost always signals multiplication. So “20% of 150” translates directly to 0.20 × 150. Converting a percent to a decimal (move the decimal point two places left) is the key first move.","steps":["Convert 20% to a decimal: 20 ÷ 100 = 0.20.","Translate “of” to multiplication: 0.20 × 150.","Multiply: 0.20 × 150 = 30, which is choice A."],"alt":"Use a friendly fraction: 20% is the same as 1/5. One-fifth of 150 is 150 ÷ 5 = 30. Splitting 150 into five equal parts gives 30 each, matching the answer.","check":"Sanity check: 10% of 150 is 15, and 20% is double that, so 30. Consistent — the answer is 30."},"ma-psda-03":{"concept":"A discount is a percent you subtract from the original price. There are two equivalent ways to handle it. Method one: find the discount amount (the percent of the price) and subtract it. Method two, faster: if you take 25% OFF, you KEEP 100% − 25% = 75%, so multiply by 0.75 in one step. Both rely on the fact that percent means “per hundred” and “of” means multiply.","steps":["Recognize a 25% discount means you keep 75% of the price.","Convert 75% to a decimal: 0.75.","Multiply by the original price: 0.75 × $40 = $30, which is choice B."],"alt":"Subtract-the-discount method: 25% of $40 is 0.25 × 40 = $10 off. Then $40 − $10 = $30. Same $30 answer, reached a different way.","check":"Check reasonableness: 25% is a quarter, so a quarter of $40 ($10) comes off, leaving three quarters ($30). Consistent with choice B. Avoid the trap $10, which is only the discount, not the sale price."},"ma-psda-04":{"concept":"Percent increase measures how much a quantity grew RELATIVE to where it started. The formula is (change ÷ original) × 100%, where change = new − old. The crucial detail: you divide by the ORIGINAL (old) value, not the new one, because you’re asking “the growth is what fraction of what we began with?”","steps":["Find the change: 100 − 80 = 20 cm of growth.","Divide by the original value: 20 ÷ 80 = 0.25.","Multiply by 100 to make it a percent: 0.25 × 100 = 25%.","Enter 25."],"alt":"Think in fractions: the plant grew 20 cm, and 20 is one quarter of the original 80 (since 80 ÷ 4 = 20). One quarter is 25%. Same result, using the intuition that 20 is 1/4 of 80.","check":"Work forward: increase 80 by 25%. 25% of 80 is 20, and 80 + 20 = 100, the given new height. It matches, so 25 is correct. (Dividing by 100 instead of 80 would wrongly give 20 — a common trap.)"},"ma-psda-05":{"concept":"This is a rate problem built on one relationship: Distance = rate × time. A rate like “60 miles per hour” tells you how many miles pile up in each hour. Multiplying that rate by the number of hours gives the total distance. Keeping units straight (miles per hour × hours = miles) confirms you’re multiplying correctly.","steps":["Identify the rate (60 mph) and the time (2.5 hours).","Apply Distance = rate × time: 60 × 2.5.","Compute: 60 × 2 = 120, and 60 × 0.5 = 30, so 120 + 30 = 150 miles, which is choice B."],"alt":"Break the time into pieces. In 2 hours the car goes 60 × 2 = 120 miles; the extra half hour adds half of 60 = 30 miles. Total 120 + 30 = 150 miles — same answer.","check":"Units check: (miles/hour) × hours = miles, correct. And 150 miles in 2.5 hours works out to 150 ÷ 2.5 = 60 mph, the given speed. Confirmed."},"ma-psda-06":{"concept":"The median is the middle value of a data set once the numbers are lined up in order from smallest to largest. It marks the center by POSITION: half the values sit below it and half above. If there’s an odd number of values, the median is the single middle one; if even, it’s the average of the two middle ones.","steps":["Confirm the data is in order: 3, 7, 7, 10, 15. (It already is.)","Count the values: there are 5, an odd number.","The middle position of 5 values is the 3rd one.","The 3rd value is 7, so the median is 7, which is choice A."],"alt":"Cross off from both ends. Remove the smallest (3) and largest (15): left with 7, 7, 10. Remove the next pair (7 and 10): the lone survivor is 7. That pinch-from-both-sides method lands on the median 7.","check":"Count that exactly two values lie below the median and two above: below are 3 and 7 (positions 1–2), above are 10 and 15 (positions 4–5). Balanced, so 7 is truly the middle. Note 8.4 is the mean, a trap answer."},"ma-psda-07":{"concept":"The mean (average) equals the total sum of all values divided by how many values there are. A powerful consequence: if you know the mean and the count, you can recover the sum by multiplying them (sum = mean × count). That lets you handle a set even without seeing the individual numbers — you just work with the total.","steps":["Recover the original sum: mean × count = 12 × 5 = 60.","Add the new number: 60 + 18 = 78 (this is the new total).","Count the values now: 5 + 1 = 6 numbers.","Divide: 78 ÷ 6 = 13, which is choice A."],"alt":"Think about the pull of the new value. The new number 18 is 6 above the old mean of 12. Spread that surplus of 6 across all 6 numbers: 6 ÷ 6 = 1 added to the mean, giving 12 + 1 = 13. Same answer via a balancing-point idea.","check":"Reasonableness: adding a value (18) larger than the current mean (12) must pull the mean up, and 13 > 12 — the direction is right. And 13 × 6 = 78 = 60 + 18. Confirmed."},"ma-psda-08":{"concept":"An outlier is a value far from the rest of the data. Different measures of center react to outliers differently. The mean uses every value’s exact size, so one huge value drags it upward — it is sensitive. The median cares only about POSITION (the middle value), so a single extreme value barely nudges it — it is resistant, or “robust.” This is why incomes and home prices are usually reported with the median.","steps":["Recall what each measure does: the mean sums all values (size matters); the median finds the positional middle (only rank matters).","A very high outlier greatly increases the sum, so it pulls the mean toward itself.","The outlier just sits at the top of the ordered list; the middle position shifts little or not at all.","Range and sum both use the extreme value directly, so they change a lot too.","Therefore the median is LEAST affected, which is choice B."],"alt":"Try a tiny example: incomes 1, 2, 3, 4, 100 (in thousands). Median is the middle value, 3. Now shrink the outlier to 1, 2, 3, 4, 10: the median is STILL 3, but the mean dropped from 22 to 4. Seeing the median stay put while the mean lurches makes it obvious the median resists outliers.","check":"Reasonableness: news reports use “median household income” precisely because a few billionaires would inflate the mean but leave the median representative of a typical household. That real-world convention confirms the median is the robust choice."},"ma-psda-09":{"concept":"Probability of an event = (number of favorable outcomes) ÷ (total number of equally likely outcomes). Since all marbles are the same size, each is equally likely to be drawn, so we just count. “Favorable” means the outcomes we want (drawing red); the total is every marble in the bag. The result is a fraction between 0 (impossible) and 1 (certain).","steps":["Count the favorable outcomes (red marbles): 3.","Count the total marbles: 3 red + 5 blue = 8.","Form the probability: favorable ÷ total = 3/8, which is choice A."],"alt":"Reason by proportion: reds make up 3 of every 8 marbles, so out of the whole bag the “red share” is 3 parts out of 8 total parts — 3/8. The share-of-the-whole view gives the same fraction.","check":"Consistency check: P(red) + P(blue) should equal 1. P(blue) = 5/8, and 3/8 + 5/8 = 8/8 = 1. It balances, so 3/8 is correct. (3/5 is a trap — that’s red-to-blue, not red-to-total.)"},"ma-psda-10":{"concept":"Two events are independent when one’s outcome doesn’t affect the other — like two separate coin flips. For independent events, the probability that BOTH happen is the product of their individual probabilities (the multiplication rule). A fair coin lands heads with probability 1/2, so two heads in a row is 1/2 × 1/2. This works because each flip independently keeps half of the remaining possibilities.","steps":["Probability of heads on coin 1: 1/2.","Probability of heads on coin 2: 1/2 (independent of the first).","Multiply for both: 1/2 × 1/2 = 1/4.","Enter 1/4 (or 0.25)."],"alt":"List every equally likely outcome of two flips: HH, HT, TH, TT — four total. Only ONE of them is “both heads” (HH). So the probability is 1 out of 4 = 1/4. Counting the sample space directly confirms it.","check":"The four outcomes HH, HT, TH, TT each have probability 1/4, and they add to 4/4 = 1 as they must. Exactly one is HH, so 1/4 is right."},"ma-psda-11":{"concept":"A map scale is a rate connecting map distance to real distance: here every 1 inch on the map stands for 25 real miles. To convert a map measurement to real miles, multiply the number of inches by the miles-per-inch rate. This is the same “multiply by the unit rate” idea used for speed or price per item.","steps":["Identify the scale (rate): 25 miles per 1 inch.","Identify the map distance: 3.5 inches.","Multiply: 25 × 3.5.","Compute: 25 × 3 = 75, and 25 × 0.5 = 12.5, so 75 + 12.5 = 87.5 miles.","Enter 87.5."],"alt":"Set up a proportion: 1 inch / 25 miles = 3.5 inches / m miles. Cross-multiply: m = 25 × 3.5 = 87.5. The proportion gives the same 87.5 miles.","check":"Reverse it: 87.5 real miles ÷ 25 miles per inch = 3.5 inches, the given map distance. It matches, so 87.5 is correct."},"s2-ma-psda-01":{"concept":"A constant rate means the same amount happens in each unit of time. The cleanest approach is to find the UNIT rate — the amount per one minute — by dividing. Once you know pages per single minute, you multiply by any number of minutes to scale up. This “find the unit rate, then multiply” method works for any constant-rate situation.","steps":["Find the unit rate: 84 pages ÷ 6 minutes = 14 pages per minute.","Multiply by the new time: 14 × 15 minutes.","Compute: 14 × 15 = 210 pages, which is choice C."],"alt":"Use a proportion: 84/6 = p/15. Cross-multiply: 6p = 84 × 15 = 1,260, so p = 1,260 ÷ 6 = 210. Same 210 pages, no unit rate needed.","check":"Check the unit rate holds: 210 pages ÷ 15 minutes = 14 pages per minute, matching the original 84 ÷ 6 = 14. Consistent, so 210 is correct."},"s2-ma-psda-02":{"concept":"A ratio 5 : 2 means the ingredients come in fixed bundles — 5 parts flour to 2 parts sugar. To scale up, find how many bundles the given amount represents by dividing by that ingredient’s ratio number, then multiply the other ingredient’s number by the same count of bundles. The bundle multiplier keeps both quantities in proportion.","steps":["The flour part of the ratio is 5, and real flour is 35 cups.","Find the number of bundles: 35 ÷ 5 = 7.","Multiply the sugar part by 7: 2 × 7 = 14 cups.","So 14 cups of sugar are needed, which is choice B."],"alt":"Proportion form: 5/2 = 35/s. Cross-multiply: 5s = 2 × 35 = 70, so s = 70 ÷ 5 = 14. Same answer of 14 cups.","check":"Verify the ratio: 35 flour to 14 sugar. Divide both by 7: 5 to 2 — the original ratio. It matches, so 14 is correct. (Trap 17.5 comes from halving 35, ignoring the ratio.)"},"s2-ma-psda-03":{"concept":"“25% off” is a discount you subtract from the original price. The one-step shortcut: if 25% comes off, you KEEP 100% − 25% = 75%, so multiply the price by 0.75. Percent means “per hundred,” and “of” means multiply, which is why converting the kept percent to a decimal and multiplying gives the sale price directly.","steps":["Since 25% is taken off, you keep 75% of the price.","Convert 75% to a decimal: 0.75.","Multiply: 0.75 × $80 = $60, which is choice C."],"alt":"Two-step subtraction: 25% of $80 is 0.25 × 80 = $20 off. Then $80 − $20 = $60. Same $60 answer.","check":"Reasonableness: 25% is a quarter, so $20 comes off leaving three quarters of $80, which is $60. Consistent. Don’t pick $20 — that’s only the discount, not the sale price."},"s2-ma-psda-04":{"concept":"Percent increase measures growth relative to the STARTING value: (new − old) ÷ old, then times 100 to express it as a percent. The denominator must be the original amount, because the question is “the increase is what fraction of what we started with?” Dividing by the new value instead is the classic mistake.","steps":["Find the increase: 2,760 − 2,400 = 360 people.","Divide by the original population: 360 ÷ 2,400 = 0.15.","Multiply by 100 to get percent: 0.15 × 100 = 15%.","Enter 15."],"alt":"Estimate with round numbers: 10% of 2,400 is 240, and 5% is 120; together 240 + 120 = 360, exactly the increase. So the increase is 10% + 5% = 15%. Building up from friendly percents confirms it.","check":"Work forward: 2,400 increased by 15% is 2,400 + 360 = 2,760, the given new population. It matches, so 15 is correct."},"s2-ma-psda-05":{"concept":"When percentages are applied one after another, you MUST apply the second one to the NEW amount, not the original — this is why a 20% increase followed by a 20% decrease does not return to the start. Each change is a multiplier: +20% means ×1.20, and −20% means ×0.80. Multiplying the two factors gives the overall effect on the original.","steps":["Pick a convenient starting value: 100 (represents 100% of the original).","Apply +20%: 100 × 1.20 = 120.","Apply −20% to the NEW price 120: 120 × 0.80 = 96.","So the final is 96 out of the original 100, i.e., 96%, which is choice A."],"alt":"Combine the multipliers first: 1.20 × 0.80 = 0.96, which is 96% of the original — no starting number needed. The −20% is bigger in dollars than the +20% because it acts on a larger amount (120 vs 100), so a net LOSS makes sense.","check":"Reasonableness: increasing then decreasing by the same percent always ends BELOW the start (you can never fully recover). 96% < 100% fits, and picking a different start like $50 gives 50 × 1.2 × 0.8 = $48 = 96% of $50. Confirmed."},"s2-ma-psda-06":{"concept":"The median is the middle value of an ordered data set — the value with equal counts of numbers below and above it. First line the numbers up smallest to largest, then find the center. With an odd count of values, the median is the single middle value (no averaging needed).","steps":["Put the scores in order: 12, 15, 15, 18, 20 (already ordered).","Count them: 5 values, which is odd.","The middle of 5 is the 3rd value.","The 3rd value is 15, so the median is 15, which is choice A."],"alt":"Pinch from both ends: cross off 12 and 20, leaving 15, 15, 18; cross off 15 and 18, leaving 15. The last survivor is the median, 15.","check":"Confirm balance: two scores (12, 15) are at or below the middle position and two (18, 20) above. Equal counts on each side, so 15 is the median."},"s2-ma-psda-07":{"concept":"When data comes in a frequency table, each value is repeated by its frequency. To find the mean you need the TOTAL of all data points (not just the distinct values), so you multiply each value by how many members had it, add those products, then divide by the total number of members. This weighted total correctly counts every member.","steps":["Multiply each “books read” value by its number of members: 0×3 = 0, 1×5 = 5, 2×7 = 14, 3×5 = 15.","Add the products to get total books: 0 + 5 + 14 + 15 = 34.","Confirm the member count: 3 + 5 + 7 + 5 = 20 members.","Divide: 34 ÷ 20 = 1.7 books per member, which is choice B."],"alt":"Estimate to eliminate choices: most members read 1 or 2 books, so the mean should sit between 1 and 2, a bit under 2 since three members read 0. That rules out 2.0 and points to something like 1.7. The exact division confirms 1.7.","check":"Reverse it: if the mean is 1.7 across 20 members, the total should be 1.7 × 20 = 34, matching the sum we computed. Confirmed."},"s2-ma-psda-08":{"concept":"The mean equals the sum of the values divided by the count. When one value is unknown, use the relationship in reverse: the sum MUST equal mean × count. Set the known sum-with-unknown equal to that required total, then solve the simple equation for the missing value. This “the pieces must add to the required total” idea is the key to any missing-data-point problem.","steps":["There are 4 numbers with mean 16, so the required total is 16 × 4 = 64.","Write the sum with the unknown: 8 + 14 + x + 22 = 64.","Add the known numbers: 8 + 14 + 22 = 44, so 44 + x = 64.","Subtract 44 from both sides: x = 64 − 44 = 20.","Enter 20."],"alt":"Compare each known value to the mean of 16: 8 is 8 below, 14 is 2 below, 22 is 6 above. Running total of deviations: −8 − 2 + 6 = −4, so the set is 4 short. To make the average exactly 16, x must be 4 ABOVE the mean: 16 + 4 = 20. The balancing view gives 20.","check":"Plug x = 20 back in: 8 + 14 + 20 + 22 = 64, and 64 ÷ 4 = 16, the given mean. It matches, so x = 20 is correct."},"s2-ma-psda-09":{"concept":"To estimate a value for a whole population fairly, a sample must be REPRESENTATIVE — every member should have an equal, unbiased chance of being included. Bias creeps in when the sampling method systematically favors one kind of member (early arrivers, drivers, volunteers), because those people tend to differ from the rest in exactly the thing being measured. A simple random sample from the complete roster is the gold standard for avoiding that bias.","steps":["The goal is an unbiased estimate of average commute time for ALL employees.","Reject “arrive before 7:00 a.m.” — early arrivers may have shorter or longer commutes, skewing the estimate.","Reject “only drivers” — it ignores employees who bus, bike, or walk, whose commute times differ.","Reject “volunteers from an online post” — self-selected responders are a biased, non-representative group.","Choose random selection from the full roster (B): it gives every employee an equal chance and represents the whole company."],"alt":"Ask of each option, “Does this leave anyone systematically out?” Early-arrivers, drivers-only, and volunteers each exclude or over-represent a subgroup tied to commute time. Only the full-roster random draw includes everyone fairly — so by elimination, B is the sound method.","check":"Reasonableness test: imagine the result. A random roster sample would include long AND short commuters in their true proportions, so its average reflects the real company average — exactly what an unbiased estimate should do. That confirms B."},"s2-ma-psda-10":{"concept":"Probability of an event is the number of favorable outcomes divided by the total number of equally likely outcomes, always a value between 0 and 1. The word “NOT” signals a complement: instead of counting the thing named, count everything else. Here “not green” just means red or blue.","steps":["Add up all the marbles to get the total: 4 + 6 + 10 = 20.","Count the “not green” marbles — the red and blue ones: 4 + 6 = 10.","Write the probability as favorable/total: 10/20.","Simplify by dividing top and bottom by 10: 10/20 = 1/2."],"alt":"Use the complement rule: P(not green) = 1 − P(green). Green is 10 out of 20, so P(green) = 10/20 = 1/2, and 1 − 1/2 = 1/2. Same answer, and it’s a good habit for harder “at least one” problems later.","check":"The two pieces must add to 1: P(green) + P(not green) = 1/2 + 1/2 = 1. That confirms the split is correct, so 1/2 is right."},"s3-ma-psda-01":{"concept":"A constant rate means the same amount happens every equal chunk of time. The cleanest way to handle rates is to find the “unit rate” — how much happens in exactly one unit (here, one minute) — then scale up. Pages and minutes stay in fixed proportion.","steps":["Find the unit rate: 24 pages √∑ 3 minutes = 8 pages per minute.","Multiply the unit rate by the new time: 8 pages/minute √ó 10 minutes.","Compute: 8 √ó 10 = 80 pages."],"alt":"Set up a proportion instead: 24/3 = x/10. Cross-multiply to get 3x = 240, so x = 80. Or notice 10 minutes is a bit more than 3 times 3 minutes, so the answer should be a bit more than 3 × 24 = 72 — and 80 fits.","check":"Check the rate holds: 80 pages √∑ 10 minutes = 8 pages per minute, matching the original 24 √∑ 3 = 8. Consistent, so 80 is correct."},"s3-ma-psda-02":{"concept":"A scale drawing keeps a fixed ratio between drawing length and real length. Because the ratio never changes, you can write two equal fractions (a proportion) and solve for the missing piece. The key is to keep the same quantities on the same level: drawing-cm on top, actual-m on the bottom, in both fractions.","steps":["Write the known ratio as drawing over actual: 2 cm / 5 m.","Set it equal to the unknown ratio for the 18 m wall: 2/5 = x/18.","Cross-multiply: 5 √ó x = 2 √ó 18, so 5x = 36.","Divide both sides by 5: x = 36 √∑ 5 = 7.2 centimeters."],"alt":"Find the scale as “cm per meter” first: 2 cm ÷ 5 m = 0.4 cm for every 1 m. Then 0.4 × 18 = 7.2 cm. This “unit rate” method avoids cross-multiplying if that feels shaky.","check":"Plug back in: does 2/5 equal 7.2/18? Compute 7.2/18 = 0.4 and 2/5 = 0.4. They match, so 7.2 is correct."},"s3-ma-psda-03":{"concept":"Speed is distance divided by time, but the units of the answer must match what’s requested. Here the given data is in kilometers and hours, but we need meters per second, so we convert. Remember two conversion facts: 1 km = 1000 m, and 1 hour = 3600 seconds (60 min × 60 s).","steps":["Find the speed in the given units: 108 km √∑ 1.5 h = 72 km/h.","Convert kilometers to meters (√ó 1000): 72 √ó 1000 = 72000 meters per hour.","Convert hours to seconds (√∑ 3600): 72000 √∑ 3600 = 20.","So the speed is 20 meters per second."],"alt":"Memorize the shortcut: to convert km/h to m/s, divide by 3.6 (because 1000/3600 = 1/3.6). Then 72 √∑ 3.6 = 20 m/s instantly. Great time-saver on test day.","check":"Reverse it: 20 m/s √ó 3.6 = 72 km/h, which matches 108 √∑ 1.5. The units and the number both check out, so 20 is correct."},"s3-ma-psda-04":{"concept":"When several identical machines work together, total output depends on three things multiplied: number of machines, hours worked, and the rate of one machine per hour. The trick is to first isolate that single-machine, single-hour rate (called a “machine-hour” rate), because it stays constant no matter how you change the machines or time.","steps":["Total machine-hours in the first case: 3 machines √ó 5 hours = 15 machine-hours.","Rate per machine-hour: 450 parts √∑ 15 = 30 parts per machine-hour.","New total machine-hours: 5 machines √ó 8 hours = 40 machine-hours.","Multiply by the rate: 40 √ó 30 = 1200 parts."],"alt":"Scale in two steps from 450. Going from 3 to 5 machines multiplies output by 5/3; going from 5 to 8 hours multiplies by 8/5. So 450 √ó (5/3) √ó (8/5) = 450 √ó 8/3 = 1200. The 5s cancel, which is a nice sanity signal.","check":"Verify the base rate is consistent: 1200 parts √∑ (5 machines √ó 8 hours) = 1200 √∑ 40 = 30 per machine-hour, matching the original 30. Correct."},"s3-ma-psda-05":{"concept":"“Percent” means “per hundred,” so 15% literally means 15 out of 100, or the decimal 0.15. The word “of” in these problems means multiply. So “15% of 60” translates directly to 0.15 × 60.","steps":["Convert the percent to a decimal: 15% = 15/100 = 0.15.","Translate “of” as multiply: 0.15 × 60.","Compute: 0.15 √ó 60 = 9."],"alt":"Use friendly pieces: 10% of 60 is 6, and 5% is half of that, 3. Add them: 6 + 3 = 9. Breaking a percent into 10% and 5% chunks lets you do many problems in your head.","check":"Reasonableness: 15% is a small slice, less than a quarter of 60 (which would be 15). Our answer 9 is comfortably below 15, so it makes sense. The trap answers 90 and 45 are far too big."},"s3-ma-psda-06":{"concept":"Percent increase measures how big a change is compared to where you started — not compared to the new value. The formula is (change ÷ original) × 100. The most common mistake is dividing by the new price; always divide by the ORIGINAL amount.","steps":["Find the change (increase): 50 − 40 = 10 dollars.","Divide by the original price, 40: 10 √∑ 40 = 0.25.","Convert to a percent by multiplying by 100: 0.25 √ó 100 = 25%."],"alt":"Think in fractions of the original: the price went up by 10 on a base of 40, and 10 is one-fourth of 40. One-fourth = 25%. No formula needed once you see 10 is a quarter of 40.","check":"Test it forward: increase 40 by 25% → 40 × 1.25 = 50. That lands exactly on the new price, confirming 25%. (Dividing by 50 instead would wrongly give 20%, the trap choice.)"},"s3-ma-psda-07":{"concept":"Percent changes are best handled as multipliers. A 20% increase multiplies by 1.20 (the original 100% plus 20%); a 20% decrease multiplies by 0.80 (100% minus 20%). The subtle point: a 20% drop after a 20% rise does NOT return you to the start, because the decrease acts on the larger, already-increased amount.","steps":["Apply the 20% increase: 50 √ó 1.20 = 60.","Apply the 20% decrease to the NEW value 60: 60 √ó 0.80 = 48.","The final value is 48 dollars."],"alt":"Combine the multipliers first: 1.20 √ó 0.80 = 0.96, meaning the stock ends at 96% of its start. Then 50 √ó 0.96 = 48. This shows why up-then-down by the same percent always loses a little (0.96 < 1).","check":"Sanity check the direction: because 0.96 is less than 1, the result must be just below the original 50 — and 48 is exactly 2 below. If you had gotten 50, you’d know something was wrong. So 48 is correct."},"s3-ma-psda-08":{"concept":"A discount is taken off the original price, so the sale price is what remains. A 30% discount means you pay 100% − 30% = 70% of the original. That gives an equation: 0.70 × (original) = sale price. You solve backward by dividing, since the original is bigger than the sale price.","steps":["Write what fraction of the original you actually pay: 100% − 30% = 70% = 0.70.","Set up the equation: 0.70 √ó p = 56, where p is the original price.","Solve for p by dividing both sides by 0.70: p = 56 √∑ 0.70.","Compute: 56 √∑ 0.70 = 80, so the original price was $80."],"alt":"Back-solve from the choices. Try $80: a 30% discount is 0.30 × 80 = 24 off, giving 80 − 24 = 56. That matches the sale price exactly, so $80 is confirmed without any division.","check":"Take 30% off $80: 80 √ó 0.70 = 56, the stated sale price. Correct. Note $72.80 is the trap you get if you wrongly SUBTRACT 30% from 56 instead of dividing."},"s3-ma-psda-09":{"concept":"The median is the middle value of a data set once the numbers are lined up in order — it splits the data into a lower half and an upper half. If there is an odd number of values, the median is simply the single value in the exact center. Median is not the same as mean (average); the median only cares about position, not size.","steps":["Confirm the data is in increasing order: 4, 7, 7, 10, 14. It is.","Count the values: there are 5, an odd amount.","The middle position of 5 values is the 3rd one (two below it, two above it).","The 3rd value is 7, so the median is 7."],"alt":"“Cross off” from both ends: remove 4 and 14 (the outer pair), then 7 and 10 (the next pair). The single number left standing in the middle is 7. This pairing-off trick works for any odd-length list.","check":"A valid median should have equally many values on each side: 4 and 7 sit below 7, and 10 and 14 sit above — two on each side. Balanced, so 7 is correct. (8.4 is the mean, a classic distractor.)"},"s3-ma-psda-10":{"concept":"The mean (average) is the total of all values divided by how many values there are. When data comes in a frequency table, each score stands for several students, so you must weight each score by how many students earned it before adding — this is a weighted average. Adding the “Number of students” column gives you how many values there are in total.","steps":["Multiply each score by its frequency: 6√ó2 = 12, 7√ó3 = 21, 8√ó4 = 32, 9√ó1 = 9.","Add those products to get the total of all scores: 12 + 21 + 32 + 9 = 74.","Add the frequencies to get the number of students: 2 + 3 + 4 + 1 = 10.","Divide total by count: 74 √∑ 10 = 7.4."],"alt":"Estimate to eliminate wrong choices: the scores run from 6 to 9, and the most common score is 8 (4 students), but plenty scored 6 and 7. So the mean should sit a little below the midpoint 7.5 — 7.4 fits, while 8 is clearly too high.","check":"The mean must land between the smallest and largest scores (6 and 9), and 7.4 does. Recount the weighted sum 74 √∑ 10 = 7.4. Correct."},"s3-ma-psda-11":{"concept":"This tests how an outlier (an unusually extreme value) affects the mean versus the median. The mean uses every value’s actual size, so a huge value like 60 drags it upward strongly. The median only depends on position, so adding one number barely shifts it. Comparing the two increases shows why the median is called “resistant” to outliers.","steps":["Old sum = mean √ó count = 15 √ó 5 = 75. New sum = 75 + 60 = 135.","New mean = 135 ÷ 6 = 22.5, so the mean increases by 22.5 − 15 = 7.5.","New ordered list: 12, 14, 15, 16, 18, 60 — now 6 values, so the median is the average of the middle two.","New median = (15 + 16)/2 = 15.5, an increase of 15.5 − 15 = 0.5.","Compare: mean rose 7.5, median rose only 0.5, so the mean increases more, by 7.5."],"alt":"Reason qualitatively first: 60 is far above the rest, and only the mean “feels” its full size, so the mean must jump more than the median — eliminating both “median” choices immediately. Then just compute the mean’s increase, 7.5, to lock in the answer.","check":"Re-verify the new mean: 135 ÷ 6 = 22.5 ✓, and 22.5 − 15 = 7.5 ✓. The median move (0.5) is tiny by comparison, confirming “the mean, by 7.5.”"},"s3-ma-psda-12":{"concept":"A two-way table sorts people by two categories at once. A “conditional” question like “of the adults who prefer tea, what fraction are female” restricts you to only the tea group — that becomes your new whole. So the denominator is the tea total, not the grand total of 150.","steps":["Identify the condition: we only care about tea drinkers, so use the Tea column.","Find the tea total (the bottom of the Tea column): 80 adults.","Find the female tea drinkers (Female row, Tea column): 60.","Form the fraction favorable/restricted-total: 60/80, then simplify by dividing by 20: 3/4."],"alt":"Compare male vs female within tea: 20 males and 60 females prefer tea, a 20 : 60 = 1 : 3 ratio. Out of every 4 tea drinkers, 3 are female, giving 3/4 directly.","check":"The male fraction should complete the whole: males are 20/80 = 1/4, and 1/4 + 3/4 = 1 (the entire tea group). Balanced, so 3/4 is correct. Using 150 as the denominator (giving 60/150 = 2/5) would be the classic mistake."},"s3-ma-psda-13":{"concept":"Probability of a simple event is favorable outcomes over total outcomes, when every marble is equally likely to be picked. First you need the total number of marbles, then how many meet the condition (green). Then simplify the fraction.","steps":["Add all marbles for the total: 3 + 5 + 2 = 10.","Count the green marbles: 2.","Write favorable/total: 2/10.","Simplify by dividing top and bottom by 2: 2/10 = 1/5."],"alt":"Note that answer 2/8 is a trap — it forgets to include the green marbles in the total or miscounts. The correct denominator must be ALL 10 marbles. Since 2 out of 10 is one-fifth, 1/5 is right.","check":"Reasonableness: green is the rarest color (only 2 of 10), so its probability should be small — 1/5 = 0.2 is indeed small, while 1/2 would wrongly suggest half the marbles are green. So 1/5 is correct."},"s3-ma-psda-14":{"concept":"The word “and” here means both conditions must hold at once — Grade 10 AND no sport — which points to a single cell inside the table (the intersection of that row and column). Because this is a plain random pick from all students, the denominator is the grand total, 100.","steps":["Locate the cell where Grade 10 meets “No sport”: 35 students.","Use the grand total as the denominator: 100 students.","Write the probability: 35/100.","Simplify by dividing top and bottom by 5: 35/100 = 7/20."],"alt":"Convert to a decimal to sanity-check: 35 out of 100 is exactly 0.35, and 7/20 = 0.35 too. The trap 35/60 uses only the Grade 10 row as the total — that would answer a different, conditional question.","check":"Simplify carefully: 35/100 ÷ 5/5 = 7/20 ✓. And 7/20 = 0.35, matching 35/100. Because the pick is from all 100 students, the denominator 100 is right, confirming 7/20."},"s3-ma-psda-15":{"concept":"“Independent” means one day’s weather doesn’t affect another’s. For independent events happening together, you multiply their probabilities. “Rains on neither day” means it does NOT rain on day 1 and does NOT rain on day 2, so first find the chance of no rain on a single day using the complement (1 minus the rain chance), then multiply the two days.","steps":["Probability of no rain on one day = 1 − 0.4 = 0.6.","Both days must be dry, and days are independent, so multiply: 0.6 √ó 0.6.","Compute: 0.6 √ó 0.6 = 0.36.","As a fraction: 0.6 = 3/5, and (3/5)² = 9/25, which equals 0.36."],"alt":"List the four equally-weighted-by-probability day combos (rain/rain, rain/dry, dry/rain, dry/dry). Only dry/dry counts, with probability 0.6 √ó 0.6 = 0.36. Seeing it as one of the four outcomes reinforces why you multiply.","check":"All four two-day outcomes must total 1: 0.16 (both rain) + 0.24 + 0.24 + 0.36 = 1.00 ✓. The “neither” case is 0.36, and since dry is more likely than rain each day, the both-dry case should be the largest — which it is. Correct."},"ma-geo-01":{"concept":"A triangle’s area is half of the rectangle you’d get by “doubling” the triangle — that’s why the formula is Area = ½ × base × height. The base is any side you choose, and the height is the straight-up (perpendicular) distance from that base to the opposite corner. The ½ is essential; forgetting it doubles your answer.","steps":["Write the formula: Area = ½ × base × height.","Substitute base = 10 and height = 6: Area = ½ × 10 × 6.","Multiply base √ó height first: 10 √ó 6 = 60.","Take half: ½ × 60 = 30."],"alt":"Picture a 10-by-6 rectangle, area 60. The triangle is exactly half of it, so 60 √∑ 2 = 30. The trap answer 60 is what you get if you forget to halve.","check":"Units and reasonableness: the triangle must be smaller than the full 60 rectangle, and 30 is exactly half — sensible. Recompute ½ × 10 × 6 = 30 ✓."},"ma-geo-02":{"concept":"A cylinder is like a stack of identical circles. Its volume is the area of the circular base times how tall the stack is: V = πr²h, where r is the radius and h the height. The r² comes from the circle’s area formula πr²; a common slip is squaring the height or forgetting to square r.","steps":["Write the formula: V = π × r² × h.","Substitute r = 3 and h = 10: V = π × 3² × 10.","Square the radius: 3² = 9.","Multiply the rest: 9 × 10 = 90, so V = 90π."],"alt":"Compute the base area and stack it: base circle area = π(3)² = 9π, and 10 of those stacked gives 9π × 10 = 90π. The trap 30π comes from using 3 instead of 3².","check":"Confirm each factor: r² = 9 ✓, times h = 10 gives 90, times π gives 90π ✓. Since r is squared but h is not, the radius should carry more weight — the setup is right, so 90π is correct."},"ma-geo-03":{"concept":"A cube has all edges the same length s, and its volume fills space in three directions, so V = s × s × s = s³. To reverse this — find the edge from the volume — you undo the cubing with a cube root: s = ∛V. The cube root asks “what number multiplied by itself three times gives this?”","steps":["Write the volume formula: V = s³.","Substitute the known volume: s³ = 64.","Take the cube root of both sides: s = ∛64.","Find the number whose cube is 64: 4 √ó 4 √ó 4 = 64, so s = 4."],"alt":"Guess-and-check small whole numbers: 3³ = 27 (too small), 4³ = 64 (exact), 5³ = 125 (too big). Since 4³ hits 64 perfectly, the edge is 4.","check":"Cube your answer to return to the start: 4³ = 4 × 4 × 4 = 64, matching the given volume. Correct."},"ma-geo-04":{"concept":"The three interior angles of any triangle always add up to exactly 180° — this is one of geometry’s most reliable rules. So if you know two angles, the third is just whatever is left after subtracting both from 180.","steps":["Write the rule: angle1 + angle2 + angle3 = 180°.","Substitute the two known angles: 50 + 60 + angle3 = 180.","Add the known angles: 50 + 60 = 110.","Subtract from 180: 180 − 110 = 70°."],"alt":"Add the two given angles first (50 + 60 = 110), then ask “how far to 180?” — the gap is 70. Same result, framed as “filling up to 180.”","check":"Add all three back together: 50 + 60 + 70 = 180 ✓. Since they sum to exactly 180°, 70° is correct."},"ma-geo-05":{"concept":"A “linear pair” is two angles that sit side by side along a straight line — together they form a straight angle, which measures 180°. Angles that add to 180° are called supplementary. So the partner of a linear pair is 180° minus the given angle. (The parallel-lines detail is a distractor here; the linear-pair rule alone answers it.)","steps":["Recognize that a linear pair lies on a straight line, totaling 180°.","Write the relationship: 110 + x = 180.","Solve for x: x = 180 − 110.","Compute: 180 − 110 = 70°."],"alt":"Visualize a straight line split by one ray into two angles. If one opening is the wide 110°, the leftover must be the smaller 70° to complete the flat 180°. The 110° trap answer is the angle EQUAL to the given one, not its linear-pair partner.","check":"The pair must total a straight angle: 110 + 70 = 180 ✓. And 70° is acute, which matches “the smaller piece of a straight line next to a 110° angle.” Correct."},"ma-geo-06":{"concept":"An isosceles triangle has two equal sides, and the two angles opposite those equal sides — the base angles — are also equal. The third angle is the vertex angle. Since all three still sum to 180°, the two base angles share whatever is left after removing the vertex angle, split evenly.","steps":["Subtract the vertex angle from 180° to find what the base angles share: 180 − 40 = 140°.","The two base angles are equal, so split the 140° in half.","Divide: 140 ÷ 2 = 70°.","Each base angle measures 70°."],"alt":"Set up with a variable: let each base angle be x. Then 40 + x + x = 180, so 2x = 140 and x = 70. The equation makes the “split evenly” step explicit.","check":"Add all three angles: 40 + 70 + 70 = 180 ✓. Two equal base angles (70 each) plus the 40° vertex sum correctly, so 70° is right."},"ma-geo-07":{"concept":"In a right triangle, the two shorter sides meeting at the right angle are the legs, and the longest side opposite the right angle is the hypotenuse. The Pythagorean theorem ties them together: leg² + leg² = hypotenuse², or a² + b² = c². To find the hypotenuse, add the squares of the legs and take the square root.","steps":["Write the theorem: a² + b² = c², with legs a = 3, b = 4.","Square the legs: 3² = 9 and 4² = 16.","Add them: 9 + 16 = 25 = c².","Take the square root: c = √25 = 5."],"alt":"Recognize the famous 3-4-5 right triangle — one of the most common Pythagorean triples on the SAT. Whenever you see legs 3 and 4, the hypotenuse is 5 with no calculation. The trap 7 comes from just adding 3 + 4.","check":"Plug back into the theorem: 3² + 4² = 9 + 16 = 25, and 5² = 25 ✓. Also the hypotenuse (5) should be the longest side, longer than both legs — it is. Correct."},"ma-geo-08":{"concept":"The Pythagorean theorem a² + b² = c² works in reverse too: if you know the hypotenuse (c, the longest side) and one leg, you find the other leg by subtracting. Rearranged, leg² = hypotenuse² − knownleg². You subtract because the hypotenuse squared already contains both legs’ squares.","steps":["Write the theorem with c = 13 (hypotenuse), one leg = 5, other leg = b: 5² + b² = 13².","Square the known values: 5² = 25 and 13² = 169.","Isolate b² by subtracting: b² = 169 − 25 = 144.","Take the square root: b = √144 = 12."],"alt":"Recognize the 5-12-13 Pythagorean triple — another SAT favorite. Given a hypotenuse 13 and leg 5, the missing leg is 12 instantly. (Be careful: subtract the squares, not the numbers — 13 − 5 = 8 is a trap.)","check":"Verify all three fit: 5² + 12² = 25 + 144 = 169 = 13² ✓. The leg 12 is shorter than the hypotenuse 13, as it must be. Correct."},"ma-geo-09":{"concept":"Trigonometry connects an angle in a right triangle to ratios of its sides. The sine of an angle θ is the length of the side OPPOSITE the angle divided by the hypotenuse (the longest side). A memory aid is SOH: Sine = Opposite over Hypotenuse. Because the opposite side is always shorter than the hypotenuse, sine is always between 0 and 1.","steps":["Recall the definition: sin θ = opposite / hypotenuse.","Identify the parts: opposite = 6, hypotenuse = 10.","Substitute: sin θ = 6 / 10.","Simplify: 6/10 = 0.6."],"alt":"Eliminate impossible choices first: sine can never exceed 1, so 1.67 is out immediately. Between the rest, opposite/hypotenuse = 6/10 lands on 0.6. The 0.8 trap is actually the cosine (adjacent side 8 over 10).","check":"Sanity range: 0.6 is between 0 and 1, as every sine must be ✓. And 6/10 reduces to 0.6 exactly. Correct."},"ma-geo-10":{"concept":"A circle’s area — the space inside it — is given by A = πr², where r is the radius (the distance from the center to the edge). The radius is squared, so doubling the radius quadruples the area. Don’t confuse this with circumference (2πr), which uses r to the first power.","steps":["Write the area formula: A = π × r².","Substitute r = 5: A = π × 5².","Square the radius: 5² = 25.","So A = 25π."],"alt":"Watch the trap 10π — that’s the circumference (2π × 5), not the area. Area needs the radius SQUARED, giving 25π. Keeping “area = square the radius” in mind separates the two formulas.","check":"Confirm the squaring: 5² = 25, times π gives 25π ✓. Since area grows with r², a radius of 5 giving 25π (and 100π would need radius 10) is consistent. Correct."},"ma-geo-11":{"concept":"The circumference is the distance all the way around the outside of a circle — its ‘perimeter.’ It is always exactly 2π times the radius, written C = 2πr, because π (≈ 3.14) is the fixed number of times a diameter (which is 2 radii) wraps around the circle. Since C = 2πr is an equation, if you know C you can solve backward for r.","steps":["Write the formula: C = 2πr.","Substitute the given circumference: 12π = 2πr.","Divide both sides by 2π to isolate r: (12π)/(2π) = r.","The π cancels and 12/2 = 6, so r = 6."],"alt":"Reason without algebra: circumference 12π means the ‘2r’ part must equal 12, because C = 2πr = 12π only when 2r = 12. If 2r = 12, then r = 6. This is a quick way to strip off the π and just match the numbers.","check":"Plug r = 6 back in: 2π(6) = 12π, which matches the given circumference exactly. Correct."},"s2-ma-geo-01":{"concept":"Area measures how much flat space a shape covers, counted in unit squares (here, square centimeters). For a rectangle, you can imagine filling it with a grid of 1×1 squares: the length tells you how many squares fit in each row, and the width tells you how many rows there are. Multiplying gives the total count, so Area = length × width.","steps":["Write the formula: Area = length × width.","Substitute: Area = 12 cm × 5 cm.","Multiply: 12 × 5 = 60.","Attach square units: 60 cm². This is choice C."],"alt":"Picture the grid literally: 5 rows with 12 little squares in each row. Count by twelves: 12, 24, 36, 48, 60. You land on 60 squares — the same answer, confirming the multiplication.","check":"Notice 17 (choice A) is just 12 + 5, the mistake of adding instead of multiplying, so it is a trap. 60 cm² is the only choice from length × width, and the unit cm² correctly shows it is an area."},"s2-ma-geo-02":{"concept":"A triangle is exactly half of a rectangle (or parallelogram) that has the same base and height. If you took a rectangle of base × height and cut it along a diagonal, you would get two identical triangles. That is why the triangle area formula is Area = ½ × base × height. The height must be the straight-up (perpendicular) distance from the base to the opposite point, not a slanted side.","steps":["Write the formula: Area = ½ × base × height.","Substitute: Area = ½ × 14 × 9.","Multiply base × height first: 14 × 9 = 126.","Take half: 126 ÷ 2 = 63.","Attach units: 63 in². This is choice B."],"alt":"Halve first to make the arithmetic easier: half of 14 is 7, then 7 × 9 = 63. Splitting the ½ onto the even number (14) avoids dealing with a fraction later and gives the same 63 in².","check":"The full rectangle would be 14 × 9 = 126 in² (choice C — the trap for forgetting the ½). Our triangle is half of that: 126 ÷ 2 = 63 in². Reasonable and matches."},"s2-ma-geo-03":{"concept":"Volume measures how much space a solid fills, in cubic units. A cylinder is like a stack of identical circular pancakes: each circular slice has area πr², and stacking them to a height h multiplies that area by h. So Volume = πr²h. ‘In terms of π’ means keep π as a symbol instead of multiplying by 3.14 — the answer stays exact.","steps":["Write the formula: V = πr²h.","Substitute r = 3 and h = 10: V = π × 3² × 10.","Square the radius: 3² = 9.","Multiply the numbers: 9 × 10 = 90, so V = 90π.","The question asks only for the coefficient of π, which is 90."],"alt":"Think in layers: one circular layer has area π × 3² = 9π. There are 10 units of height, so ten such layers give 10 × 9π = 90π. The coefficient is 90.","check":"Order-of-operations sanity check: you must square r before multiplying. If someone did (3 × 10) = 30 then squared, they would get the wrong answer. Doing 3² = 9 first, then ×10, gives 90 — the intended result."},"s2-ma-geo-04":{"concept":"The three interior angles of any triangle always add up to exactly 180°. This is a fixed rule — a straight line measures 180°, and if you tear off the three corners of any triangle and lay them side by side, they form a straight line. So if you know two angles, the third is just whatever is left over from 180°.","steps":["Write the rule: angle1 + angle2 + angle3 = 180°.","Substitute the known angles: 55° + 65° + third = 180°.","Add the two known angles: 55 + 65 = 120.","Subtract from 180: third = 180 − 120 = 60°. Thi
