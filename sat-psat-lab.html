s is choice B."],"alt":"Estimate for a sanity check: the two given angles (55° and 65°) are both fairly large and already use up 120°, leaving only 60° — a clearly smaller angle. Choice D (120°) is the sum of the two known angles, a classic trap; the leftover, not the sum, is the answer.","check":"Add all three: 55 + 65 + 60 = 180. It totals exactly 180°, so the three angles do form a valid triangle. Correct."},"s2-ma-geo-05":{"concept":"An isosceles triangle has two sides of equal length, and the two angles sitting opposite those equal sides (the base angles) are also equal to each other. The apex (vertex) angle is the odd one out at the top. Since all three angles still add to 180°, the two equal base angles must share whatever is left after removing the apex angle.","steps":["Total of all angles is 180°; subtract the apex angle: 180 − 40 = 140°.","This 140° is split equally between the two base angles.","Divide by 2: 140 ÷ 2 = 70°.","Each base angle is 70°. This is choice C."],"alt":"Set it up with a variable: let each base angle be x. Then x + x + 40 = 180, so 2x = 140 and x = 70°. Writing it as an equation makes the ‘two equal parts’ idea explicit.","check":"Add all three angles: 70 + 70 + 40 = 180. Perfect. Also note each base angle (70°) is larger than the apex (40°), which makes sense because the base angles sit opposite the longer equal sides."},"s2-ma-geo-06":{"concept":"When a straight line (a transversal) crosses two parallel lines, it creates eight angles with special relationships. Co-interior angles (also called same-side interior or consecutive interior angles) are the two angles on the same side of the transversal, between the two parallel lines. These two always add up to 180° — they are supplementary. So if you know one, subtract from 180° to get its partner.","steps":["Identify the relationship: co-interior angles are supplementary (sum to 180°).","Write it: 110° + co-interior = 180°.","Subtract: co-interior = 180 − 110 = 70°. This is choice B."],"alt":"Sanity-check by picturing the two lines: one angle is obtuse (110°, wider than a right angle) and it hugs the same side as its partner. Between parallel lines those same-side partners must ‘balance’ to a straight 180°, so the partner has to be the acute 70°. Choice C (110°) is the trap for confusing this with equal angle pairs.","check":"Add the pair: 110 + 70 = 180, confirming they are supplementary. Correct."},"s2-ma-geo-07":{"concept":"The Pythagorean theorem applies to right triangles (triangles with a 90° corner). It says the two shorter sides (the legs, which meet at the right angle) relate to the longest side (the hypotenuse, opposite the right angle) by a² + b² = c². This works because the areas of squares built on the two legs together equal the area of the square built on the hypotenuse.","steps":["Write the theorem: leg² + leg² = hypotenuse².","Substitute the legs: 9² + 12² = c².","Square each: 81 + 144 = c².","Add: 225 = c².","Take the square root: c = √225 = 15. This is choice A."],"alt":"Recognize the pattern: 9, 12, 15 is the well-known 3-4-5 right triangle multiplied by 3 (3×3=9, 4×3=12, 5×3=15). SAT problems love these ‘Pythagorean triples,’ so memorizing 3-4-5 and 5-12-13 lets you skip the arithmetic entirely.","check":"Verify 9² + 12² = 15²: 81 + 144 = 225 and 15² = 225. They match. Also, the hypotenuse (15) is longer than both legs, as it must be. Choice D (225) is the un-square-rooted trap; choice C (√63) comes from subtracting instead of adding."},"s2-ma-geo-08":{"concept":"The area of a circle — the flat space inside it — is A = πr², where r is the radius (the distance from the center to the edge). The r is squared because area is two-dimensional: doubling the radius quadruples the area. ‘In terms of π’ means leave π as a symbol for an exact answer.","steps":["Write the formula: A = πr².","Substitute r = 5: A = π × 5².","Square the radius: 5² = 25.","So A = 25π. This is choice B."],"alt":"Watch the classic trap: 10π (choice A) is 2 × 5, which is the circumference formula's coefficient (2πr), not area. Remember ‘area squares the radius’ — square first, so 5² = 25 gives 25π. Saying it aloud (‘pi r squared’) keeps you from just doubling.","check":"Rough numeric check: 25π ≈ 25 × 3.14 ≈ 78.5. A circle of radius 5 fits inside a 10×10 square (area 100) and fills most of it — 78.5 is a believable portion of 100. Reasonable."},"s2-ma-geo-09":{"concept":"A sector is a ‘pie slice’ of a circle — the region between two radii and the arc between them. Its size is a fraction of the whole circle, and that fraction equals the central angle divided by 360° (the full turn). So sector area = (angle/360) × full circle area. A 90° angle is one quarter of 360°, so it grabs one quarter of the circle.","steps":["Find the whole circle's area: A = πr² = π × 6² = 36π.","Find the fraction the sector takes: 90/360 = 1/4.","Multiply: (1/4) × 36π = 9π. This is choice B."],"alt":"Think in quarters directly: 90° is exactly a quarter-circle, and 36π ÷ 4 = 9π. Since a right angle is one of the four equal corners of a full turn, you can just divide the circle's area by 4.","check":"The sector must be smaller than the whole circle (36π) and, being a quarter, noticeably small — 9π fits. Multiply back: 9π × 4 = 36π rebuilds the full circle. Correct."},"s2-ma-geo-10":{"concept":"In a right triangle, ‘sine’ of an angle is a fixed ratio: sin(angle) = (side opposite the angle) ÷ (hypotenuse). The hypotenuse is the longest side, across from the right angle. A key fact worth memorizing: sin(30°) = 1/2. So the side opposite a 30° angle is always exactly half the hypotenuse — this is the special 30-60-90 triangle.","steps":["Write the ratio: sin(30°) = opposite ÷ hypotenuse.","Substitute the known hypotenuse: sin(30°) = opposite ÷ 10.","Use sin(30°) = 1/2: 1/2 = opposite ÷ 10.","Solve: opposite = 10 × (1/2) = 5. This is choice A."],"alt":"Use the 30-60-90 shortcut: its sides are in the ratio 1 : √3 : 2, where 2 is the hypotenuse and 1 is opposite the 30°. Here the hypotenuse 10 corresponds to the ‘2,’ so each ‘1’ unit is 5 — that is the side opposite 30°. No trig needed.","check":"The side opposite the smallest angle (30°) should be the shortest side, and 5 is indeed shorter than the hypotenuse 10 and shorter than the ≈8.66 side opposite 60°. Reasonable. Choice B (5√3 ≈ 8.66) is the side opposite 60°, a trap."},"s3-ma-geo-01":{"concept":"Area is the amount of flat surface a shape covers, measured in square units. For a rectangle, tile the inside with 1×1 squares: the length is how many squares fit across one row, and the width is how many rows stack up. Multiplying rows by squares-per-row gives the total, so Area = length × width.","steps":["Write the formula: Area = length × width.","Substitute: Area = 15 × 8.","Multiply: 15 × 8 = 120.","So the area is 120 square meters. This is choice B."],"alt":"Break the multiplication apart: 15 × 8 = (10 × 8) + (5 × 8) = 80 + 40 = 120. Splitting 15 into 10 + 5 makes the mental math easier and confirms 120.","check":"Choice A (46) is the perimeter-style mistake 2(15) + 2(8), and choice D (60) is unrelated — both traps. Only 120 comes from length × width, and 15 × 8 clearly lands near 120, so it is reasonable."},"s3-ma-geo-02":{"concept":"A cylinder's volume is the area of its circular base multiplied by its height, because you can think of it as many thin circular disks stacked up. The base is a circle of area πr², and stacking to height h gives V = πr²h. Keep the answer ‘in terms of π’ (leaving π as a symbol) for an exact value.","steps":["Write the formula: V = πr²h.","Substitute r = 4, h = 9: V = π × 4² × 9.","Square the radius first: 4² = 16.","Multiply: 16 × 9 = 144, so V = 144π cubic centimeters. This is choice B."],"alt":"One disk has area π × 4² = 16π. Stack 9 of them: 9 × 16π = 144π. Thinking of the height as ‘how many base-layers’ turns the volume into simple repeated addition.","check":"The common error is not squaring r (using 4 instead of 16), which would give 36π — that is exactly the trap choice A. Squaring the radius before multiplying by height gives 144π. Correct."},"s3-ma-geo-03":{"concept":"A trapezoid has two parallel sides of different lengths (the bases, b₁ and b₂) connected by two slanted sides. Its area formula, Area = ½(b₁ + b₂)h, works by averaging the two parallel sides — (b₁ + b₂)/2 gives the ‘typical’ width — and multiplying by the height h (the perpendicular distance between the parallel sides), just like a rectangle of that average width.","steps":["Write the formula: Area = ½(b₁ + b₂)h.","Substitute b₁ = 6, b₂ = 10, h = 5: Area = ½(6 + 10)(5).","Add the bases: 6 + 10 = 16.","Multiply and halve: ½ × 16 × 5 = 8 × 5 = 40. This is choice B."],"alt":"Use the ‘average width’ view: the two parallel sides average to (6 + 10)/2 = 8. Treat the shape like a rectangle 8 wide and 5 tall: 8 × 5 = 40. Same answer, and it makes the formula feel natural.","check":"The trapezoid's area should sit between the rectangle using the short base (6 × 5 = 30) and the one using the long base (10 × 5 = 50). 40 is right in the middle — perfectly reasonable."},"s3-ma-geo-04":{"concept":"A cone is like a cylinder that tapers to a point. It turns out a cone holds exactly one third of the cylinder with the same base and height — that is where the ⅓ comes from. So V = ⅓πr²h, where πr²h is the matching cylinder's volume.","steps":["Write the formula: V = ⅓πr²h.","Substitute r = 6, h = 14: V = ⅓ × π × 6² × 14.","Square the radius: 6² = 36.","Multiply the numbers: 36 × 14 = 504, giving ⅓ × 504π.","Take one third: 504 ÷ 3 = 168, so V = 168π cubic inches. This is choice B."],"alt":"Divide early to keep numbers small: since you need ⅓, split it onto the 6² term as (36 ÷ 3) = 12 first, then 12 × 14 = 168, giving 168π. Handling the ⅓ before multiplying avoids the big 504.","check":"The full cylinder would be πr²h = 504π (that is trap choice A). A cone is one third of that, and 504π ÷ 3 = 168π. The cone answer is correctly smaller than the cylinder. Correct."},"s3-ma-geo-05":{"concept":"Every triangle's three interior angles add up to exactly 180°, no matter its shape or size. This is a foundational rule of flat geometry — the three corners, placed together, always form a straight line (180°). So the third angle is simply 180° minus the two you already know.","steps":["Write the rule: angle1 + angle2 + angle3 = 180.","Substitute: 50 + 60 + third = 180.","Add the known angles: 50 + 60 = 110.","Subtract from 180: third = 180 − 110 = 70°."],"alt":"Count up instead of subtracting: from 110 you need to reach 180. 110 + 70 = 180, so the missing angle is 70. Counting up can feel safer than subtracting and gives the same result.","check":"Add all three to confirm they form a valid triangle: 50 + 60 + 70 = 180. Exactly 180°, so 70 is correct."},"s3-ma-geo-06":{"concept":"When a transversal crosses two parallel lines, co-interior angles (same-side interior angles) are the pair on the same side of the transversal and between the two lines. These always add to 180° — they are supplementary. This happens because the parallel lines force the angles to ‘complete’ a straight line together.","steps":["Identify the rule: co-interior angles are supplementary (sum to 180°).","Write it: 65° + co-interior = 180°.","Subtract: co-interior = 180 − 65 = 115°. This is choice B."],"alt":"Sanity check by size: 65° is acute (less than a right angle). Its same-side interior partner between parallel lines must ‘make up the difference’ to a straight line, so it should be obtuse — and 115° is the obtuse partner. Choice A (65°, equal) is the trap for confusing this with alternate or corresponding angles.","check":"Confirm supplementary: 65 + 115 = 180. Correct."},"s3-ma-geo-07":{"concept":"Similar triangles have the same shape but different sizes — one is a scaled copy of the other. Every pair of corresponding sides is enlarged (or shrunk) by the same number, called the scale factor. Find the scale factor from one matching pair, then apply it to any other side. Here AB matches DE, and BC matches EF.","steps":["Find the scale factor from the known matching pair AB→DE: 12 ÷ 4 = 3.","Every side of DEF is 3 times its match in ABC.","EF matches BC, so EF = BC × 3 = 6 × 3 = 18. This is choice B."],"alt":"Use a proportion: AB/DE = BC/EF, so 4/12 = 6/EF. Cross-multiply: 4 × EF = 12 × 6 = 72, giving EF = 72 ÷ 4 = 18. The proportion method is handy when the scale factor is not a whole number.","check":"Check consistency: 4→12 tripled, and 6→18 also tripled — the same factor of 3 for both pairs, as required for similar triangles. Choice D (72) is the un-divided cross-product trap; choice A (14) wrongly adds 12−4=8 as a difference. 18 is correct."},"s3-ma-geo-08":{"concept":"In an isosceles triangle the two equal sides make a symmetric shape, so the height dropped from the apex straight down to the base cuts the base exactly in half. That height forms a right angle with the base, creating a right triangle you can solve with the Pythagorean theorem (leg² + leg² = hypotenuse²). One equal side becomes the hypotenuse, and half the base is one leg.","steps":["The height bisects the base: half of 10 is 5, so one leg = 5.","The slanted equal side (13) is the hypotenuse of the right triangle.","Apply Pythagoras: height² + 5² = 13².","Compute: height² = 169 − 25 = 144.","Take the square root: height = √144 = 12. This is choice B."],"alt":"Recognize the 5-12-13 Pythagorean triple: with a hypotenuse of 13 and one leg of 5, the other leg is automatically 12. Memorizing 5-12-13 (alongside 3-4-5) lets you read off the height instantly.","check":"Verify 5² + 12² = 13²: 25 + 144 = 169 = 13². It holds. Also the height (12) is less than the slanted side (13), which must be true since the slant is the longest side. Choice A (√194) comes from adding instead of subtracting the squares — a trap."},"s3-ma-geo-09":{"concept":"The area inside a circle is A = πr², where r is the radius (center-to-edge distance). The radius is squared because area is a two-dimensional measure. Leaving the answer ‘in terms of π’ keeps it exact instead of turning it into a decimal.","steps":["Write the formula: A = πr².","Substitute r = 5: A = π × 5².","Square the radius: 5² = 25.","So A = 25π. This is choice B."],"alt":"Avoid the trap: choice A (10π) is 2 × 5, which belongs to circumference (2πr), not area. The memory phrase ‘pi r squared’ reminds you to square, giving 25π. Choice C (100π) squares the diameter (10) instead of the radius — another trap.","check":"Numeric reasonableness: 25π ≈ 78.5. A radius-5 circle sits inside a 10×10 box (area 100) and fills most of it, so ~78.5 makes sense. Correct."},"s3-ma-geo-10":{"concept":"An arc is a portion of the circle's edge. The whole edge (the circumference) is 2πr. An arc's length is the same fraction of the circumference as its central angle is of the full 360°. So arc length = (angle/360) × 2πr. The bigger the central angle, the longer the arc.","steps":["Find the circumference: C = 2πr = 2π × 9 = 18π.","Find the fraction: 40/360 = 1/9.","Multiply: (1/9) × 18π = 18π/9 = 2π. This is choice A."],"alt":"Since 40° is one ninth of 360° (because 360 ÷ 40 = 9), the arc is one ninth of the full circumference. 18π ÷ 9 = 2π. Turning the angle into a simple fraction first makes the final step a quick division.","check":"The arc must be much shorter than the whole 18π circumference, since 40° is a small slice — and 2π is indeed small. Multiply back: 2π × 9 = 18π rebuilds the full circumference. Correct."},"s3-ma-geo-11":{"concept":"A sector is a pie-slice region of a circle bounded by two radii and an arc. Its area is the same fraction of the whole circle's area as its central angle is of 360°. So sector area = (angle/360) × πr². A 90° angle is a quarter of the full 360°, so the slice is one quarter of the circle.","steps":["Find the whole circle's area: A = πr² = π × 8² = 64π.","Find the fraction: 90/360 = 1/4.","Multiply: (1/4) × 64π = 16π. This is choice B."],"alt":"A 90° sector is exactly a quarter-circle, so just divide the circle's area by 4: 64π ÷ 4 = 16π. Right angles are one of the four equal quarters of a full turn, so no fraction setup is needed.","check":"The sector must be smaller than the full circle (64π), and a quarter of it is 16π. Choice A (64π) forgets to take the fraction — a trap. Multiply back: 16π × 4 = 64π. Correct."},"s3-ma-geo-12":{"concept":"The central angle, the arc it cuts off, and the whole circle are all linked by the same fraction. An arc that is, say, one ninth of the total circumference is subtended by a central angle that is one ninth of 360°. So central angle = (arc length / circumference) × 360°. You do not even need the radius here.","steps":["Find the fraction of the circle the arc covers: 4π / 36π = 4/36 = 1/9.","The central angle is that same fraction of 360°.","Multiply: (1/9) × 360 = 40°. This is choice B."],"alt":"Set up a proportion: (arc)/(circumference) = (angle)/360. So 4π/36π = x/360, meaning x = 360 × (4/36) = 360 × (1/9) = 40°. The π cancels immediately, leaving clean numbers.","check":"Reverse it: a 40° central angle is 40/360 = 1/9 of the circle, and 1/9 of the 36π circumference is 4π — exactly the given arc. Consistent, so 40° is correct."},"s3-ma-geo-13":{"concept":"For a right triangle (one with a 90° corner), the Pythagorean theorem links the two legs (the sides forming the right angle) to the hypotenuse (the longest side, opposite the right angle): leg² + leg² = hypotenuse². It comes from the fact that squares built on the two legs have areas that add up to the square built on the hypotenuse.","steps":["Write the theorem: 6² + 8² = hypotenuse².","Square each leg: 36 + 64 = hypotenuse².","Add: 100 = hypotenuse².","Take the square root: hypotenuse = √100 = 10."],"alt":"Recognize the 3-4-5 pattern: 6, 8, 10 is the 3-4-5 triangle doubled (3×2, 4×2, 5×2). SAT problems reuse these triples constantly, so spotting 6-8-10 gives the hypotenuse instantly without computing.","check":"Verify 6² + 8² = 10²: 36 + 64 = 100 = 10². It checks out, and the hypotenuse (10) is longer than both legs, as it must be. Correct."},"s3-ma-geo-14":{"concept":"Sine is one of the three basic trig ratios in a right triangle. The memory aid SOH tells you: Sine = Opposite ÷ Hypotenuse. ‘Opposite’ means the side directly across from the angle you care about; the hypotenuse is the longest side, across from the right angle. So sin A is simply the length opposite angle A divided by the hypotenuse.","steps":["Recall SOH: sin A = opposite ÷ hypotenuse.","The side opposite angle A is 5; the hypotenuse is 13.","So sin A = 5/13. This is choice B."],"alt":"Identify the triangle first: with a hypotenuse 13 and one leg 5, this is the 5-12-13 triple, so the other leg is 12. That lets you double-check every ratio at once — sin A = 5/13, cos A = 12/13 — and confirms 5/13 pairs with the opposite side. Choice A (12/13) is the trap using the wrong leg.","check":"Sine must be less than 1 for an acute angle, because the opposite side is always shorter than the hypotenuse. 5/13 ≈ 0.38, safely under 1. Choice C (13/5) is bigger than 1 and impossible for a sine. 5/13 is correct."},"s3-ma-geo-15":{"concept":"In any right triangle, the two acute angles must add to 90°, because the three angles total 180° and one of them is already the 90° right angle. Angles that add to 90° are called complementary. There is a beautiful ‘cofunction’ relationship: the sine of an angle equals the cosine of its complement, so sin A = cos(90° − A) = cos B when A + B = 90°.","steps":["The acute angles satisfy A + B = 90°, so B = 90° − A.","Apply the cofunction identity: cos B = cos(90° − A) = sin A.","Since sin A = 0.6, it follows that cos B = 0.6. This is choice A."],"alt":"Build a concrete triangle: sin A = 0.6 = 3/5 fits a 3-4-5 triangle where the side opposite A is 3 and the hypotenuse is 5. For angle B, the side adjacent to B is that same side of length 3, so cos B = adjacent/hypotenuse = 3/5 = 0.6. Same answer, seen directly.","check":"In the 3-4-5 triangle, sin A = 3/5 and cos B = 3/5 — they match, confirming sin A = cos B. Choice B (0.8) is cos A (=4/5), a trap for mixing up which angle. cos B = 0.6 is correct."}};

/* ---------------------------------------------------------------------------
   SPR numeric helpers
   ------------------------------------------------------------------------- */
function parseNum(raw){
  if(raw===null||raw===undefined) return null;
  let s=String(raw).trim().replace(/^\+/,'').replace(/\s+/g,'');
  if(s==='') return null;
  // percent sign tolerated
  s=s.replace(/%$/,'');
  // fraction a/b
  if(/^-?\d+\/\-?\d+$/.test(s)){
    const [a,b]=s.split('/').map(Number);
    if(b===0) return null;
    return a/b;
  }
  // mixed or plain decimal / integer (allow leading dot)
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return null;
}
function sprCorrect(input, accepted){
  const v=parseNum(input);
  if(v===null) return false;
  const inputHasFrac=String(input).includes('/');
  for(const a of accepted){
    const av=parseNum(a);
    if(av===null) continue;
    if(Math.abs(v-av) < 1e-6) return true;
    // Grid-rounding tolerance: the College Board grid accepts a rounded/truncated
    // decimal of a repeating value (e.g. .667 for 2/3). Only widen the tolerance
    // when a fraction is involved on either side, so distinct values stay rejected.
    if((inputHasFrac || String(a).includes('/')) && Math.abs(v-av) < 2e-3) return true;
  }
  return false;
}

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

  STATE.log.push({ id:q.id, sec:q.sec, dom:q.dom, skill:q.skill, dif:q.dif, correct:!!correct, ts:nowTs() });

/* ---------------------------------------------------------------------------
   MASTERY & SCORE PROJECTION
   mastery per domain = difficulty-weighted correct / difficulty-weighted seen
   ------------------------------------------------------------------------- */
function domainMastery(dom){
  const rows=STATE.log.filter(r=>r.dom===dom);
  if(!rows.length) return { m:0, seen:0, correct:0 };
  let wSum=0, wCorrect=0, correct=0;
  for(const r of rows){
    const w=CONFIG.difWeight[r.dif]||1;
    wSum+=w; if(r.correct){ wCorrect+=w; correct++; }
  }
  return { m: wSum? wCorrect/wSum : 0, seen:rows.length, correct };
}
function sectionMastery(sec){
  const doms=DOM_ORDER.filter(d=>CONFIG.domains[d].sec===sec);
  let wsum=0, msum=0;
  for(const d of doms){
    const wt=CONFIG.domains[d].wt;
    const {m,seen}=domainMastery(d);
    // unseen domains contribute 0 mastery but still weigh (so score starts near base)
    wsum+=wt; msum+=wt*m;
  }
  return wsum? msum/wsum : 0;
}
/* Friendlier projection: each domain's mastery is blended with an OPTIMISTIC
   PRIOR that fades as real evidence accumulates (a motivated-student prior of
   PSEUDO pseudo-answers at PRIOR accuracy). A concave curve makes early progress
   feel rewarding. A brand-new user sees a hopeful ~mid projection instead of the
   bare floor; strong work still climbs toward the top, weak work eases down. */
const PROJ_PRIOR=0.62, PROJ_PSEUDO=4, PROJ_CURVE=0.85;
function projectedSection(sec){
  const scale=CONFIG.scales[STATE.target];
  const [lo,hi]=scale.sec; const base=scale.base; const range=hi-lo;
  const doms=DOM_ORDER.filter(d=>CONFIG.domains[d].sec===sec);
  let wsum=0, msum=0;
  for(const d of doms){
    const wt=CONFIG.domains[d].wt;
    let seenW=0, corrW=0;
    for(const r of STATE.log){ if(r.dom!==d) continue; const w=CONFIG.difWeight[r.dif]||1; seenW+=w; if(r.correct) corrW+=w; }
    const mD=(corrW + PROJ_PRIOR*PROJ_PSEUDO)/(seenW + PROJ_PSEUDO);   // blended, prior fades with data
    wsum+=wt; msum+=wt*mD;
  }
  const m = wsum? msum/wsum : PROJ_PRIOR;
  const curved = Math.pow(m, PROJ_CURVE);
  const raw = base + curved*range;
  return Math.max(lo, Math.min(hi, Math.round(raw/10)*10));
}
function projectedTotal(){
  return projectedSection('rw')+projectedSection('math');
}
/* Aspirational goal score (settable), clamped to the current scale. */
function goalScore(){
  const sc=CONFIG.scales[STATE.target]; const [lo,hi]=sc.total;
  const g=Number(STATE.goal)||1600;
  return Math.max(lo+120, Math.min(hi, Math.round(g/10)*10));
}
/* Pure adaptive-exam helpers (unit-testable, no DOM) */
function routeDecision(correct, n){ return correct >= Math.ceil(n*0.6) ? 'hard' : 'easy'; }
function estimateSectionScore(target, route, correct, n){
  const scale=CONFIG.scales[target]; const [lo,hi]=scale.sec;
  const acc = n? correct/n : 0;
  const cap = route==='hard' ? 1.0 : 0.80;   // easier Module 2 caps the achievable top
  const eff = Math.min(acc, cap);
  return Math.max(lo, Math.min(hi, Math.round((lo + eff*(hi-lo))/10)*10));
}
function goalLine(total, goal, band){
  const gap=goal-total;
  if(gap<=0) return `Goal reached — you’re projecting ${band}! Aim even higher.`;
  if(gap<=60) return `Almost there — just ${gap} points to your ${goal} goal. 🔥`;
  if(gap<=180) return `On your way — ${gap} points to your ${goal} goal.`;
  return `${band} and climbing — ${gap} points to your ${goal} goal. Let’s go.`;
}
function scoreBand(total){
  const scale=CONFIG.scales[STATE.target];
  const [lo,hi]=scale.total;
  const pct=(total-lo)/(hi-lo);
  if(pct>=0.85) return 'Elite';
  if(pct>=0.68) return 'Competitive';
  if(pct>=0.5)  return 'On track';
  if(pct>=0.32) return 'Building';
  return 'Foundation';
}

function mistakeIds(){

  const latest={};

/* ---------------------------------------------------------------------------
   DOM / RENDER helpers  (guarded so smoke harness can stub)
   ------------------------------------------------------------------------- */
const hasDoc = (typeof document!=='undefined' && document && document.getElementById);
function el(id){ return hasDoc? document.getElementById(id):null; }
function h(html){ return html; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Self-contained LaTeX-subset → HTML renderer (no external library).
   Handles \(..\), \frac/\dfrac/\tfrac, \sqrt, ^{..}/^x superscripts, and common symbols.
   `isHTML`=true trusts existing markup (stims with tables); otherwise escapes < > &. */
function mathConv(s){
  s=s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,
      (m,a,b)=>`<span class="frac"><span class="fnum">${a}</span><span class="fden">${b}</span></span>`);
  s=s.replace(/\\sqrt\{([^{}]*)\}/g,(m,a)=>`&radic;<span class="rad">${a}</span>`);
  s=s.replace(/\^\{([^{}]*)\}/g,(m,a)=>`<sup>${a}</sup>`);
  s=s.replace(/\^(-?[0-9A-Za-z]+)/g,(m,a)=>`<sup>${a}</sup>`);
  s=s.replace(/\\cdot/g,'·').replace(/\\times/g,'×').replace(/\\div/g,'÷')
     .replace(/\\leq?\b/g,'≤').replace(/\\geq?\b/g,'≥').replace(/\\neq/g,'≠')
     .replace(/\\pm/g,'±').replace(/\\pi\b/g,'π').replace(/\\theta\b/g,'θ')
     .replace(/\\approx/g,'≈').replace(/\\,/g,'').replace(/\\!/g,'').replace(/\\ /g,' ');
  s=s.replace(/\\[()\[\]]/g,'');       // strip \( \) \[ \] delimiters
  return s;
}
function mathHTML(s,isHTML){
  if(s==null) return '';
  s=String(s);
  return isHTML ? mathConv(s) : mathConv(esc(s));
}
function mathText(s){ // plain-text-ish for previews: convert then strip tags
  return mathHTML(s,false).replace(/<[^>]+>/g,'').replace(/&radic;/g,'√').replace(/&[a-z]+;/g,' ').trim();
}

}

/* ---------------------------------------------------------------------------
   SEEDED RNG — deterministic, reproducible test forms
   ------------------------------------------------------------------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(arr, seed){ const a=arr.slice(); const rnd=mulberry32(seed>>>0); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------------------------------------------------------------------------
   HAPTICS — vibration patterns (Android/Chrome; iOS Safari has no web vibrate)
   ------------------------------------------------------------------------- */
const HAPTIC_PATTERNS={ correct:[45], wrong:[70,45,70], streak:[30,55,30,55,110], done:[20,35,20], tap:[18] };
function hapticsSupported(){ return typeof navigator!=='undefined' && typeof navigator.vibrate==='function'; }

/* iOS Safari has no navigator.vibrate, but iOS 17.4+ fires a system haptic
   when a native <input type="checkbox" switch> toggles. We keep one hidden,
   rendered (not display:none) switch and click its label inside the user
   gesture to produce a real taptic tap. Repeated taps differentiate events. */
let _hapSwitch=null;
function ensureHapSwitch(){
  if(_hapSwitch!==null) return _hapSwitch;
  if(!hasDoc || !document.body){ _hapSwitch=false; return false; }
  try{
    const label=document.createElement('label');
    label.setAttribute('aria-hidden','true');
    label.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;z-index:-1';
    const input=document.createElement('input');
    input.type='checkbox'; input.setAttribute('switch',''); input.tabIndex=-1;
    label.appendChild(input); document.body.appendChild(label);
    _hapSwitch={label,input};
  }catch(e){ _hapSwitch=false; }
  return _hapSwitch;
}
function iosHaptic(kind){
  const sw=ensureHapSwitch(); if(!sw) return;
  const taps = kind==='streak'?3 : kind==='wrong'?2 : 1;
  try{ for(let i=0;i<taps;i++) sw.label.click(); }catch(e){}
}
function haptic(kind){
  try{
    if(STATE.haptics===false) return;
    if(hapticsSupported()) navigator.vibrate(HAPTIC_PATTERNS[kind]||[20]);
    else iosHaptic(kind);   // iOS 17.4+ system-haptic fallback
  }catch(e){}
}

/* ---------------------------------------------------------------------------
   SOUND — WebAudio feedback (works everywhere incl. iPhone, offline, no files)
   correct = bright rising ding · wrong = soft low tone · streak = sparkle
   ------------------------------------------------------------------------- */
let _actx=null;
function audioCtx(){
  if(_actx) return _actx;
  try{ const AC=(typeof window!=='undefined')&&(window.AudioContext||window.webkitAudioContext); if(AC) _actx=new AC(); }catch(e){}
  return _actx;
}
const SOUND_SPECS={
  correct:[[660,0,0.10],[988,0.07,0.14]],
  streak :[[523,0,0.09],[659,0.08,0.09],[880,0.17,0.16]],
  wrong  :[[180,0,0.20]],
  tap    :[[520,0,0.035]],
  done   :[[587,0,0.10],[880,0.09,0.16]]
};
function sound(kind){
  try{
    if(STATE.sound===false) return;
    const ctx=audioCtx(); if(!ctx) return;
    if(ctx.state==='suspended' && ctx.resume) ctx.resume();
    const spec=SOUND_SPECS[kind]||SOUND_SPECS.tap;
    const t0=ctx.currentTime;
    for(const [freq,start,dur] of spec){
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type = (kind==='wrong')?'triangle':'sine';
      osc.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, t0+start);
      g.gain.exponentialRampToValueAtTime(0.25, t0+start+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+start+dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0+start); osc.stop(t0+start+dur+0.03);
    }
  }catch(e){}
}
/* Combined answer feedback: buzz (if supported) + sound. */
function feedback(kind){ haptic(kind); sound(kind); }

function gaugeSVG(value, lo, hi, mark){
  const size=230, cx=size/2, cy=size/2, r=92, sw=16;
  const start=135, sweep=270;                 // degrees
  const frac=Math.max(0,Math.min(1,(value-lo)/(hi-lo)));
  const toXY=(deg,rr)=>{ const a=(deg-90)*Math.PI/180; return [cx+(rr||r)*Math.cos(a), cy+(rr||r)*Math.sin(a)]; };
  const arc=(a0,a1)=>{
    const [x0,y0]=toXY(a0), [x1,y1]=toXY(a1);
    const large=(a1-a0)>180?1:0;
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  };
  const endDeg=start+sweep*frac;
  // ticks
  let ticks='';
  for(let i=0;i<=10;i++){
    const d=start+sweep*(i/10);
    const [x0,y0]=toXY(d,r+11);
    const [x1,y1]=toXY(d,r+3);
    ticks+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#2b4066" stroke-width="2"/>`;
  }
  // gold goal marker
  let marker='';
  if(mark!=null){
    const mf=Math.max(0,Math.min(1,(mark-lo)/(hi-lo)));
    const md=start+sweep*mf;
    const [gx0,gy0]=toXY(md,r-11), [gx1,gy1]=toXY(md,r+11);
    const [dotx,doty]=toXY(md,r+18);
    marker=`<line x1="${gx0.toFixed(1)}" y1="${gy0.toFixed(1)}" x2="${gx1.toFixed(1)}" y2="${gy1.toFixed(1)}" stroke="#f2c14e" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="${dotx.toFixed(1)}" cy="${doty.toFixed(1)}" r="4" fill="#f2c14e" stroke="#1a1405" stroke-width="1"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="220" height="220" role="img" aria-label="Projected score gauge with goal marker">
    <defs>
      <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1d6fce"/><stop offset=".55" stop-color="#2f9bff"/><stop offset="1" stop-color="#f2c14e"/>
      </linearGradient>
    </defs>
    ${ticks}
    <path d="${arc(start,start+sweep)}" fill="none" stroke="#16233b" stroke-width="${sw}" stroke-linecap="round"/>
    <path d="${arc(start,endDeg)}" fill="none" stroke="url(#gg)" stroke-width="${sw}" stroke-linecap="round"/>
    ${marker}
    <circle cx="${cx}" cy="${cy}" r="60" fill="#0b1526" stroke="#1c2c48"/>
  </svg>`;
}

/* ---------------------------------------------------------------------------
   QUESTION RUNNER (shared by practice / drills)
   opts: { queue:[q...], onDone, title, showPacing, secForPace }
   ------------------------------------------------------------------------- */
function runQueue(container, opts){
  const queue=opts.queue.slice();
  let idx=0, correctCount=0, runStreak=0;
  let timer=null, elapsed=0;

  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function startTimer(){
    if(!opts.showPacing) return;
    stopTimer(); elapsed=0;
    timer=setInterval(()=>{ elapsed++; paintClock(); }, 1000);
  }
  function paintClock(){
    const c=container.querySelector('#pace-clock'); if(!c) return;
    const mm=String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss=String(elapsed%60).padStart(2,'0');
    c.textContent=`${mm}:${ss}`;
    const budget=opts.secForPace||90;
    c.className='clock'+(elapsed>budget?' crit':elapsed>budget*0.75?' warn':'');
  }

  function paint(){
    if(idx>=queue.length){ stopTimer(); return finish(); }
    const q=queue[idx];
    const dom=CONFIG.domains[q.dom];
    const pacing = opts.showPacing? `
      <div class="pacing">
        <div><div class="pace-lbl">Time on item</div><div class="clock" id="pace-clock">00:00</div></div>
        <div class="progressbar"><i style="width:${(idx/queue.length*100).toFixed(0)}%"></i></div>
        <div class="pace-lbl">${idx+1} / ${queue.length}</div>
      </div>`:'';
    container.innerHTML=`
      <div class="runner">
        ${opts.title?`<div class="exam-hud"><h2>${opts.title}</h2>
           <button class="btn ghost sm" onclick="go('${opts.back||'practice'}')">Exit</button></div>`:''}
        ${pacing}
        <div class="qmeta">
          <span class="pill ${q.dif}">${({E:'Easy',M:'Medium',H:'Hard'})[q.dif]}</span>
          <span class="pill">${dom.name}</span>
          <span class="pill">${q.skill}</span>
          <span class="pill">${q.type==='spr'?'Student response':'Multiple choice'}</span>
        </div>
        ${q.stim?`<div class="stim">${mathHTML(q.stim,true)}</div>`:''}
        <div class="prompt">${mathHTML(q.prompt,false)}</div>
        <div id="answerzone"></div>
        <div id="expzone"></div>
      </div>`;
    renderAnswer(q);
    startTimer();
  }

  function renderAnswer(q){
    const zone=container.querySelector('#answerzone');
    if(q.type==='spr'){
      zone.innerHTML=`
        <input class="spr-in" id="spr" autocomplete="off" placeholder="answer" />
        <div class="spr-hint">Enter a number, fraction (like 3/4), or decimal. Press Enter or Submit.</div>
        <div class="spacer"></div>
        <button class="btn" id="submit">Submit</button>`;
      const inp=zone.querySelector('#spr');
      const submit=()=>grade(q, inp.value);
      zone.querySelector('#submit').onclick=submit;
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
      if(inp.focus) inp.focus();
    } else {
      zone.innerHTML=`<div class="choices">${q.choices.map((c,i)=>
        `<button class="choice" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${mathHTML(c,false)}</span></button>`).join('')}</div>`;
      zone.querySelectorAll('.choice').forEach(b=>b.onclick=()=>grade(q, Number(b.dataset.i)));
    }
  }

  function grade(q, raw){
    stopTimer();
    let correct;
    if(q.type==='spr'){ correct=sprCorrect(raw, q.ans); }
    else { correct = Number(raw)===q.ans; }
    recordAttempt(q, correct);
    if(correct){ correctCount++; runStreak++; } else { runStreak=0; }
    if(runStreak>(STATE.bestStreak||0)){ STATE.bestStreak=runStreak; saveState(); }
    feedback(correct ? (runStreak>=3?'streak':'correct') : 'wrong');
    // lock UI + mark
    const zone=container.querySelector('#answerzone');
    if(q.type==='spr'){
      zone.querySelectorAll('input,button').forEach(x=>x.disabled=true);
    } else {
      zone.querySelectorAll('.choice').forEach(b=>{
        const i=Number(b.dataset.i); b.disabled=true;
        if(i===q.ans) b.classList.add('correct');
        else if(i===Number(raw)) b.classList.add('wrong');
      });
    }
    showExplanation(q, correct, raw);
  }

  function showExplanation(q, correct, raw){
    const zone=container.querySelector('#expzone');
    const e=q.exp;
    const react = (STATE.coPilot!==false) ? vegaReact(correct, runStreak) : null;
    const vega = react ? vegaBubble(react.mood, react.line) : '';
    let traps='';
    if(q.type!=='spr' && e.traps){
      traps=`<div class="traps"><div class="eyebrow" style="margin-bottom:6px">Why the distractors tempt</div>${
        ['A','B','C','D'].map((L,i)=> e.traps[L]&&i!==q.ans?
          `<div class="t"><b>${L}</b> ${mathHTML(e.traps[L],false)}</div>`:'').join('')}</div>`;
    }
    zone.innerHTML=`
      <div class="exp ${correct?'ok':'no'}">
        <div class="band">${correct?'✓ Correct':'✗ Not quite'} — ${correct?'nice read':'let’s lock it in'}</div>
        <div class="body">
          ${vega}
          <p class="why">${mathHTML(e.why,false)}</p>
          ${traps}
          <div style="margin-top:10px">
            <span class="tag2">Skill · ${q.skill}</span>
            <span class="tag2">Difficulty · ${({E:'Easy',M:'Medium',H:'Hard'})[q.dif]}</span>
          </div>
          <div class="strat"><b>Strategy —</b> ${mathHTML(e.strat,false)}</div>
          ${deepHTML(q)}
          <div class="spacer"></div>
          <div class="btnrow">
            <button class="btn" id="next">${idx+1<queue.length?'Next question':'See results'}</button>
          </div>
        </div>
      </div>`;
    zone.querySelector('#next').onclick=()=>{ idx++; paint(); };
  }

  function finish(){
    if(opts.onDone) return opts.onDone({total:queue.length, correct:correctCount});
    const pct=queue.length? Math.round(100*correctCount/queue.length):0;
    container.innerHTML=`
      <div class="runner center card">
        <div class="eyebrow">Set complete</div>
        <div class="result-big">${correctCount}/${queue.length}</div>
        <p class="muted">${pct}% correct · logged to your mastery profile</p>
        <div class="btnrow" style="justify-content:center">
          <button class="btn gold" onclick="go('practice')">More practice</button>
          <button class="btn ghost" onclick="go('dashboard')">Dashboard</button>
          ${mistakeIds().length?`<button class="btn ghost" onclick="go('mistakes')">Review mistakes</button>`:''}
        </div>
      </div>`;
  }

  paint();
}

function pickN(pool,n){
  const a=pool.slice();
  // Fisher–Yates
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,Math.min(n,a.length));
}
function weightedDraw(sec,n){
  const doms=DOM_ORDER.filter(d=> sec==='all'? true : CONFIG.domains[d].sec===sec);
  const out=[];
  // proportional to blueprint weight
  const totalWt=doms.reduce((s,d)=>s+CONFIG.domains[d].wt,0);
  for(const d of doms){
    const share=Math.round(n*CONFIG.domains[d].wt/totalWt);
    out.push(...pickN(QUESTIONS.filter(q=>q.dom===d), share));
  }
  // top up / trim to n
  let pool=QUESTIONS.filter(q=> sec==='all'||CONFIG.domains[q.dom].sec===sec);
  while(out.length<n){ const extra=pickN(pool,1)[0]; if(!extra) break; if(!out.includes(extra)) out.push(extra); else break; }
  return pickN(out,n);
}
function startSkill(enc){
  const skill=decodeURIComponent(enc);
  const pool=QUESTIONS.filter(q=>q.skill===skill);
  if(!pool.length){ toast('No items yet for that skill'); return; }
  go('practice'); // ensure nav state
  const v=el('view');
  runQueue(v,{ queue:pickN(pool,Math.min(8,pool.length)), title:skill, showPacing:true,
    secForPace: pool[0].sec==='math'?95:75, back:'practice' });
}
function startMixed(sec,n){
  const q=weightedDraw(sec,n);
  if(!q.length){ toast('No questions available'); return; }
  const v=el('view');
  const title=sec==='all'?'Full mixed set':(CONFIG.sections[sec]+' mixed set');
  runQueue(v,{ queue:q, title, showPacing:true, secForPace: sec==='math'?95:75, back:'practice' });
}

function buildModule1(sec,n){
  // balanced difficulty sample
  const pool=QUESTIONS.filter(q=>q.sec===sec);
  const byDif=g=>pool.filter(q=>q.dif===g);
  let out=[...pickN(byDif('E'),Math.ceil(n/3)),...pickN(byDif('M'),Math.ceil(n/3)),...pickN(byDif('H'),Math.floor(n/3))];
  out=pickN(out,n);
  while(out.length<n){ const e=pickN(pool,1)[0]; if(!e||out.includes(e))break; out.push(e);}
  return out;
}
function buildModule2(sec,n,hard,exclude){
  const pool=QUESTIONS.filter(q=>q.sec===sec && !exclude.includes(q.id));
  let tier = hard? pool.filter(q=>q.dif==='H'||q.dif==='M') : pool.filter(q=>q.dif==='E'||q.dif==='M');
  let out=pickN(tier,n);
  while(out.length<n){ const e=pickN(pool,1)[0]; if(!e||out.includes(e))break; out.push(e);}
  return out;
}

function runModule(container, sec, queue, modNum, hard, onDone){

  function paint(){

function fillModule(sec,count,tier,exclude,seed,basePool){
  // tier: 'mix' | 'hard' | 'easy'  — recycle only if the pool is smaller than count.
  // seed: deterministic order when provided (stable forms); basePool: restrict to a
  // specific disjoint slice (used by named test forms so they never share items).
  let pool=(basePool||QUESTIONS.filter(q=>q.sec===sec)).slice();
  if(tier==='hard') pool=pool.filter(q=>q.dif!=='E').concat(pool);
  if(tier==='easy') pool=pool.filter(q=>q.dif!=='H').concat(pool);
  if(exclude&&exclude.length) pool=pool.filter(q=>!exclude.includes(q.id)).concat(pool.filter(q=>exclude.includes(q.id)));
  const shuffled = (seed!=null) ? seededShuffle(pool, seed) : pickN(pool,pool.length);
  const out=[];
  let i=0;
  while(out.length<count && shuffled.length){ out.push(shuffled[i%shuffled.length]); i++; }
  return out;
}
/* Partition each section into 5 disjoint form pools (round-robin over a seeded
   shuffle => even size and difficulty spread; stable across sessions). */
const FORM_SEED=20260721;
let _formPools={};
function formPools(sec){
  if(_formPools[sec]) return _formPools[sec];
  const shuffled=seededShuffle(QUESTIONS.filter(q=>q.sec===sec), FORM_SEED+(sec==='rw'?1:2));
  const parts=[[],[],[],[],[]];
  shuffled.forEach((q,i)=>parts[i%5].push(q));
  _formPools[sec]=parts; return parts;
}
function startFull(sec, form){
  const spec=FULL_SPEC[sec];
  const seedBase = form ? (form.i*131 + (sec==='rw'?7:19)) : null;
  const pool = form ? formPools(sec)[form.i] : null;   // disjoint slice per form
  const label = form ? `Form ${form.numeral} · ${form.name}` : 'Full-length';
  FULLRUN.sec=sec; FULLRUN.detail=[]; FULLRUN.formName=label;
  const m1=fillModule(sec,spec.modQ,'mix',[], seedBase, pool);
  runFullModule(el('view'), sec, m1, 1, false, (r1)=>{
    FULLRUN.detail.push(...r1.detail);
    const correct=r1.detail.filter(x=>x.correct).length;
    const hard=correct>=Math.ceil(spec.modQ*0.6);
    FULLRUN.route=hard?'hard':'easy';
    const m2=fillModule(sec,spec.modQ,hard?'hard':'easy',m1.map(q=>q.id), seedBase!=null?seedBase+53:null, pool);
    const v=el('view');
    v.innerHTML=`<div class="runner center card">
      <div class="eyebrow">${label} · Module 1 complete · ${correct}/${spec.modQ}</div>
      <p class="muted">Break. Module 2 is the <b style="color:${hard?'var(--hard)':'var(--easy)'}">${hard?'harder':'easier'}</b> route (${spec.minutes} min).</p>
      <div class="btnrow" style="justify-content:center"><button class="btn gold" id="c2">Begin Module 2</button></div>
    </div>`;
    v.querySelector('#c2').onclick=()=>runFullModule(v, sec, m2, 2, hard, (r2)=>{
      FULLRUN.detail.push(...r2.detail); fullResults(v);
    });
  });
}
function startForm(formIdx, sec){ startFull(sec, FORMS[formIdx]); }
function runFullModule(container, sec, queue, modNum, hard, onDone){
  const spec=FULL_SPEC[sec];
  let idx=0; const detail=[]; const answers=new Array(queue.length).fill(null);
  let remaining=spec.minutes*60; let timer=null;
  function stop(){ if(timer){clearInterval(timer);timer=null;} }
  function tick(){
    remaining--; paintClock();
    if(remaining<=0){ stop(); autoFinish(); }
  }
  function paintClock(){
    const c=container.querySelector('#fl-clock'); if(!c)return;
    const mm=String(Math.floor(remaining/60)).padStart(2,'0');
    const ss=String(remaining%60).padStart(2,'0');
    c.textContent=`${mm}:${ss}`;
    c.className='clock'+(remaining<60?' crit':remaining<300?' warn':'');
  }
  function autoFinish(){
    // grade whatever was answered
    queue.forEach((q,i)=>{
      const a=answers[i];
      let correct=false;
      if(a!=null){ correct = q.type==='spr'? sprCorrect(a,q.ans) : Number(a)===q.ans; recordAttempt(q,correct);}
      detail.push({q,correct,chosen:a,mod:modNum});
    });
    onDone({detail});
  }
  function paint(){
    const q=queue[idx];
    const modtag= modNum===1?`<span class="modtag">Module 1</span>`:`<span class="modtag ${hard?'hard':'easy'}">Module 2 · ${hard?'Harder':'Easier'}</span>`;
    container.innerHTML=`<div class="runner">
      <div class="exam-hud">
        <div>${modtag} <span class="modtag">${spec.label}</span></div>
        <div><span class="pace-lbl">Time left</span> <span class="clock" id="fl-clock">--:--</span></div>
      </div>
      <div class="progressbar" style="margin:10px 0 14px"><i style="width:${((idx+1)/queue.length*100).toFixed(0)}%"></i></div>
      <div class="qmeta"><span class="pill ${q.dif}">${({E:'Easy',M:'Medium',H:'Hard'})[q.dif]}</span>
        <span class="pill">${CONFIG.domains[q.dom].name}</span>
        <span class="pace-lbl">${idx+1} / ${queue.length}</span></div>
      ${q.stim?`<div class="stim">${mathHTML(q.stim,true)}</div>`:''}
      <div class="prompt">${mathHTML(q.prompt,false)}</div>
      <div id="az"></div>
      <div class="spacer"></div>
      <div class="btnrow">
        <button class="btn ghost sm" id="prev" ${idx===0?'disabled':''}>← Back</button>
        <button class="btn sm" id="next">${idx+1<queue.length?'Next →':'Finish module'}</button>
      </div>
    </div>`;
    const az=container.querySelector('#az');
    if(q.type==='spr'){
      az.innerHTML=`<input class="spr-in" id="spr" autocomplete="off" placeholder="answer" value="${answers[idx]!=null?esc(answers[idx]):''}"/>
        <div class="spr-hint">Number, fraction, or decimal.</div>`;
      az.querySelector('#spr').addEventListener('input',e=>answers[idx]=e.target.value);
    } else {
      az.innerHTML=`<div class="choices">${q.choices.map((c,i)=>
        `<button class="choice ${answers[idx]===i?'sel':''}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${mathHTML(c,false)}</span></button>`).join('')}</div>`;
      az.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ haptic('tap'); answers[idx]=Number(b.dataset.i); paint(); });
    }
    paintClock();
    container.querySelector('#prev').onclick=()=>{ if(idx>0){idx--;paint();} };
    container.querySelector('#next').onclick=()=>{ if(idx+1<queue.length){idx++;paint();} else { stop(); autoFinish(); } };
  }
  timer=setInterval(tick,1000);
  paint();
}

  ['Adaptive routing','Module 1 sets your ceiling', `
    <h3>How the branch works</h3>
    <ul><li>Module 1 is mixed difficulty. Your accuracy routes you to a <b>harder</b> or <b>easier</b> Module 2.</li>
    <li>The harder path is the only way to reach the top of the score range.</li>
    <li>There is <b>no wrong-answer penalty</b> — never leave a blank.</li></ul>
    <div class="ex">Treat Module 1 like it decides everything, because it does. Spend your freshest focus there and guess-with-elimination rather than skip.</div>`],
  ['Reading & Writing','Short-passage tactics', `
    <h3>One question, one job</h3>
    <ul><li><b>Read the question first</b> for Command-of-Evidence and Central-Idea items so you know what to hunt for.</li>
    <li><b>Words in Context:</b> cover the blank, predict your own word, then match.</li>
    <li><b>Transitions:</b> label the logical relationship (contrast, cause, example) before looking at choices.</li>
    <li>The answer must be supported <i>by the passage</i>, not by outside knowledge.</li></ul>
    <div class="ex">Wrong answers are usually true statements that don't answer <i>this</i> question, or half-right/half-wrong pairs.</div>`],
  ['Grammar rules','Conventions that repeat', `
    <h3>Boundaries &amp; sentence structure</h3>
    <ul><li>Independent + independent needs a period, semicolon, or comma-plus-FANBOYS.</li>
    <li>A semicolon works exactly where a period works.</li>
    <li>Non-essential information sits inside a matched pair of commas, dashes, or parentheses.</li>
    <li>Subject–verb agreement: find the true subject, ignore the interrupting phrase.</li>
    <li>Pronouns and modifiers must clearly point to one noun.</li></ul>
    <div class="ex">If two choices are grammatically identical, they're both wrong — the test never has two correct answers.</div>`],
  ['Algebra & functions','The 70% of Math', `
    <h3>Linear &amp; systems muscle memory</h3>
    <ul><li>Slope-intercept <b>y = mx + b</b>: m is rate, b is the starting value — read word problems straight into it.</li>
    <li>Systems: substitute when one variable is isolated; eliminate when coefficients line up.</li>
    <li>"No solution" = parallel lines (same slope, different intercept). "Infinite" = identical lines.</li>
    <li>For "in terms of," solve symbolically — don't plug numbers unless stuck.</li></ul>

    <li>Exponential growth/decay is repeated multiplication: y = a·bˣ.</li>

/* ---------------------------------------------------------------------------
   VIEW: ANALYTICS (longitudinal)
   ------------------------------------------------------------------------- */
function viewAnalytics(v){
  const hist=STATE.history.slice();
  // also derive a rolling projected-total series from the log
  const series=projectionSeries();
  const spark=series.length>1? sparkSVG(series):
    `<div class="empty">Answer more questions to chart your projected-score trend.</div>`;
  const runs=hist.length? hist.slice().reverse().map(hh=>`<div class="rev-item">
      <span class="rmark ok">${hh.est}</span>
      <div class="rq"><b>${CONFIG.sections[hh.sec]||hh.sec}</b> <span class="muted">${hh.kind==='full'?'full-length':'exam'} · ${hh.correct}/${hh.total} · ${hh.route} route</span></div>
    </div>`).join('') : `<div class="empty">No completed full-length runs yet.</div>`;

  // per-difficulty accuracy
  const dstat=['E','M','H'].map(d=>{
    const rows=STATE.log.filter(r=>r.dif===d);
    const acc=rows.length?Math.round(100*rows.filter(r=>r.correct).length/rows.length):0;
    return `<div class="k"><div class="v">${rows.length?acc+'%':'—'}</div><div class="l">${({E:'Easy',M:'Medium',H:'Hard'})[d]} acc</div></div>`;
  }).join('');

  v.innerHTML=`<div class="grid" style="margin-top:6px">
    <div class="card">
      <h2>Projected score over time</h2>
      <div class="sub">Rolling projection recomputed as you practice (last ${series.length} checkpoints).</div>
      <div class="chart-wrap">${spark}</div>
    </div>
    <div class="card">
      <h2>Accuracy by difficulty</h2>
      <div class="kpi" style="margin-top:12px">${dstat}</div>
    </div>
    <div class="card"><h2>Completed runs</h2><div class="sub">Full-length and exam estimates.</div>${runs}</div>
  </div>`;
}
function projectionSeries(){
  // recompute projected total at each 5-question checkpoint by replaying the log
  const log=STATE.log;
  if(log.length<2) return [];
  const saved=STATE.log;
  const out=[];
  const step=Math.max(1,Math.floor(log.length/24));
  for(let i=step;i<=log.length;i+=step){
    STATE.log=saved.slice(0,i);
    out.push(projectedTotal());
  }
  STATE.log=saved;
  return out;
}
function sparkSVG(series){
  const w=560,hgt=180,pad=28;
  const scale=CONFIG.scales[STATE.target];
  const lo=scale.total[0],hi=scale.total[1];
  const n=series.length;
  const x=i=>pad+(w-2*pad)*(i/(n-1));
  const y=val=>hgt-pad-(hgt-2*pad)*((val-lo)/(hi-lo));
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${pad},${hgt-pad} ${pts} ${(w-pad)},${hgt-pad}`;
  const grid=[0,.25,.5,.75,1].map(f=>{
    const yy=hgt-pad-(hgt-2*pad)*f; const val=Math.round(lo+f*(hi-lo));
    return `<line x1="${pad}" y1="${yy}" x2="${w-pad}" y2="${yy}" stroke="#1a2c48" stroke-width="1"/>
            <text x="4" y="${yy+3}" fill="#6d84a6" font-size="9">${val}</text>`;
  }).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none" role="img" aria-label="Score trend">
    <defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(47,155,255,.4)"/><stop offset="1" stop-color="rgba(47,155,255,0)"/></linearGradient></defs>
    ${grid}
    <polygon points="${area}" fill="url(#sp)"/>
    <polyline points="${pts}" fill="none" stroke="#2f9bff" stroke-width="2.5"/>
    ${series.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#f2c14e"/>`).join('')}
  </svg>`;
}

  }catch(e){ toast('Export not available here'); }
}

    const info=CONFIG.domains[d]; const {m,seen}=domainMastery(d);
    return `<div class="mastery-row"><div class="lbl">${info.name}<small>${(info.wt*100)|0}% wt</small></div>
      <div class="bar"><i style="width:${(m*100).toFixed(0)}%"></i></div>
      <div class="pct">${seen?(m*100).toFixed(0)+'%':'—'}</div></div>`;

  const runs=STATE.history.slice(-6).reverse().map(h=>`<tr><td>${CONFIG.sections[h.sec]||h.sec}</td>
