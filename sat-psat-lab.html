{"id":"s3-rw-craft-21","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"H","type":"mcq","stim":"<p><b>Text 1</b></p><p>Choreographers have long sought a way to write down dance as composers write music. Systems of symbols can now record every step, angle, and timing on paper, so a work can be revived decades later exactly as designed, long after its original dancers are gone.</p><p><b>Text 2</b></p><p>No notation, however detailed, captures the weight of a gesture or the breath behind a movement, Okafor insists. These qualities pass only from body to body, teacher to student. A dance preserved only on paper, she warns, is a skeleton without its living flesh.</p>","prompt":"Based on the texts, how would Okafor (Text 2) most likely characterize the method praised in Text 1?","choices":["As the only reliable way to keep a dance from being forgotten","As useless for recording even the basic sequence of steps","As valuable for recording steps but incapable of preserving a dance's living qualities","As superior to teaching dance directly from person to person"],"ans":2,"exp":{"why":"Okafor does not deny that notation records steps and timing, but she insists it misses weight, breath, and other living qualities that pass body to body. She would grant its usefulness for steps while faulting it for the rest.","traps":{"A":"She sees notation as insufficient, not the only way.","B":"She never claims it fails at recording steps.","C":"Correct: useful for steps, blind to living qualities.","D":"She favors person-to-person transmission over paper."},"skill":"Cross-Text Connections","strat":"Give a critic credit for what they concede before stating their objection."}},
{"id":"s3-rw-craft-22","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>The dandelion owes much of its success to seeds fitted with tiny parachutes of bristles. A single gust can carry them for miles, letting the plant ______ far beyond the parent's shadow and colonize any patch of bare soil it lands on.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["disperse","wither","germinate instantly","cluster"],"ans":0,"exp":{"why":"Seeds carried for miles to colonize distant bare soil describe spreading widely. 'Disperse' means to scatter over a wide area, matching 'far beyond the parent's shadow.'","traps":{"A":"Correct: scattering widely is dispersal.","B":"Wither means to shrivel, the opposite of thriving.","C":"Timing of sprouting is not the point; spread is.","D":"Cluster means to gather close, contradicting 'for miles.'"},"skill":"Words in Context","strat":"Let the phrase about distance decide between spreading and gathering."}},
{"id":"s3-rw-craft-23","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"E","type":"mcq","stim":"<p>Why does a bottle of water cost more at an airport than at a corner store? The answer is limited competition. Inside the security gates, only a handful of shops operate, and travelers cannot easily leave to buy elsewhere. With few sellers and a captive audience, prices climb.</p>","prompt":"Which choice best describes the structure of the text?","choices":["It poses a question and then explains the answer","It presents two opposing viewpoints on airport prices","It lists the steps for opening an airport shop","It describes a personal experience buying water"],"ans":0,"exp":{"why":"The passage opens with a direct question and immediately answers it, then explains the answer through limited competition and captive buyers. That is a question-and-answer structure.","traps":{"A":"Correct: a question followed by its explanation.","B":"Only one explanation is given, not two viewpoints.","C":"No procedure for opening a shop appears.","D":"There is no first-person anecdote."},"skill":"Text Structure & Purpose","strat":"A leading question usually signals a question-answer structure."}},
{"id":"s3-rw-craft-24","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>For over a thousand years, astronomers placed Earth at the center of the cosmos. To explain why planets sometimes appear to loop backward, they added smaller circles, called epicycles, onto the planets' orbits. With enough of these adjustments, the model predicted the sky with real accuracy.</p><p><b>Text 2</b></p><p>Placing the Sun at the center, later astronomers found, made the loops vanish as a natural consequence. The apparent backward motion was simply Earth overtaking a slower outer planet. One elegant idea replaced a tangle of added circles.</p>","prompt":"Based on the texts, the heliocentric model described in Text 2 improved on the model in Text 1 chiefly by","choices":["explaining backward planetary motion more simply, without added circles","making more accurate predictions than any earlier model could","proving that Earth does not move at all","abandoning the goal of predicting planetary positions"],"ans":0,"exp":{"why":"Text 1 notes the geocentric model was accurate but required many epicycles; Text 2 says the Sun-centered view made the loops vanish naturally, replacing a tangle of circles. The improvement is simplicity, not greater accuracy.","traps":{"A":"Correct: a simpler account of retrograde motion.","B":"Text 1 says the old model was already accurate.","C":"Text 2 relies on Earth moving, not standing still.","D":"The new model still predicts positions."},"skill":"Cross-Text Connections","strat":"Pinpoint the specific advantage the second text claims, not a generic 'better.'"}},
{"id":"s3-rw-craft-25","sec":"rw","dom":"craft","skill":"Words in Context","dif":"H","type":"mcq","stim":"<p>Gothic cathedral builders discovered that a pointed arch channels weight downward more efficiently than a rounded one. This let walls grow thinner and windows larger without collapse. The innovation proved so ______ that it spread across a continent within decades, reshaping how sacred spaces looked and felt.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["decorative","tentative","consequential","fragile"],"ans":2,"exp":{"why":"The innovation spread across a continent in decades and reshaped architecture, showing it had far-reaching effects. 'Consequential' means having important, wide-ranging consequences.","traps":{"A":"Decorative downplays the arch's structural impact.","B":"Tentative means hesitant, clashing with rapid spread.","C":"Correct: far-reaching influence fits 'consequential.'","D":"Fragile contradicts a load-bearing improvement."},"skill":"Words in Context","strat":"When effects are described as widespread, choose the word meaning far-reaching."}},
{"id":"s3-rw-craft-26","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>The wide, straight boulevards of many European capitals were not designed merely for beauty. In the nineteenth century, planners cut them through crowded medieval quarters partly to ease traffic and improve sanitation. But the avenues served another aim as well: broad, open streets were far harder for rebels to barricade than the narrow, twisting lanes they replaced.</p>","prompt":"Which choice best describes the main purpose of the text?","choices":["To argue that medieval streets were more beautiful than modern boulevards","To reveal that a familiar urban feature served practical and political aims beyond appearance","To trace the biography of a single city planner","To explain how to construct a stone barricade"],"ans":1,"exp":{"why":"The text says the boulevards were not just for beauty, then lists practical aims (traffic, sanitation) and a political one (thwarting barricades). Its purpose is to expose these hidden functions behind a familiar feature.","traps":{"A":"It makes no beauty comparison between street types.","B":"Correct: reveals practical and political aims beyond looks.","C":"No individual planner is profiled.","D":"It mentions barricades to make a point, not to instruct."},"skill":"Text Structure & Purpose","strat":"When a text says 'not merely X,' expect it to reveal the fuller set of purposes."}},
{"id":"s3-rw-craft-27","sec":"rw","dom":"craft","skill":"Cross-Text Connections","dif":"M","type":"mcq","stim":"<p><b>Text 1</b></p><p>Many old folktales, some scholars note, encode blunt practical warnings. Stories of children lost in the woods or lured by strangers taught the young, in an age before written rules, which behaviors could get them killed. The tales were survival manuals in disguise.</p><p><b>Text 2</b></p><p>Other researchers emphasize the inner work such stories perform. By facing witches and wolves within the safety of a story, a child rehearses fear and learns to master it. The value of the tale lies less in any literal lesson than in the emotional courage it builds.</p>","prompt":"Based on the texts, the two explanations of folktales differ mainly in that","choices":["Text 1 stresses practical survival lessons, while Text 2 stresses emotional development","Text 1 focuses on emotions, while Text 2 focuses on physical dangers","both texts argue that folktales have no real purpose","both texts claim folktales are meant only for adults"],"ans":0,"exp":{"why":"Text 1 treats folktales as disguised survival manuals teaching literal dangers; Text 2 values them for building emotional courage rather than literal lessons. The split is practical safety versus emotional growth.","traps":{"A":"Correct: survival lessons versus emotional development.","B":"It reverses the two emphases.","C":"Both assign folktales a real purpose.","D":"Both concern children, not only adults."},"skill":"Cross-Text Connections","strat":"Summarize each author's core emphasis, then contrast the two."}},
{"id":"s3-rw-craft-28","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>Every flat map of the round Earth must distort something: shapes, sizes, and distances cannot all be preserved at once. A mapmaker therefore chooses which errors to ______, accepting stretched polar regions, say, in exchange for accurate compass directions.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["tolerate","eliminate","conceal","multiply"],"ans":0,"exp":{"why":"Since distortion is unavoidable, the mapmaker decides which errors to accept, as shown by 'accepting stretched polar regions.' 'Tolerate' means to accept or put up with those errors.","traps":{"A":"Correct: accepting some errors is tolerating them.","B":"Eliminate contradicts 'must distort something.'","C":"Conceal means hide, not accept.","D":"Multiply means increase, not a deliberate choice to accept."},"skill":"Words in Context","strat":"Anchor the verb to the 'accepting ... in exchange for' example that follows."}},
{"id":"s3-rw-craft-29","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"H","type":"mcq","stim":"<p>To grasp the age of the Earth, imagine its 4.6-billion-year history compressed into a single calendar year. On this scale, life appears in the spring, but the dinosaurs do not arrive until mid-December and vanish on the 26th. All of recorded human history occupies only the final few seconds before midnight. The comparison does not merely inform; it is meant to unsettle our sense of our own importance.</p>","prompt":"Which choice best describes the function of the final sentence?","choices":["It introduces a scientific objection to the calendar analogy","It provides the exact date the Earth formed","It states the rhetorical intent behind the analogy the passage has developed","It corrects an error made earlier in the passage"],"ans":2,"exp":{"why":"After building the calendar analogy, the last sentence explains why it exists: not just to inform but to unsettle our sense of human importance. It names the analogy's rhetorical aim.","traps":{"A":"It endorses the analogy rather than objecting.","B":"It gives no formation date.","C":"Correct: it states the analogy's persuasive intent.","D":"Nothing earlier is being corrected."},"skill":"Text Structure & Purpose","strat":"A closing 'it is meant to' line usually declares the passage's rhetorical goal."}},
{"id":"s3-rw-craft-30","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"E","type":"mcq","stim":"<p>A melody can feel restless or settled depending on where it pauses. Composers create tension by ending a phrase on an unstable note that seems to demand continuation. Resolving that phrase onto a stable note, the tonic, produces the feeling of arriving home. This push and pull is the engine that drives a piece of music forward.</p>","prompt":"Which choice best describes the overall structure of the text?","choices":["It explains a general effect and then how composers produce it","It compares two composers' contrasting styles","It lists musical instruments in order of pitch","It argues that music theory is too complex to teach"],"ans":0,"exp":{"why":"The passage first names the effect (a melody feeling restless or settled), then explains how composers create it through unstable and stable notes. It moves from effect to mechanism.","traps":{"A":"Correct: states the effect, then how it is produced.","B":"No two composers are compared.","C":"No instruments are listed by pitch.","D":"It never claims theory is unteachable."},"skill":"Text Structure & Purpose","strat":"Track whether the text moves from an effect to its cause or the reverse."}},
{"id":"s3-rw-info-01","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"E","type":"mcq","stim":"<p>In the eleventh century, builders in Chaco Canyon, in what is now New Mexico, constructed a network of unusually straight roadways radiating from their great stone houses. Some of these roads run for many kilometers without bending, even where the terrain would have made a curving path far easier to build. Because the roads often lead toward shrines or distant landmarks rather than toward obvious sources of food or water, several archaeologists now argue that the roads served ceremonial purposes as much as practical ones.</p>","prompt":"Which choice best states the main idea of the text?","choices":["The straightness of Chaco Canyon’s roads suggests they may have had ceremonial as well as practical functions.","The builders of Chaco Canyon lacked the tools needed to construct curving roads.","Chaco Canyon’s roads were the longest roadways built in North America before European contact.","Archaeologists agree that the roads were used mainly to transport water across the canyon."],"ans":0,"exp":{"why":"The passage stresses that the roads run straight even across difficult terrain and lead toward shrines and landmarks, prompting archaeologists to argue they were partly ceremonial. That interpretive claim is the central point.","traps":{"A":"Correct: it captures the roads’ unusual straightness and the ceremonial interpretation.","B":"The text never says builders lacked tools; straightness was a choice, not a limitation.","C":"The passage makes no comparison to other North American roadways.","D":"The text says roads lead away from water sources, contradicting this."},"skill":"Central Ideas & Details","strat":"Find the sentence that states an interpretation and check that the answer restates it without adding claims."}},
{"id":"s3-rw-info-02","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>The sixteenth-century painter Sofonisba Anguissola was celebrated in her lifetime for portraits that captured fleeting expressions rather than stiff, formal poses. In one well-known work, she painted her sisters playing chess, one of them caught mid-laugh as if reacting to a move just made. Because women of her era were barred from studying anatomy through nude models, Anguissola concentrated on faces and domestic scenes she could observe directly. Art historians note that this constraint, rather than limiting her, pushed her toward the intimate, psychologically vivid style for which she is now remembered.</p>","prompt":"According to the text, what was one effect of the restrictions Anguissola faced?","choices":["She abandoned portraiture in favor of landscape painting.","She developed an intimate style focused on faces and domestic scenes.","She was ignored by audiences during her own lifetime.","She secretly studied anatomy despite the prohibition."],"ans":1,"exp":{"why":"The passage states that, barred from anatomy study, Anguissola concentrated on faces and domestic scenes and that this constraint pushed her toward her intimate, psychologically vivid style.","traps":{"A":"The text describes portraits and domestic scenes, not a shift to landscapes.","B":"Correct: the restriction channeled her toward intimate faces and domestic subjects.","C":"She was celebrated in her lifetime, the opposite of ignored.","D":"Nothing indicates she defied the prohibition."},"skill":"Central Ideas & Details","strat":"Locate the cause-and-effect sentence and match the answer to the stated effect."}},
{"id":"s3-rw-info-03","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>In participatory budgeting, a city sets aside a portion of public funds and lets residents themselves propose and vote on how the money is spent. Advocates argue that the process does more than fund parks or streetlights: it draws in residents who rarely contact officials, teaching them how municipal budgets work and building trust in local government. Critics counter that the sums involved are usually tiny compared with a city’s total budget, so the practice risks giving participants a sense of influence that outpaces their actual power over spending.</p>","prompt":"Which choice best states the central idea of the text?","choices":["Participatory budgeting has replaced traditional budgeting in most large cities.","Supporters and skeptics disagree about whether participatory budgeting’s benefits match residents’ real influence over spending.","Residents who join participatory budgeting rarely learn how city finances work.","Participatory budgeting is used mainly to fund parks and streetlights."],"ans":1,"exp":{"why":"The passage lays out advocates’ civic-engagement case and critics’ concern that the small sums make residents’ sense of influence exceed their real power, framing a debate.","traps":{"A":"The text never claims it has replaced traditional budgeting.","B":"Correct: it captures the two-sided debate the passage presents.","C":"Advocates say the process teaches residents how budgets work, contradicting this.","D":"Parks and streetlights are examples, not the main point."},"skill":"Central Ideas & Details","strat":"When a text presents both advocates and critics, the central idea is usually the debate itself."}},
{"id":"s3-rw-info-04","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"H","type":"mcq","stim":"<p>When helium is cooled below about two kelvin, it becomes a superfluid, flowing without any measurable friction. A superfluid placed in an open cup will creep up the inner wall in a thin film, spill over the rim, and drip out the bottom until the cup is empty. Ordinary liquids cannot do this because friction and viscosity halt such motion almost immediately. Physicists explain the climbing film by noting that a superfluid, lacking viscosity, is not slowed by the drag that normally opposes a liquid’s spread along a surface.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Superfluid helium empties from a cup because its lack of viscosity removes the drag that stops ordinary liquids.","Helium can be cooled to lower temperatures than any other element.","Ordinary liquids climb the walls of cups more slowly than superfluids do.","Superfluid helium is warmer than the liquids people encounter every day."],"ans":0,"exp":{"why":"The passage describes the climbing film and attributes it to the absence of viscosity, which removes the drag that halts ordinary liquids. That mechanism is the central point.","traps":{"A":"Correct: it names the phenomenon and its stated cause.","B":"The text gives one temperature but makes no cross-element comparison.","C":"Ordinary liquids do not climb and spill at all, not merely more slowly.","D":"Superfluid helium is extremely cold; the passage never calls it warm."},"skill":"Central Ideas & Details","strat":"For a science explanation, the main idea usually pairs the phenomenon with its cause."}},
{"id":"s3-rw-info-05","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>The Inca kept detailed records without a writing system by using the quipu, a device made of a main cord from which many knotted strings hung. The position of a knot along a string indicated whether it stood for ones, tens, or hundreds, and the number of knots at each position gave the digit. Colors and the direction of the twist appear to have encoded categories, such as the type of goods being counted. Because so few quipus survive and no key remains, scholars can read the numerical parts with confidence but still debate what the non-numerical features recorded.</p>","prompt":"According to the text, why can scholars read the numbers on quipus but not their other features?","choices":["The numerical knots have been destroyed on most surviving quipus.","The rules for the numerical system are understood, while no key survives for the colors and twists.","The Inca deliberately hid the meaning of the numbers.","Colors and twists were added long after the quipus were made."],"ans":1,"exp":{"why":"The passage explains the place-value knot system clearly and then says that, with few quipus and no key, scholars still debate what the colors and twists recorded.","traps":{"A":"The text says numbers can be read with confidence, so those knots are not lost.","B":"Correct: numerical rules are known; no key exists for the non-numerical features.","C":"Nothing suggests the Inca hid the numbers; numbers are the readable part.","D":"The passage does not claim colors and twists were added later."},"skill":"Central Ideas & Details","strat":"Identify the contrast the passage draws and match the reason to each side of it."}},
{"id":"s3-rw-info-06","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>At the bottom of certain still lakes, sediment settles in paired layers called varves: a pale, coarse layer deposited during spring snowmelt and a dark, fine layer that settles in the calm of winter. Because one pale and one dark layer form together each year, a scientist can count the pairs in a sediment core much as one counts rings in a tree, assigning a single year to each pair. Thicker pale layers point to heavy meltwater, so a core can also reveal which past years brought unusually wet springs.</p>","prompt":"According to the text, how can a scientist determine the age of a layer in a varve core?","choices":["By measuring the total depth of the sediment in the lake.","By counting the paired pale-and-dark layers, each of which represents one year.","By comparing the core to rings from nearby trees.","By weighing the coarse spring material in each layer."],"ans":1,"exp":{"why":"The passage states that one pale and one dark layer form together each year, so counting the pairs assigns a year to each, like counting tree rings.","traps":{"A":"Total depth is not the dating method described; counting pairs is.","B":"Correct: each pale-dark pair equals one year, so counting pairs gives age.","C":"Tree rings are only an analogy; the text does not describe comparing to actual tree rings.","D":"Layer thickness indicates meltwater amount, not age."},"skill":"Central Ideas & Details","strat":"Distinguish the detail that answers the exact question from nearby details serving other purposes."}},
{"id":"s3-rw-info-07","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"E","type":"mcq","stim":"<p>Seagrass meadows, the underwater fields of flowering plants that fringe many coastlines, store carbon far faster per acre than most forests on land. As the grasses grow, they trap drifting particles and bury carbon-rich material in the seafloor, where the lack of oxygen keeps it from breaking down for centuries. Scientists studying climate change have begun mapping these meadows carefully, because protecting an existing meadow can lock away carbon that would otherwise return to the atmosphere.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Seagrass meadows grow only in waters that contain no oxygen.","Seagrass meadows are effective long-term carbon stores that scientists are working to protect.","Forests on land store more carbon per acre than seagrass meadows do.","Mapping seagrass meadows has proven too difficult for scientists to attempt."],"ans":1,"exp":{"why":"The passage emphasizes that seagrass meadows bury carbon for centuries and that scientists map and protect them to keep that carbon locked away.","traps":{"A":"The oxygen-poor condition is in the buried seafloor, not the water the grass grows in.","B":"Correct: it captures the storage function and the protection effort.","C":"The text says seagrass stores carbon faster per acre than most forests, the reverse.","D":"Scientists have begun mapping the meadows, not abandoned the task."},"skill":"Central Ideas & Details","strat":"Pick the choice that combines the passage’s key function with its stated purpose."}},
{"id":"s3-rw-info-08","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"M","type":"mcq","stim":"<p>Recycling the lithium in spent batteries has long been costly because the older method, smelting, burns the battery at high heat and destroys the lithium along with other useful metals. A newer approach, called direct recycling, instead dismantles a battery and refreshes its electrode material so it can be reused with much of its structure intact. Engineers caution, however, that direct recycling works well only when batteries are sorted by type beforehand, since a mix of chemistries fed into the same process yields a material too inconsistent to reuse.</p>","prompt":"According to the text, what limits the usefulness of direct recycling?","choices":["It requires burning batteries at even higher temperatures than smelting does.","It destroys the lithium along with other metals in the battery.","It produces inconsistent material unless batteries are sorted by type first.","It cannot recover any of a battery’s original electrode structure."],"ans":2,"exp":{"why":"The passage states that engineers caution direct recycling works well only when batteries are sorted by type, because mixed chemistries yield material too inconsistent to reuse.","traps":{"A":"High heat describes smelting, not direct recycling.","B":"Destroying lithium is the drawback of the older smelting method.","C":"Correct: unsorted, mixed batteries produce inconsistent, unusable material.","D":"Direct recycling keeps much of the electrode structure intact."},"skill":"Central Ideas & Details","strat":"Find the sentence that begins with a caution or limitation and read its condition carefully."}},
{"id":"s3-rw-info-09","sec":"rw","dom":"info","skill":"Central Ideas & Details","dif":"H","type":"mcq","stim":"<p>Learners often assume that studying material in one long block cements it best. Research on the spacing effect suggests the opposite. When the same total study time is broken into sessions separated by days, the resulting memories last markedly longer than when the time is massed into a single sitting. Cognitive scientists propose that each delayed return forces the brain to reconstruct a partly forgotten memory, and this effortful retrieval strengthens the memory more than smooth, uninterrupted review does. The very sense of difficulty that makes spaced study feel less productive, they argue, is a sign that deeper learning is occurring.</p>","prompt":"Which choice best states the main idea of the text?","choices":["Studying feels easier when sessions are spread across several days.","Spreading study across sessions produces more durable learning because effortful retrieval strengthens memory.","Total study time matters more than how that time is distributed.","Massed study is the most reliable way to form lasting memories."],"ans":1,"exp":{"why":"The passage explains that spaced sessions outlast massed ones because each delayed return forces effortful reconstruction, which strengthens memory, and that the felt difficulty signals deeper learning.","traps":{"A":"The text says spaced study feels less productive, i.e., harder, not easier.","B":"Correct: it names the benefit (durable learning) and its stated cause (effortful retrieval).","C":"The passage holds total time constant and credits distribution, contradicting this.","D":"Research described favors spaced over massed study."},"skill":"Central Ideas & Details","strat":"Ignore the intuitive belief the passage sets up in order to knock down; the main idea is the correction plus its reason."}},
{"id":"s3-rw-info-10","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>A biologist studied four populations of a songbird living on islands at different distances from the mainland. She proposed that the more isolated a population is, the simpler its song becomes, because isolated birds have fewer neighbors from whom to learn new syllables. She recorded the average number of distinct syllables per song for each island.</p><table><tr><th>Island</th><th>Distance from mainland (km)</th><th>Avg. syllables per song</th></tr><tr><td>Near</td><td>5</td><td>12</td></tr><tr><td>Mid</td><td>40</td><td>9</td></tr><tr><td>Far</td><td>120</td><td>7</td></tr><tr><td>Remote</td><td>300</td><td>5</td></tr></table>","prompt":"Which choice most effectively uses data from the table to support the biologist’s proposal?","choices":["The Near population, only 5 km from the mainland, had the most syllables per song, at 12.","As distance from the mainland increased across the four islands, the average number of syllables per song steadily decreased.","The Remote population, 300 km away, had 5 syllables per song.","The Mid and Far populations differed by only 2 syllables per song despite being 80 km apart."],"ans":1,"exp":{"why":"The proposal links greater isolation to simpler song. The table shows syllables falling from 12 to 9 to 7 to 5 as distance rises from 5 to 300 km, a consistent inverse trend that supports the claim.","traps":{"A":"One data point alone does not show the relationship across increasing distance.","B":"Correct: the steady decrease in syllables with increasing distance directly supports the proposal.","C":"A single value for Remote does not establish the trend.","D":"This highlights a small gap between two islands rather than the overall pattern."},"skill":"Command of Evidence","strat":"Choose the option that describes the trend across all rows in the direction the hypothesis predicts."}},
{"id":"s3-rw-info-11","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>Excavating a coastal settlement, archaeologists recorded the percentage of pottery fragments made from clay imported from distant regions in each buried layer. Deeper layers are older. The team argued that the settlement’s trade with distant regions grew stronger over time.</p><table><tr><th>Layer</th><th>Approx. age (years ago)</th><th>Imported pottery (%)</th></tr><tr><td>1 (top)</td><td>600</td><td>41</td></tr><tr><td>2</td><td>800</td><td>28</td></tr><tr><td>3</td><td>1000</td><td>17</td></tr><tr><td>4 (bottom)</td><td>1200</td><td>9</td></tr></table>","prompt":"Which choice most effectively uses data from the table to support the archaeologists’ argument?","choices":["In the oldest layer, only 9 percent of the pottery was made from imported clay.","The top two layers together contained more imported pottery than the bottom two.","As the layers became younger, the percentage of imported pottery rose from 9 to 41 percent.","Layer 3, dated to about 1000 years ago, contained 17 percent imported pottery."],"ans":2,"exp":{"why":"The argument is that distant trade grew over time. Because younger layers sit on top, the rise from 9 percent (oldest) to 41 percent (youngest) shows imported pottery increasing through time, supporting growing trade.","traps":{"A":"A single oldest-layer value does not demonstrate growth over time.","B":"This grouping obscures the ordered trend across all four layers.","C":"Correct: the steady rise from oldest to youngest layer supports increasing distant trade.","D":"One middle value alone does not establish the upward trend."},"skill":"Command of Evidence","strat":"Track how the measured value changes from oldest to youngest and match it to the claimed direction of change."}},
{"id":"s3-rw-info-12","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>An engineering student is choosing a material for the handle of a cooking pot. To keep the handle cool while the pot heats, she wants the material with the lowest thermal conductivity, since a lower value means heat travels through the material more slowly. She compiled measured values for four candidate materials.</p><table><tr><th>Material</th><th>Thermal conductivity (W/m·K)</th></tr><tr><td>Copper</td><td>400</td><td></td></tr><tr><td>Aluminum</td><td>235</td></tr><tr><td>Stainless steel</td><td>16</td></tr><tr><td>Bakelite</td><td>1.4</td></tr></table>","prompt":"Which choice most effectively uses data from the table to identify the best material for the handle?","choices":["Copper, with a conductivity of 400 W/m·K, should be chosen for the handle.","Aluminum should be chosen because its conductivity of 235 W/m·K is lower than copper’s.","Stainless steel, at 16 W/m·K, has the lowest conductivity of the four materials.","Bakelite should be chosen because, at 1.4 W/m·K, it has the lowest conductivity of the four."],"ans":3,"exp":{"why":"The student wants the lowest thermal conductivity. Bakelite’s 1.4 W/m·K is the smallest of the four values, so it best keeps the handle cool.","traps":{"A":"Copper’s 400 is the highest value, the worst choice for a cool handle.","B":"Aluminum is lower than copper but still far higher than steel or Bakelite.","C":"16 is low but not the lowest; Bakelite’s 1.4 is smaller.","D":"Correct: Bakelite has the lowest conductivity, meeting the stated goal."},"skill":"Command of Evidence","strat":"Restate the criterion (here, lowest value) and scan the table for the true extreme."}},
{"id":"s3-rw-info-13","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"H","type":"mcq","stim":"<p>Researchers tested whether shorter sleep slows reaction time. Volunteers were assigned a fixed number of hours to sleep for one night, then measured on a task in which they pressed a button as soon as a light appeared; higher millisecond values mean slower responses. The team claimed that reaction time worsens as sleep decreases, but only once sleep drops below a threshold.</p><table><tr><th>Hours slept</th><th>Avg. reaction time (ms)</th></tr><tr><td>8</td><td>250</td></tr><tr><td>7</td><td>252</td></tr><tr><td>6</td><td>255</td></tr><tr><td>5</td><td>310</td></tr><tr><td>4</td><td>360</td></tr></table>","prompt":"Which choice most effectively uses data from the table to support the researchers’ claim?","choices":["Reaction time rose steadily by the same amount with each hour of lost sleep.","Reaction times were nearly flat from 8 to 6 hours but jumped sharply once sleep fell to 5 hours and below.","The fastest reaction time occurred at 4 hours of sleep.","Reaction time was unaffected by the number of hours volunteers slept."],"ans":1,"exp":{"why":"The claim has two parts: worsening with less sleep, but only below a threshold. Values barely change from 8 to 6 hours (250 to 255) then jump to 310 and 360 at 5 and 4 hours, matching a threshold effect.","traps":{"A":"The increases are not uniform; they are tiny then large, which the claim actually requires.","B":"Correct: near-flat values then a sharp jump below 6 hours capture the threshold claim.","C":"4 hours gave the slowest, not fastest, time (360 ms).","D":"Reaction time clearly worsened at low sleep, so it was not unaffected."},"skill":"Command of Evidence","strat":"When a claim specifies a threshold, verify both the flat region and the break, not just an overall direction."}},
{"id":"s3-rw-info-14","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>After a drained marsh was reflooded to restore it, ecologists counted the number of native plant species present in the same survey plots each year. They concluded that native plant diversity recovered gradually following the restoration.</p><table><tr><th>Year after reflooding</th><th>Native plant species</th></tr><tr><td>1</td><td>6</td></tr><tr><td>2</td><td>11</td></tr><tr><td>3</td><td>15</td></tr><tr><td>4</td><td>18</td></tr></table>","prompt":"Which choice most effectively uses data from the table to support the ecologists’ conclusion?","choices":["The number of native species rose each year, from 6 in year 1 to 18 in year 4.","In year 1, only 6 native species were recorded in the plots.","The number of native species tripled between years 2 and 4.","Native species increased more between years 1 and 2 than between years 3 and 4."],"ans":0,"exp":{"why":"The conclusion is that diversity recovered gradually. The count rising each year from 6 to 11 to 15 to 18 shows a steady, gradual increase supporting recovery.","traps":{"A":"Correct: the year-by-year rise from 6 to 18 shows gradual recovery.","B":"A single year’s value does not show recovery over time.","C":"11 to 18 is not a tripling, so the figure is inaccurate.","D":"This compares two intervals rather than showing overall recovery."},"skill":"Command of Evidence","strat":"For a gradual-increase claim, cite the full sequence rising across all years."}},
{"id":"s3-rw-info-15","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"E","type":"mcq","stim":"<p>Art historians have debated whether the Dutch painter Judith Leyster planned her lively tavern scenes carefully or worked spontaneously. A conservator studying one canvas under infrared light reported finding beneath the paint an underdrawing in which figures had been sketched, erased, and repositioned before the final image was set down.</p>","prompt":"Which finding, if true, would most directly support the view that Leyster planned her compositions carefully?","choices":["Leyster completed most of her known paintings within a single week each.","The infrared underdrawing shows figures sketched, erased, and repositioned before the final painting.","Leyster’s tavern scenes were popular with buyers during her lifetime.","Some of Leyster’s canvases were later mistakenly attributed to other painters."],"ans":1,"exp":{"why":"Careful planning is best shown by evidence of deliberate adjustment before finishing. The underdrawing with figures sketched, erased, and repositioned directly demonstrates planning rather than pure spontaneity.","traps":{"A":"Fast completion would, if anything, suggest spontaneity, not planning.","B":"Correct: revising the underdrawing before the final image shows deliberate planning.","C":"Popularity says nothing about her working method.","D":"Misattribution concerns authorship, not whether she planned compositions."},"skill":"Command of Evidence","strat":"Match the evidence to the specific claim; planning requires signs of deliberate revision before completion."}},
{"id":"s3-rw-info-16","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>A linguist argues that a small endangered language, spoken by only a few hundred people, is being actively passed to the next generation rather than dying out. To make this case, she needs evidence that children are not merely hearing the language but using it themselves in everyday life.</p>","prompt":"Which finding, if true, would most strongly support the linguist’s argument?","choices":["Most fluent speakers of the language are over sixty years old.","A dictionary of the language was recently published for scholars.","In several households, young children speak the language with one another during play.","The language was once spoken across a much larger territory."],"ans":2,"exp":{"why":"The argument requires that children actively use the language, not just hear it. Young children speaking it with one another during play is exactly the active, everyday use the claim needs.","traps":{"A":"Speakers being mostly elderly suggests the language may be dying, the opposite.","B":"A scholarly dictionary documents the language but does not show children using it.","C":"Correct: children speaking it among themselves shows active transmission to the next generation.","D":"Past geographic range says nothing about current use by children."},"skill":"Command of Evidence","strat":"Pin down the exact thing the claim must demonstrate (children using it) and pick the option that shows it."}},
{"id":"s3-rw-info-17","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"H","type":"mcq","stim":"<p>A gardener claims that a certain native wildflower attracts more pollinating insects when it is planted in dense clusters than when the same number of plants is spread thinly across a garden, because clusters are easier for insects to locate. A skeptic suspects that the total number of flowers, not their spacing, is what matters.</p>","prompt":"Which finding, if true, would most directly weaken the gardener’s claim?","choices":["Dense clusters of the wildflower received more insect visits than thinly spread plantings of the same size.","Thinly spread plantings and dense clusters with equal flower counts received nearly the same number of insect visits.","Larger clusters of the wildflower attracted more insects than smaller clusters did.","Insects visited the wildflower more often on warm days than on cool days."],"ans":1,"exp":{"why":"The gardener credits spacing (clustering) itself. If clustered and thinly spread plantings with equal flower counts draw nearly the same visits, spacing makes little difference, weakening the claim and favoring the skeptic.","traps":{"A":"This supports the gardener rather than weakening the claim.","B":"Correct: equal visits at equal flower counts shows spacing does not drive the effect.","C":"Bigger clusters having more flowers still leaves the spacing question open, consistent with the skeptic but not directly testing spacing at equal counts.","D":"Temperature effects are irrelevant to the spacing-versus-total debate."},"skill":"Command of Evidence","strat":"To weaken a claim, find the result that holds the disputed variable’s alternative constant and shows no effect."}},
{"id":"s3-rw-info-18","sec":"rw","dom":"info","skill":"Command of Evidence","dif":"M","type":"mcq","stim":"<p>Historians long assumed that the medieval trading city of Novgorod was governed almost entirely by a small circle of wealthy landowners. A scholar disputes this, arguing that ordinary residents also took part in civic decisions. She is looking for evidence that people outside the elite had a formal voice in the city’s affairs.</p>","prompt":"Which finding, if true, would most directly support the scholar’s argument?","choices":["Surviving records show that the city’s wealthiest families owned most of the farmland around Novgorod.","Preserved birch-bark documents include petitions in which artisans and tradespeople addressed the city assembly directly.","Novgorod’s markets attracted merchants from many distant regions.","The city’s main cathedral was funded largely by its leading landowners."],"ans":1,"exp":{"why":"The scholar needs evidence that non-elites had a formal civic voice. Petitions in which artisans and tradespeople addressed the city assembly directly show ordinary residents participating in civic decisions.","traps":{"A":"Elite landholding supports the older view, not the scholar’s.","B":"Correct: ordinary tradespeople petitioning the assembly shows non-elite participation.","C":"Attracting distant merchants speaks to commerce, not who governed.","D":"Elite funding of a cathedral reinforces elite dominance, not broad participation."},"skill":"Command of Evidence","strat":"Support requires evidence of the specific actors (non-elites) doing the specific thing (formal civic participation)."}},
{"id":"s3-rw-info-19","sec":"rw","dom":"info","skill":"Inferences","dif":"E","type":"mcq","stim":"<p>The desert plant known as the resurrection plant can lose almost all of its internal water and curl into a dry, brown ball that appears lifeless for months or even years. Yet when rain finally arrives, the plant unfurls within hours, turns green, and resumes growth. Botanists note that during its dry state the plant’s cells are not dead but merely suspended, their vital structures protected until moisture returns.</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["the resurrection plant cannot survive in regions that receive regular rainfall.","the plant’s dry, lifeless appearance does not mean that it has actually died.","the plant grows faster than any other desert species.","rain is harmful to the resurrection plant once it has dried out."],"ans":1,"exp":{"why":"The text says the plant looks lifeless yet its cells are only suspended and revive with rain. It follows that the dry appearance does not indicate real death.","traps":{"A":"The passage never addresses whether it can live in wet regions.","B":"Correct: suspended, protected cells that revive show the plant is not truly dead when dry.","C":"No comparison of growth speed to other species is made.","D":"Rain revives the plant, so it is beneficial, not harmful."},"skill":"Inferences","strat":"Draw only the conclusion the stated facts guarantee; here, alive-but-suspended means not dead."}},
{"id":"s3-rw-info-20","sec":"rw","dom":"info","skill":"Inferences","dif":"M","type":"mcq","stim":"<p>A researcher compared two nearby towns that had adopted very different street layouts. In the first, a dense grid gave drivers many alternative routes between any two points; in the second, a small number of wide arterial roads carried nearly all traffic. When a single major road was closed for repairs, the first town’s overall travel times rose only slightly, while the second town’s times increased dramatically. The researcher concluded that a network’s resilience to disruption depends less on the capacity of any single road than on _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["the total number of vehicles that use the network each day.","how many alternative routes the network offers when one road is unavailable.","the width of the widest arterial road in the town.","whether the town’s residents prefer driving to walking."],"ans":1,"exp":{"why":"The grid town, rich in alternative routes, absorbed a closure with little delay, while the arterial town did not. The logical inference is that resilience depends on the availability of alternative routes.","traps":{"A":"Total daily traffic volume is never compared between the towns.","B":"Correct: the grid’s many alternatives explain its resilience.","C":"Wide arterials were the fragile design, so road width is not the key factor.","D":"Walking preferences are not discussed."},"skill":"Inferences","strat":"Identify the single difference that tracks the outcome and let it complete the generalization."}},
{"id":"s3-rw-info-21","sec":"rw","dom":"info","skill":"Inferences","dif":"M","type":"mcq","stim":"<p>An astronomer measured the light from a distant star and found that its brightness dipped by the same tiny amount at perfectly regular intervals, then returned to normal each time. The dip was far too small and too repetitive to be caused by the star itself flickering. From these observations, the astronomer inferred that _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["the star is gradually cooling and will soon stop shining.","an object is likely passing in front of the star at regular intervals, blocking a little of its light.","the star is moving rapidly away from Earth.","the astronomer’s instrument was malfunctioning during the measurements."],"ans":1,"exp":{"why":"Regular, identical dips that are not caused by the star flickering point to something repeatedly passing in front and blocking a bit of light, such as an orbiting body.","traps":{"A":"Cooling would dim the star steadily, not cause brief repeating dips with returns to normal.","B":"Correct: periodic, uniform dimming fits an object regularly transiting the star.","C":"Motion away from Earth is not indicated by periodic brightness dips.","D":"The text treats the measurements as reliable; malfunction is not suggested."},"skill":"Inferences","strat":"Rule out causes the text excludes, then choose the explanation the remaining evidence best fits."}},
{"id":"s3-rw-info-22","sec":"rw","dom":"info","skill":"Inferences","dif":"M","type":"mcq","stim":"<p>In a study of memory, participants were shown a list of words and later asked to recall them. Some participants were told, just before recall, that the test would affect their course grade; others were told it was only for practice. Those in the high-stakes group recalled fewer words on average, and afterward many described feeling too anxious to concentrate. The researchers suggested that, at least for this task, raising the stakes _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["improved recall by making participants try harder.","may have hindered recall by increasing anxiety that interfered with concentration.","had no measurable effect on how many words participants recalled.","caused participants to forget the instructions they were given."],"ans":1,"exp":{"why":"The high-stakes group recalled fewer words and reported anxiety that hurt concentration. The inference is that raising the stakes may have worsened recall by increasing interfering anxiety.","traps":{"A":"The high-stakes group did worse, so recall was not improved.","B":"Correct: lower recall plus reported anxiety supports a hindering effect.","C":"There was a difference (fewer words), so the effect was not null.","D":"Nothing indicates participants forgot the instructions."},"skill":"Inferences","strat":"Combine the outcome (fewer words) with the reported mechanism (anxiety) to reach the supported conclusion."}},
{"id":"s3-rw-info-23","sec":"rw","dom":"info","skill":"Inferences","dif":"M","type":"mcq","stim":"<p>The composer Florence Price often wove melodies drawn from spirituals into the forms of the European symphony. Critics of her era sometimes treated the two traditions as incompatible, praising a work for its symphonic craft while dismissing its folk elements as out of place. Price’s scores, however, integrate the borrowed melodies so thoroughly into the symphonic structure that removing them would leave the movements incomplete. A modern scholar studying these scores would most reasonably conclude that _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["Price regarded the symphonic and folk traditions as fundamentally incompatible.","the folk melodies in Price’s symphonies are essential to their structure rather than mere decoration.","Price’s symphonies were more popular than those of her contemporaries.","critics of Price’s era fully understood how she used spirituals."],"ans":1,"exp":{"why":"Because the borrowed melodies are integrated so thoroughly that removing them would leave movements incomplete, they must be structurally essential, not decorative additions.","traps":{"A":"Price blended the traditions, so she evidently did not treat them as incompatible.","B":"Correct: melodies whose removal breaks the structure are essential to it.","C":"Relative popularity is never discussed.","D":"Critics dismissed the folk elements, suggesting they did not fully grasp her method."},"skill":"Inferences","strat":"Turn the load-bearing detail (removal leaves it incomplete) into its direct implication (essential)."}},
{"id":"s3-rw-info-24","sec":"rw","dom":"info","skill":"Inferences","dif":"H","type":"mcq","stim":"<p>Fossil footprints preserved in ancient mud can reveal how an extinct animal moved. In one trackway, the spacing between successive prints of a large reptile grows steadily wider along the trail, while the depth of each print becomes shallower. Paleontologists know that a faster-moving animal takes longer strides and, because each foot spends less time on the ground, presses less deeply into soft mud. From this single trackway, they can most reasonably infer that _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["the reptile was slowing down as it crossed the mud.","the reptile was speeding up as it crossed the mud.","the reptile was heavier than other reptiles of its kind.","the mud was deeper at the end of the trail than at the start."],"ans":1,"exp":{"why":"Wider stride spacing and shallower prints both indicate faster movement, per the stated principles. Since both change in that direction along the trail, the animal was accelerating.","traps":{"A":"Slowing would shorten strides and deepen prints, the opposite of what is described.","B":"Correct: longer strides plus shallower prints together indicate increasing speed.","C":"The evidence concerns speed and stride, not the animal’s weight.","D":"Shallower prints suggest faster motion, not deeper mud; mud depth is not established."},"skill":"Inferences","strat":"Apply both stated rules to the described trend; when both point the same way, the inference is secure."}},
{"id":"s3-rw-info-25","sec":"rw","dom":"info","skill":"Inferences","dif":"H","type":"mcq","stim":"<p>Economists studying a small island once observed that its two main exports, fish and fruit, tended to fail in the same seasons, since a single storm could ruin both the boats and the orchards. After a new cold-storage facility let the island add preserved goods that depended on neither weather-sensitive industry, the island’s total export earnings became far steadier from season to season, even though its best seasons were no higher than before. The economists concluded that the stability came not from raising peak output but from _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["eliminating the island’s dependence on storms for its harvests.","adding an export whose success did not rise and fall together with the existing ones.","increasing the earnings produced in the island’s very best seasons.","reducing the total number of goods the island exported."],"ans":1,"exp":{"why":"Earnings steadied after adding a good not tied to the weather-sensitive industries that failed together. Because peaks did not rise, the stability came from an export that did not fluctuate in step with the others.","traps":{"A":"No harvest depends on storms for success; storms harmed output, and this misstates the point.","B":"Correct: an uncorrelated export smooths total earnings without raising peaks.","C":"The text explicitly says best seasons were no higher, ruling this out.","D":"The island added, not reduced, the variety of exports."},"skill":"Inferences","strat":"When peaks stay flat but variability drops, attribute the change to diversification, not higher output."}},
{"id":"s3-rw-info-26","sec":"rw","dom":"info","skill":"Inferences","dif":"E","type":"mcq","stim":"<p>Some species of ants tend herds of tiny insects called aphids much as farmers tend livestock. The ants protect the aphids from predators and, in return, feed on a sugary liquid the aphids release. Observers have noticed that when aphids are moved to a fresh plant, ants will often carry them there and continue guarding them. Given this relationship, it is reasonable to conclude that _____</p>","prompt":"Which choice most logically completes the text with a reasonable inference?","choices":["the ants gain no benefit from their care of the aphids.","the ants’ protection of the aphids helps ensure the ants’ own food supply.","the aphids would survive just as well without the ants’ protection.","the ants prefer eating aphids to feeding on the sugary liquid."],"ans":1,"exp":{"why":"The ants feed on the sugary liquid the aphids produce, so protecting and relocating the aphids keeps that food source alive and available, securing the ants’ supply.","traps":{"A":"The ants gain the sugary liquid, a clear benefit.","B":"Correct: guarding the aphids preserves the ants’ own food source.","C":"The ants’ protection from predators suggests aphids fare better with them, not equally without.","D":"The ants eat the liquid, not the aphids; no such preference is stated."},"skill":"Inferences","strat":"Trace the benefit each party receives and infer the self-interest that the described behavior serves."}},
{"id":"s3-rw-conv-01","sec":"rw","dom":"conv","skill":"Boundaries","dif":"E","type":"mcq","stim":"<p>The observatory closes to the public during the summer ______ its telescopes require careful maintenance before the autumn viewing season.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", "," and ","; ",", however "],"ans":2,"exp":{"why":"Two independent clauses (‘The observatory closes…' and ‘its telescopes require…') must be joined by a semicolon, a period, or a comma plus a coordinating conjunction; a semicolon does this correctly.","traps":{"A":"A comma alone between two independent clauses is a comma splice.","B":"‘And' joining two independent clauses needs a comma before it; here there is none, creating a run-on.","C":"Correct: a semicolon properly links two closely related independent clauses.","D":"‘However' is a conjunctive adverb, not a conjunction, so a comma before it produces a comma splice."},"skill":"Boundaries","strat":"Two complete sentences need a semicolon, a period, or a comma + FANBOYS between them."}},
{"id":"s3-rw-conv-02","sec":"rw","dom":"conv","skill":"Boundaries","dif":"E","type":"mcq","stim":"<p>Maria hoped to photograph the total eclipse ______ she could not locate a proper solar filter for her camera in time.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", but ","; but "," but ",", but, "],"ans":0,"exp":{"why":"Two independent clauses in contrast are correctly joined by a comma plus the coordinating conjunction ‘but.'","traps":{"A":"Correct: comma + coordinating conjunction ‘but' links the two independent clauses.","B":"A semicolon should not be paired with a coordinating conjunction to join these clauses.","C":"Omitting the comma before ‘but' creates a run-on.","D":"The extra comma after ‘but' incorrectly separates the conjunction from its clause."},"skill":"Boundaries","strat":"Join two sentences with a comma directly before a FANBOYS word (for, and, nor, but, or, yet, so)."}},
{"id":"s3-rw-conv-03","sec":"rw","dom":"conv","skill":"Boundaries","dif":"E","type":"mcq","stim":"<p>Because the old bridge had been weakened by decades of heavy freight traffic ______ recommended closing it to vehicles immediately.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[" engineers",", engineers","; engineers",", and engineers"],"ans":1,"exp":{"why":"An introductory dependent clause beginning with ‘Because' must be set off from the main clause by a comma.","traps":{"A":"Omitting the comma after the introductory clause runs the clauses together.","B":"Correct: a comma follows the introductory dependent clause.","C":"A semicolon cannot separate a dependent clause from its main clause.","D":"Adding ‘and' wrongly treats the dependent clause as if it were independent."},"skill":"Boundaries","strat":"Put a comma after an introductory dependent clause before the main clause begins."}},
{"id":"s3-rw-conv-04","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The novelist's debut work, a sprawling multigenerational family saga ______ already been translated into twelve languages.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[" has",", has","; has",": has"],"ans":1,"exp":{"why":"The nonessential appositive ‘a sprawling multigenerational family saga' is opened with a comma and must be closed with a comma before the sentence resumes.","traps":{"A":"Without a closing comma, the paired-comma appositive is left unclosed.","B":"Correct: the comma closes the nonessential appositive that the earlier comma opened.","C":"A semicolon cannot close an appositive or precede the verb ‘has.'","D":"A colon cannot close an appositive or precede the verb ‘has.'"},"skill":"Boundaries","strat":"A nonessential element opened with a comma must be closed with a matching comma."}},
{"id":"s3-rw-conv-05","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The chemist added the copper catalyst to the flask ______ the pale solution turned bright orange within seconds.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", then","; then"," then",": then"],"ans":1,"exp":{"why":"Two independent clauses are involved, and ‘then' is an adverb, not a conjunction, so only a semicolon can join the clauses correctly.","traps":{"A":"‘Then' cannot join independent clauses, so a comma here is a comma splice.","B":"Correct: a semicolon joins the two independent clauses; ‘then' functions as an adverb.","C":"With no punctuation, the two clauses are fused into a run-on.","D":"A colon requires the second part to explain or list; here it merely reports a sequential result."},"skill":"Boundaries","strat":"‘Then' is not a conjunction, so it cannot fix a comma splice on its own."}},
{"id":"s3-rw-conv-06","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The linguistics conference featured invited scholars from Oslo, Norway ______ Kyoto, Japan; and Nairobi, Kenya.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", "," ","; ",": "],"ans":2,"exp":{"why":"When items in a series already contain internal commas (city, country), the items must be separated by semicolons to keep them distinct.","traps":{"A":"A comma cannot separate list items that already contain internal commas without causing confusion.","B":"Omitting punctuation between items runs them together.","C":"Correct: semicolons separate series items that contain internal commas.","D":"A colon does not separate items within a series."},"skill":"Boundaries","strat":"Use semicolons to divide list items when those items contain their own commas."}},
{"id":"s3-rw-conv-07","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The rowing team trained intensively for eight months ______ they still finished last in the regional championship.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", however, ","; however, "," however, ","; however "],"ans":1,"exp":{"why":"The conjunctive adverb ‘however' cannot join two independent clauses with only a comma; a semicolon precedes it and a comma follows it.","traps":{"A":"A comma before ‘however' between two independent clauses is a comma splice.","B":"Correct: a semicolon precedes the conjunctive adverb and a comma follows it.","C":"Without a semicolon, the two clauses are fused.","D":"The semicolon is right, but ‘however' still needs a following comma before the next clause."},"skill":"Boundaries","strat":"Between two clauses, punctuate a conjunctive adverb as ‘; however,'."}},
{"id":"s3-rw-conv-08","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The archaeologist carefully brushed away the powdery gray sand ______ a fragment of a mosaic floor beneath it.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", and revealed","; and revealed"," and, revealed"," and revealed"],"ans":3,"exp":{"why":"‘Brushed…and revealed' is a compound predicate sharing one subject, so no punctuation should separate the two verbs.","traps":{"A":"A comma before ‘and' wrongly breaks a compound predicate, not two full clauses.","B":"A semicolon can join only independent clauses, but ‘revealed…' has no subject of its own.","C":"The comma after ‘and' misplaces punctuation inside the compound predicate.","D":"Correct: no punctuation separates the two verbs of a compound predicate."},"skill":"Boundaries","strat":"Do not put a comma before ‘and' when it joins two verbs that share one subject."}},
{"id":"s3-rw-conv-09","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The heirloom recipe calls for three spices rarely found in ordinary kitchens ______ sumac, asafoetida, and grains of paradise.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", ",": ","; "," "],"ans":1,"exp":{"why":"A complete independent clause precedes the list, so a colon correctly introduces the three items.","traps":{"A":"A comma cannot formally introduce the list after a complete clause here.","B":"Correct: a colon follows a complete clause to introduce a list.","C":"A semicolon cannot introduce a list, and the words after it are not an independent clause.","D":"Omitting punctuation runs the introduction into the list."},"skill":"Boundaries","strat":"Use a colon after a complete sentence to introduce a list or explanation."}},
{"id":"s3-rw-conv-10","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The passengers ______ had already checked their luggage were allowed to board the aircraft first.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", who,",", who","who","who,"],"ans":2,"exp":{"why":"The relative clause identifies which passengers boarded first, so it is essential and takes no commas.","traps":{"A":"Paired commas mark the clause as nonessential, wrongly implying all passengers boarded first.","B":"An opening comma with no closing comma both mispunctuates and mislabels an essential clause.","C":"Correct: an essential (restrictive) clause takes no surrounding commas.","D":"A single trailing comma incorrectly separates the essential clause from its verb."},"skill":"Boundaries","strat":"Essential clauses that identify the noun get no commas; nonessential ones do."}},
{"id":"s3-rw-conv-11","sec":"rw","dom":"conv","skill":"Boundaries","dif":"M","type":"mcq","stim":"<p>The startup exhausted its entire seed funding within a single year ______ its founders remained oddly optimistic about a second round.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[". Its",", its"," its",": its"],"ans":0,"exp":{"why":"Two complete independent clauses can be written as two separate sentences, so a period followed by a capital letter is correct.","traps":{"A":"Correct: a period separates the two independent clauses into complete sentences.","B":"A comma alone between two independent clauses is a comma splice.","C":"With no punctuation, the clauses are fused into a run-on.","D":"A colon requires the second part to explain the first; here it simply adds a contrasting fact."},"skill":"Boundaries","strat":"A period can always separate two independent clauses into two sentences."}},
{"id":"s3-rw-conv-12","sec":"rw","dom":"conv","skill":"Boundaries","dif":"H","type":"mcq","stim":"<p>The three finalists ______ each a veteran of several previous competitions — delivered nearly flawless performances before the judges.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", each"," each","; each"," — each"],"ans":3,"exp":{"why":"The nonessential element is closed with a dash, so it must be opened with a matching dash; paired punctuation must be the same on both sides.","traps":{"A":"A comma cannot pair with the closing dash; paired marks must match.","B":"Omitting the opening dash leaves the interrupting element unbounded.","C":"A semicolon cannot open a mid-sentence nonessential element.","D":"Correct: an opening dash matches the closing dash around the nonessential element."},"skill":"Boundaries","strat":"Set off a nonessential element with a matched pair of the same punctuation marks."}},
{"id":"s3-rw-conv-13","sec":"rw","dom":"conv","skill":"Boundaries","dif":"H","type":"mcq","stim":"<p>The glacier has retreated nearly a mile since the first survey was taken ______ researchers now worry that the valley's streams will run dry.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":[", ","; "," ",", which "],"ans":1,"exp":{"why":"Both parts are independent clauses, so a semicolon is needed to join them.","traps":{"A":"A comma alone between two independent clauses is a comma splice.","B":"Correct: a semicolon joins the two closely related independent clauses.","C":"With no punctuation, the two clauses form a run-on.","D":"‘Which' has no clear noun to modify and cannot introduce the following full clause."},"skill":"Boundaries","strat":"When both sides are full sentences, a semicolon can join them."}},
{"id":"s3-rw-conv-14","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>The museum's collection of rare Byzantine stamps ______ displayed in the east gallery for only one month each year.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["are","were","is","have been"],"ans":2,"exp":{"why":"The subject is the singular ‘collection,' not the plural object ‘stamps,' so the verb must be singular ‘is.'","traps":{"A":"‘Are' is plural, mistakenly agreeing with ‘stamps' inside the prepositional phrase.","B":"‘Were' is plural and also shifts the tense unnecessarily.","C":"Correct: singular ‘is' agrees with the singular subject ‘collection.'","D":"‘Have been' is plural, again agreeing with ‘stamps' rather than ‘collection.'"},"skill":"Form, Structure & Sense","strat":"Match the verb to the true subject, ignoring words in an interrupting phrase."}},
{"id":"s3-rw-conv-15","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Each of the wilderness volunteers must submit ______ own signed liability waiver before the group departs for the trailhead.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["their","his or her","there","they're"],"ans":1,"exp":{"why":"‘Each' is grammatically singular, so its pronoun must be the singular ‘his or her.'","traps":{"A":"‘Their' is plural and does not agree with the singular ‘each.'","B":"Correct: singular ‘his or her' agrees with the singular antecedent ‘each.'","C":"‘There' is an adverb of place, not a possessive pronoun.","D":"‘They're' means ‘they are' and is not possessive."},"skill":"Form, Structure & Sense","strat":"‘Each,' ‘every,' and ‘one' are singular and take singular pronouns."}},
{"id":"s3-rw-conv-16","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>By the time the firefighters finally arrived at the scene, the abandoned warehouse ______ nearly to the ground.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["had burned","burned","has burned","burns"],"ans":0,"exp":{"why":"The warehouse's burning was completed before the firefighters arrived, so the earlier past action takes the past perfect ‘had burned.'","traps":{"A":"Correct: past perfect ‘had burned' marks the action completed before the later past event.","B":"Simple past ‘burned' fails to show that the burning preceded the arrival.","C":"Present perfect ‘has burned' clashes with the clearly past time frame.","D":"Present tense ‘burns' contradicts the past-tense narration."},"skill":"Form, Structure & Sense","strat":"Use past perfect for the earlier of two past actions."}},
{"id":"s3-rw-conv-17","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"E","type":"mcq","stim":"<p>The summer internship taught her to write code efficiently, to explain technical ideas clearly, and ______ calmly under sudden deadline pressure.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["working","she worked","work","to work"],"ans":3,"exp":{"why":"The series consists of parallel infinitives (‘to write,' ‘to explain'), so the third item must also be an infinitive, ‘to work.'","traps":{"A":"The gerund ‘working' breaks the infinitive pattern of the series.","B":"The clause ‘she worked' is not parallel with the infinitive items.","C":"The bare verb ‘work' omits ‘to' and breaks parallelism.","D":"Correct: ‘to work' keeps the list of infinitives parallel."},"skill":"Form, Structure & Sense","strat":"Items in a list must share the same grammatical form."}},
{"id":"s3-rw-conv-18","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The total rainfall recorded this year was far greater than ______ of any single year in the previous decade.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["that","those","them","it"],"ans":0,"exp":{"why":"The comparison is to the singular noun ‘rainfall,' so the singular ‘that' is required.","traps":{"A":"Correct: singular ‘that' stands in for the singular ‘rainfall.'","B":"‘Those' is plural and cannot replace the singular ‘rainfall.'","C":"‘Them' is an object pronoun and cannot serve as the point of comparison here.","D":"‘It' cannot take the possessive ‘of' construction needed for the comparison."},"skill":"Form, Structure & Sense","strat":"Use ‘that' for a singular noun and ‘those' for a plural noun in comparisons."}},
{"id":"s3-rw-conv-19","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Neither the head coach nor the veteran players ______ satisfied with the referee's controversial final call.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","is","were","has been"],"ans":2,"exp":{"why":"In a ‘neither…nor' subject, the verb agrees with the nearer subject, ‘players,' which is plural, so ‘were' is correct.","traps":{"A":"‘Was' is singular and does not agree with the nearer plural subject ‘players.'","B":"‘Is' is singular and also wrongly shifts to present tense.","C":"Correct: ‘were' agrees with the nearer plural subject ‘players.'","D":"‘Has been' is singular and disagrees with ‘players.'"},"skill":"Form, Structure & Sense","strat":"With ‘neither…nor,' the verb agrees with the subject closer to it."}},
{"id":"s3-rw-conv-20","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>Dr. Okafor is one of those field researchers who ______ never fully satisfied with a single tidy explanation for a phenomenon.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["is","are","was","has been"],"ans":1,"exp":{"why":"In a ‘one of those…who' construction, ‘who' refers to the plural ‘researchers,' so the verb is plural ‘are.'","traps":{"A":"‘Is' wrongly agrees with ‘one' rather than with the plural ‘researchers' that ‘who' refers to.","B":"Correct: ‘are' agrees with the plural ‘researchers,' the antecedent of ‘who.'","C":"‘Was' is singular and also shifts the tense.","D":"‘Has been' is singular and misidentifies the antecedent."},"skill":"Form, Structure & Sense","strat":"In ‘one of those X who,' the verb agrees with the plural X, not with ‘one.'"}},
{"id":"s3-rw-conv-21","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"H","type":"mcq","stim":"<p>The hiring committee recommended that the new analyst ______ a senior mentor throughout her first month on the job.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["be assigned","is assigned","was assigned","will be assigned"],"ans":0,"exp":{"why":"After a verb of recommendation, the subordinate clause takes the subjunctive base form ‘be assigned.'","traps":{"A":"Correct: the subjunctive ‘be assigned' follows ‘recommended that.'","B":"‘Is assigned' is indicative, not the required subjunctive form.","C":"‘Was assigned' is indicative past and not subjunctive.","D":"‘Will be assigned' is future indicative, not the subjunctive required after ‘recommended.'"},"skill":"Form, Structure & Sense","strat":"After recommend, require, or suggest that, use the base-form subjunctive verb."}},
{"id":"s3-rw-conv-22","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>The lingering disagreement over the annual budget remained strictly between the director and ______.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["I","myself","we","me"],"ans":3,"exp":{"why":"The pronoun is an object of the preposition ‘between,' so the objective-case ‘me' is required.","traps":{"A":"‘I' is subjective case and cannot serve as the object of ‘between.'","B":"‘Myself' is a reflexive pronoun with no antecedent to reflect here.","C":"‘We' is subjective case and cannot be an object.","D":"Correct: objective-case ‘me' follows the preposition ‘between.'"},"skill":"Form, Structure & Sense","strat":"After a preposition like ‘between,' use the objective pronoun (me, him, her, us, them)."}},
{"id":"s3-rw-conv-23","sec":"rw","dom":"conv","skill":"Form, Structure & Sense","dif":"M","type":"mcq","stim":"<p>Walking slowly along the fog-covered shoreline just after dawn, ______.</p>","prompt":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the lighthouse gradually came into view","a pod of dolphins was spotted offshore","we spotted a pod of dolphins offshore","there were dolphins visible offshore"],"ans":2,"exp":{"why":"The introductory participial phrase must modify the noun that does the walking, so the main clause needs a subject who can walk, ‘we.'","traps":{"A":"This makes the lighthouse the walker, a dangling modifier.","B":"The passive construction leaves the phrase attached to the dolphins, who were not walking.","C":"Correct: ‘we' is the one walking, so the modifier attaches properly.","D":"‘There' cannot be the walker, so the modifier dangles."},"skill":"Form, Structure & Sense","strat":"The noun right after an introductory ‑ing phrase must be the one performing that action."}},
