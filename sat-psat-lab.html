 right side."},"s3-ma-alg-05":{"concept":"Two fractions set equal call for cross-multiplication: a/b = c/d becomes a·d = b·c, which clears both denominators at once. After that you have a normal linear equation; gather the x terms on one side and constants on the other.","steps":["Cross-multiply (x + 2)/3 = (x − 4)/2: 2(x + 2) = 3(x − 4).","Distribute: 2x + 4 = 3x − 12.","Subtract 2x from both sides: 4 = x − 12.","Add 12 to both sides: x = 16, which is choice A."],"alt":"Clear fractions by multiplying every term by the LCD 6: 6·(x+2)/3 = 2(x + 2) and 6·(x−4)/2 = 3(x − 4), giving 2(x + 2) = 3(x − 4) — the same equation, leading to x = 16.","check":"Substitute x = 16: left (16 + 2)/3 = 18/3 = 6; right (16 − 4)/2 = 12/2 = 6. Both equal 6 ✓."},"s3-ma-alg-06":{"concept":"When x appears on both sides, first collect the x terms on one side by subtracting the smaller x term from both sides, then move the constants to the other side. Choosing to subtract the smaller coefficient (2x) keeps the x coefficient positive and the arithmetic friendly.","steps":["Start with 4x − 9 = 2x + 7. Subtract 2x from both sides: 2x − 9 = 7.","Add 9 to both sides: 2x = 16.","Divide both sides by 2: x = 8, which is choice A."],"alt":"Back-solve: test A) x = 8 → left 4(8) − 9 = 32 − 9 = 23; right 2(8) + 7 = 16 + 7 = 23. Both sides equal 23 ✓.","check":"Substitute x = 8: 4(8) − 9 = 23 and 2(8) + 7 = 23; both sides match ✓."},"s3-ma-alg-07":{"concept":"'Solve for W in terms of P and L' means rearrange the formula so W stands alone, treating the other letters as if they were numbers. Use the same balancing moves as with numbers: undo what's attached to the W-term. Here 2L is added and W is multiplied by 2.","steps":["Start with P = 2L + 2W. Subtract 2L from both sides: P − 2L = 2W.","Divide both sides by 2: (P − 2L)/2 = W.","So W = (P − 2L)/2, which is choice A."],"alt":"Sanity-check with numbers: let L = 3 and W = 4, so P = 2(3) + 2(4) = 14. The correct formula must return W = 4: (P − 2L)/2 = (14 − 6)/2 = 8/2 = 4 ✓. Choice B, P − 2L = 8, fails.","check":"Substitute W = (P − 2L)/2 back into 2L + 2W: 2L + 2·(P − 2L)/2 = 2L + (P − 2L) = P ✓, recovering the original formula."},"s3-ma-alg-08":{"concept":"When an equation contains several fractions, multiply EVERY term by the least common denominator (LCD) to clear all fractions at once. The LCD of 3 and 2 is 6. Be careful to multiply the entire numerator of each fraction and to distribute any minus signs.","steps":["Multiply every term of (2x + 1)/3 − (x − 1)/2 = 1 by 6: 6·(2x+1)/3 − 6·(x−1)/2 = 6·1.","Simplify each: 2(2x + 1) − 3(x − 1) = 6.","Distribute carefully: 4x + 2 − 3x + 3 = 6 (note −3·−1 = +3).","Combine like terms: x + 5 = 6, so x = 1, which is choice A."],"alt":"Back-solve: test A) x = 1 → (2·1 + 1)/3 − (1 − 1)/2 = 3/3 − 0/2 = 1 − 0 = 1 ✓. Clean and instant.","check":"Substitute x = 1: (2+1)/3 − (1−1)/2 = 1 − 0 = 1 ✓, matching the right side."},"s3-ma-alg-09":{"concept":"Solving a literal equation (letters instead of numbers) uses the exact same balancing steps; just treat a, h, k as fixed numbers. Since a ≠ 0 you're allowed to divide by it. Undo the multiplication by a first, then undo the subtraction of h.","steps":["Start with a(x − h) = k. Divide both sides by a: x − h = k/a.","Add h to both sides: x = k/a + h.","Combine over a common denominator: x = k/a + ah/a = (k + ah)/a, which is choice A."],"alt":"Distribute first: ax − ah = k. Add ah: ax = k + ah. Divide by a: x = (k + ah)/a. Same result. Or test numbers: a = 2, h = 3, k = 4 give x − 3 = 2 → x = 5; choice A gives (4 + 6)/2 = 5 ✓.","check":"Substitute x = (k + ah)/a into a(x − h): a·((k + ah)/a − h) = (k + ah) − ah = k ✓, recovering the right side."},"s3-ma-alg-10":{"concept":"Decimals don't change the method — balance both sides the same way. If decimals feel error-prone, you can multiply the whole equation by a power of 10 to make everything integers. Here the numbers are one decimal place, so multiplying by 10 clears them.","steps":["Distribute the left side: 0.2(x − 3) = 0.2x − 0.6, so 0.2x − 0.6 = 0.5x − 2.1.","Subtract 0.2x from both sides: −0.6 = 0.3x − 2.1.","Add 2.1 to both sides: 1.5 = 0.3x.","Divide by 0.3: x = 1.5/0.3 = 5, which is choice A."],"alt":"Clear decimals first: multiply everything by 10 to get 2(x − 3) = 5x − 21. Distribute: 2x − 6 = 5x − 21. Subtract 2x: −6 = 3x − 21. Add 21: 15 = 3x. Divide: x = 5.","check":"Substitute x = 5: left 0.2(5 − 3) = 0.2·2 = 0.4; right 0.5(5) − 2.1 = 2.5 − 2.1 = 0.4. Both equal 0.4 ✓."},"s3-ma-alg-11":{"concept":"Slope measures steepness as 'rise over run' — how much y changes for a given change in x. For two points (x₁, y₁) and (x₂, y₂), slope = (y₂ − y₁)/(x₂ − x₁). Subtract the coordinates in the SAME order top and bottom so the sign comes out right.","steps":["Label the points: (x₁, y₁) = (2, 3) and (x₂, y₂) = (6, 11).","Rise = y₂ − y₁ = 11 − 3 = 8. Run = x₂ − x₁ = 6 − 2 = 4.","Slope = rise/run = 8/4 = 2, which is choice A."],"alt":"Sanity-check by direction: as x goes from 2 to 6 (up 4), y goes from 3 to 11 (up 8). Both increase, so the slope is positive, and 8 up for 4 across is 2 up for every 1 across — slope 2. This rules out the negative trap −2.","check":"Use the slope to predict: starting at (2, 3), moving 4 right should raise y by 4·2 = 8, landing at y = 11 — exactly the second point (6, 11) ✓."},"s3-ma-alg-12":{"concept":"A function is just a rule that takes an input and produces one output. The notation f(x) means 'the output of the rule f when the input is x.' So f(5) is asking: run the rule with 5 in place of x. Wherever you see the letter x in the formula, you swap in the number 5 — that is all 'evaluating a function' means.","steps":["Write the rule: f(x) = 3x − 4.","Replace every x with 5: f(5) = 3(5) − 4.","Multiply first (order of operations): 3 × 5 = 15.","Subtract: 15 − 4 = 11.","So f(5) = 11, which is choice A."],"alt":"Think of it as a machine: you drop 5 in, the machine triples it to 15, then takes away 4, leaving 11. You can also picture the line y = 3x − 4 and read the height directly above x = 5 — it sits at y = 11.","check":"Reasonableness: at x = 5 the '3x' part gives 15, and subtracting only 4 should leave something in the low teens. 11 fits. The wrong answers 19 and 7 come from adding 4 or from 3 + 4·... slips; 11 is the clean result."},"s3-ma-alg-13":{"concept":"Every straight line can be written as y = mx + b, where m is the slope (how much y changes for each 1-step increase in x) and b is the y-intercept (the y-value when x = 0). The point (0, −3) has x = 0, so its y-value IS the intercept b. Once you know m and b, you have the full equation and can find y for any x.","steps":["Identify slope m = 4 and, from the point (0, −3), intercept b = −3.","Write the line: y = 4x − 3.","Substitute x = 2: y = 4(2) − 3.","Multiply: 4 × 2 = 8.","Subtract: 8 − 3 = 5."],"alt":"Use slope directly without writing the equation: start at the known point (0, −3). Slope 4 means every time x goes up by 1, y goes up by 4. Going from x = 0 to x = 2 is 2 steps, so y rises 2 × 4 = 8: −3 + 8 = 5.","check":"Plug x = 2 back: 4(2) − 3 = 8 − 3 = 5. Also confirm the given point works: at x = 0, y = 4(0) − 3 = −3. Both check out."},"s3-ma-alg-14":{"concept":"Parallel lines run in the same direction forever and never meet, which means they have exactly the same slope. In y = mx + b the slope is the number multiplying x. So any line parallel to y = 3x + 5 must also have slope 3 — only the intercept b changes. You then pick b so the line passes through the required point.","steps":["Read the slope of the given line: m = 3.","The parallel line has the same slope, so it looks like y = 3x + b.","Force it through (1, 2): plug in x = 1, y = 2: 2 = 3(1) + b.","Solve: 2 = 3 + b, so b = −1.","The equation is y = 3x − 1, which is choice A."],"alt":"Test the choices instead. A parallel line must have slope 3, which eliminates the two choices with slope −1/3 and 1/3. Between y = 3x − 1 and y = 3x + 2, plug in the point (1, 2): for y = 3x − 1, 3(1) − 1 = 2 ✓; for y = 3x + 2, 3(1) + 2 = 5 ✗. Only A works.","check":"Substitute the point into your answer: 3(1) − 1 = 2, matching the given y = 2. And the slope 3 matches the original line's slope, confirming parallel."},"s3-ma-alg-15":{"concept":"Perpendicular lines cross at a right angle (90°). Their slopes are 'negative reciprocals' of each other: flip the fraction and change the sign. So if one slope is 2/3, the perpendicular slope is −3/2. A quick memory aid: the two slopes multiply to −1. After finding the new slope, you anchor the line to the given point to find its intercept.","steps":["Given slope is 2/3; take the negative reciprocal: flip to 3/2, add a minus sign → −3/2.","The line looks like y = −(3/2)x + b.","Force it through (4, −1): −1 = −(3/2)(4) + b.","Compute −(3/2)(4) = −6, so −1 = −6 + b, giving b = 5.","The equation is y = −(3/2)x + 5, which is choice A."],"alt":"Eliminate by slope first: perpendicular to slope 2/3 must be −3/2, so throw out the choices with slope 2/3 and −2/3. That leaves y = −(3/2)x + 5 and y = −(3/2)x − 5. Test (4, −1): −(3/2)(4) + 5 = −6 + 5 = −1 ✓. Choice A wins.","check":"Confirm the slopes multiply to −1: (2/3)(−3/2) = −1 ✓ (truly perpendicular). Then substitute the point: −(3/2)(4) + 5 = −6 + 5 = −1, matching the given y = −1."},"s3-ma-alg-16":{"concept":"Evaluating a function goes input → output; here we run it backward. We are told the OUTPUT is 1 (f(x) = 1) and must find the INPUT x that produces it. Since f(x) is the expression 2x + 7, setting f(x) = 1 just means solving the equation 2x + 7 = 1 using inverse operations (undo the +7, then undo the ×2).","steps":["Replace f(x) with its formula: 2x + 7 = 1.","Undo the +7 by subtracting 7 from both sides: 2x = 1 − 7 = −6.","Undo the ×2 by dividing both sides by 2: x = −6/2.","Simplify: x = −3."],"alt":"Back-solve by testing a value: try x = −3. Then f(−3) = 2(−3) + 7 = −6 + 7 = 1 ✓. Since the output equals the required 1, x = −3 is correct. A negative x makes sense because the output 1 is smaller than the intercept 7.","check":"Substitute x = −3 into the original: 2(−3) + 7 = −6 + 7 = 1, which is exactly the target output. Confirmed."},"s3-ma-alg-17":{"concept":"In a linear model like C = 15 + 0.2m, the constant 15 is the starting amount (the cost before any miles, i.e., the base fee), and the number attached to the variable m is the RATE — how much the total changes for each one-unit increase in m. Here 0.2 multiplies m (miles), so it is dollars added per extra mile. Rate-of-change always carries the units 'output per input,' i.e., dollars per mile.","steps":["Match the form C = (start) + (rate)(variable): start = 15, rate = 0.2, variable = m = miles.","The rate 0.2 tells how C grows for each additional 1 mile.","Increasing m by 1 raises C by 0.2 dollars, i.e., $0.20.","So 0.2 = cost per mile: 'cost increases by $0.20 for each additional mile,' choice A."],"alt":"Test with real numbers. At m = 10, C = 15 + 0.2(10) = 17. At m = 11, C = 15 + 0.2(11) = 17.20. Going one more mile added exactly $0.20 — that is what 0.2 does. The base fee is the 15, not the 0.2, which rules out the other choices.","check":"Compare two mile-values: the cost jump per single mile equals 0.20 every time, confirming 0.2 is the per-mile rate, not the base fee (15) or a total."},"s3-ma-alg-18":{"concept":"The x-intercept is the point where a line crosses the x-axis. On the x-axis the height is zero, so every x-intercept has y = 0. To find it, substitute y = 0 into the equation and solve for x. (Likewise the y-intercept sets x = 0.) The answer is written as a point (x, 0).","steps":["Start with 4x − 3y = 12 and set y = 0.","The equation becomes 4x − 3(0) = 12, i.e., 4x = 12.","Divide both sides by 4: x = 3.","Write it as a point: (3, 0), which is choice A."],"alt":"Test the choices: an x-intercept must have y = 0, which immediately eliminates (0, −4). Plug the remaining (3,0), (4,0), (−3,0) into 4x − 3y: 4(3) = 12 ✓, 4(4) = 16 ✗, 4(−3) = −12 ✗. Only (3, 0) gives 12.","check":"Substitute (3, 0) into the original: 4(3) − 3(0) = 12 − 0 = 12 ✓, which matches the right-hand side."},"s3-ma-alg-19":{"concept":"Two points completely determine a line. First find the slope with the formula m = (change in y)/(change in x) = (y₂ − y₁)/(x₂ − x₁) — 'rise over run.' Then use one point with y = mx + b to find the intercept b. Be careful with signs when subtracting negatives.","steps":["Slope = (−7 − 5)/(4 − (−2)) = (−12)/(6) = −2.","So the line is y = −2x + b.","Plug in point (−2, 5): 5 = −2(−2) + b = 4 + b.","Solve: b = 5 − 4 = 1.","The equation is y = −2x + 1, which is choice A."],"alt":"All four choices have y = −2x + something, so the slope doesn't separate them — test the point (−2, 5) instead. y = −2(−2) + 1 = 4 + 1 = 5 ✓. The others give 4 + (−3) = 1, 4 + 9 = 13, 4 + 5 = 9 — none equal 5. Choice A is the only match.","check":"Verify BOTH points on y = −2x + 1: at x = −2, y = 4 + 1 = 5 ✓; at x = 4, y = −8 + 1 = −7 ✓. Both original points lie on the line."},"s3-ma-alg-20":{"concept":"A linear function has a constant slope, so it can be written f(x) = mx + b. Being given two input–output pairs is exactly like being given two points, (1, 4) and (4, 16). Find the slope from them, then the intercept b — and note that f(0) IS the intercept b, since plugging x = 0 leaves just b.","steps":["Treat the values as points (1, 4) and (4, 16).","Slope = (16 − 4)/(4 − 1) = 12/3 = 4, so f(x) = 4x + b.","Use f(1) = 4: 4(1) + b = 4, so 4 + b = 4, giving b = 0.","f(0) = 4(0) + b = b = 0."],"alt":"Use the constant-rate idea directly. From x = 1 to x = 4 (3 steps) the output rose 12, so each step is +4. Going backward from f(1) = 4 to f(0) is one step down in x, so subtract 4: 4 − 4 = 0. So f(0) = 0.","check":"Test the full rule f(x) = 4x against both givens: f(1) = 4 ✓ and f(4) = 16 ✓. Since both hold, f(0) = 0 is trustworthy."},"s3-ma-alg-21":{"concept":"A 'system' is two equations that must be true at the same time. The elimination method adds or subtracts the equations to cancel one variable. Here one equation has +y and the other has −y; adding them makes the y-terms cancel (y + (−y) = 0), leaving a single equation in x that you can solve instantly.","steps":["Write them lined up: x + y = 10 and x − y = 4.","Add straight down: (x + x) + (y − y) = 10 + 4.","The y's cancel: 2x = 14.","Divide by 2: x = 7, which is choice A."],"alt":"Back-solve with the choices. Try x = 7: from x + y = 10, y = 3; check x − y = 7 − 3 = 4 ✓. Both equations hold, so x = 7. (x = 5 would give y = 5 and x − y = 0, wrong.)","check":"Find y then verify both: x = 7 gives y = 3. Check equation 1: 7 + 3 = 10 ✓. Check equation 2: 7 − 3 = 4 ✓. Both satisfied."},"s3-ma-alg-22":{"concept":"The substitution method is ideal when one equation already tells you what a variable equals. Here y = 2x, so anywhere you see y you may replace it with 2x. This turns the second equation into one with only x, which you solve — then back out y. Substitution just avoids having two unknowns at once.","steps":["Replace y with 2x in x + y = 9: x + 2x = 9.","Combine like terms: 3x = 9.","Divide by 3: x = 3.","Find y using y = 2x: y = 2(3) = 6."],"alt":"Reason in parts: since y = 2x, y is twice x, so together x + y = x + 2x is 3 equal 'x-sized' parts totaling 9. Each part is 9/3 = 3, and y is two parts = 6.","check":"Plug back into both: y = 2x → 6 = 2(3) ✓; x + y = 3 + 6 = 9 ✓. Both original equations hold."},"s3-ma-alg-23":{"concept":"When both equations share an identical term (here both start with 2x), subtracting one equation from the other cancels that term. Subtracting removes x and leaves an equation in y alone; solve for y, then substitute back to get x. Line the equations up and subtract term by term, watching signs carefully.","steps":["Subtract the second from the first: (2x + 3y) − (2x − y) = 12 − 4.","The 2x cancels; 3y − (−y) = 4y, and 12 − 4 = 8: so 4y = 8.","Divide by 4: y = 2.","Substitute into 2x − y = 4: 2x − 2 = 4, so 2x = 6, x = 3 (choice A)."],"alt":"Back-solve with the choices. Try x = 3: from 2x − y = 4, 6 − y = 4 → y = 2. Check the first: 2(3) + 3(2) = 6 + 6 = 12 ✓. Works, so x = 3.","check":"Use x = 3, y = 2 in both originals: 2(3) + 3(2) = 12 ✓ and 2(3) − 2 = 4 ✓. Both confirmed."},"s3-ma-alg-24":{"concept":"Word problems become systems when two facts each give an equation. Name the unknowns with letters, then translate each sentence. 'Total number of tickets' gives a count equation; 'total money' gives a value equation (price × quantity). With two equations and two unknowns, substitution or elimination solves it.","steps":["Let a = adult tickets, c = child tickets. Count: a + c = 20. Money: 8a + 5c = 130.","Solve the count equation for c: c = 20 − a.","Substitute into the money equation: 8a + 5(20 − a) = 130.","Distribute: 8a + 100 − 5a = 130, i.e., 3a + 100 = 130.","Subtract 100: 3a = 30; divide by 3: a = 10 (choice A)."],"alt":"Back-solve with a = 10: then c = 20 − 10 = 10 children. Money check: 8(10) + 5(10) = 80 + 50 = 130 ✓. Matches the $130 total, so 10 adult tickets is right.","check":"Tickets: 10 adult + 10 child = 20 ✓. Dollars: 80 + 50 = 130 ✓. Both conditions met."},"s3-ma-alg-25":{"concept":"'Sum and difference' problems are a classic system. Let the two numbers be x (larger) and y (smaller). 'Sum is 40' gives x + y = 40; 'difference is 8' gives x − y = 8. Adding the equations cancels y and isolates x — a fast route to the larger number.","steps":["Set up: x + y = 40 and x − y = 8.","Add the equations: (x + y) + (x − y) = 40 + 8.","The y's cancel: 2x = 48.","Divide by 2: x = 24 (the larger number).","Optional: y = 40 − 24 = 16."],"alt":"Shortcut worth memorizing: the larger of two numbers is (sum + difference)/2 = (40 + 8)/2 = 48/2 = 24. The smaller is (sum − difference)/2 = 32/2 = 16.","check":"Check both facts with 24 and 16: sum 24 + 16 = 40 ✓, difference 24 − 16 = 8 ✓. And 24 is indeed the larger."},"s3-ma-alg-26":{"concept":"Two linear equations graph as two lines. 'No solution' means the lines never cross — they are parallel: same slope but different intercepts. In standard form ax + by = c, lines are parallel when the coefficient ratios match (a₁/a₂ = b₁/b₂) BUT the constant ratio differs. So set the x- and y-coefficient ratios equal to find k, then confirm the constants don't follow the same ratio.","steps":["Compare 2x + ky = 5 and 4x + 6y = 9. Match x-coefficients: 2/4 = 1/2.","For parallel lines, y-coefficients share that ratio: k/6 = 1/2.","Solve: k = 6 × (1/2) = 3.","Confirm 'no solution' (not 'infinitely many'): constants give 5/9, and 5/9 ≠ 1/2, so the lines are parallel but distinct.","Thus k = 3, choice A."],"alt":"Make the x-terms identical: multiply the first equation by 2 → 4x + 2ky = 10. For it to be parallel to 4x + 6y = 9, the y-terms must match: 2k = 6, so k = 3. The constants 10 vs 9 differ, confirming no solution (parallel, not identical).","check":"With k = 3, the first line's slope is −2/3 (from 2x + 3y = 5) and the second is also −2/3 (from 4x + 6y = 9). Equal slopes, unequal intercepts → parallel → no solution ✓."},"s3-ma-alg-27":{"concept":"'Infinitely many solutions' means the two equations are secretly the SAME line — one is just a multiple of the other, so every point on the line satisfies both. In that case, whatever number you multiply the whole first equation by must also produce the second equation's constant. Compare the x-coefficients to find the multiplier, then apply it to the constant.","steps":["Compare 3x − 2y = 7 with 9x − 6y = c. See how the x-terms relate: 9 = 3 × 3, so the multiplier is 3.","Check the y-terms agree: −2 × 3 = −6 ✓ (matches).","For the same line, multiply the constant too: 7 × 3 = 21.","So c = 21, choice A."],"alt":"Divide the second equation by 3: (9x − 6y)/3 = c/3 gives 3x − 2y = c/3. For this to be identical to 3x − 2y = 7, we need c/3 = 7, so c = 21.","check":"Multiply the first equation entirely by 3: 3(3x − 2y) = 3(7) → 9x − 6y = 21. This is exactly the second equation when c = 21, so they coincide → infinitely many solutions ✓."},"s3-ma-alg-28":{"concept":"Rate problems use speed = distance ÷ time. Downstream, the current helps, so the effective speed is (boat + current) = b + c. Upstream, the current opposes, so it is (boat − current) = b − c. Computing each effective speed from the given distance and time gives two equations; adding them cancels c and reveals the boat's still-water speed b.","steps":["Downstream speed = 36 miles ÷ 3 hours = 12 mph, so b + c = 12.","Upstream speed = 36 miles ÷ 6 hours = 6 mph, so b − c = 6.","Add the equations: (b + c) + (b − c) = 12 + 6, so 2b = 18.","Divide by 2: b = 9 mph, choice A."],"alt":"The still-water speed is the average of the downstream and upstream speeds, because the current adds the same amount one way and subtracts it the other: b = (12 + 6)/2 = 18/2 = 9. (The current is half the difference: (12 − 6)/2 = 3.)","check":"With b = 9 and c = 3: downstream 9 + 3 = 12 mph covers 36 mi in 36/12 = 3 h ✓; upstream 9 − 3 = 6 mph covers 36 mi in 36/6 = 6 h ✓."},"s3-ma-alg-29":{"concept":"Elimination shines when the two equations have opposite coefficients on a variable — here +2y and −2y. Adding the equations makes the y-terms vanish, leaving one equation in x. After finding x, substitute to get y. The question wants x + y, so combine at the end. Watch signs, especially with negative y-values.","steps":["Add 3x + 2y = 4 and 5x − 2y = 12: the 2y and −2y cancel, giving 8x = 16.","Divide by 8: x = 2.","Substitute into 3x + 2y = 4: 3(2) + 2y = 4, so 6 + 2y = 4.","Solve: 2y = −2, y = −1.","Add: x + y = 2 + (−1) = 1."],"alt":"Notice x + y is requested, not x and y separately. Still, elimination is cleanest here. As a sanity route you could add the two equations to get 8x = 16 (x = 2) and, once y = −1 is found, immediately combine — no need to fully re-derive each piece.","check":"Verify both originals with x = 2, y = −1: 3(2) + 2(−1) = 6 − 2 = 4 ✓; 5(2) − 2(−1) = 10 + 2 = 12 ✓. Then x + y = 1."},"s3-ma-alg-30":{"concept":"When neither variable cancels on its own, use the elimination method with scaling: multiply each equation by a number so one variable ends up with matching coefficients, then subtract to eliminate it. Here we scale both equations so the pen-terms (p) match at 6p, then subtract to leave only notebooks (n).","steps":["Equations: 3p + 2n = 13 and 2p + 5n = 16.","Make p-coefficients equal to 6: multiply the first by 2 → 6p + 4n = 26; multiply the second by 3 → 6p + 15n = 48.","Subtract the first new equation from the second: (15n − 4n) = 48 − 26, so 11n = 22.","Divide by 11: n = 2, so one notebook costs $2 (choice A)."],"alt":"Back-solve with the choices. Try n = 2: from 3p + 2(2) = 13, 3p = 9, p = 3. Check the other equation: 2(3) + 5(2) = 6 + 10 = 16 ✓. Both hold, so a notebook is $2.","check":"With p = 3, n = 2: first bundle 3(3) + 2(2) = 9 + 4 = 13 ✓; second bundle 2(3) + 5(2) = 6 + 10 = 16 ✓. Both prices confirmed."},"s3-ma-alg-31":{"concept":"Solving a linear inequality works just like solving an equation: isolate x by undoing operations on both sides. The '>' behaves like '=' EXCEPT for one special rule (multiplying or dividing by a negative flips the direction). Here we only subtract and divide by a positive, so the inequality sign stays pointing the same way.","steps":["Start: 2x + 3 > 11.","Subtract 3 from both sides: 2x > 8.","Divide both sides by 2 (positive, so no flip): x > 4.","That is choice A."],"alt":"Test a boundary and a sample. At x = 4: 2(4) + 3 = 11, which is not greater than 11, so 4 is excluded → strict '>'. Try x = 5: 2(5) + 3 = 13 > 11 ✓. Values above 4 work, matching x > 4.","check":"Pick x = 10 (in the solution): 2(10) + 3 = 23 > 11 ✓. Pick x = 0 (outside): 3 > 11 is false ✓. The boundary at 4 is correct."},"s3-ma-alg-32":{"concept":"The one rule that makes inequalities different from equations: when you multiply or divide both sides by a NEGATIVE number, you must FLIP the inequality sign. Here x is multiplied by −3, so dividing by −3 to isolate x forces ≤ to become ≥. Forgetting to flip is the most common inequality mistake.","steps":["Start: −3x ≤ 12.","Divide both sides by −3 to isolate x.","Because −3 is negative, flip ≤ to ≥.","Compute 12 ÷ (−3) = −4, giving x ≥ −4 (choice A)."],"alt":"Test to confirm the direction. Try x = 0: −3(0) = 0 ≤ 12 ✓, so 0 should be in the solution. x ≥ −4 includes 0 ✓, while x ≤ −4 would exclude it. So the sign must be ≥.","check":"Try x = −4 (boundary): −3(−4) = 12 ≤ 12 ✓ (equality allowed). Try x = 5: −3(5) = −15 ≤ 12 ✓. Solution x ≥ −4 holds."},"s3-ma-alg-33":{"concept":"'Least value that satisfies' means solve the inequality, then take the smallest x allowed. Solve normally by undoing operations. Because we add and divide by positives, the sign doesn't flip. The '≥' includes equality, so the boundary value itself IS allowed and becomes the least value.","steps":["Start: 5x − 2 ≥ 13.","Add 2 to both sides: 5x ≥ 15.","Divide by 5 (positive, no flip): x ≥ 3.","Since ≥ includes 3, the least value is x = 3."],"alt":"Plug the boundary straight in: does x = 3 satisfy it? 5(3) − 2 = 15 − 2 = 13, and 13 ≥ 13 is true. Anything below 3, like 2, gives 8 which fails. So 3 is exactly the smallest that works.","check":"Test x = 3: 5(3) − 2 = 13 ≥ 13 ✓. Test x = 2 (just below): 5(2) − 2 = 8 ≥ 13 is false. So 3 is truly the least."},"s3-ma-alg-34":{"concept":"Handle a fraction in an inequality just as in an equation: isolate the fraction, then multiply both sides by the denominator. Here x is divided by 2. We add 4 first, then multiply both sides by the positive number 2. Multiplying by a positive keeps the inequality direction unchanged.","steps":["Start: (x/2) − 4 < 1.","Add 4 to both sides: x/2 < 5.","Multiply both sides by 2 (positive, no flip): x < 10.","That is choice A."],"alt":"Test a value near the boundary. Try x = 10: (10/2) − 4 = 5 − 4 = 1, which is not less than 1, so 10 is excluded → strict '<'. Try x = 8: 4 − 4 = 0 < 1 ✓. Values below 10 work, giving x < 10.","check":"Pick x = 0 (in solution): (0/2) − 4 = −4 < 1 ✓. Pick x = 12 (outside): 6 − 4 = 2 < 1 is false ✓. Boundary 10 confirmed."},"s3-ma-alg-35":{"concept":"A compound inequality like −3 < 2x − 1 ≤ 5 is really two conditions at once, and x must satisfy both. The efficient method is to treat all THREE parts together: whatever you do to the middle, do equally to the left and right parts. Add and divide across all three sections to isolate x in the middle.","steps":["Start: −3 < 2x − 1 ≤ 5.","Add 1 to all three parts: −3 + 1 < 2x ≤ 5 + 1, i.e., −2 < 2x ≤ 6.","Divide all three parts by 2 (positive, no flips): −1 < x ≤ 3.","That is choice A. Note the strict '<' stays strict and '≤' stays inclusive.","So −1 is excluded, 3 is included."],"alt":"Split into two inequalities and combine. Left: −3 < 2x − 1 → −2 < 2x → x > −1. Right: 2x − 1 ≤ 5 → 2x ≤ 6 → x ≤ 3. Together: −1 < x ≤ 3, matching choice A.","check":"Test x = 3 (should be allowed): 2(3) − 1 = 5, and −3 < 5 ≤ 5 ✓. Test x = −1 (should be excluded): 2(−1) − 1 = −3, and −3 < −3 is false ✓. Endpoints behave correctly."},"s3-ma-alg-36":{"concept":"'Greatest number' with a spending limit is a real-world inequality. Total spending must be ≤ the money available. Build the total cost (fixed gift plus a per-ride cost times the number of rides) and set it ≤ 50. Solve for r. Because you can't take a fraction of a ride, round DOWN to the nearest whole number at the end.","steps":["Total spent = 12 (gift) + 4r (rides), and it must be ≤ 50: 12 + 4r ≤ 50.","Subtract 12: 4r ≤ 38.","Divide by 4: r ≤ 9.5.","Rides must be whole numbers, so round down: r = 9."],"alt":"Reason with money directly: after the $12 gift, Maria has 50 − 12 = $38 left. Each ride is $4, so 38 ÷ 4 = 9.5 rides' worth. She can only take 9 full rides (9 rides cost $36, leaving $2 — not enough for a 10th).","check":"Cost of 9 rides: 12 + 4(9) = 12 + 36 = 48 ≤ 50 ✓. Cost of 10 rides: 12 + 40 = 52 > 50 ✗. So 9 is the greatest possible."},"s3-ma-alg-37":{"concept":"'At least $500' means the total must be ≥ 500. Model the money as the starting amount plus the per-member earning times the number of new members, and set it ≥ 500. Solve for m. Since members are whole people and the goal is a minimum, if the division comes out even you take that number; otherwise you round UP to be sure the goal is reached.","steps":["Total money = 200 (already have) + 15m (new members): 200 + 15m ≥ 500.","Subtract 200: 15m ≥ 300.","Divide by 15: m ≥ 20.","The least whole number satisfying m ≥ 20 is 20 (choice A)."],"alt":"Money reasoning: the club still needs 500 − 200 = $300. Each member brings $15, so 300 ÷ 15 = 20 members exactly. Since it divides evenly, 20 members gets them precisely to the goal.","check":"With 20 members: 200 + 15(20) = 200 + 300 = 500 ≥ 500 ✓. With 19: 200 + 285 = 485 < 500 ✗. So 20 is the least number needed."},"s3-ma-alg-38":{"concept":"An inequality is like an equation, but instead of an equals sign it uses ≤, ≥, <, or >, so its answer is a whole range of numbers rather than one value. You solve it almost exactly like an equation — do the same thing to both sides to isolate x. The ONE special rule: whenever you multiply or divide both sides by a negative number, you must flip the inequality sign. Here we avoid that trap entirely by moving x to the side that keeps its coefficient positive.","steps":["Distribute the 3 on the left: 3·x − 3·2 = 3x − 6, so the inequality is 3x − 6 ≤ 5x + 4.","Get the x terms together by subtracting 3x from both sides: −6 ≤ 2x + 4 (the left side keeps a positive 2x, so no sign flip needed).","Subtract 4 from both sides: −6 − 4 = −10, giving −10 ≤ 2x.","Divide both sides by 2 (a positive number, so the sign stays): −5 ≤ x.","Read −5 ≤ x from right to left: x is greater than or equal to −5, i.e. x ≥ −5, which is choice A."],"alt":"Back-solve by testing a number. Pick x = 0 (easy and inside choice A’s range x ≥ −5). Original: 3(0 − 2) = −6 on the left, and 5(0) + 4 = 4 on the right. Is −6 ≤ 4? Yes, so x = 0 must be in the answer. That immediately kills choices B (x ≤ −5) and D would still allow 0, so also test x = −10: 3(−12) = −36 ≤ 5(−10)+4 = −46? Is −36 ≤ −46? No. So x = −10 is NOT a solution, which eliminates B. Only A survives.","check":"Test the boundary and one point inside. At x = −5: 3(−5 − 2) = −21 and 5(−5) + 4 = −21, so −21 ≤ −21 is true (equality holds, confirming ≥ includes −5). At x = 0 (inside): −6 ≤ 4 is true. Both check out, so x ≥ −5 is correct."},"s3-ma-alg-39":{"concept":"This is a real-world inequality: ‘at most $45’ means the bill can equal $45 or be less, which translates to ≤ 45. The total cost has a fixed part ($30, paid no matter what) plus a variable part ($0.10 for each text). You build an expression for the total, set it ≤ the budget, and solve for the number of texts. Because you can’t send part of a text, the answer must be a whole number.","steps":["Let t = number of text messages. The variable cost is 0.10·t dollars.","Write the total bill and the budget condition: 30 + 0.10t ≤ 45.","Subtract 30 from both sides to isolate the text-cost term: 0.10t ≤ 15.","Divide both sides by 0.10 (positive, so no flip): t ≤ 15 / 0.10 = 150.","Since t must be a whole number of texts and t ≤ 150, the greatest allowed value is 150."],"alt":"Reason with money directly. After paying the fixed $30, the user has 45 − 30 = $15 left for texts. Each text costs $0.10, i.e. a dime. How many dimes are in $15? 15 ÷ 0.10 = 150. So 150 texts spends exactly the remaining $15, hitting the budget right on the nose.","check":"Plug t = 150 back in: 30 + 0.10(150) = 30 + 15 = 45, which meets ‘at most 45’ exactly. Try one more (151): 30 + 0.10(151) = 45.10 > 45, over budget. So 150 is the greatest number that works."},"s3-ma-alg-40":{"concept":"A compound inequality like −2 ≤ (3 − x)/2 < 4 is really two conditions stacked together, meaning the middle expression sits between −2 and 4. You solve it by doing the same operation to ALL THREE parts at once to peel the middle down to a bare x. The key rule returns here: multiplying or dividing every part by a negative number flips BOTH inequality signs. Finally you may need to rewrite the result so x reads left-to-right in increasing order.","steps":["Multiply all three parts by 2 to clear the fraction: −2·2 ≤ 3 − x < 4·2, giving −4 ≤ 3 − x < 8.","Subtract 3 from all three parts: −4 − 3 ≤ −x < 8 − 3, giving −7 ≤ −x < 5.","Multiply all three parts by −1 to turn −x into x, and FLIP both signs: 7 ≥ x > −5.","Rewrite from smallest to largest by reading it backward: −5 < x ≤ 7.","This matches choice A: −5 < x ≤ 7. Note the strict < at −5 (came from the strict < 4) and the ≤ at 7 (came from the ≤ −2)."],"alt":"Test the boundary points to nail the endpoints and which sign is strict. Try x = 7: (3 − 7)/2 = −4/2 = −2. The condition allows −2 (since −2 ≤ … is inclusive), so x = 7 IS included → we need ≤ 7. Try x = −5: (3 − (−5))/2 = 8/2 = 4. The condition is … < 4, and 4 is NOT less than 4, so x = −5 is excluded → we need > −5. Together: −5 < x ≤ 7, choice A. This also rules out C and D, whose endpoints are −7 and 5.","check":"Pick a value inside, say x = 0: (3 − 0)/2 = 1.5, and −2 ≤ 1.5 < 4 is true. Then confirm the endpoints as above: x = 7 gives exactly −2 (allowed), x = −5 gives exactly 4 (not allowed). Everything lines up with −5 < x ≤ 7."},"ma-adv-01":{"concept":"A quadratic equation set equal to 0 can often be solved by factoring — rewriting x² − 5x + 6 as a product of two simple pieces (x − p)(x − q). This works because of the Zero Product Property: if two things multiply to 0, at least one of them must be 0. To factor x² + bx + c, find two numbers that MULTIPLY to c and ADD to b. Then each factor set to zero gives a solution.","steps":["Identify b = −5 and c = 6. Find two numbers that multiply to 6 and add to −5.","The pair −2 and −3 works: (−2)(−3) = 6 and (−2) + (−3) = −5.","Factor: x² − 5x + 6 = (x − 2)(x − 3) = 0.","Apply the Zero Product Property: x − 2 = 0 or x − 3 = 0.","Solve each: x = 2 or x = 3, which is choice A."],"alt":"Back-solve by plugging the choices into x² − 5x + 6. Test x = 2: 4 − 10 + 6 = 0 ✓. Test x = 3: 9 − 15 + 6 = 0 ✓. Both roots in choice A give 0, so A is correct. A quick sanity check on B (x = −2): 4 + 10 + 6 = 20 ≠ 0, so B fails.","check":"Substitute both answers into the original. x = 2: 2² − 5(2) + 6 = 4 − 10 + 6 = 0 ✓. x = 3: 3² − 5(3) + 6 = 9 − 15 + 6 = 0 ✓. Both make the equation true."},"ma-adv-02":{"concept":"The equation x² = 49 asks: what number, when squared, gives 49? Squaring means multiplying a number by itself. A crucial fact is that TWO numbers square to 49 — a positive one and its negative twin — because a negative times a negative is positive. So x² = 49 has solutions x = 7 and x = −7. The extra condition x > 0 tells you to keep only the positive one.","steps":["Take the square root of both sides, remembering both signs: x = ±√49.","Since √49 = 7 (because 7 × 7 = 49), the two solutions are x = 7 and x = −7.","Apply the restriction x > 0, which rules out −7.","Therefore x = 7."],"alt":"Just think of perfect squares you know. 7² = 49 is a memorized fact from times tables. Since the problem wants the positive root, the answer is simply 7 — no algebra needed.","check":"Square the answer: 7² = 7 × 7 = 49 ✓, and 7 > 0 satisfies the condition. Correct."},"ma-adv-03":{"concept":"Multiplying two binomials (two-term expressions) like (x + 4)(x − 3) means every term in the first parenthesis must multiply every term in the second. A handy memory aid is FOIL: First, Outer, Inner, Last — the four products you must form. Then you combine any ‘like terms’ (terms with the same power of x) to simplify.","steps":["First: x · x = x².","Outer: x · (−3) = −3x.","Inner: 4 · x = 4x.","Last: 4 · (−3) = −12.","Add them: x² − 3x + 4x − 12, then combine −3x + 4x = +x to get x² + x − 12, choice A."],"alt":"Plug in an easy number for x, say x = 1, into both the original and each choice. Original: (1 + 4)(1 − 3) = (5)(−2) = −10. Now test choice A at x = 1: 1² + 1 − 12 = 1 + 1 − 12 = −10 ✓. Choice B: 1 − 1 − 12 = −12 ✗. Choice C: 1 + 7 − 12 = −4 ✗. Only A matches, so A is correct.","check":"Check the constant and middle term. The constant is the product of the last terms: 4 × (−3) = −12 ✓ (matches the −12 in A). The x-coefficient is the sum of Outer and Inner: −3 + 4 = +1 ✓. Both confirm x² + x − 12."},"ma-adv-04":{"concept":"Factoring reverses multiplication: you split 2x² + 7x + 3 back into two binomials that multiply to give it. When the leading coefficient isn’t 1 (here it’s 2), the front terms of the factors must multiply to 2x² and the back terms must multiply to 3, while the ‘Outer + Inner’ cross-products add to the middle 7x. The cleanest way to be sure is to expand each candidate and see which rebuilds the original.","steps":["The front terms must give 2x², so try (2x + _)(x + _). The back numbers must multiply to +3: options are 1 and 3.","Try (2x + 1)(x + 3). Expand with FOIL: First 2x·x = 2x²; Outer 2x·3 = 6x; Inner 1·x = x; Last 1·3 = 3.","Combine the middle: 6x + x = 7x.","Result: 2x² + 7x + 3, which matches exactly.","So the factored form is (2x + 1)(x + 3), choice A."],"alt":"Plug in x = 1. The original: 2(1) + 7(1) + 3 = 2 + 7 + 3 = 12. Now test each choice at x = 1. Choice A: (2+1)(1+3) = 3·4 = 12 ✓. Choice B: (2+3)(1+1) = 5·2 = 10 ✗. Choice C: (2−1)(1−3) = 1·(−2) = −2 ✗. Choice D: (1+1)(1+3) = 2·4 = 8 ✗. Only A gives 12.","check":"Re-expand A fully: (2x + 1)(x + 3) = 2x² + 6x + x + 3 = 2x² + 7x + 3, identical to the original trinomial. Confirmed."},"ma-adv-05":{"concept":"A parabola is the U-shaped graph of a quadratic y = ax² + bx + c. Its ‘vertex’ is the single turning point — the bottom of the U if it opens up (a > 0) or the top if it opens down. The x-coordinate of the vertex always sits at x = −b/(2a), a formula that comes from the symmetry of the parabola. Once you have that x, plug it back into the equation to get the vertex’s y-coordinate.","steps":["Identify a = 1, b = −6, c = 5.","Find the vertex x-coordinate: x = −b/(2a) = −(−6)/(2·1) = 6/2 = 3.","Substitute x = 3 into y = x² − 6x + 5: y = 3² − 6(3) + 5.","Compute: 9 − 18 + 5 = −4.","The vertex is (3, −4), choice A."],"alt":"Graph y = x² − 6x + 5 on the Desmos calculator and look at the lowest point of the U; the cursor readout shows (3, −4). Alternatively, complete the square: x² − 6x + 5 = (x² − 6x + 9) − 9 + 5 = (x − 3)² − 4, which is vertex form with vertex (3, −4) — a great method that avoids the formula.","check":"Because a = 1 > 0, the parabola opens up, so −4 should be the minimum. Test x = 2 and x = 4 (one step on each side): both give 2² − 12 + 5 = −3 and 4² − 24 + 5 = −3, which are higher than −4. The point (3, −4) is indeed the lowest, confirming the vertex."},"ma-adv-06":{"concept":"For y = ax² + bx + c with a > 0, the parabola opens upward like a valley, so it has a lowest point and that lowest point is the vertex. The minimum VALUE of y is simply the y-coordinate of the vertex — the height of the bottom of the valley. You find the vertex’s x with x = −b/(2a), then plug in to get that minimum y.","steps":["Here a = 1 (positive), so the parabola opens up and has a minimum.","Vertex x-coordinate: x = −b/(2a) = −(−6)/(2·1) = 6/2 = 3.","Plug x = 3 into y = x² − 6x + 5: y = 9 − 18 + 5.","9 − 18 = −9, then −9 + 5 = −4.","The minimum value of y is −4."],"alt":"Complete the square to rewrite the function: y = (x − 3)² − 4. Since (x − 3)² is a square, it can never be negative — its smallest possible value is 0 (when x = 3). So the smallest y can be is 0 − 4 = −4. This shows why −4 is the floor.","check":"Try nearby inputs: x = 2 gives 4 − 12 + 5 = −3; x = 4 gives 16 − 24 + 5 = −3. Both exceed −4, and at x = 3 we get exactly −4, so −4 is the lowest — the minimum value. Confirmed."},"ma-adv-07":{"concept":"A quadratic ax² + bx + c = 0 can have two, one, or zero real solutions, and the ‘discriminant’ b² − 4ac tells you which. If it’s positive there are two solutions; if zero, exactly one (a repeated root where the parabola just touches the x-axis); if negative, none. So ‘exactly one real solution’ means you set the discriminant equal to 0 and solve for the unknown coefficient.","steps":["Identify a = 1, b = 4, c = c (the unknown).","Write the discriminant and set it to 0 for one solution: b² − 4ac = 0 → 4² − 4(1)(c) = 0.","Compute 4² = 16, so 16 − 4c = 0.","Solve: 16 = 4c, so c = 4, which is choice B."],"alt":"Think about a perfect-square trinomial. For x² + 4x + c to have one repeated root, it must equal (x + 2)² because 2·2 = 4 gives the correct middle term. Expanding (x + 2)² = x² + 4x + 4, so c = 4. The single solution is x = −2.","check":"With c = 4 the equation is x² + 4x + 4 = 0 = (x + 2)², whose only solution is x = −2 — exactly one, as required. If instead c were 2, the discriminant would be 16 − 8 = 8 > 0, giving two solutions, so c = 4 is right."},"ma-adv-08":{"concept":"The expression x² − y² is a ‘difference of squares,’ and it always factors into (x + y)(x − y). This is a pattern worth memorizing because it lets you compute x² − y² WITHOUT ever finding x and y individually — you just need their sum and their difference, both of which are given here. That shortcut is exactly what the SAT is testing.","steps":["Recognize the difference-of-squares identity: x² − y² = (x + y)(x − y).","Substitute the given values: x + y = 8 and x − y = 3.","Multiply: (8)(3) = 24.","So x² − y² = 24."],"alt":"Solve for x and y directly. Add the two equations: (x + y) + (x − y) = 8 + 3 → 2x = 11 → x = 5.5. Then y = 8 − 5.5 = 2.5. Now x² − y² = 5.5² − 2.5² = 30.25 − 6.25 = 24. Same answer, confirming the shortcut.","check":"Using x = 5.5, y = 2.5: check x + y = 5.5 + 2.5 = 8 ✓ and x − y = 5.5 − 2.5 = 3 ✓. Then x² − y² = 30.25 − 6.25 = 24 ✓. Everything is consistent."},"ma-adv-09":{"concept":"Exponential growth means a quantity multiplies by the same factor over each fixed time period. The general model is N = (starting amount) · (growth factor)^(number of periods). ‘Doubling’ makes the growth factor 2. ‘Every 3 hours’ sets the length of one period, so the number of periods elapsed after t hours is t divided by 3, i.e. t/3. Putting these together gives the formula.","steps":["Start with the exponential form N = N₀ · (factor)^(periods), where N₀ = 500.","Doubling makes the factor 2.","One period is 3 hours, so after t hours the number of periods is t/3.","Assemble: N = 500 · 2^(t/3), which is choice A."],"alt":"Test with a known value. After exactly 3 hours the colony should double from 500 to 1000. Plug t = 3 into choice A: 500 · 2^(3/3) = 500 · 2¹ = 1000 ✓. Try choice B: 500 · 2^(3·3) = 500 · 2⁹ = 256000 ✗ (way too big). So A is right.","check":"Check a second time point. At t = 6 hours (two doublings) it should be 2000. Choice A: 500 · 2^(6/3) = 500 · 2² = 500 · 4 = 2000 ✓. The model behaves correctly."},"ma-adv-10":{"concept":"Exponential DECAY is the mirror of growth: instead of multiplying by more than 1, you multiply by a factor between 0 and 1 each period. If something loses 15% of its value per year, then it KEEPS the other 85% — and 85% written as a decimal is 0.85. So the value each year is 0.85 times the year before, giving V = (start) · (0.85)^t. A common trap is using 0.15 (the part lost) instead of 0.85 (the part kept).","steps":["Start value is $20,000, so V₀ = 20000.","Losing 15% means keeping 100% − 15% = 85% each year.","Write 85% as a decimal factor: 0.85.","Model: V = 20000 · (0.85)^t, choice A."],"alt":"Compute one year by hand. After 1 year the car loses 15% of 20000 = 0.15 · 20000 = 3000, leaving 20000 − 3000 = 17000. Now test choice A at t = 1: 20000 · 0.85 = 17000 ✓. Test choice C: 20000 · 0.15 = 3000 ✗ (that’s the amount lost, not the value). So A is correct.","check":"The value should shrink over time, so the base must be less than 1 — only 0.85 (A) and 0.15 (C) qualify, and C wrongly gives just the lost portion. A yields $17,000 after year 1, a sensible small drop, confirming V = 20000(0.85)^t."},"ma-adv-11":{"concept":"An equation like 3^x = 81 asks: to what power must you raise 3 to get 81? The trick is to rewrite BOTH sides as powers of the same base. Once the bases match, the exponents must be equal. So express 81 as a power of 3, then read off x.","steps":["Write 81 as repeated multiplication of 3: 3 × 3 = 9, 9 × 3 = 27, 27 × 3 = 81.","That’s four 3’s multiplied, so 81 = 3⁴.","The equation becomes 3^x = 3⁴.","Same base means equal exponents: x = 4."],"alt":"Count by multiplying up from 3 until you reach 81, tracking the power: 3¹ = 3, 3² = 9, 3³ = 27, 3⁴ = 81. You hit 81 on the fourth step, so x = 4.","check":"Substitute back: 3⁴ = 3·3·3·3 = 81 ✓, which matches the right side. Correct."},"ma-adv-12":{"concept":"To simplify a rational expression (a fraction with polynomials), you factor the top and bottom and cancel any factor they share — just like reducing 6/9 to 2/3. The numerator x² − 4 is a difference of squares, factoring as (x − 2)(x + 2). The denominator x − 2 then cancels with the matching factor on top. The restriction x ≠ 2 is there because the original fraction is undefined when the denominator is 0.","steps":["Factor the numerator as a difference of squares: x² − 4 = (x − 2)(x + 2).","Rewrite the fraction: (x − 2)(x + 2) / (x − 2).","Cancel the common factor (x − 2), allowed since x ≠ 2 keeps it nonzero.","What remains is x + 2, choice A."],"alt":"Plug in an easy allowed number, say x = 3. Original: (3² − 4)/(3 − 2) = (9 − 4)/1 = 5. Now test choice A: x + 2 = 3 + 2 = 5 ✓. Choice B: x − 2 = 1 ✗. So A matches.","check":"Try a second value, x = 0: original (0 − 4)/(0 − 2) = (−4)/(−2) = 2, and choice A gives 0 + 2 = 2 ✓. Both agree, confirming x + 2."},"ma-adv-13":{"concept":"To solve an equation with a square root, you square both sides to undo the root. But squaring can INVENT fake answers called ‘extraneous solutions,’ because squaring erases the distinction between positive and negative. So you must always plug each candidate back into the ORIGINAL equation and discard any that don’t actually work. Also remember: the √ symbol means the non-negative root, so the left side √(x + 6) can never be negative — which forces x itself to be non-negative here.","steps":["Square both sides of √(x + 6) = x: x + 6 = x².","Rearrange into standard form: x² − x − 6 = 0.","Factor: find numbers multiplying to −6 and adding to −1 → −3 and 2, so (x − 3)(x + 2) = 0.","Candidates: x = 3 or x = −2.","Check in the original. x = 3: √(3 + 6) = √9 = 3 = x ✓. x = −2: √(−2 + 6) = √4 = 2, but x = −2, and 2 ≠ −2 ✗.","Only x = 3 works, choice A."],"alt":"Reason before solving: the left side √(x + 6) is always ≥ 0, and it equals x, so x must be ≥ 0. That instantly disqualifies any negative candidate like −2. Among the choices, only A keeps solely the non-negative root x = 3.","check":"Substitute x = 3 into the untouched original: √(3 + 6) = √9 = 3, and the right side is x = 3. Both sides equal 3 ✓, so x = 3 is a genuine solution and the only one."},"ma-adv-14":{"concept":"Function notation f(x) is just a rule: wherever you see x in the formula, substitute the input. So f(−3) means replace every x with −3 and compute. The one spot students slip is squaring a negative: (−3)² means (−3)·(−3), and a negative times a negative is POSITIVE, so it equals +9, not −9.","steps":["Start with the rule f(x) = x² + 1.","Replace x with −3: f(−3) = (−3)² + 1.","Compute the square carefully: (−3)² = (−3)·(−3) = 9.","Add 1: 9 + 1 = 10.","So f(−3) = 10."],"alt":"Notice the graph of f(x) = x² + 1 is symmetric about the y-axis, so f(−3) equals f(3). Compute the easier one: f(3) = 3² + 1 = 9 + 1 = 10. Same result, and it sidesteps the negative-squaring worry.","check":"Re-examine the sign: squaring any nonzero number gives a positive result, so (−3)² = 9, and 9 + 1 = 10. The answer is positive and equals f(3), which is consistent."},"ma-adv-15":{"concept":"‘Vertex form’ of a parabola is y = a(x − h)² + k, and it hands you the vertex directly as the point (h, k) — no formula or calculation needed. The tricky part is the SIGN of h: because the form has (x − h), you read the vertex x as the value that makes the parenthesis zero. So (x − 2)² gives h = 2 (since x = 2 makes it zero), and the number added outside, +3, is k.","steps":["Compare y = (x − 2)² + 3 to the template y = a(x − h)² + k.","Match the inside: (x − h) = (x − 2), so h = 2 (the value that makes x − 2 equal 0).","Match the outside constant: k = 3.","The vertex is (h, k) = (2, 3), choice A."],"alt":"Think about what makes y smallest. The term (x − 2)² is a square, so its minimum is 0, and that happens when x = 2. At x = 2, y = 0 + 3 = 3. So the lowest point is (2, 3) — the vertex. You could also graph it on Desmos and read the turning point.","check":"Plug x = 2 into the equation: y = (2 − 2)² + 3 = 0 + 3 = 3, giving the point (2, 3). Test a neighbor, x = 3: y = (1)² + 3 = 4, which is higher, confirming (2, 3) is the vertex."},"ma-adv-16":{"concept":"In a projectile equation like h = −16t² + 32t, h is the height and t is the time. ‘Returns to the ground’ means the height is 0, so you set h = 0 and solve for t. Because there’s no constant term, you can factor out the common piece (here −16t), and the Zero Product Property gives the two times when height is 0: the launch (t = 0) and the landing (the other value).","steps":["Set height to zero: −16t² + 32t = 0.","Factor out the greatest common factor −16t: −16t(t − 2) = 0.","Zero Product Property: −16t = 0 or t − 2 = 0.","Solve each: t = 0 (the moment it’s thrown) or t = 2.","The ball returns to the ground at t = 2 seconds, choice B."],"alt":"Use symmetry. A projectile’s path is a symmetric parabola, so it lands the same amount of time after the peak as it took to reach the peak. The peak is at t = −b/(2a) = −32/(2·−16) = 1 second, so landing is at twice that, t = 2 seconds.","check":"Plug t = 2 into h: −16(2²) + 32(2) = −16(4) + 64 = −64 + 64 = 0 ✓. Height is exactly 0, so the ball is on the ground at t = 2."},"ma-adv-17":{"concept":"The maximum height of a thrown ball is reached at the TOP of its parabolic path — the vertex. Since the height equation h = −16t² + 32t opens downward (the t² coefficient is negative), the vertex is a peak. Find the time of the peak with t = −b/(2a), then plug that time back into the height equation to get the maximum height itself. Careful: −b/(2a) gives the TIME, not the height — you still must substitute.","steps":["Identify a = −16, b = 32.","Find the time of maximum height: t = −b/(2a) = −32/(2·−16) = −32/−32 = 1 second.","Substitute t = 1 into h = −16t² + 32t: h = −16(1)² + 32(1).","Compute: −16 + 32 = 16.","The maximum height is 16 feet, choice B."],"alt":"Graph h = −16t² + 32t on the Desmos calculator and read the highest point of the arc; the peak sits at (1, 16), so the max height is 16 feet. This visual method confirms the algebra at a glance.","check":"Compare heights just before and after t = 1. At t = 0.5: −16(0.25) + 16 = −4 + 16 = 12. At t = 1.5: −16(2.25) + 48 = −36 + 48 = 12. Both are below 16, so 16 feet at t = 1 is indeed the peak."},"ma-adv-18":{"concept":"Subtracting one polynomial from another is where sign errors happen, because the minus sign in front of the parentheses flips the sign of EVERY term inside them — like distributing a −1. After you flip those signs, you combine ‘like terms’: x² terms with x² terms, x terms with x terms, and constants with constants.","steps":["Write it out: (2x² + 3x) − (x² − 5x + 4).","Distribute the minus across the second group, flipping each sign: −x² + 5x − 4.","Now combine: 2x² + 3x − x² + 5x − 4.","Group like terms: (2x² − x²) + (3x + 5x) − 4.","Simplify: x² + 8x − 4, choice A."],"alt":"Plug in x = 1. Original: (2 + 3) − (1 − 5 + 4) = 5 − 0 = 5. Test choice A at x = 1: 1 + 8 − 4 = 5 ✓. Choice B: 1 − 2 + 4 = 3 ✗. Choice C: 3 − 2 − 4 = −3 ✗. Only A gives 5.","check":"Verify with a second value, x = 2. Original: (8 + 6) − (4 − 10 + 4) = 14 − (−2) = 16. Choice A: 2² + 8(2) − 4 = 4 + 16 − 4 = 16 ✓. Match confirms x² + 8x − 4."},"ma-adv-19":{"concept":"‘Triples every hour’ is exponential growth with a factor of 3 per hour. After t hours the amount is (start) · 3^t, because you multiply by 3 once for each hour that passes. Here you just need t = 2, so you multiply the starting 800 by 3 twice — that is, by 3² = 9.","steps":["Start with 800 bacteria.","After 1 hour: 800 × 3 = 2400.","After 2 hours: 2400 × 3 = 7200.","Equivalently, 800 · 3² = 800 · 9 = 7200."],"alt":"Use the exponent directly: two triplings multiply the count by 3 × 3 = 9. Then 800 × 9 = 7200. Break it up if easier: 800 × 9 = 800 × 10 − 800 = 8000 − 800 = 7200.","check":"Work backward: 7200 ÷ 3 = 2400 (one hour ago), and 2400 ÷ 3 = 800 (the start) ✓. Returning to the original 800 confirms 7200 is correct."},"ma-adv-20":{"concept":"When you MULTIPLY two powers that share the same base, you ADD their exponents: x^m · x^n = x^(m+n). This works because the exponents just count how many factors of x you have, and multiplying combines the counts. Here the exponents are fractions, so you add 1/2 and 3/2 — and adding fractions with the same denominator just means adding the tops.","steps":["Same base x, and we’re multiplying, so add exponents: x^(1/2 + 3/2).","Add the fractions (same denominator 2): 1/2 + 3/2 = 4/2.","Simplify the exponent: 4/2 = 2.","So the expression equals x², choice A."],"alt":"Recall that x^(1/2) means √x. So the product is √x · x·√x = √x · √x · x = x · x = x². Using x = 4 as a test: 4^(1/2) · 4^(3/2) = 2 · 8 = 16 = 4², confirming x².","check":"Plug in x = 9: 9^(1/2) = 3 and 9^(3/2) = (√9)³ = 3³ = 27, so 3 · 27 = 81. And x² = 9² = 81 ✓. Match confirms x²."},"ma-adv-21":{"concept":"This combines function notation with solving a quadratic. f(a) = 12 means: put a into the rule f(x) = x² − 4 and set the result equal to 12, then solve for a. Solving a² = 16 gives two answers, +4 and −4, because both square to 16. The condition a > 0 then selects the positive one.","steps":["Write the equation f(a) = 12 using the rule: a² − 4 = 12.","Add 4 to both sides: a² = 16.","Take square roots, keeping both signs: a = ±4.","Apply a > 0, which eliminates −4.","Therefore a = 4."],"alt":"Test the positive perfect squares. Which positive number squared, minus 4, gives 12? Try a = 4: 4² − 4 = 16 − 4 = 12 ✓. It works on the first try, and since a must be positive, a = 4.","check":"Substitute a = 4 back into f: f(4) = 4² − 4 = 16 − 4 = 12 ✓, matching the required value, and 4 > 0. Correct."},"ma-adv-22":{"concept":"A fraction equals 0 only when its TOP (numerator) is 0 — because 0 divided by any nonzero number is 0. The bottom being 0 does NOT make the fraction zero; it makes it undefined instead. So to solve (x − 5)/(x + 2) = 0, set the numerator equal to 0, then double-check the value doesn’t also zero out the denominator.","steps":["A fraction is 0 exactly when its numerator is 0, so set x − 5 = 0.","Solve: x = 5.","Check the denominator at x = 5: x + 2 = 5 + 2 = 7, which is not 0 — good, so the fraction is defined.","Therefore x = 5, choice A."],"alt":"Test the choices in the fraction. x = 5: (5 − 5)/(5 + 2) = 0/7 = 0 ✓. x = −2: (−2 − 5)/(−2 + 2) = −7/0 = undefined ✗ (denominator zero, not a solution). Only x = 5 gives 0.","check":"Plug x = 5 into the original fraction: (5 − 5)/(5 + 2) = 0/7 = 0 ✓. The numerator vanishes while the denominator stays nonzero, exactly what’s required."},"ma-adv-23":{"concept":"For a quadratic x² + bx + c = 0, there’s a beautiful shortcut called Vieta’s formulas: the two solutions always ADD up to −b and MULTIPLY to c (when the leading coefficient is 1). So the product of the roots is just c — here, 10 — with no need to actually find the roots. If you prefer, you can still factor and multiply, and you’ll get the same thing.","steps":["Identify the equation x² − 7x + 10 = 0, so c = 10 and the leading coefficient is 1.","By Vieta’s formula, the product of the roots equals c = 10.","(Optional confirmation) Factor: two numbers multiplying to 10 and adding to 7 are 2 and 5, so (x − 2)(x − 5) = 0.","The roots are x = 2 and x = 5; their product is 2 · 5 = 10.","The product of the solutions is 10, choice A."],"alt":"Just factor and multiply the roots directly. x² − 7x + 10 = (x − 2)(x − 5), giving roots 2 and 5, and 2 × 5 = 10. This is the concrete version of the c-shortcut and lands on the same 10.","check":"Verify the factoring rebuilds the original: (x − 2)(x − 5) = x² − 5x − 2x + 10 = x² − 7x + 10 ✓. The roots 2 and 5 are correct, so their product 10 is confirmed."},"ma-adv-24":{"concept":"An exponent tells you how many times to multiply the base by itself, so 2^5 means 2·2·2·2·2. The key rule here is that if two powers with the SAME base are equal, then their exponents must be equal (this is called “equating exponents”). So the whole trick is to rewrite both sides of the equation as a power of the same base, here base 2, and then just match the exponents.","steps":["Recognize 32 is a power of 2: 2·2·2·2·2 = 32, so 32 = 2^5.","Rewrite the equation with a common base: 2^(x+3) = 2^5.","Since the bases match, set the exponents equal: x + 3 = 5.","Subtract 3 from both sides: x = 5 − 3 = 2.","The answer is A) 2."],"alt":"Back-solve by testing the choices. The answer is “x,” and the choices are 2, 5, 3, 8. Try x = 2: the exponent becomes 2 + 3 = 5, and 2^5 = 32. ✓ That matches immediately, so A) 2 is correct. This is fast when you can compute the small power in your head.","check":"Plug x = 2 back into the original: 2^(2+3) = 2^5 = 32, which equals the right side. ✓"},"ma-adv-25":{"concept":"“Complete factorization” means breaking an expression into the product of the simplest pieces that cannot be factored further. Two tools do it here: (1) factoring out the greatest common factor (the biggest number/variable dividing every term), and (2) the difference of squares pattern a² − b² = (a − b)(a + b), which works because the middle terms cancel when you multiply back out. You must do BOTH steps to be fully complete.","steps":["Find the common factor of 3x² and 12: both are divisible by 3, so factor it out: 3x² − 12 = 3(x² − 4).","Look at x² − 4: it is a difference of two squares since x² = (x)² and 4 = (2)².","Apply a² − b² = (a − b)(a + b) with a = x, b = 2: x² − 4 = (x − 2)(x + 2).","Combine: 3(x − 2)(x + 2).","The answer is A) 3(x − 2)(x + 2)."],"alt":"Eliminate the wrong choices by checking completeness. Choice 3(x² − 4) still has a factorable piece (x² − 4), so it is not complete. Choice (x − 2)(x + 2) lost the factor of 3, so multiplying it back gives x² − 4, not 3x² − 12 — wrong value. Choice (3x − 6)(x + 2) multiplies to 3x² − 12, but 3x − 6 still hides a common factor of 3, so it is not fully factored. Only A survives.","check":"Multiply A back out: 3(x − 2)(x + 2) = 3(x² − 4) = 3x² − 12, which is the original expression. ✓"},"ma-adv-26":{"concept":"An x-intercept is a point where a graph crosses the x-axis, and on the x-axis the height (the y-value, here g(x)) is 0. When a function is written as a product of factors, like (x + 1)(x − 4), you use the Zero Product Property: if two things multiply to 0, at least one of them must be 0. So you set each factor equal to 0 separately.","steps":["Set the function equal to 0 for intercepts: (x + 1)(x − 4) = 0.","Apply the Zero Product Property: either x + 1 = 0 or x − 4 = 0.","Solve x + 1 = 0: x = −1.","Solve x − 4 = 0: x = 4.","Compare −1 and 4; the smaller is −1."],"alt":"Sanity-check by reading the factors directly. A factor (x + 1) becomes zero when x makes the inside zero, which is x = −1 (the opposite sign of the number). Likewise (x − 4) gives x = 4. On a number line −1 sits to the left of 4, so −1 is the smaller intercept.","check":"Substitute x = −1 into g: (−1 + 1)(−1 − 4) = (0)(−5) = 0, confirming −1 is truly an x-intercept. ✓"},"s2-ma-adv-01":{"concept":"The “solutions” (also called roots) of a quadratic are the x-values that make it equal 0. One way is to factor into (x − p)(x − q), which reveals the roots p and q. A powerful shortcut is Vieta’s rule: for ax² + bx + c = 0, the sum of the roots always equals −b/a. This works because when you expand (x − p)(x − q) you get x² − (p + q)x + pq, so the coefficient of x is −(sum of roots).","steps":["Factor: find two numbers that multiply to 6 and add to −5, namely −2 and −3.","Write x² − 5x + 6 = (x − 2)(x − 3) = 0.","Set each factor to 0: x = 2 or x = 3.","Add the roots: 2 + 3 = 5.","The answer is A) 5."],"alt":"Skip the factoring entirely with the sum-of-roots shortcut. Here a = 1, b = −5, so the sum is −b/a = −(−5)/1 = 5. This is instant and avoids any risk of a factoring mistake — great for a 1600 pace.","check":"Verify each root satisfies the equation: 2² − 5(2) + 6 = 4 − 10 + 6 = 0 ✓ and 3² − 5(3) + 6 = 9 − 15 + 6 = 0 ✓, and their sum is 5. ✓"},"s2-ma-adv-02":{"concept":"A parabola y = ax² + bx + c with a > 0 opens upward like a valley, so it has a lowest point called the vertex — that is where the minimum value lives. The x-coordinate of the vertex is always x = −b/(2a), which sits exactly halfway between the two roots by symmetry. Once you know that x, plug it in to get the minimum y-value.","steps":["Identify a = 1, b = −6, c = 5; since a > 0 the parabola opens up and has a minimum.","Find the vertex x-coordinate: x = −b/(2a) = −(−6)/(2·1) = 6/2 = 3.","Substitute x = 3: y = 3² − 6(3) + 5 = 9 − 18 + 5.","Compute: 9 − 18 + 5 = −4.","The minimum value is A) −4."],"alt":"Complete the square to reveal the vertex directly: y = x² − 6x + 5 = (x² − 6x + 9) − 9 + 5 = (x − 3)² − 4. Since (x − 3)² is never negative, the smallest y happens when (x − 3)² = 0, giving y = −4. You can also just graph y = x² − 6x + 5 on Desmos and read the bottom of the curve at (3, −4).","check":"Test a nearby x to confirm −4 is a minimum: at x = 2, y = 4 − 12 + 5 = −3, which is higher than −4, and at x = 4, y = 16 − 24 + 5 = −3, also higher. So −4 is indeed the lowest. ✓"},"s2-ma-adv-03":{"concept":"When something squared equals a number, you undo the square by taking the square root of both sides — but you must include BOTH a positive and a negative root, because both (+4)² and (−4)² give 16. That “±” step is where most points are lost. After that you solve two simple linear equations and pick the one that fits the given condition (here x > 0).","steps":["Start with (x − 3)² = 16.","Take the square root of both sides, keeping ±: x − 3 = ±4.","Split into two cases: x − 3 = 4 gives x = 7; x − 3 = −4 gives x = −1.","Apply the condition x > 0: only x = 7 qualifies.","The answer is 7."],"alt":"Back-solve using the condition. Since x > 0, test x = 7 directly: (7 − 3)² = 4² = 16. ✓ It works and is positive, so x = 7. This avoids the ± bookkeeping if you can guess the positive candidate.","check":"Substitute x = 7 into the original: (7 − 3)² = 16, and 7 > 0. ✓"},"s2-ma-adv-04":{"concept":"In projectile problems, h is the height and it equals 0 at ground level — both when it is launched and when it lands. To find those times, set h = 0 and solve. Because there is no constant term here, you can factor out the common factor (which includes t), then use the Zero Product Property: if a product is 0, one of the factors is 0.","steps":["Set height to zero: −16t² + 48t = 0.","Factor out the common factor −16t: −16t(t − 3) = 0.","Apply the Zero Product Property: −16t = 0 gives t = 0; t − 3 = 0 gives t = 3.","t = 0 is the launch moment, so the landing (t > 0) is t = 3.","The answer is A) 3."],"alt":"Use symmetry/estimation. The ball goes up and comes back down symmetrically; the peak is at the vertex t = −b/(2a) = −48/(2·−16) = 1.5 seconds. Landing takes the same time again, so total flight is 2 × 1.5 = 3 seconds. This confirms t = 3 without factoring.","check":"Plug t = 3 into h: −16(3²) + 48(3) = −16(9) + 144 = −144 + 144 = 0. Height is 0, so the ball is on the ground. ✓"},"s2-ma-adv-05":{"concept":"“Equivalent” expressions look different but give the same value for every x. To simplify, use the distributive property (multiply the outside number into each term inside the parentheses), then combine like terms (add together terms that have the same variable part). Only x-terms combine with x-terms, and plain numbers combine with plain numbers.","steps":["Distribute the 3: 3(2x − 4) = 3·2x − 3·4 = 6x − 12.","Rewrite the full expression: 6x − 12 + 5x.","Combine the x-terms: 6x + 5x = 11x.","Keep the constant: −12.","Result is 11x − 12, choice A."],"alt":"Plug in an easy number, like x = 1. Original: 3(2·1 − 4) + 5·1 = 3(−2) + 5 = −6 + 5 = −1. Now test the choices at x = 1: A) 11 − 12 = −1 ✓, B) 11 − 4 = 7 ✗, C) 6 − 12 = −6 ✗, D) 11 + 12 = 23 ✗. Only A matches.","check":"Try a second value, x = 2: original = 3(4 − 4) + 10 = 0 + 10 = 10; choice A = 11(2) − 12 = 22 − 12 = 10. ✓ Two matches confirm equivalence."},"s2-ma-adv-06":{"concept":"Multiplying two binomials (two-term expressions) uses FOIL — First, Outer, Inner, Last — which is just the distributive property applied twice so every term in the first parenthesis multiplies every term in the second. After multiplying, combine the like x-terms. Watch the signs carefully: they are the number-one source of errors.","steps":["First: x · x = x².","Outer: x · (−3) = −3x.","Inner: 4 · x = 4x.","Last: 4 · (−3) = −12.","Combine the middle terms: −3x + 4x = x, giving x² + x − 12, choice A."],"alt":"Plug in x = 2. Original: (2 + 4)(2 − 3) = (6)(−1) = −6. Test choices at x = 2: A) 4 + 2 − 12 = −6 ✓, B) 4 − 2 − 12 = −10 ✗, C) 4 + 14 − 12 = 6 ✗, D) 4 + 2 + 12 = 18 ✗. Only A gives −6.","check":"Verify the constant and sum-of-roots quickly: constant = 4·(−3) = −12 ✓; the middle coefficient should be (4) + (−3) = 1, matching +x. ✓"},"s2-ma-adv-07":{"concept":"A rational expression is a fraction with polynomials on top and bottom. You simplify it just like a number fraction: factor the top and bottom completely, then cancel any factor that appears in both. The numerator here is a difference of squares (a² − b² = (a − b)(a + b)); the denominator is a standard trinomial you factor by finding two numbers that multiply to the constant and add to the middle coefficient.","steps":["Factor the numerator (difference of squares): x² − 9 = (x − 3)(x + 3).","Factor the denominator: need two numbers multiplying to −6 and adding to −1, namely −3 and +2, so x² − x − 6 = (x − 3)(x + 2).","Write the fraction: (x − 3)(x + 3) / [(x − 3)(x + 2)].","Cancel the common factor (x − 3): (x + 3)/(x + 2).","The answer is A) (x + 3)/(x + 2)."],"alt":"Plug in a safe number like x = 0 (allowed since x ≠ 3 and it doesn’t make a denominator zero). Original: (0 − 9)/(0 − 0 − 6) = −9/−6 = 3/2 = 1.5. Test choices at x = 0: A) 3/2 = 1.5 ✓, B) −3/−2 = 1.5 also — tie, so test x = 1: original (1 − 9)/(1 − 1 − 6) = −8/−6 ≈ 1.33; A) 4/3 ≈ 1.33 ✓, B) −2/−1 = 2 ✗. A wins.","check":"Substitute x = 2 into original and answer: original = (4 − 9)/(4 − 2 − 6) = −5/−4 = 1.25; answer A = (2 + 3)/(2 + 2) = 5/4 = 1.25. ✓"},"s2-ma-adv-08":{"concept":"“For all values of x” means the two sides are the same expression, so their matching coefficients must be equal — this is the idea of an identity. To find b, expand the left side using the perfect-square pattern (a + b)² = a² + 2ab + b², then line up the coefficient of x on each side. The doubled cross-term 2ab is exactly what produces the x-coefficient.","steps":["Expand using (a + b)² = a² + 2ab + b² with a = 2x, b = 3.","Square the first: (2x)² = 4x².","Double the product: 2(2x)(3) = 12x.","Square the last: 3² = 9, giving 4x² + 12x + 9.","Match to 4x² + bx + 9: the x-coefficients give b = 12."],"alt":"Plug in a convenient x, say x = 1. Left: (2·1 + 3)² = 5² = 25. Right: 4(1) + b(1) + 9 = 13 + b. Set 13 + b = 25, so b = 12. Picking x = 1 turns the identity into a simple equation.","check":"Test the full expansion at x = 2: left (2·2 + 3)² = 7² = 49; right 4(4) + 12(2) + 9 = 16 + 24 + 9 = 49. ✓ b = 12 works."},"s2-ma-adv-09":{"concept":"The notation f(x + 1) means “substitute the whole quantity (x + 1) everywhere x appears in the rule for f.” This is function evaluation with an expression instead of a number. Then f(x + 1) − f(x) subtracts the original, and the x² parts cancel, leaving a simpler expression that measures how much the function grows over one step.","steps":["Compute f(x + 1): replace x with (x + 1): 2(x + 1)² − 3.","Expand (x + 1)² = x² + 2x + 1, so 2(x² + 2x + 1) − 3 = 2x² + 4x + 2 − 3 = 2x² + 4x − 1.","Write f(x): 2x² − 3.","Subtract: (2x² + 4x − 1) − (2x² − 3) = 4x − 1 + 3 = 4x + 2.","The answer is A) 4x + 2."],"alt":"Plug in a number, x = 1. Then f(2) = 2(4) − 3 = 5 and f(1) = 2(1) − 3 = −1, so f(2) − f(1) = 5 − (−1) = 6. Test choices at x = 1: A) 4 + 2 = 6 ✓, B) 4 − 2 = 2 ✗, C) 2 + 2 = 4 ✗, D) 4 ✗. Only A gives 6.","check":"Confirm with a different x, x = 0: f(1) − f(0) = (2 − 3) − (0 − 3) = −1 − (−3) = 2; choice A at x = 0 is 4(0) + 2 = 2. ✓"},"s2-ma-adv-10":{"concept":"This is vertex form, y = a(x − h)² + k, where the vertex is at (h, k). The squared term (x − h)² can never be negative — the smallest it gets is 0, which happens when x = h. When a is positive (here a = 1), the parabola opens up, so plugging in that lowest squared value gives the minimum of the whole function: just the constant k.","steps":["Identify the squared part: (x − 2)² is always ≥ 0.","Its smallest possible value is 0, occurring when x − 2 = 0, i.e. x = 2.","Substitute that minimum in: g = 0 + 1 = 1.","So the minimum value of g is 1, at x = 2.","The answer is A) 1."],"alt":"Read it off vertex form directly: y = a(x − h)² + k has vertex (h, k) = (2, 1), and since it opens upward, the y-value of the vertex, 1, is the minimum. You can also graph g(x) = (x − 2)² + 1 on Desmos and see the bottom of the curve at height 1.","check":"Test a value away from x = 2, like x = 0: g(0) = (0 − 2)² + 1 = 4 + 1 = 5, which is larger than 1 — consistent with 1 being the minimum. ✓"},"s2-ma-adv-11":{"concept":"The zeros of a function are the x-values where it equals 0, and each zero r corresponds to a factor (x − r). So a quadratic with zeros −2 and 5 can be rebuilt as (x − (−2))(x − 5) = (x + 2)(x − 5). Expanding this and comparing to x² + bx + c lets you read off b. A shortcut: the sum of the zeros equals −b.","steps":["Turn zeros into factors: zero −2 gives (x + 2); zero 5 gives (x − 5).","Multiply: (x + 2)(x − 5) = x² − 5x + 2x − 10 = x² − 3x − 10.","Compare with x² + bx + c: the x-coefficient gives b = −3.","(Constant confirms c = −10.)","The answer is A) −3."],"alt":"Use the sum-of-roots shortcut. For x² + bx + c, sum of roots = −b. The roots add to −2 + 5 = 3, so −b = 3, meaning b = −3. No expansion needed.","check":"Verify one zero satisfies x² − 3x − 10 = 0: at x = 5, 25 − 15 − 10 = 0 ✓; at x = −2, 4 + 6 − 10 = 0 ✓. So b = −3 is right."},"s2-ma-adv-12":{"concept":"The value a is a vertical stretch factor that scales a parabola. Because the equation must hold for the given point, you substitute that point’s coordinates (x, y) into the equation and solve the resulting equation for a. The factored form y = a(x − r₁)(x − r₂) already shows the roots; a only controls how tall or narrow the curve is.","steps":["Substitute the point (0, −16): x = 0, y = −16 into y = a(x − 2)(x + 4).","Compute the factors at x = 0: (0 − 2) = −2 and (0 + 4) = 4.","Multiply: (−2)(4) = −8, so the equation is −16 = a(−8) = −8a.","Solve for a: a = −16 / −8 = 2.","The answer is 2."],"alt":"Estimate/reason about sign first as a sanity guide: the point (0, −16) lies below the x-axis, and between the roots x = 2 and x = 4 the raw product (x − 2)(x + 4) at x = 0 is negative (−8), so a must be positive to keep y negative — pointing toward a positive a like 2. Then dividing −16 by −8 confirms exactly a = 2.","check":"Put a = 2 back and test the point: y = 2(0 − 2)(0 + 4) = 2(−2)(4) = −16, which matches the given point (0, −16). ✓"},"s2-ma-adv-13":{"concept":"Exponential growth means multiplying by a fixed factor each period, and its model is P = (starting amount)·(growth factor)^t, where t counts the periods. “Doubles every year” means the growth factor is 2 and t is in years. Contrast this with t² (which is not repeated multiplication) and 300 + 2t (which only adds, i.e. linear) — those grow far too slowly to represent doubling.","steps":["Identify the starting value: P = 300 when t = 0.","Identify the growth factor: doubling means multiply by 2 each year.","Write the exponential model: P = 300 · 2^t.","Verify structure: the base 2 is raised to t (the number of doublings).","The answer is A) P = 300 · 2^t."],"alt":"Test the choices against the story. After 1 year the population should be 600, after 2 years 1200. Choice A: 300·2^1 = 600, 300·2^2 = 1200 ✓. Choice C: 2·300^1 = 600 but 2·300^2 = 180000 ✗. Choice B and D grow far too slowly. Only A fits both years.","check":"Plug t = 0 (the start): 300·2^0 = 300·1 = 300, the correct initial population, and t = 3 gives 300·8 = 2400 (doubled three times: 600→1200→2400). ✓"},"s2-ma-adv-14":{"concept":"When an unknown sits in the exponent, the strategy is to express both sides as powers of the same base and then match exponents, since equal powers of the same base force equal exponents. Here both 2^(x+1) and 32 can be written with base 2. Note the exponent is (x + 1), so after matching you solve a quick one-step equation.","steps":["Rewrite 32 as a power of 2: 32 = 2^5.","Set up equal bases: 2^(x+1) = 2^5.","Equate the exponents: x + 1 = 5.","Solve: x = 5 − 1 = 4.","The answer is A) 4."],"alt":"Back-solve the choices. Try x = 4: 2^(4+1) = 2^5 = 32 ✓ — matches. Try x = 5: 2^6 = 64 ✗. So A) 4 is correct. Testing the smallest reasonable choice first often lands it quickly.","check":"Substitute x = 4 into the original: 2^(4+1) = 2^5 = 32, matching the right-hand side. ✓"},"s2-ma-adv-15":{"concept":"A proportion is a statement that two fractions are equal. The fastest tool is cross-multiplication: for a/b = c/d, the diagonal products are equal, a·d = b·c. This is valid as long as no denominator is zero. After cross-multiplying you get a linear equation you can solve by collecting the x-terms on one side.","steps":["Cross-multiply 2/(x − 1) = 3/(x + 4): 2(x + 4) = 3(x − 1).","Distribute both sides: 2x + 8 = 3x − 3.","Subtract 2x from both sides: 8 = x − 3.","Add 3: x = 11.","The answer is 11."],"alt":"Plug the answer back to confirm rather than re-deriving: at x = 11, the left fraction is 2/(11 − 1) = 2/10 = 0.2 and the right is 3/(11 + 4) = 3/15 = 0.2. Equal, so x = 11. You could also graph both sides and find where they intersect on Desmos.","check":"Both sides equal 0.2 at x = 11, and neither denominator is zero (10 and 15), so the solution is valid. ✓"},"s3-ma-adv-01":{"concept":"Solving a quadratic means finding the x-values that make it 0. Factoring rewrites x² − 5x + 6 as (x − p)(x − q), where p and q are two numbers that multiply to the constant (6) and add to the middle coefficient (−5). Once factored, the Zero Product Property says each factor can be set to 0 to get the solutions.","steps":["Find two numbers multiplying to 6 and adding to −5: −2 and −3 (since (−2)(−3) = 6 and −2 + −3 = −5).","Factor: x² − 5x + 6 = (x − 2)(x − 3) = 0.","Set each factor to 0: x − 2 = 0 → x = 2; x − 3 = 0 → x = 3.","So the solutions are x = 2 and x = 3.","The answer is A) x = 2 and x = 3."],"alt":"Back-solve by testing. Plug x = 2 into x² − 5x + 6: 4 − 10 + 6 = 0 ✓, and x = 3: 9 − 15 + 6 = 0 ✓. The negative-root choices (B and D) can be ruled out fast because plugging a negative x makes −5x positive, so the terms all add up positive and can’t reach 0.","check":"Both x = 2 and x = 3 give 0 when substituted, and they multiply to 6 (the constant) and add to 5 (matching −b). ✓"},"s3-ma-adv-02":{"concept":"To undo a square, take the square root of both sides — and always include ± because both a positive and a negative number square to the same positive result. That gives two linear equations. Then read the question: it asks for the greatest value, so you pick the larger of the two answers.","steps":["Start with (x − 4)² = 49.","Square-root both sides with ±: x − 4 = ±7.","Case 1: x − 4 = 7 → x = 11.","Case 2: x − 4 = −7 → x = −3.","The greatest value is 11."],"alt":"Since the greatest x comes from the plus branch, jump straight to it: x = 4 + √49 = 4 + 7 = 11. The larger root always equals (the number added) + (the positive square root), so 11 is the maximum without listing both.","check":"Substitute x = 11: (11 − 4)² = 7² = 49, matching the equation, and 11 is larger than the other root −3. ✓"},"s3-ma-adv-03":{"concept":"When the leading coefficient a is not 1, factoring is trickier. You look for factors (mx + p)(nx + q) whose First terms multiply to 2x², whose Last terms multiply to −5, and whose Outer + Inner terms combine to +3x. Once factored, the Zero Product Property gives the roots. If factoring feels slow, the quadratic formula always works.","steps":["Set up factors for 2x²: the First terms must be 2x and x.","Test (2x + 5)(x − 1): Outer = −2x, Inner = 5x, sum = 3x ✓, and Last = 5·(−1) = −5 ✓.","So 2x² + 3x − 5 = (2x + 5)(x − 1) = 0.","Solve x − 1 = 0 → x = 1; solve 2x + 5 = 0 → 2x = −5 → x = −5/2.","The answer is A) x = 1 and x = −5/2."],"alt":"Use the quadratic formula x = (−b ± √(b² − 4ac))/(2a) with a = 2, b = 3, c = −5: discriminant = 9 − 4(2)(−5) = 9 + 40 = 49, √49 = 7, so x = (−3 ± 7)/4. That gives (−3 + 7)/4 = 4/4 = 1 and (−3 − 7)/4 = −10/4 = −5/2. Same roots.","check":"Test x = 1: 2(1) + 3(1) − 5 = 2 + 3 − 5 = 0 ✓; test x = −5/2: 2(25/4) + 3(−5/2) − 5 = 12.5 − 7.5 − 5 = 0 ✓."},"s3-ma-adv-04":{"concept":"You don’t always need the actual roots. Vieta’s formulas say that for ax² + bx + c = 0, the sum of the solutions is −b/a and the product is c/a. This falls out of expanding a(x − r₁)(x − r₂). Since x² − 8x + 3 doesn’t factor with nice integers, the sum formula saves you from messy square roots.","steps":["Identify a = 1, b = −8, c = 3.","Apply the sum-of-roots formula: sum = −b/a.","Substitute: −(−8)/1 = 8.","So the two solutions add to 8, no need to find them individually.","The answer is 8."],"alt":"Reason from the vertex/axis of symmetry. The two roots are symmetric about x = −b/(2a) = 8/2 = 4, meaning they are 4 − d and 4 + d for some d. Their sum is (4 − d) + (4 + d) = 8, the d’s cancel. Same answer, and it shows why the formula works.","check":"The roots are 4 ± √13 (from the quadratic formula, discriminant 64 − 12 = 52). Adding them: (4 + √13) + (4 − √13) = 8. ✓"},"s3-ma-adv-05":{"concept":"By Vieta’s formulas, the product of the solutions of ax² + bx + c = 0 is c/a. This works because a(x − r₁)(x − r₂) expanded gives a constant term of a·r₁·r₂, which must equal c, so r₁·r₂ = c/a. It’s a shortcut that avoids solving the equation, though you can factor to double-check.","steps":["Identify a = 3, b = −12, c = 9.","Apply the product-of-roots formula: product = c/a.","Substitute: 9/3 = 3.","So the two solutions multiply to 3.","The answer is A) 3."],"alt":"Factor and multiply directly. Divide the equation by 3: x² − 4x + 3 = 0, which factors as (x − 1)(x − 3) = 0, giving roots 1 and 3. Their product is 1·3 = 3, matching the formula.","check":"Roots 1 and 3: product 1·3 = 3 ✓, and each satisfies 3x² − 12x + 9 = 0 (e.g., x = 1: 3 − 12 + 9 = 0). ✓"},"s3-ma-adv-06":{"concept":"The vertex is the turning point of a parabola, and its x-coordinate is x = −b/(2a) — this is the axis of symmetry, the vertical line the parabola is mirrored across. Once you have that x, substitute it back into the equation to get the y-coordinate. The vertex is written as the ordered pair (x, y).","steps":["Identify a = 1, b = −6, c = 11.","Find the vertex x: x = −b/(2a) = −(−6)/(2·1) = 6/2 = 3.","Substitute x = 3: y = 3² − 6(3) + 11 = 9 − 18 + 11.","Compute: 9 − 18 + 11 = 2.","The vertex is (3, 2), choice A."],"alt":"Complete the square: y = x² − 6x + 11 = (x² − 6x + 9) + 2 = (x − 3)² + 2. In vertex form a(x − h)² + k the vertex is (h, k) = (3, 2), read off di
