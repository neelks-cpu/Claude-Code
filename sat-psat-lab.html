<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreLab — Digital SAT/PSAT Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy-0:#070c18; --navy-1:#0c1426; --navy-2:#111c33; --navy-3:#17253f;
  --chrome:#1d2f4d; --line:#243a5e; --line-soft:#1a2c48;
  --gold:#f2c14e; --gold-dim:#c99a2e;
  --azure:#2f9bff; --azure-dim:#1d6fce; --azure-glow:rgba(47,155,255,.35);
  --paper:#f7f1e3; --paper-ink:#2a2417; --paper-line:#e3d9c0;
  --text:#e8eef8; --muted:#93a6c4; --muted-2:#6d84a6;
  --good:#39d98a; --bad:#ff6b6b; --warn:#ffb454;
  --easy:#5ec2ff; --med:#f2c14e; --hard:#ff8b6b;
  --radius:14px; --radius-s:9px;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --font-head:'Space Grotesk',system-ui,sans-serif;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-read:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 80% -10%,#13294a 0,transparent 60%),
             radial-gradient(900px 600px at -5% 10%,#10203a 0,transparent 55%),
             var(--navy-0);
  color:var(--text); font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;letter-spacing:-.01em;margin:0}
a{color:var(--azure);text-decoration:none}
button{font-family:var(--font-ui);cursor:pointer}
::selection{background:var(--azure-glow)}

/* ---------- Shell / nav ---------- */
.app{max-width:1160px;margin:0 auto;padding:0 20px 80px}
.topbar{
  display:flex;align-items:center;gap:18px;padding:18px 0 14px;position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--navy-0) 70%,transparent);
}
.brand{display:flex;align-items:center;gap:12px;user-select:none}
.brand .mark{
  width:38px;height:38px;border-radius:10px;position:relative;flex:0 0 auto;
  background:linear-gradient(145deg,var(--chrome),var(--navy-2));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  display:grid;place-items:center;
}
.brand .mark::before{content:"";width:16px;height:16px;border-radius:50%;
  border:2px solid var(--gold);border-top-color:transparent;transform:rotate(35deg)}
.brand .mark::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--azure);box-shadow:0 0 10px var(--azure)}
.brand h1{font-size:19px;letter-spacing:.02em}
.brand .tag{font-size:11px;color:var(--muted-2);letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-ui)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{
  background:transparent;border:1px solid transparent;color:var(--muted);
  padding:8px 13px;border-radius:10px;font-size:13.5px;font-weight:500;transition:.15s;
}
.nav button:hover{color:var(--text);background:var(--navy-2)}
.nav button.active{color:var(--navy-0);background:var(--gold);border-color:var(--gold-dim);font-weight:600}

/* ---------- Cards ---------- */
.card{
  background:linear-gradient(180deg,var(--navy-1),var(--navy-0));
  border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);min-width:0;
}
.card h2{font-size:16px;margin-bottom:4px}
.card .sub{color:var(--muted-2);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600}

/* ---------- Dashboard gauge ---------- */
.dash-top{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px}
.dash-top>*{min-width:0}
@media(max-width:820px){.dash-top{grid-template-columns:minmax(0,1fr)}}
.gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.gauge-score{font-family:var(--font-head);font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em}
.goal-hero{font-family:var(--font-head);font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--gold);text-shadow:0 0 22px rgba(242,193,78,.28);margin:-2px 0 6px}
.gauge-range{color:var(--muted);font-size:12.5px}
.gauge-band{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.04em}
.sectionsplit{display:flex;gap:10px;margin-top:8px;width:100%}
.sectionsplit .s{flex:1;text-align:center;background:var(--navy-2);border:1px solid var(--line-soft);border-radius:10px;padding:8px}
.sectionsplit .s .v{font-family:var(--font-head);font-size:22px;font-weight:600}
.sectionsplit .s .k{font-size:10.5px;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase}

/* ---------- Mastery bars ---------- */
.mastery-row{display:flex;align-items:center;gap:12px;margin:9px 0}
.mastery-row .lbl{width:170px;flex:0 0 auto;font-size:12.5px}
.mastery-row .lbl small{color:var(--muted-2);display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.bar{flex:1;height:9px;background:var(--navy-2);border-radius:20px;overflow:hidden;border:1px solid var(--line-soft)}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--azure-dim),var(--azure));transition:width .5s}
.mastery-row .pct{width:42px;text-align:right;font-family:var(--font-head);font-size:13px;color:var(--muted)}
.wt{font-size:10px;color:var(--muted-2)}

/* ---------- Timeline ---------- */
.timeline{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding:4px 0}
.tl-node{flex:1;min-width:110px;background:var(--navy-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;position:relative}
.tl-node.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim) inset}
.tl-node .yr{font-family:var(--font-head);font-weight:600;font-size:14px}
.tl-node .ev{font-size:11.5px;color:var(--muted);margin-top:2px}
.tl-node .tst{font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}

/* ---------- Buttons ---------- */
.btn{background:var(--azure);color:#04101f;border:1px solid var(--azure-dim);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--navy-2);transform:none}
.btn.gold{background:var(--gold);border-color:var(--gold-dim);color:#1a1405}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.wide{width:100%;justify-content:center;display:flex}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Skill chips ---------- */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.skill-card{background:var(--navy-1);border:1px solid var(--line-soft);border-radius:12px;padding:14px;transition:.15s;cursor:pointer}
.skill-card:hover{border-color:var(--azure-dim);transform:translateY(-2px)}
.skill-card .dom{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.skill-card h4{font-size:14px;margin:5px 0 4px}
.skill-card .meta{font-size:11.5px;color:var(--muted-2);display:flex;justify-content:space-between;align-items:center}
.mini-bar{height:5px;background:var(--navy-2);border-radius:10px;margin-top:9px;overflow:hidden}
.mini-bar>i{display:block;height:100%;background:var(--good)}

/* ---------- Question runner ---------- */
.runner{max-width:820px;margin:0 auto}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted-2);margin-bottom:12px}
.pill{padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:var(--navy-2);font-size:11px;letter-spacing:.04em}
.pill.E{color:var(--easy);border-color:#2b567a}
.pill.M{color:var(--med);border-color:#7a6420}
.pill.H{color:var(--hard);border-color:#7a4230}
.stim{font-family:var(--font-read);background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:20px 22px;line-height:1.62;font-size:16.5px;border:1px solid var(--paper-line);box-shadow:0 4px 18px rgba(0,0,0,.3);overflow-x:auto}
.stim p{margin:0 0 10px}
.stim table{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:13.5px}
.stim th,.stim td{border:1px solid var(--paper-line);padding:6px 10px;text-align:center}
.stim th{background:#efe6cf;font-weight:600}
.prompt{font-size:16px;margin:16px 2px;line-height:1.55}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--navy-1);border:1px solid var(--line-soft);border-radius:11px;padding:12px 14px;transition:.12s;text-align:left;color:var(--text);width:100%}
.choice:hover{border-color:var(--azure-dim)}
.choice .k{width:24px;height:24px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-head);font-size:13px;color:var(--muted)}
.choice.sel{border-color:var(--azure);background:#12233c}
.choice.sel .k{background:var(--azure);color:#04101f;border-color:var(--azure)}
.choice.correct{border-color:var(--good);background:rgba(57,217,138,.09)}
.choice.correct .k{background:var(--good);color:#052616;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}
.choice.wrong .k{background:var(--bad);color:#2a0808;border-color:var(--bad)}
.choice:disabled{cursor:default}
.spr-in{font-family:var(--font-head);font-size:20px;background:var(--navy-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);width:220px;letter-spacing:.02em}
.spr-in:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 3px var(--azure-glow)}
.spr-hint{font-size:11.5px;color:var(--muted-2);margin-top:6px}

/* explanation */
.exp{margin-top:16px;border-radius:12px;border:1px solid var(--line-soft);overflow:hidden}
.exp .band{padding:11px 16px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:9px}
.exp.ok .band{background:rgba(57,217,138,.14);color:var(--good)}
.exp.no .band{background:rgba(255,107,107,.13);color:var(--bad)}
.exp .body{padding:14px 16px;background:var(--navy-1)}
.exp .body p{margin:0 0 10px}
.exp .why{font-size:14px}
.exp .traps{border-top:1px dashed var(--line);padding-top:11px;margin-top:6px}
.exp .traps .t{font-size:12.5px;margin:5px 0;color:var(--muted)}
.exp .traps .t b{color:var(--warn);font-family:var(--font-head)}
.exp .tag2{display:inline-block;font-size:11px;background:var(--navy-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:2px 6px 2px 0;color:var(--muted)}
.exp .strat{font-size:13px;color:var(--text);background:var(--navy-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;margin-top:8px}

/* pacing timer */
.pacing{display:flex;align-items:center;gap:14px;background:var(--navy-2);border:1px solid var(--line-soft);border-radius:11px;padding:10px 15px;margin-bottom:14px}
.pacing .clock{font-family:var(--font-head);font-size:20px;font-weight:600;letter-spacing:.03em}
.pacing .clock.warn{color:var(--warn)}
.pacing .clock.crit{color:var(--bad)}
.pacing .pace-lbl{font-size:11px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase}
.progressbar{flex:1;height:6px;background:var(--navy-3);border-radius:20px;overflow:hidden}
.progressbar>i{display:block;height:100%;background:var(--azure)}

/* routing panel */
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.route>*{min-width:0}
@media(max-width:700px){.route{grid-template-columns:minmax(0,1fr)}}
.route .mod{background:var(--navy-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px}
.route .mod h4{font-size:13.5px}
.route .mod.hard{border-color:#7a4230}
.route .mod.easy{border-color:#2b567a}
.route .arrows{display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted-2);font-size:12px}
.route .arrow{display:flex;align-items:center;gap:6px}
.route .arrow.up{color:var(--hard)}
.route .arrow.dn{color:var(--easy)}
.svg-route{width:100%;height:auto}

/* exam / results */
.exam-hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.modtag{font-family:var(--font-head);font-size:12.5px;letter-spacing:.04em;padding:4px 11px;border-radius:8px;background:var(--navy-2);border:1px solid var(--line)}
.modtag.hard{color:var(--hard);border-color:#7a4230}
.modtag.easy{color:var(--easy);border-color:#2b567a}
.result-big{font-family:var(--font-head);font-size:60px;font-weight:700;line-height:1}
.rev-item{border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin:8px 0;background:var(--navy-1)}
.rev-item .rq{font-size:13.5px}
.rev-item .rmark{float:right;font-family:var(--font-head);font-weight:600}
.rev-item .rmark.ok{color:var(--good)} .rev-item .rmark.no{color:var(--bad)}

/* mistake bank */
.mistake{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line-soft);border-radius:11px;padding:12px 15px;margin:9px 0;background:var(--navy-1)}
.mistake .mq{font-size:13px}
.mistake .mtags{font-size:11px;color:var(--muted-2);margin-top:3px}

/* strategy */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--navy-2);border:1px solid var(--line-soft);color:var(--muted);padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:500}
.tabs button.active{background:var(--chrome);color:var(--text);border-color:var(--azure-dim)}
.strat-body{font-size:14px;line-height:1.62}
.strat-body h3{font-size:15px;margin:14px 0 6px;color:var(--gold)}
.strat-body ul{margin:6px 0 12px;padding-left:20px}
.strat-body li{margin:5px 0}
.strat-body .ex{background:var(--navy-2);border-left:3px solid var(--azure);padding:9px 13px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}

/* settings / forms */
.field{margin:14px 0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input[type=text]{background:var(--navy-2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;color:var(--text);font-size:14px;width:280px;max-width:100%}
.field input:focus{outline:none;border-color:var(--azure)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--navy-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:transparent;border:none;color:var(--muted);padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:500}
.seg button.active{background:var(--gold);color:#1a1405;font-weight:600}

/* analytics chart */
.chart-wrap{overflow-x:auto}
.spark{width:100%;min-width:520px;height:200px}

/* co-pilot Vega */
.vega{flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
@keyframes vpop{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.vega-wrap{display:flex;align-items:center;gap:12px;background:var(--navy-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.vega-badge{animation:vpop .35s cubic-bezier(.3,1.4,.5,1) both}
.vega-say{font-family:var(--font-head);font-size:14px;color:var(--text);line-height:1.3}
.vega-hi{display:flex;align-items:center;gap:12px;background:var(--navy-2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
.vega-hi span{font-family:var(--font-head);font-size:13.5px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.vega-badge{animation:none}}

/* quizzes */
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.quiz-card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--navy-1);border:1px solid var(--line-soft);border-radius:12px;padding:13px 14px;color:var(--text);transition:.14s;cursor:pointer;min-width:0}
.quiz-card:hover{border-color:var(--azure-dim);transform:translateY(-2px)}
.quiz-card:disabled{opacity:.45;cursor:not-allowed;transform:none}
.qz-emoji{font-size:26px;flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;background:var(--navy-2);border:1px solid var(--line-soft);border-radius:11px}
.qz-body{min-width:0}
.qz-name{font-family:var(--font-head);font-weight:600;font-size:14px}
.qz-blurb{font-size:11.5px;color:var(--muted);margin:2px 0 4px;line-height:1.3}
.qz-meta{font-size:10.5px;color:var(--gold);letter-spacing:.04em}

/* test forms */
.tests-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.form-card{background:linear-gradient(180deg,var(--navy-1),var(--navy-0));border:1px solid var(--line-soft);border-radius:14px;padding:16px;min-width:0;position:relative;overflow:hidden}
.form-card .form-star{position:absolute;top:10px;right:10px;opacity:.85}
.form-num{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.form-name{font-family:var(--font-head);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0 6px}
.form-blurb{font-size:12.5px;color:var(--muted);line-height:1.4;min-height:34px}
.form-spec{font-size:10.5px;color:var(--gold);letter-spacing:.03em;margin-top:8px}

/* inline math */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.05}
.frac .fnum{border-bottom:1px solid currentColor;padding:0 .35em;font-size:.92em}
.frac .fden{padding:0 .35em;font-size:.92em}
.rad{border-top:1px solid currentColor;padding:0 .12em;margin-left:-.05em}
sup{font-size:.72em}

/* misc */
.hidden{display:none!important}
.center{text-align:center}
.muted{color:var(--muted)}
.spacer{height:16px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kpi .k{background:var(--navy-2);border:1px solid var(--line-soft);border-radius:11px;padding:13px}
.kpi .k .v{font-family:var(--font-head);font-size:24px;font-weight:600}
.kpi .k .l{font-size:11px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase}
.empty{text-align:center;color:var(--muted-2);padding:40px 20px;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-3);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:100;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media print{
  body{background:#fff;color:#000}
  .topbar,.nav,.no-print{display:none!important}
  .card{box-shadow:none;border-color:#ccc;background:#fff;color:#000}
  .report-print{color:#000}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>ScoreLab</h1>
        <div class="tag">Precision SAT / PSAT Lab</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   ScoreLab — single-file digital SAT/PSAT prep lab
   Vanilla JS, offline, localStorage-persisted. No external libs (fonts only).
   ========================================================================== */
"use strict";

/* ---------------------------------------------------------------------------
   CONFIG — scales, domains, skills, blueprint weights
   ------------------------------------------------------------------------- */
const CONFIG = {
  scales: {
    sat:   { name:'SAT',            total:[400,1600], sec:[200,800], base:200 },
    psat89:{ name:'PSAT 8/9',       total:[240,1440], sec:[120,720], base:120 },

/* ===================== R&W · CRAFT & STRUCTURE (28%) ===================== */
{ id:'rw-craft-01', sec:'rw', dom:'craft', skill:'Words in Context', dif:'E', type:'mcq',
  stim:`<p>Marisol had rehearsed the violin passage a hundred times, but under the stage lights her fingers felt strangely ______, refusing to move with their usual ease.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['nimble','leaden','graceful','melodic'],
  ans:1,
  exp:{ why:`The clue "refusing to move with their usual ease" signals heaviness or stiffness; "leaden" means heavy and sluggish, matching fingers that will not move.`,
    traps:{ A:'"Nimble" means quick and light — the opposite of fingers that refuse to move.', C:'"Graceful" is positive and contradicts the loss of ease the sentence describes.', D:'"Melodic" describes sound, not the movement of fingers.' },
    skill:'Words in Context', strat:'Cover the blank, predict your own word from the surrounding clue ("won’t move easily" → heavy/stiff), then match it to a choice.' } },

{ id:'rw-craft-02', sec:'rw', dom:'craft', skill:'Words in Context', dif:'M', type:'mcq',
  stim:`<p>Critics initially dismissed the architect's plans as ______: her towers seemed to defy gravity so brazenly that engineers doubted they could ever stand. Decades later, those same designs are studied as landmarks of structural daring.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['conventional','preposterous','derivative','tentative'],
  ans:1,
  exp:{ why:`Engineers "doubted they could ever stand," so critics thought the plans were absurd or impossible — "preposterous" captures that dismissal.`,
    traps:{ A:'"Conventional" means ordinary, but the towers "defy gravity so brazenly" — the opposite of ordinary.', C:'"Derivative" means unoriginal; the passage stresses daring originality, not imitation.', D:'"Tentative" means hesitant, but the designs are described as bold, not cautious.' },
    skill:'Words in Context', strat:'Let the strongest clue ("doubted they could ever stand") set the tone — here, disbelief — and pick the word that matches that emotional charge.' } },

{ id:'rw-craft-03', sec:'rw', dom:'craft', skill:'Words in Context', dif:'H', type:'mcq',
  stim:`<p>The essayist's prose is deceptively ______: each sentence reads as effortless and plain, yet careful analysis reveals a lattice of allusion and calibrated rhythm beneath the simple surface.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['ornate','austere','artless','ponderous'],
  ans:2,
  exp:{ why:`The prose "reads as effortless and plain" on the surface while hiding craft beneath — "artless" means seemingly natural and unstudied, and "deceptively artless" precisely names that gap between surface and depth.`,
    traps:{ A:'"Ornate" means heavily decorated, contradicting "plain" and "simple surface."', B:'"Austere" means severe or bare; it misses the hidden richness the sentence emphasizes.', D:'"Ponderous" means dull and heavy-handed, the opposite of "effortless."' },
    skill:'Words in Context', strat:'When "deceptively" precedes the blank, the word must describe the misleading surface, not the hidden reality — surface here is "plain/effortless."' } },

{ id:'rw-craft-04', sec:'rw', dom:'craft', skill:'Words in Context', dif:'M', type:'mcq',
  stim:`<p>Rather than issuing commands, the new manager preferred to ______ her team's own ideas, drawing out proposals through questions until the staff felt the final plan was theirs.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['suppress','elicit','mandate','disregard'],
  ans:1,
  exp:{ why:`She "draw[s] out proposals through questions," so she pulls ideas from the team — "elicit" means to draw out or evoke.`,
    traps:{ A:'"Suppress" means to hold down; she is encouraging ideas, not silencing them.', C:'"Mandate" means to command, but the sentence contrasts her style with "issuing commands."', D:'"Disregard" means to ignore, contradicting her interest in the team’s ideas.' },
    skill:'Words in Context', strat:'Anchor on the paraphrase already in the sentence ("drawing out proposals") and find its synonym.' } },

{ id:'rw-craft-05', sec:'rw', dom:'craft', skill:'Words in Context', dif:'E', type:'mcq',
  stim:`<p>The documentary was praised for its ______ portrait of the town: it neither romanticized the region's hardships nor exaggerated its charms, showing daily life exactly as residents described it.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['candid','biased','nostalgic','cynical'],
  ans:0,
  exp:{ why:`It "neither romanticized ... nor exaggerated," presenting life "exactly as residents described it" — that honest, unfiltered quality is "candid."`,
    traps:{ B:'"Biased" contradicts the balanced treatment ("neither ... nor").', C:'"Nostalgic" implies romanticizing the past, which the text explicitly rules out.', D:'"Cynical" implies distrust or negativity, but the portrait is described as even-handed.' },
    skill:'Words in Context', strat:'Balanced "neither...nor" structures point to a neutral, fair-minded word.' } },

{ id:'rw-craft-06', sec:'rw', dom:'craft', skill:'Words in Context', dif:'H', type:'mcq',
  stim:`<p>Far from being a ______ figure content to preserve tradition, the composer relentlessly upended the conventions of harmony, unsettling audiences who came expecting the familiar.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['radical','reactionary','virtuosic','prolific'],
  ans:1,
  exp:{ why:`"Far from being a ___ figure content to preserve tradition" sets up a contrast with someone who "upended ... conventions." The blank must name a tradition-preserver: "reactionary" means resistant to change.`,
    traps:{ A:'"Radical" describes what the composer actually was, but "Far from being" demands the opposite of a change-maker.', C:'"Virtuosic" refers to technical skill, irrelevant to the tradition-vs-change contrast.', D:'"Prolific" means producing much work; it says nothing about preserving tradition.' },
    skill:'Words in Context', strat:'"Far from being a ___" flips the blank to the OPPOSITE of the described behavior — read for the negation.' } },

{ id:'rw-craft-07', sec:'rw', dom:'craft', skill:'Words in Context', dif:'M', type:'mcq',
  stim:`<p>The scientist's claims were met with ______: colleagues neither embraced nor rejected them outright, instead withholding judgment until the results could be replicated.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['enthusiasm','skepticism','hostility','indifference'],
  ans:1,
  exp:{ why:`Colleagues "withhold[eld] judgment until the results could be replicated" — a cautious, doubting stance best named by "skepticism."`,
    traps:{ A:'"Enthusiasm" contradicts "neither embraced ... outright."', C:'"Hostility" is too strong; they did not "reject them outright."', D:'"Indifference" means not caring, but they cared enough to demand replication.' },
    skill:'Words in Context', strat:'Match intensity: "withholding judgment" is doubt, not warmth (too positive) or hostility (too harsh).' } },

{ id:'rw-craft-08', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'M', type:'mcq',
  stim:`<p>Honeybees perform a "waggle dance" to tell hivemates where food lies. The angle of the dance relative to vertical encodes the direction to the flowers; the duration of the waggle encodes the distance. In this way, a behavior lasting only seconds transmits a precise map.</p>`,
  prompt:`Which choice best describes the overall structure of the text?`,
  choices:['It presents a claim and then concedes an exception to it.','It introduces a phenomenon and then explains how its parts convey information.','It compares two competing scientific theories.','It narrates a discovery in chronological order.'],
  ans:1,
  exp:{ why:`The text names a phenomenon (the waggle dance), then breaks it into parts — angle encodes direction, duration encodes distance — explaining how each conveys information.`,
    traps:{ A:'There is no concession or exception; the text only builds up an explanation.', C:'Only one mechanism is described; no competing theories appear.', D:'No timeline of discovery is given — the focus is how the dance works, not when it was found.' },
    skill:'Text Structure & Purpose', strat:'Map the moves: phenomenon → decomposition into functions. Match that arc to the answer, ignoring choices that add elements (exceptions, theories) not in the text.' } },

{ id:'rw-craft-09', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'H', type:'mcq',
  stim:`<p>It is tempting to credit the printing press alone for the spread of literacy. Yet presses sat idle without cheap paper, and paper mills depended on a supply of linen rags. The revolution in reading, then, rested as much on worn-out clothing as on movable type.</p>`,
  prompt:`Which choice best states the main purpose of the text?`,
  choices:['To argue that the printing press was overrated as an invention','To complicate a familiar explanation by tracing an overlooked dependency','To describe the process of manufacturing paper from rags','To compare literacy rates before and after the printing press'],
  ans:1,
  exp:{ why:`The text opens with a "tempting" simple story (press = literacy), then adds an overlooked chain (paper, then rags), complicating that story rather than replacing it.`,
    traps:{ A:'It never calls the press "overrated"; it adds a dependency, not a demotion.', C:'Paper-making is a supporting detail, not the purpose of the whole passage.', D:'No literacy-rate comparison or numbers appear.' },
    skill:'Text Structure & Purpose', strat:'"It is tempting ... Yet ..." signals a complicate-the-obvious purpose. Choose the answer describing that added nuance, not a supporting detail.' } },

{ id:'rw-craft-10', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'M', type:'mcq',
  stim:`<p>The following is adapted from a naturalist's field notes.</p><p>At dawn the tide pool looks lifeless, a still bowl of water. But wait, and it wakes: a hermit crab tests the air, anemones unclench their tentacles, and a blenny darts from a crevice. Stillness, I have learned, is only patience I have not yet outlasted.</p>`,
  prompt:`Which choice best describes the function of the underlined-in-spirit final sentence ("Stillness ... outlasted") in the text as a whole?`,
  choices:['It offers a scientific classification of the tide-pool species.','It generalizes the specific observation into a reflective lesson.','It questions whether the earlier observations were accurate.','It introduces a new setting unrelated to the tide pool.'],
  ans:1,
  exp:{ why:`After listing what the pool reveals when watched, the last line turns the concrete scene into a broader insight about patience — a reflective generalization.`,
    traps:{ A:'No species are classified; the tone is reflective, not taxonomic.', C:'It affirms the observations rather than doubting them.', D:'It stays with the tide pool, drawing a lesson from it, not introducing a new place.' },
    skill:'Text Structure & Purpose', strat:'Closing lines often zoom out from example to meaning — ask "does this sentence generalize the scene?"' } },

{ id:'rw-craft-11', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'E', type:'mcq',
  stim:`<p>Some plants defend themselves without thorns or poison. When a caterpillar begins chewing a leaf, certain acacia trees release chemicals into the air. Nearby acacias detect these signals and ramp up their own toxin production before any caterpillar arrives.</p>`,
  prompt:`The main purpose of the text is to`,
  choices:['explain how some plants warn one another of an approaching threat','argue that caterpillars are the greatest threat to acacia trees','describe the chemical composition of acacia toxins','list the many kinds of physical plant defenses'],
  ans:0,
  exp:{ why:`The passage centers on airborne chemical signals that let one acacia alert others to prepare before the pest arrives — plant-to-plant warning.`,
    traps:{ B:'Caterpillars are an example, not the passage’s claim about "greatest threat."', C:'The chemistry itself is never detailed.', D:'Only one defense mechanism is discussed, not a list.' },
    skill:'Text Structure & Purpose', strat:'Pick the choice that covers the whole passage, not a single supporting detail.' } },

{ id:'rw-craft-12', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'H', type:'mcq',
  stim:`<p>The museum's new wing was designed to disorient. Corridors narrow without warning; floors tilt by degrees too small to notice consciously; light sources hide behind angled walls. Visitors report unease they cannot explain — which is precisely the architect's intent, for the wing houses art about exile and displacement.</p>`,
  prompt:`Which choice best describes the function of the final clause ("for the wing houses art about exile and displacement")?`,
  choices:['It concedes a flaw in the wing’s design.','It supplies the rationale that makes the disorienting design purposeful.','It contrasts the wing with other museum spaces.','It questions whether visitors truly feel unease.'],
  ans:1,
  exp:{ why:`Everything before describes unsettling design and unexplained unease; the final clause gives the reason ("for ...") — the art’s theme justifies the discomfort as intentional.`,
    traps:{ A:'It presents the design as successful and deliberate, not flawed.', C:'No other museum spaces are compared.', D:'It accepts the unease as real and explains it, rather than doubting it.' },
    skill:'Text Structure & Purpose', strat:'A clause beginning "for ..." usually gives a reason — check what claim it justifies.' } },

{ id:'rw-craft-13', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'M', type:'mcq',
  stim:`<p>Early maps left blank the regions Europeans had not visited. Later cartographers, uneasy with emptiness, filled those spaces with imagined mountains and beasts. The blank map, it turns out, was the more honest one.</p>`,
  prompt:`Which choice best describes the overall structure of the text?`,
  choices:['It traces a shift in practice and then delivers an evaluative judgment.','It defines a term and gives three examples.','It poses a question and leaves it unresolved.','It refutes a common misconception about mapmaking tools.'],
  ans:0,
  exp:{ why:`The text describes a change (blank maps → maps filled with invention) and then judges it: the blank map "was the more honest one."`,
    traps:{ B:'No term is formally defined, and there are not three parallel examples.', C:'The final sentence resolves the point rather than leaving a question open.', D:'It does not target a stated misconception; it offers a judgment about honesty.' },
    skill:'Text Structure & Purpose', strat:'Watch for a final sentence that evaluates ("more honest") — that turns a description into description-plus-judgment.' } },

{ id:'rw-craft-14', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'M', type:'mcq',
  stim:`<p>A common assumption holds that silence in a conversation signals discomfort. Among the Western Apache, the anthropologist Keith Basso observed the reverse: silence is offered as a courtesy in moments of uncertainty, giving others room rather than pressure.</p>`,
  prompt:`The main rhetorical purpose of the text is to`,
  choices:['present a counterexample that challenges a common assumption','trace the history of anthropological fieldwork','argue that silence is always a sign of respect','define the term "conversation" for readers'],
  ans:0,
  exp:{ why:`The text states a "common assumption" then offers an observed case ("the reverse") that undercuts it — a counterexample structure.`,
    traps:{ B:'It uses one observation, not a history of the field.', C:'"Always" overstates; the text describes one culture’s practice, not a universal rule.', D:'No definition of "conversation" is offered.' },
    skill:'Text Structure & Purpose', strat:'"A common assumption ... the reverse" is a classic setup-then-counter move; name that move.' } },

{ id:'rw-craft-15', sec:'rw', dom:'craft', skill:'Cross-Text Connections', dif:'M', type:'mcq',
  stim:`<p><b>Text 1</b></p><p>City officials argue that installing bright streetlights on every block is the surest way to reduce nighttime crime, since would-be offenders avoid well-lit areas where they might be recognized.</p><p><b>Text 2</b></p><p>Criminologist Dana Voss notes that several studies found no drop in crime after lighting upgrades. Brighter streets, she suggests, may simply help offenders see their surroundings and spot targets more easily.</p>`,
  prompt:`Based on the texts, how would Voss (Text 2) most likely respond to the officials' argument in Text 1?`,
  choices:['By agreeing that lighting is the single most effective anti-crime measure','By noting that evidence does not clearly support lighting’s crime-reducing effect','By proposing that streetlights be removed entirely','By arguing that crime cannot be measured reliably'],
  ans:1,
  exp:{ why:`Voss cites studies finding "no drop in crime" and offers a mechanism by which light might not help — so she would question the officials’ confident claim, not endorse it.`,
    traps:{ A:'This restates Text 1’s position, which Voss undercuts.', C:'Voss doubts the benefit but never calls for removing lights entirely — that overshoots her point.', D:'She relies on crime studies, so she does not claim crime is unmeasurable.' },
    skill:'Cross-Text Connections', strat:'For "how would author 2 respond," find author 2’s stance, then choose the option that applies it to author 1 — avoid over-strong extensions.' } },

{ id:'rw-craft-16', sec:'rw', dom:'craft', skill:'Cross-Text Connections', dif:'H', type:'mcq',
  stim:`<p><b>Text 1</b></p><p>Historians long portrayed the medieval peasant as passive, bound to the land and resigned to hardship, leaving no mark on the political events of the age.</p><p><b>Text 2</b></p><p>Recent scholarship draws on court records showing peasants who sued lords, staged coordinated work stoppages, and negotiated the terms of their labor — acting, in short, as shrewd political agents.</p>`,
  prompt:`Which choice best describes the relationship between the two texts?`,
  choices:['Text 2 provides evidence that revises the characterization presented in Text 1.','Text 2 offers a specific example that confirms Text 1’s general claim.','Text 2 explains why the events described in Text 1 occurred.','Text 2 restates Text 1’s argument in more technical language.'],
  ans:0,
  exp:{ why:`Text 1 calls peasants "passive" and politically absent; Text 2 uses court records of lawsuits and work stoppages to portray them as "shrewd political agents" — evidence that overturns Text 1’s view.`,
    traps:{ B:'Text 2 contradicts rather than confirms Text 1’s claim of passivity.', C:'Text 2 does not explain Text 1’s events; it disputes its characterization.', D:'It advances a different claim, not the same one reworded.' },
    skill:'Cross-Text Connections', strat:'Identify each text’s claim in a word (passive vs. active), then pick the relationship — here, revision through new evidence.' } },

{ id:'rw-craft-17', sec:'rw', dom:'craft', skill:'Cross-Text Connections', dif:'M', type:'mcq',
  stim:`<p><b>Text 1</b></p><p>Advocates of open-plan offices claim that removing walls sparks collaboration: when colleagues can see and overhear one another, ideas cross-pollinate freely.</p><p><b>Text 2</b></p><p>A study tracking employees before and after a switch to open plans found that face-to-face interaction actually fell by 70 percent, as workers donned headphones and retreated into email to reclaim privacy.</p>`,
  prompt:`Based on the texts, the study in Text 2 undermines the advocates' claim in Text 1 primarily by`,
  choices:['showing that open plans reduced, rather than increased, direct interaction','proving that collaboration is unnecessary for good ideas','demonstrating that workers dislike their colleagues','confirming that walls are expensive to remove'],
  ans:0,
  exp:{ why:`Text 1 predicts more collaboration from open plans; Text 2’s data show face-to-face interaction "fell by 70 percent" — directly opposing the predicted effect.`,
    traps:{ B:'The study measures interaction, not whether collaboration matters.', C:'Retreating for privacy is not evidence of disliking colleagues.', D:'Cost of removing walls is never discussed.' },
    skill:'Cross-Text Connections', strat:'"Undermines by" wants the specific mechanism — match the data point in Text 2 to the exact claim it contradicts in Text 1.' } },

{ id:'rw-craft-18', sec:'rw', dom:'craft', skill:'Cross-Text Connections', dif:'H', type:'mcq',
  stim:`<p><b>Text 1</b></p><p>The poet Elian argues that translating poetry is impossible: a poem's music lives in the sounds of its original language, and those sounds cannot survive the crossing into another tongue.</p><p><b>Text 2</b></p><p>The translator Okafor concedes that sound is lost but insists something is also gained. A skilled translator, she writes, composes a new music in the target language, so that translation is not a copy but a fresh act of creation.</p>`,
  prompt:`Based on the texts, Okafor would most likely characterize the "impossibility" Elian describes as`,
  choices:['a decisive reason to abandon translation altogether','a real loss that is nonetheless offset by a creative gain','a myth invented by careless translators','a problem unique to modern poetry'],
  ans:1,
  exp:{ why:`Okafor "concedes that sound is lost" (accepting Elian’s point) "but insists something is also gained" — she reframes the loss as offset by creative gain.`,
    traps:{ A:'She defends translation as "a fresh act of creation," not something to abandon.', C:'She agrees the loss is real, so she does not call it a myth.', D:'Neither text limits the issue to modern poetry.' },
    skill:'Cross-Text Connections', strat:'When author 2 "concedes ... but," the answer usually keeps author 1’s point as partly true while adding a counterweight.' } },

{ id:'rw-craft-19', sec:'rw', dom:'craft', skill:'Words in Context', dif:'M', type:'mcq',
  stim:`<p>The treaty's language was deliberately ______, its key clauses worded so loosely that each nation's diplomats could return home claiming victory on their own terms.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['precise','ambiguous','abrasive','concise'],
  ans:1,
  exp:{ why:`Clauses "worded so loosely" that opposing sides each claim victory must be open to multiple readings — "ambiguous."`,
    traps:{ A:'"Precise" is the opposite of "worded so loosely."', C:'"Abrasive" means harsh in tone, unrelated to looseness of meaning.', D:'"Concise" means brief; brevity does not explain rival interpretations.' },
    skill:'Words in Context', strat:'"So loosely that [both sides claim victory]" demands a word meaning open to interpretation.' } },

{ id:'rw-craft-20', sec:'rw', dom:'craft', skill:'Words in Context', dif:'H', type:'mcq',
  stim:`<p>The memoir refuses easy sentiment. Where another writer might ______ the reader with tidy lessons, Adichie leaves contradictions unresolved, trusting us to sit with discomfort.</p>`,
  prompt:`Which choice completes the text with the most logical and precise word or phrase?`,
  choices:['placate','provoke','bewilder','inform'],
  ans:0,
  exp:{ why:`The contrast ("Where another writer might ___ ... Adichie leaves contradictions unresolved") needs a word for soothing the reader with "tidy lessons" — "placate" means to calm or appease.`,
    traps:{ B:'"Provoke" means to stir up; that is closer to what Adichie does, not the comforting alternative being contrasted.', C:'"Bewilder" means to confuse, but "tidy lessons" are reassuring, not confusing.', D:'"Inform" is neutral and misses the soothing sense of "tidy lessons."' },
    skill:'Words in Context', strat:'In a "Where X might ___ ... Y instead does the opposite" frame, the blank matches X’s contrasting behavior — here, comforting with tidy lessons.' } },

{ id:'rw-craft-21', sec:'rw', dom:'craft', skill:'Cross-Text Connections', dif:'M', type:'mcq',
  stim:`<p><b>Text 1</b></p><p>Zoos, defenders argue, are arks: by breeding endangered species in safety, they preserve animals that might otherwise vanish from a shrinking wild.</p><p><b>Text 2</b></p><p>Critics counter that most zoo animals belong to common species and that captive-bred animals are rarely released, so the "ark" rarely delivers its passengers back to any wilderness.</p>`,
  prompt:`Which choice best describes how Text 2 responds to the argument in Text 1?`,
  choices:['It accepts the ark metaphor but extends it to new species.','It challenges the ark metaphor by questioning whether zoos achieve its promised outcome.','It provides statistical proof that zoos harm animals physically.','It agrees fully with the defenders quoted in Text 1.'],
  ans:1,
  exp:{ why:`Text 2 keeps the "ark" image but argues zoos rarely release captive-bred animals, so the ark "rarely delivers its passengers" — challenging whether zoos deliver the metaphor’s promise.`,
    traps:{ A:'It uses the metaphor to critique, not to extend it to new species.', C:'It discusses release rates, not physical harm, and cites no statistics.', D:'It counters the defenders rather than agreeing.' },
    skill:'Cross-Text Connections', strat:'When a text adopts the other’s metaphor, check whether it is endorsing or turning that metaphor against the first author.' } },

{ id:'rw-craft-22', sec:'rw', dom:'craft', skill:'Text Structure & Purpose', dif:'E', type:'mcq',
  stim:`<p>Octopuses can taste with their arms. Each sucker is lined with receptors that detect chemicals on contact, so an octopus probing a crevice "samples" surfaces before its eyes ever see what lies inside.</p>`,
  prompt:`Which choice best states the main idea of the text?`,
  choices:['Octopus arms contain receptors that let the animal taste by touch.','Octopuses have poor eyesight compared with other sea creatures.','Octopuses prefer to hunt inside dark crevices.','Octopus suckers are stronger than those of squid.'],
  ans:0,
  exp:{ why:`The text’s core point is that suckers have chemical receptors, so the octopus tastes surfaces on contact — tasting by touch.`,
    traps:{ B:'Eyesight is mentioned only to contrast timing ("before its eyes ... see"); no comparison of eyesight quality is made.', C:'Crevice-probing is an illustration, not the main claim.', D:'Squid are never mentioned.' },
    skill:'Text Structure & Purpose', strat:'The main idea is the general claim the details support — here, every detail serves "tastes with its arms."' } },

/* ===================== R&W · INFORMATION & IDEAS (26%) ===================== */
{ id:'rw-info-01', sec:'rw', dom:'info', skill:'Central Ideas & Details', dif:'E', type:'mcq',
  stim:`<p>The axolotl, a salamander native to a few lakes near Mexico City, keeps its larval features for life. Unlike most amphibians, it never fully leaves the water or loses its feathery external gills, remaining in a permanently juvenile form even as it grows and reproduces.</p>`,
  prompt:`Which choice best states the main idea of the text?`,
  choices:['The axolotl retains juvenile traits throughout its adult life.','The axolotl lives only in lakes near Mexico City.','Most amphibians lose their gills as they mature.','The axolotl reproduces more often than other salamanders.'],
  ans:0,
  exp:{ why:`Every detail — keeping larval features, never leaving the water, retaining gills "even as it grows and reproduces" — supports the point that the axolotl stays juvenile for life.`,
    traps:{ B:'Its habitat is a supporting detail, not the central idea.', C:'This is background contrast about other amphibians, not the passage’s focus.', D:'Reproduction is mentioned only to stress it happens in a juvenile form; no frequency is compared.' },
    skill:'Central Ideas & Details', strat:'The central idea is what all details point to; habitat and contrasts are scaffolding, not the claim.' } },

{ id:'rw-info-02', sec:'rw', dom:'info', skill:'Central Ideas & Details', dif:'M', type:'mcq',
  stim:`<p>For centuries, sailors dismissed the "rogue wave" — a wall of water towering far above the surrounding sea — as a tall tale. Then in 1995, an oil platform's sensors recorded a single wave 26 meters high amid waves half that size, giving the legend, at last, a hard number.</p>`,
  prompt:`Which choice best states the main idea of the text?`,
  choices:['Rogue waves are more dangerous to oil platforms than to ships.','A once-dismissed phenomenon gained credibility when instruments finally measured it.','Sailors in the past were unreliable observers of the sea.','Ocean waves rarely exceed half the height of a rogue wave.'],
  ans:1,
  exp:{ why:`The arc is: legend dismissed → 1995 sensor records a 26 m wave → "giving the legend, at last, a hard number." That is a dismissed phenomenon confirmed by measurement.`,
    traps:{ A:'No comparison of danger to platforms vs. ships is made.', C:'Sailors doubted the wave; the text does not fault their observation skills broadly.', D:'The half-size detail describes one event, not a general rule about waves.' },
    skill:'Central Ideas & Details', strat:'Trace the narrative shift (myth → evidence) and pick the choice that captures the whole shift, not one detail.' } },

{ id:'rw-info-03', sec:'rw', dom:'info', skill:'Central Ideas & Details', dif:'H', type:'mcq',
  stim:`<p>The economist argues that a currency's value rests not on gold or decree but on a shared fiction: money works only because each person expects everyone else to accept it tomorrow. Break that mutual expectation, and even a vault of banknotes becomes worthless paper.</p>`,
  prompt:`Which choice best states the main idea of the text?`,
  choices:['Governments should back their currencies with gold reserves.','A currency’s worth depends on collective, self-reinforcing expectations of its acceptance.','Banknotes are physically fragile and easily destroyed.','Economists disagree about what gives money its value.'],
  ans:1,
  exp:{ why:`The core claim is that money’s value is a "shared fiction" resting on everyone expecting others to accept it — collective, self-reinforcing belief.`,
    traps:{ A:'The text explicitly says value rests "not on gold," contradicting a gold-backing recommendation.', C:'"Worthless paper" is a figure of speech about lost value, not physical fragility.', D:'Only one economist’s argument is presented; no disagreement is described.' },
    skill:'Central Ideas & Details', strat:'Abstract-argument passages hinge on one thesis; restate it plainly and match, discarding literal misreadings.' } },

{ id:'rw-info-04', sec:'rw', dom:'info', skill:'Central Ideas & Details', dif:'M', type:'mcq',
  stim:`<p>Tardigrades, or "water bears," survive conditions that would kill almost anything else: boiling heat, the vacuum of space, and doses of radiation hundreds of times lethal to humans. They endure by drying into a dormant husk, halting their metabolism until water returns.</p>`,
  prompt:`According to the text, tardigrades survive extreme conditions primarily by`,
  choices:['growing a protective outer shell','entering a dried-out, dormant state that pauses their metabolism','moving quickly away from danger','reproducing faster than they die'],
  ans:1,
  exp:{ why:`The text states directly that they "endure by drying into a dormant husk, halting their metabolism until water returns."`,
    traps:{ A:'A "husk" is a dried state, not a grown shell; the mechanism is dormancy, not armor.', C:'No mention of movement or fleeing appears.', D:'Reproduction rate is never discussed.' },
    skill:'Central Ideas & Details', strat:'"Primarily by" questions want the explicit mechanism — quote-match the sentence that answers "how."' } },

{ id:'rw-info-05', sec:'rw', dom:'info', skill:'Inferences', dif:'M', type:'mcq',
  stim:`<p>In the archive, the letters from the general to his wife grow shorter and more formal as the war drags on. The early pages brim with plans for their garden; by the final year, he writes only of weather and supply lines, never once of home.</p>`,
  prompt:`Which choice most logically completes the text with a reasonable inference?`,
  choices:['the general had lost interest in gardening as a hobby.','the strain of the prolonged war appears to have worn down his capacity for intimate reflection.','his wife had asked him to write only about military matters.','the letters were intercepted and rewritten by censors.'],
  ans:1,
  exp:{ why:`Letters shrinking to "weather and supply lines, never once of home" as the war "drags on" suggests the war’s strain eroded his ability to write warmly — a supported inference.`,
    traps:{ A:'The garden stands for intimacy generally; losing a hobby is too literal and narrow.', C:'Nothing indicates his wife made such a request — that adds unstated facts.', D:'Censorship is invented; the text gives no hint of interception.' },
    skill:'Inferences', strat:'A valid inference stays tethered to the evidence (fading warmth) and avoids importing new facts (censors, requests).' } },

{ id:'rw-info-06', sec:'rw', dom:'info', skill:'Inferences', dif:'H', type:'mcq',
  stim:`<p>Ecologists found that after wolves returned to the valley, the riverbanks stopped eroding. The wolves ate no plants and moved no soil; yet by thinning and unsettling the elk herds that had been grazing the young willows to stubble, they allowed the roots that hold the banks to return.</p>`,
  prompt:`Which choice most logically completes the text with a reasonable inference?`,
  choices:['the wolves directly reinforced the riverbanks with their movement.','a predator can reshape a landscape indirectly, through its effect on other species.','elk are more destructive to rivers than any other animal.','willows cannot grow unless wolves are present in a valley.'],
  ans:1,
  exp:{ why:`Wolves "ate no plants and moved no soil" yet stabilized banks by reducing elk grazing so willow roots returned — an indirect, chain-reaction effect on the landscape.`,
    traps:{ A:'The text explicitly says the wolves "moved no soil," ruling out direct reinforcement.', C:'"More destructive than any other animal" is an unsupported superlative.', D:'Willows need reduced grazing, not literally the presence of wolves — that overstates the link.' },
    skill:'Inferences', strat:'Track the causal chain (wolves → fewer elk → more willows → firmer banks) and choose the inference that names the indirect mechanism.' } },

{ id:'rw-info-07', sec:'rw', dom:'info', skill:'Inferences', dif:'M', type:'mcq',
  stim:`<p>The new employee noticed that whenever the director praised a project in a meeting, funding for it quietly dried up within the month. Those the director pointedly ignored, by contrast, tended to receive fresh resources.</p>`,
  prompt:`Which choice most logically completes the text with a reasonable inference?`,
  choices:['the director’s spoken praise was not a reliable guide to which projects would actually be supported.','the director disliked every project equally.','funding decisions in the organization were made at random.','the employee misunderstood the meaning of the word "praise."'],
  ans:0,
  exp:{ why:`Praise preceded funding cuts while being ignored preceded fresh resources, so the director’s words did not match the funding outcomes — praise was an unreliable signal.`,
    traps:{ B:'The director praised some and ignored others, so not "equally."', C:'The pattern is consistent, not random.', D:'Nothing suggests the employee misread "praise"; the point is the mismatch, not a vocabulary error.' },
    skill:'Inferences', strat:'When outcomes reverse expectations consistently, infer that the surface signal is misleading — stay with what the pattern shows.' } },

{ id:'rw-info-08', sec:'rw', dom:'info', skill:'Inferences', dif:'E', type:'mcq',
  stim:`<p>The bakery posts no sign and takes no advertising, yet by six each morning a line stretches down the block. Regulars say they first heard of it from a neighbor, who heard of it from a friend.</p>`,
  prompt:`Which choice most logically completes the text with a reasonable inference?`,
  choices:['the bakery has built its following largely through word of mouth.','the bakery’s bread is of poor quality.','the bakery spends heavily on online advertising.','the neighborhood has very few other restaurants.'],
  ans:0,
  exp:{ why:`With "no sign" and "no advertising" but customers who "heard of it from a neighbor ... from a friend," the following clearly spread person to person — word of mouth.`,
    traps:{ B:'Long daily lines suggest popularity, not poor quality.', C:'The text says it "takes no advertising," contradicting heavy ad spending.', D:'Other restaurants are never mentioned.' },
    skill:'Inferences', strat:'Combine the stated facts (no ads + friend-to-friend) into the simplest conclusion they jointly support.' } },

{ id:'rw-info-09', sec:'rw', dom:'info', skill:'Command of Evidence', dif:'M', type:'mcq',
  stim:`<p>A researcher hypothesized that houseplants improve office workers' focus. To test this, she had employees complete identical concentration tasks in two rooms — one filled with leafy plants, the other bare — and compared their error rates.</p>`,
  prompt:`Which finding, if true, would most strongly support the researcher's hypothesis?`,
  choices:['Workers said they found the plant-filled room more attractive.','Workers made significantly fewer errors on the tasks in the plant-filled room than in the bare room.','Workers spent more time in the plant-filled room during their breaks.','The plants in the room required little maintenance.'],
  ans:1,
  exp:{ why:`The hypothesis is about focus, measured by error rates on the tasks. Fewer errors in the plant room than the bare room directly shows improved focus.`,
    traps:{ A:'Finding a room "attractive" is a preference, not a measure of focus.', C:'Break-time preference does not measure task concentration.', D:'Plant maintenance is irrelevant to worker focus.' },
    skill:'Command of Evidence', strat:'Match the evidence to the exact variable in the claim — here "focus," operationalized as task error rates, not opinions.' } },

{ id:'rw-info-10', sec:'rw', dom:'info', skill:'Command of Evidence', dif:'H', type:'mcq',
  stim:`<p>Some historians claim that a city's medieval prosperity came chiefly from its cloth trade. A skeptic counters that if cloth were truly the engine of wealth, the city's fortunes should have tracked the ups and downs of the cloth market.</p>`,
  prompt:`Which finding would most directly support the skeptic's counterargument?`,
  choices:['The city’s wealth remained high even during years when the cloth market collapsed.','The city produced more cloth than any neighboring town.','Cloth merchants were among the city’s wealthiest residents.','The cloth trade employed a large share of the city’s workers.'],
  ans:0,
  exp:{ why:`The skeptic says that if cloth drove wealth, wealth should rise and fall with the cloth market. Wealth staying high while the cloth market collapsed breaks that link — supporting the skeptic.`,
    traps:{ B:'High cloth output fits the historians’ claim, not the skeptic’s.', C:'Rich cloth merchants support the cloth-as-engine view.', D:'Heavy cloth employment also supports the historians, not the skeptic.' },
    skill:'Command of Evidence', strat:'For a counterargument, find the data point that severs the claimed cause-effect link (wealth decoupled from cloth).' } },

{ id:'rw-info-11', sec:'rw', dom:'info', skill:'Command of Evidence', dif:'M', type:'mcq',
  stim:`<p>A student is writing about the diet of the giant panda and wants evidence that pandas, though classified as carnivores, rely overwhelmingly on a single plant food.</p>`,
  prompt:`Which quotation from a source would best support the student's point?`,
  choices:['"Pandas were long grouped with bears, their closest evolutionary relatives."','"Roughly 99 percent of a wild panda’s diet consists of bamboo, which it eats for up to 14 hours a day."','"Captive pandas are sometimes given specially formulated biscuits."','"Pandas possess a modified wrist bone that functions like a thumb."'],
  ans:1,
  exp:{ why:`The point is heavy reliance on one plant food. "Roughly 99 percent ... consists of bamboo" is exactly that: overwhelming dependence on a single plant.`,
    traps:{ A:'Evolutionary relatives address classification, not diet composition.', C:'Captive biscuits are an exception that dilutes, not supports, the "single plant food" claim.', D:'The pseudo-thumb aids eating mechanics but does not show dietary proportion.' },
    skill:'Command of Evidence', strat:'Pick the quotation whose content maps one-to-one onto the claim — here a percentage showing single-food dominance.' } },

{ id:'rw-info-12', sec:'rw', dom:'info', skill:'Command of Evidence', dif:'M', type:'mcq',
  stim:`<p><b>Soil moisture and seedling survival (greenhouse trial)</b></p>
    <table><tr><th>Watering level</th><th>Seedlings planted</th><th>Survived to 30 days</th></tr>
    <tr><td>Low</td><td>100</td><td>41</td></tr>
    <tr><td>Medium</td><td>100</td><td>88</td></tr>
    <tr><td>High</td><td>100</td><td>52</td></tr></table>`,
  prompt:`A student claims the data show that seedling survival is highest at a moderate watering level, not at the extremes. Which choice best uses the table to support this claim?`,
  choices:['Survival at the medium level (88) exceeded survival at both the low (41) and high (52) levels.','More seedlings were planted at the medium level than at the low level.','Survival increased steadily as watering increased from low to high.','Fewer than half of the low-watering seedlings survived.'],
  ans:0,
  exp:{ why:`The claim is that a moderate level beats the extremes. Medium survival (88) is greater than both low (41) and high (52), directly supporting a peak in the middle.`,
    traps:{ B:'Equal numbers (100) were planted at every level, so this is false and irrelevant.', C:'Survival did not rise steadily — it peaked at medium and fell at high.', D:'True but only about the low level; it does not show the middle is the peak.' },
    skill:'Command of Evidence', strat:'For data claims, cite the specific comparison the claim requires — here medium vs. both extremes, not a single value.' } },

{ id:'rw-info-13', sec:'rw', dom:'info', skill:'Command of Evidence', dif:'H', type:'mcq',
  stim:`<p><b>Reported hours of sleep and quiz scores (n = 60 students)</b></p>
    <table><tr><th>Nightly sleep</th><th>Avg. quiz score (%)</th></tr>
    <tr><td>Under 5 hr</td><td>62</td></tr>
    <tr><td>5–6 hr</td><td>71</td></tr>
    <tr><td>7–8 hr</td><td>84</td></tr>
    <tr><td>Over 9 hr</td><td>80</td></tr></table>`,
  prompt:`Which statement is best supported by the data in the table?`,
  choices:['Average quiz scores were highest among students reporting 7–8 hours of sleep.','Students who slept under 5 hours scored higher than any other group.','Sleeping over 9 hours produced the lowest average scores.','Quiz scores rose without interruption as sleep increased.'],
  ans:0,
  exp:{ why:`The 7–8 hr group’s average (84%) is the highest value in the table, so scores peaked there.`,
    traps:{ B:'Under-5 hr had the lowest average (62%), not the highest.', C:'The lowest average was under-5 hr (62%), not over-9 hr (80%).', D:'Scores rose then dipped from 84 to 80, so not "without interruption."' },
    skill:'Command of Evidence', strat:'Read the table for the actual maximum and check monotonic claims against every row before choosing.' } },

{ id:'rw-info-14', sec:'rw', dom:'info', skill:'Central Ideas & Details', dif:'M', type:'mcq',
  stim:`<p>The dictionary we treat as an authority was, in its first editions, a record of guesses. Samuel Johnson filled his 1755 work with definitions drawn from his own reading and, at times, his own opinions, occasionally admitting in the entries themselves that he did not know a word's origin.</p>`,
  prompt:`Which choice best states the main idea of the text?`,
  choices:['Samuel Johnson’s dictionary was the first ever written in English.','An authoritative reference began as a subjective, admittedly uncertain compilation.','Modern dictionaries contain more words than Johnson’s did.','Johnson was primarily a poet rather than a lexicographer.'],
  ans:1,
  exp:{ why:`The passage contrasts the dictionary’s current authority with its origins "as a record of guesses," shaped by Johnson’s reading, opinions, and admitted uncertainty.`,
    traps:{ A:'The text never claims his was the first English dictionary.', C:'No comparison of word counts with modern dictionaries appears.', D:'His profession is not the focus; his subjective method is.' },
    skill:'Central Ideas & Details', strat:'When a passage juxtaposes "treated as authority" with humble origins, the main idea is that contrast.' } },

{ id:'rw-info-15', sec:'rw', dom:'info', skill:'Inferences', dif:'H', type:'mcq',
  stim:`<p>Linguists note that languages with many speakers tend to have simpler grammars than languages spoken by small, isolated communities. One proposed explanation: adults learning a language as outsiders smooth away irregularities that children, learning from birth, would preserve.</p>`,
  prompt:`Which choice most logically completes the text with a reasonable inference?`,
  choices:['a language’s grammatical complexity may depend partly on how many of its speakers learned it as adults.','languages with few speakers are impossible for adults to learn.','simpler grammars are always easier to understand than complex ones.','children cannot learn languages with irregular grammar.'],
  ans:0,
  exp:{ why:`If adult learners "smooth away irregularities," then widely spoken languages (with more adult learners) become simpler — so complexity depends partly on the share of adult learners.`,
    traps:{ B:'"Impossible for adults" contradicts the premise that adults do learn such languages.', C:'"Always ... easier to understand" is an unsupported absolute.', D:'The text says children "preserve" irregularities, implying they can learn them, not that they cannot.' },
    skill:'Inferences', strat:'Turn the proposed mechanism into a general principle without adding absolutes like "impossible" or "always."' } },

{ id:'rw-info-16', sec:'rw', dom:'info', skill:'Central Ideas & Details', dif:'E', type:'mcq',
  stim:`<p>Fireflies flash in patterns unique to their species, and females answer only the pattern of their own kind. A male's blink, then, is less a decoration than a password — a signal that must be recognized before any mate will reply.</p>`,
  prompt:`According to the text, a firefly's flash pattern functions mainly as`,
  choices:['a way to frighten predators away','a species-specific signal used to attract a compatible mate','a method of navigating in the dark','a means of regulating body temperature'],
  ans:1,
  exp:{ why:`The text calls the flash "a password" recognized only by "its own kind" before a mate replies — a species-specific mating signal.`,
    traps:{ A:'Predators are never mentioned.', C:'Navigation is not discussed; the flash targets mates.', D:'Temperature regulation is unrelated to the passage.' },
    skill:'Central Ideas & Details', strat:'The metaphor ("password") states the function directly — pick the choice that paraphrases it.' } },

{ id:'rw-info-17', sec:'rw', dom:'info', skill:'Command of Evidence', dif:'M', type:'mcq',
  stim:`<p>An urban planner argues that adding protected bike lanes makes streets safer for everyone, not just cyclists. A colleague asks for evidence that the lanes reduce harm to people outside of bicycles as well.</p>`,
  prompt:`Which finding would best support the planner's specific argument?`,
  choices:['Cyclist injuries fell after the protected lanes were installed.','Pedestrian and motorist injuries, not only cyclist injuries, declined on streets with protected lanes.','More residents reported riding bikes after the lanes opened.','The lanes were popular in resident surveys.'],
  ans:1,
  exp:{ why:`The claim is that the lanes help "everyone, not just cyclists." A decline in pedestrian AND motorist injuries — people outside bicycles — is exactly the needed evidence.`,
    traps:{ A:'Fewer cyclist injuries supports safety for cyclists only, not "everyone."', C:'More ridership is not a measure of safety for non-cyclists.', D:'Popularity is an opinion, not a harm-reduction outcome.' },
    skill:'Command of Evidence', strat:'When a claim widens the beneficiaries ("everyone"), the evidence must cover the widened group, not the original one.' } },

{ id:'rw-info-18', sec:'rw', dom:'info', skill:'Inferences', dif:'M', type:'mcq',
  stim:`<p>The colony of ants had no leader directing traffic, yet the foraging trails it built consistently followed the shortest routes to food. Each ant simply laid a chemical trace and preferred stronger traces, and shorter paths — traveled more often in the same time — accumulated the strongest scent.</p>`,
  prompt:`Which choice most logically completes the text with a reasonable inference?`,
  choices:['efficient group behavior can emerge from simple individual rules without central control.','ants are capable of measuring distances precisely.','the colony must have had a hidden leader after all.','chemical traces are stronger than any other form of animal communication.'],
  ans:0,
  exp:{ why:`With "no leader" but efficient shortest-path trails arising from each ant’s simple rule (follow stronger scent), the case illustrates order emerging from simple local rules — no central control needed.`,
    traps:{ B:'Ants do not measure distance; shorter paths just accumulate scent faster.', C:'The premise is explicitly no leader; inferring a hidden one contradicts the text.', D:'No comparison of communication strength across animals is made.' },
    skill:'Inferences', strat:'Generalize the described mechanism (local rule → global efficiency) rather than reinserting the very thing the text rules out.' } },

{ id:'rw-info-19', sec:'rw', dom:'info', skill:'Central Ideas & Details', dif:'H', type:'mcq',
  stim:`<p>The philosopher distinguishes "cleverness" from "wisdom." Cleverness, she writes, finds the most efficient means to any end a person happens to hold; wisdom asks whether the end is worth pursuing at all. A society can grow ever more clever, she warns, while losing the capacity to ask the second question.</p>`,
  prompt:`Which choice best states the main idea of the text?`,
  choices:['Cleverness and wisdom are ultimately the same trait.','Wisdom concerns the worth of our goals, a question cleverness alone cannot address.','Efficient means are always preferable to inefficient ones.','Modern societies have become less clever over time.'],
  ans:1,
  exp:{ why:`The distinction is the heart of the passage: cleverness serves any goal efficiently, while wisdom judges whether the goal is worthwhile — a question cleverness cannot ask.`,
    traps:{ A:'The text draws a sharp contrast, so they are not the same.', C:'The passage warns that efficient means can serve unworthy ends, undercutting "always preferable."', D:'It says societies grow "more clever," not less.' },
    skill:'Central Ideas & Details', strat:'For a defined contrast, the main idea is the distinction itself — restate what separates the two terms.' } },

{ id:'rw-info-20', sec:'rw', dom:'info', skill:'Command of Evidence', dif:'M', type:'mcq',
  stim:`<p><b>Recycling rates by bin design (office pilot, 4 weeks)</b></p>
    <table><tr><th>Bin lid</th><th>Correctly sorted items (%)</th></tr>
    <tr><td>Open top</td><td>54</td></tr>
    <tr><td>Round hole</td><td>68</td></tr>
    <tr><td>Bottle-shaped hole</td><td>83</td></tr></table>`,
  prompt:`A student concludes that shaping a bin's opening to match its intended contents improves sorting accuracy. Which choice best supports this conclusion with data from the table?`,
  choices:['The bottle-shaped opening yielded the highest correct-sorting rate (83%), above the round hole (68%) and open top (54%).','The open-top bin had the lowest correct-sorting rate.','Each bin design was tested for four weeks.','Round holes performed better than open tops.'],
  ans:0,
  exp:{ why:`The conclusion is that shaping the opening to fit the item helps. The bottle-shaped hole — matched to its contents — scored highest (83%), above less specific shapes, directly supporting the claim.`,
    traps:{ B:'True but shows only the worst case, not that matching the shape is what helped.', C:'Equal test duration is background, not evidence for the shaping effect.', D:'A partial comparison; it omits the decisive bottle-shaped result.' },
    skill:'Command of Evidence', strat:'Support a causal claim with the row that isolates the claimed factor — here the shape-matched bin outperforming generic ones.' } },

{ id:'rw-info-21', sec:'rw', dom:'info', skill:'Inferences', dif:'E', type:'mcq',
  stim:`<p>Every map in the old atlas shows the coastline in a slightly different place. The mapmakers worked decades apart, each correcting the last, and the shifting line traces not a moving shore but a slowly sharpening picture of where the shore had been all along.</p>`,
  prompt:`Which choice most logically completes the text with a reasonable inference?`,
  choices:['the differences among the maps reflect improving accuracy rather than a changing coastline.','the coastline physically moved a great deal over the decades.','the earliest map was the most accurate of them all.','the mapmakers deliberately falsified their measurements.'],
  ans:0,
  exp:{ why:`The text says the shifting line traces "not a moving shore but a slowly sharpening picture," so the differences reflect growing accuracy, not real coastal movement.`,
    traps:{ B:'The passage explicitly denies "a moving shore."', C:'Each map "correct[ed] the last," implying later maps were more accurate, not the earliest.', D:'Correcting predecessors is honest refinement, not falsification.' },
    skill:'Inferences', strat:'When the text directly contrasts two explanations, infer the one it endorses — improving accuracy over physical change.' } },

/* ===================== R&W · STANDARD ENGLISH CONVENTIONS (26%) ===================== */
{ id:'rw-conv-01', sec:'rw', dom:'conv', skill:'Boundaries', dif:'E', type:'mcq',
  stim:`<p>The marathon route wound through five neighborhoods ______ it ended at the harbor, where a crowd had gathered since dawn.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[', and',', it','; and',' and,'],
  ans:0,
  exp:{ why:`Two independent clauses ("The marathon route wound..." and "it ended...") are joined correctly by a comma plus the coordinating conjunction "and."`,
    traps:{ B:'A comma alone between two independent clauses is a comma splice.', C:'A semicolon should not be paired with "and"; use one or the other.', D:'Placing the comma after "and" misplaces the punctuation and leaves a splice.' },
    skill:'Boundaries', strat:'Independent + independent needs a period, a semicolon, or a comma + FANBOYS — never a bare comma.' } },

{ id:'rw-conv-02', sec:'rw', dom:'conv', skill:'Boundaries', dif:'M', type:'mcq',
  stim:`<p>The committee reached its decision quickly ______ the debate that preceded it had lasted three long weeks.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[', however','; however,',' however','however,'],
  ans:1,
  exp:{ why:`"However" is a conjunctive adverb joining two independent clauses, so it needs a semicolon before it and a comma after: "...quickly; however, the debate...".`,
    traps:{ A:'A comma before "however" between two clauses creates a comma splice.', C:'Omitting punctuation before "however" runs the clauses together.', D:'"however," with no preceding mark still splices the two independent clauses.' },
    skill:'Boundaries', strat:'When a transition like "however" links two full sentences, use "; however," — semicolon before, comma after.' } },

{ id:'rw-conv-03', sec:'rw', dom:'conv', skill:'Boundaries', dif:'M', type:'mcq',
  stim:`<p>She packed the essentials for the expedition ______ a compass, a water filter, and a coil of sturdy rope.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[', for example','; namely',':',', and'],
  ans:2,
  exp:{ why:`A colon introduces a list that follows an independent clause ("She packed the essentials..."), so a colon before the three items is correct.`,
    traps:{ A:'"for example" implies a partial sample, and the phrasing is awkward before a full list; a colon is the clean choice.', B:'"; namely" is unnecessarily heavy and less standard here than a simple colon.', D:'", and" would make "a compass" part of the main clause, not introduce the list.' },
    skill:'Boundaries', strat:'An independent clause followed by a list or explanation takes a colon.' } },

{ id:'rw-conv-04', sec:'rw', dom:'conv', skill:'Boundaries', dif:'H', type:'mcq',
  stim:`<p>The novelist's early manuscripts ______ now archived at the university ______ reveal how heavily she revised even her most famous opening lines.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[', / ,',', / (no punctuation)','(no punctuation) / ,',' — / (no punctuation)'],
  ans:0,
  exp:{ why:`"now archived at the university" is nonessential information interrupting the subject and verb, so it must be enclosed by a matched pair of commas — one before, one after.`,
    traps:{ B:'A comma before but none after leaves the nonessential phrase unclosed.', C:'No comma before but one after is likewise unbalanced.', D:'A dash before must pair with a dash after, not with nothing.' },
    skill:'Boundaries', strat:'Nonessential elements need matching punctuation on both sides — two commas, two dashes, or two parentheses.' } },

{ id:'rw-conv-05', sec:'rw', dom:'conv', skill:'Boundaries', dif:'E', type:'mcq',
  stim:`<p>After the storm finally passed ______ the volunteers began clearing fallen branches from the road.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[',',';',':',' (no punctuation)'],
  ans:0,
  exp:{ why:`"After the storm finally passed" is an introductory dependent clause, so a comma separates it from the main clause that follows.`,
    traps:{ B:'A semicolon requires an independent clause on both sides; the opener is dependent.', C:'A colon needs an independent clause before it; the opener is not independent.', D:'Omitting the comma runs the introductory clause into the main clause.' },
    skill:'Boundaries', strat:'A dependent clause that opens a sentence is followed by a comma.' } },

{ id:'rw-conv-06', sec:'rw', dom:'conv', skill:'Boundaries', dif:'M', type:'mcq',
  stim:`<p>The recipe calls for three spices ______ cumin, coriander, and smoked paprika ______ that give the stew its distinctive warmth.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
