{"id":"s3-ma-adv-18","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"H","type":"mcq","stim":"","prompt":"Which of the following is the completely factored form of 16x⁴ − 1 over the integers?","choices":["(2x − 1)(2x + 1)(4x² + 1)","(4x² − 1)(4x² + 1)","(2x − 1)²(2x + 1)²","(4x² + 1)²"],"ans":0,"exp":{"why":"16x⁴ − 1 = (4x²)² − 1² = (4x² − 1)(4x² + 1). Then 4x² − 1 = (2x − 1)(2x + 1) is another difference of squares, while 4x² + 1 does not factor over the integers. Completely factored: (2x − 1)(2x + 1)(4x² + 1).","traps":{"A":"Correct and completely factored.","B":"Not complete: 4x² − 1 still factors.","C":"This equals (4x² − 1)², not 16x⁴ − 1.","D":"(4x² + 1)² = 16x⁴ + 8x² + 1, not the given expression."},"skill":"Equivalent expressions","strat":"Apply difference of squares repeatedly until no factor factors further."}},
{"id":"s3-ma-adv-19","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"H","type":"mcq","stim":"","prompt":"Which expression is equivalent to (x + 2)(x² − 2x + 4)?","choices":["x³ + 8","x³ − 8","x³ + 2x² + 8","x³ + 6x"],"ans":0,"exp":{"why":"This is the sum-of-cubes pattern (a + b)(a² − ab + b²) = a³ + b³ with a = x, b = 2, giving x³ + 8. Expanding directly: x³ − 2x² + 4x + 2x² − 4x + 8 = x³ + 8.","traps":{"A":"Correct: sum of cubes, x³ + 8.","B":"That is the difference of cubes form.","C":"Failed to cancel the −2x² and +2x² terms.","D":"Failed to cancel terms correctly."},"skill":"Equivalent expressions","strat":"Recognize the sum-of-cubes factorization or expand and cancel."}},
{"id":"s3-ma-adv-20","sec":"math","dom":"adv","skill":"Equivalent expressions","dif":"H","type":"mcq","stim":"","prompt":"Which expression is equivalent to x² + 8x + 10?","choices":["(x + 4)² − 6","(x + 4)² + 6","(x + 4)² − 16","(x − 4)² − 6"],"ans":0,"exp":{"why":"Complete the square: x² + 8x = (x + 4)² − 16. So x² + 8x + 10 = (x + 4)² − 16 + 10 = (x + 4)² − 6.","traps":{"A":"Correct completed-square form.","B":"Added 6 instead of subtracting.","C":"Forgot to add back the +10.","D":"Wrong sign inside the square (should be +4)."},"skill":"Equivalent expressions","strat":"Complete the square: take half of 8, square it, then adjust the constant."}},
{"id":"s3-ma-adv-21","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"E","type":"spr","stim":"<p>The function f is defined by f(x) = x² − 4x + 1.</p>","prompt":"What is the value of f(3)?","ans":["-2"],"exp":{"why":"Substitute x = 3: f(3) = 3² − 4(3) + 1 = 9 − 12 + 1 = −2.","skill":"Nonlinear functions","strat":"Substitute the input and follow the order of operations."}},
{"id":"s3-ma-adv-22","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"M","type":"mcq","stim":"<p>The function f is defined by f(x) = x².</p>","prompt":"Which expression is equivalent to f(x + 1) − f(x)?","choices":["2x + 1","1","2x","x² + 1"],"ans":0,"exp":{"why":"f(x + 1) = (x + 1)² = x² + 2x + 1. Then f(x + 1) − f(x) = (x² + 2x + 1) − x² = 2x + 1.","traps":{"A":"Correct: the x² terms cancel, leaving 2x + 1.","B":"Only kept the constant; dropped the 2x term.","C":"Dropped the +1 constant.","D":"Did not subtract f(x)."},"skill":"Nonlinear functions","strat":"Expand f(x + 1), then subtract f(x) and combine like terms."}},
{"id":"s3-ma-adv-23","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"M","type":"mcq","stim":"","prompt":"A quadratic function f with leading coefficient 1 has zeros at x = −2 and x = 5. Which of the following defines f(x)?","choices":["x² − 3x − 10","x² + 3x − 10","x² − 3x + 10","x² − 7x − 10"],"ans":0,"exp":{"why":"With zeros −2 and 5 and leading coefficient 1: f(x) = (x + 2)(x − 5) = x² − 5x + 2x − 10 = x² − 3x − 10.","traps":{"A":"Correct product of the factors.","B":"Sign error on the linear term.","C":"Wrong sign on the constant (product of zeros is −10).","D":"Added the zeros incorrectly for the middle term."},"skill":"Nonlinear functions","strat":"Write f(x) = a(x − r₁)(x − r₂) using the given zeros, then expand."}},
{"id":"s3-ma-adv-24","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"H","type":"mcq","stim":"<p>A parabola has x-intercepts at x = 1 and x = 4 and passes through the point (0, 8).</p>","prompt":"Which of the following defines the function f whose graph is this parabola?","choices":["2x² − 10x + 8","x² − 5x + 4","2x² − 10x − 8","2x² + 10x + 8"],"ans":0,"exp":{"why":"Write f(x) = a(x − 1)(x − 4). Use (0, 8): f(0) = a(−1)(−4) = 4a = 8, so a = 2. Then f(x) = 2(x − 1)(x − 4) = 2(x² − 5x + 4) = 2x² − 10x + 8.","traps":{"A":"Correct: a = 2 gives the point (0, 8).","B":"Used a = 1, so f(0) = 4, not 8.","C":"Sign error on the constant term.","D":"Sign error on the linear term."},"skill":"Nonlinear functions","strat":"Use factored form with the zeros, then solve for a using the extra point."}},
{"id":"s3-ma-adv-25","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"M","type":"spr","stim":"<p>Let f(x) = 2x + 1 and g(x) = x².</p>","prompt":"What is the value of g(f(2))?","ans":["25"],"exp":{"why":"First find f(2) = 2(2) + 1 = 5. Then g(5) = 5² = 25.","skill":"Nonlinear functions","strat":"Evaluate the inner function first, then apply the outer function."}},
{"id":"s3-ma-adv-26","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"M","type":"spr","stim":"<p>The function f is defined by f(x) = x² + x.</p>","prompt":"What is the value of f(4) − f(3)?","ans":["8"],"exp":{"why":"f(4) = 16 + 4 = 20 and f(3) = 9 + 3 = 12. So f(4) − f(3) = 20 − 12 = 8.","skill":"Nonlinear functions","strat":"Evaluate each output separately, then subtract."}},
{"id":"s3-ma-adv-27","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"E","type":"spr","stim":"<p>The function f is defined by f(x) = 2(x + 1)² − 5.</p>","prompt":"What is the minimum value of f(x)?","ans":["-5"],"exp":{"why":"Because 2(x + 1)² ≥ 0 for all x and equals 0 when x = −1, the smallest value of f is 0 − 5 = −5. The vertex form a(x − h)² + k has minimum k = −5 (since a > 0).","skill":"Nonlinear functions","strat":"In vertex form a(x − h)² + k with a > 0, the minimum value is k."}},
{"id":"s3-ma-adv-28","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"H","type":"mcq","stim":"<p>A quadratic function f has its vertex at (2, −1) and passes through the point (0, 3).</p>","prompt":"What is the value of f(5)?","choices":["8","4","24","−1"],"ans":0,"exp":{"why":"Write vertex form f(x) = a(x − 2)² − 1. Use (0, 3): a(4) − 1 = 3, so a = 1. Then f(x) = (x − 2)² − 1, and f(5) = (3)² − 1 = 9 − 1 = 8.","traps":{"A":"Correct: a = 1 gives f(5) = 8.","B":"Forgot to subtract 1 after squaring incorrectly.","C":"Used a = 3 by ignoring the vertex shift.","D":"That is the y-value at the vertex, not f(5)."},"skill":"Nonlinear functions","strat":"Use vertex form and the extra point to find a, then evaluate."}},
{"id":"s3-ma-adv-29","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"M","type":"mcq","stim":"<p>The function f is defined by f(x) = x², and g is defined by g(x) = f(x − 3).</p>","prompt":"Which statement best describes the graph of g compared with the graph of f?","choices":["Shifted 3 units to the right","Shifted 3 units to the left","Shifted 3 units up","Shifted 3 units down"],"ans":0,"exp":{"why":"g(x) = f(x − 3) = (x − 3)². Replacing x with x − 3 shifts the graph 3 units to the right (its vertex moves from (0, 0) to (3, 0)).","traps":{"A":"Correct: f(x − 3) shifts right.","B":"f(x − 3) shifts right, not left (a common reversal).","C":"A vertical shift would be f(x) + 3.","D":"A vertical shift would be f(x) − 3."},"skill":"Nonlinear functions","strat":"f(x − h) shifts the graph h units horizontally in the sign-opposite direction."}},
{"id":"s3-ma-adv-30","sec":"math","dom":"adv","skill":"Nonlinear functions","dif":"H","type":"spr","stim":"<p>The function f is defined by f(x) = x².</p>","prompt":"What is the average rate of change of f from x = 1 to x = 4?","ans":["5"],"exp":{"why":"Average rate of change = (f(4) − f(1))/(4 − 1) = (16 − 1)/3 = 15/3 = 5.","skill":"Nonlinear functions","strat":"Compute the change in output divided by the change in input."}},
{"id":"s3-ma-adv-31","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"E","type":"mcq","stim":"<p>A colony of insects has an initial population of 200 and grows by 3% each year.</p>","prompt":"Which function models the population P after t years?","choices":["P = 200(1.03)ᵗ","P = 200(0.03)ᵗ","P = 200(1.3)ᵗ","P = 200(0.97)ᵗ"],"ans":0,"exp":{"why":"Growth of 3% per year multiplies by 1 + 0.03 = 1.03 each year, so P = 200(1.03)ᵗ.","traps":{"A":"Correct growth factor 1.03.","B":"0.03 would shrink the population drastically.","C":"1.3 represents 30% growth, not 3%.","D":"0.97 represents 3% decay, not growth."},"skill":"Exponential & rational","strat":"For r% growth, use a base of 1 + r/100."}},
{"id":"s3-ma-adv-32","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"M","type":"spr","stim":"","prompt":"If 2^(x + 1) = 8, what is the value of x?","ans":["2"],"exp":{"why":"Write 8 as a power of 2: 8 = 2³. So 2^(x + 1) = 2³, meaning x + 1 = 3, and x = 2.","skill":"Exponential & rational","strat":"Rewrite both sides with the same base, then equate exponents."}},
{"id":"s3-ma-adv-33","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"M","type":"mcq","stim":"","prompt":"If 5^(x − 1) = 125, what is the value of x?","choices":["4","3","2","5"],"ans":0,"exp":{"why":"Since 125 = 5³, we have 5^(x − 1) = 5³, so x − 1 = 3 and x = 4.","traps":{"A":"Correct: x − 1 = 3 gives x = 4.","B":"That is the exponent (x − 1), not x.","C":"Miscounted the power of 5.","D":"Confused the base with the answer."},"skill":"Exponential & rational","strat":"Express both sides in the same base and set exponents equal."}},
{"id":"s3-ma-adv-34","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"M","type":"mcq","stim":"<p>A car purchased for $24,000 loses 15% of its value each year.</p>","prompt":"Which function models the car's value V, in dollars, after t years?","choices":["V = 24000(0.85)ᵗ","V = 24000(0.15)ᵗ","V = 24000(1.15)ᵗ","V = 24000(1 − 0.85t)"],"ans":0,"exp":{"why":"Losing 15% per year leaves 85% each year, so the base is 1 − 0.15 = 0.85 and V = 24000(0.85)ᵗ.","traps":{"A":"Correct decay factor 0.85.","B":"0.15 keeps only 15% each year, far too fast a drop.","C":"1.15 models 15% growth, not decay.","D":"This is a linear model, not exponential decay."},"skill":"Exponential & rational","strat":"For r% decay, multiply by a base of 1 − r/100 each period."}},
{"id":"s3-ma-adv-35","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"M","type":"mcq","stim":"","prompt":"For x ≠ 2 and x ≠ −1, which expression is equivalent to (x² − 4)/(x² − x − 2)?","choices":["(x + 2)/(x + 1)","(x − 2)/(x − 1)","(x + 2)/(x − 1)","(x − 2)/(x + 1)"],"ans":0,"exp":{"why":"Factor: x² − 4 = (x − 2)(x + 2) and x² − x − 2 = (x − 2)(x + 1). Cancel the common (x − 2): (x + 2)/(x + 1).","traps":{"A":"Correct after cancelling (x − 2).","B":"Incorrect factoring of both parts.","C":"Kept the wrong denominator factor.","D":"Cancelled the wrong numerator factor."},"skill":"Exponential & rational","strat":"Factor numerator and denominator, then cancel common factors."}},
{"id":"s3-ma-adv-36","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"mcq","stim":"","prompt":"How many solutions does the equation x/(x − 4) = 4/(x − 4) + 2 have?","choices":["No solution","Exactly one solution, x = 4","Exactly one solution, x = 2","Exactly one solution, x = 0"],"ans":0,"exp":{"why":"Multiply both sides by (x − 4): x = 4 + 2(x − 4) = 4 + 2x − 8 = 2x − 4. Then −x = −4, so x = 4. But x = 4 makes the denominators 0, so it is extraneous. The equation has no valid solution.","traps":{"A":"Correct: the only candidate is extraneous.","B":"x = 4 is extraneous (division by zero).","C":"Algebra error; x = 4 is the candidate.","D":"x = 0 does not satisfy the equation."},"skill":"Exponential & rational","strat":"Solve, then reject any value that makes a denominator zero."}},
{"id":"s3-ma-adv-37","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"M","type":"mcq","stim":"","prompt":"What is the solution to 2/(x − 1) = 3/(x + 1)?","choices":["x = 5","x = −5","x = 1","x = 0"],"ans":0,"exp":{"why":"Cross-multiply: 2(x + 1) = 3(x − 1), so 2x + 2 = 3x − 3. Then 5 = x, i.e., x = 5. Check: denominators 4 and 6 are nonzero, so it is valid.","traps":{"A":"Correct solution x = 5.","B":"Sign error when isolating x.","C":"x = 1 makes the left denominator 0.","D":"x = 0 does not satisfy the equation."},"skill":"Exponential & rational","strat":"Cross-multiply the proportion, solve, and check the denominators."}},
{"id":"s3-ma-adv-38","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"mcq","stim":"","prompt":"If 4^x = 2^(x + 3), what is the value of x?","choices":["3","1","6","−3"],"ans":0,"exp":{"why":"Rewrite 4 as 2²: 4^x = (2²)^x = 2^(2x). So 2^(2x) = 2^(x + 3), giving 2x = x + 3, thus x = 3.","traps":{"A":"Correct: 2x = x + 3 gives x = 3.","B":"Did not rewrite 4 as 2².","C":"Set 2x = 3 + x·? arithmetic error.","D":"Sign error solving 2x = x + 3."},"skill":"Exponential & rational","strat":"Express both sides with base 2, then equate exponents."}},
{"id":"s3-ma-adv-39","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"mcq","stim":"","prompt":"If 8^x = 4^(x + 1), what is the value of x?","choices":["2","1","3","−2"],"ans":0,"exp":{"why":"Write both sides with base 2: 8^x = 2^(3x) and 4^(x + 1) = 2^(2x + 2). So 3x = 2x + 2, giving x = 2.","traps":{"A":"Correct: 3x = 2x + 2 gives x = 2.","B":"Arithmetic error isolating x.","C":"Miscomputed one of the exponents.","D":"Sign error solving the exponent equation."},"skill":"Exponential & rational","strat":"Convert 8 and 4 to powers of 2, then equate exponents."}},
{"id":"s3-ma-adv-40","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"mcq","stim":"<p>A bacteria culture starts with 300 cells and doubles every 4 hours.</p>","prompt":"How many cells are present after 12 hours?","choices":["2,400","1,200","900","3,600"],"ans":0,"exp":{"why":"In 12 hours there are 12/4 = 3 doubling periods, so the amount is 300·2³ = 300·8 = 2,400 cells.","traps":{"A":"Correct: 300·2³ = 2,400.","B":"Doubled only twice (300·2² = 1,200).","C":"Tripled the start instead of doubling three times.","D":"Used 300·2·6 or a similar miscount of periods."},"skill":"Exponential & rational","strat":"Count the number of doubling periods, then multiply by 2 raised to that count."}},
{"id":"s3-ma-psda-01","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"E","type":"mcq","stim":"<p>A printer prints 24 pages in 3 minutes at a constant rate.</p>","prompt":"At this rate, how many pages will the printer print in 10 minutes?","choices":["80","72","8","240"],"ans":0,"exp":{"why":"First find the unit rate: 24 pages ÷ 3 minutes = 8 pages per minute. Then multiply by the new time: 8 × 10 = 80 pages.","traps":{"A":"Correct. 24 ÷ 3 = 8 pages/min, and 8 × 10 = 80.","B":"72 = 24 × 3; this multiplies the given values instead of finding and applying the rate.","C":"8 is only the unit rate (pages per minute), not the total for 10 minutes.","D":"240 = 24 × 10; this ignores the 3-minute time frame of the given amount."},"skill":"Ratios, rates & proportions","strat":"Convert the given ratio to a unit rate, then multiply by the new quantity."}},
{"id":"s3-ma-psda-02","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"M","type":"spr","stim":"<p>On a scale drawing, a length of 2 centimeters represents an actual length of 5 meters.</p>","prompt":"On the drawing, how many centimeters represent an actual wall that is 18 meters long?","ans":["7.2"],"exp":{"why":"Set up a proportion with drawing-cm over actual-m: 2/5 = x/18. Cross-multiply: 5x = 36, so x = 36 ÷ 5 = 7.2 centimeters.","skill":"Ratios, rates & proportions","strat":"Write a proportion keeping the same units in matching positions, then cross-multiply."}},
{"id":"s3-ma-psda-03","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"M","type":"mcq","stim":"<p>A car travels 108 kilometers in 1.5 hours at a constant speed.</p>","prompt":"What is the car’s speed in meters per second?","choices":["20","30","72","40"],"ans":0,"exp":{"why":"Speed = 108 km ÷ 1.5 h = 72 km/h. Convert: 72 km/h × 1000 m per km ÷ 3600 s per h = 72000 ÷ 3600 = 20 meters per second.","traps":{"A":"Correct. 72 km/h × (1000/3600) = 20 m/s.","B":"30 = 108 ÷ 3.6; this converts distance to m/s but forgets to divide by the 1.5 hours first.","C":"72 is the speed in km/h, not converted to meters per second.","D":"40 doubles the correct value, a common conversion slip."},"skill":"Ratios, rates & proportions","strat":"Find speed in km/h first, then convert units by dividing km/h by 3.6."}},
{"id":"s3-ma-psda-04","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"H","type":"spr","stim":"<p>Working at a constant rate, 3 identical machines together produce 450 parts in 5 hours.</p>","prompt":"At the same rate, how many parts will 5 of these machines produce in 8 hours?","ans":["1200"],"exp":{"why":"Find the rate per machine per hour: 450 ÷ (3 machines × 5 hours) = 450 ÷ 15 = 30 parts per machine-hour. Then 5 machines × 8 hours × 30 = 1200 parts.","skill":"Ratios, rates & proportions","strat":"Reduce to a per-machine, per-hour rate, then scale up by the new number of machines and hours."}},
{"id":"s3-ma-psda-05","sec":"math","dom":"psda","skill":"Percentages","dif":"E","type":"mcq","stim":"<p>A quantity is described below.</p>","prompt":"What is 15% of 60?","choices":["9","90","45","4"],"ans":0,"exp":{"why":"15% = 0.15, and 0.15 × 60 = 9.","traps":{"A":"Correct. 0.15 × 60 = 9.","B":"90 = 15 × 60 ÷ 10; this misplaces the decimal point.","C":"45 = 60 − 15, subtracting instead of taking a percent.","D":"4 = 60 ÷ 15, dividing instead of multiplying by 0.15."},"skill":"Percentages","strat":"Convert the percent to a decimal and multiply by the whole."}},
{"id":"s3-ma-psda-06","sec":"math","dom":"psda","skill":"Percentages","dif":"M","type":"mcq","stim":"<p>The price of a shirt increased from $40 to $50.</p>","prompt":"What was the percent increase in the price of the shirt?","choices":["25%","20%","10%","125%"],"ans":0,"exp":{"why":"Percent increase = (change ÷ original) × 100 = (50 − 40)/40 × 100 = 10/40 × 100 = 25%.","traps":{"A":"Correct. 10/40 = 0.25 = 25%.","B":"20% = 10/50; this divides the change by the new price instead of the original.","C":"10% mistakes the dollar amount of change ($10) for the percent.","D":"125% = 50/40; this is the new price as a percent of the old, not the increase."},"skill":"Percentages","strat":"Divide the amount of change by the original value, not the new value."}},
{"id":"s3-ma-psda-07","sec":"math","dom":"psda","skill":"Percentages","dif":"H","type":"spr","stim":"<p>A stock is worth $50. During one week its value increases by 20%. The following week its new value decreases by 20%.</p>","prompt":"What is the value of the stock, in dollars, after these two changes?","ans":["48"],"exp":{"why":"Apply the changes as multipliers: 50 × 1.20 = 60 after the increase, then 60 × 0.80 = 48 after the decrease. Because the 20% decrease acts on the larger $60 value, the result is below the original $50.","skill":"Percentages","strat":"Treat each successive percent change as a multiplier and apply them in order — do not just add and subtract the percents."}},
{"id":"s3-ma-psda-08","sec":"math","dom":"psda","skill":"Percentages","dif":"M","type":"mcq","stim":"<p>After a 30% discount, a jacket costs $56.</p>","prompt":"What was the original price of the jacket?","choices":["$80","$72.80","$86","$186.67"],"ans":0,"exp":{"why":"A 30% discount means the sale price is 70% of the original: 0.70 × p = 56, so p = 56 ÷ 0.70 = $80.","traps":{"A":"Correct. 56 ÷ 0.70 = 80.","B":"$72.80 = 56 × 1.30; this adds 30% to the sale price instead of reversing a 30% discount.","C":"$86 = 56 + 30, adding a flat $30 rather than a percent.","D":"$186.67 = 56 ÷ 0.30, dividing by the discount rate instead of the paid fraction."},"skill":"Percentages","strat":"The sale price equals (100% − discount) of the original; divide by that decimal to reverse it."}},
{"id":"s3-ma-psda-09","sec":"math","dom":"psda","skill":"Data & statistics","dif":"E","type":"mcq","stim":"<p>A data set is shown: 4, 7, 7, 10, 14.</p>","prompt":"What is the median of the data set?","choices":["7","8.4","10","7.5"],"ans":0,"exp":{"why":"The values are already in order: 4, 7, 7, 10, 14. With 5 values, the median is the 3rd (middle) value, which is 7.","traps":{"A":"Correct. The middle of five ordered values is 7.","B":"8.4 = (4+7+7+10+14)/5 is the mean, not the median.","C":"10 is the fourth value, not the middle one.","D":"7.5 averages two central-looking values but is not needed with an odd count of data."},"skill":"Data & statistics","strat":"Order the data, then pick the middle value for an odd number of entries."}},
{"id":"s3-ma-psda-10","sec":"math","dom":"psda","skill":"Data & statistics","dif":"M","type":"mcq","stim":"<p>The table shows the scores earned by 10 students on a quiz.</p><table><tr><th>Score</th><th>Number of students</th></tr><tr><td>6</td><td>2</td></tr><tr><td>7</td><td>3</td></tr><tr><td>8</td><td>4</td></tr><tr><td>9</td><td>1</td></tr></table>","prompt":"What is the mean score for these 10 students?","choices":["7.4","7.5","7","8"],"ans":0,"exp":{"why":"Weight each score by its frequency: (6×2 + 7×3 + 8×4 + 9×1) = 12 + 21 + 32 + 9 = 74. Divide by the total of 10 students: 74 ÷ 10 = 7.4.","traps":{"A":"Correct. 74 ÷ 10 = 7.4.","B":"7.5 = (6+7+8+9)/4; this averages the distinct scores and ignores how many students earned each.","C":"7 is the median score, not the mean.","D":"8 is the most frequent (mode) score, not the mean."},"skill":"Data & statistics","strat":"For a frequency table, multiply each value by its frequency, sum, then divide by the total frequency."}},
{"id":"s3-ma-psda-11","sec":"math","dom":"psda","skill":"Data & statistics","dif":"H","type":"mcq","stim":"<p>A data set is 12, 14, 15, 16, 18, which has a mean of 15 and a median of 15. The value 60 is then added to the data set.</p>","prompt":"After 60 is added, which measure increases more, and by how much?","choices":["The mean, by 7.5","The median, by 0.5","The mean, by 22.5","The median, by 15.5"],"ans":0,"exp":{"why":"New mean: the sum was 75, now 75 + 60 = 135 over 6 values, so 135 ÷ 6 = 22.5, an increase of 22.5 − 15 = 7.5. New median: with six ordered values 12, 14, 15, 16, 18, 60, the median is (15 + 16)/2 = 15.5, an increase of 0.5. The mean increases far more because the outlier 60 pulls it up strongly, while the median barely moves.","traps":{"A":"Correct. The mean rises by 7.5; the median rises by only 0.5, so the mean changes more.","B":"The median does increase by 0.5, but that is the smaller change, not the larger.","C":"22.5 is the new mean itself, not the amount of increase (which is 22.5 − 15 = 7.5).","D":"15.5 is the new median value, not the size of the median’s increase."},"skill":"Data & statistics","strat":"An outlier shifts the mean much more than the median; compute each before and after to compare."}},
{"id":"s3-ma-psda-12","sec":"math","dom":"psda","skill":"Data & statistics","dif":"M","type":"mcq","stim":"<p>The two-way table shows the preferred drink of 150 surveyed adults.</p><table><tr><th></th><th>Coffee</th><th>Tea</th><th>Total</th></tr><tr><td>Male</td><td>40</td><td>20</td><td>60</td></tr><tr><td>Female</td><td>30</td><td>60</td><td>90</td></tr><tr><td>Total</td><td>70</td><td>80</td><td>150</td></tr></table>","prompt":"Of the adults who prefer tea, what fraction are female?","choices":["3/4","2/3","3/5","8/15"],"ans":0,"exp":{"why":"The tea column total is 80, of whom 60 are female. The fraction is 60/80 = 3/4.","traps":{"A":"Correct. 60 female tea-drinkers out of 80 tea-drinkers = 3/4.","B":"2/3 = 60/90, the fraction of females who prefer tea — the wrong denominator (all females).","C":"3/5 = 90/150, the fraction of all adults who are female, not restricted to tea.","D":"8/15 = 80/150, the fraction of all adults who prefer tea, ignoring gender."},"skill":"Data & statistics","strat":"‘Of those who…’ tells you the denominator — use only that row or column total."}},
{"id":"s3-ma-psda-13","sec":"math","dom":"psda","skill":"Probability","dif":"E","type":"mcq","stim":"<p>A bag contains 3 red marbles, 5 blue marbles, and 2 green marbles. One marble is drawn at random.</p>","prompt":"What is the probability that the marble drawn is green?","choices":["1/5","1/2","1/10","2/8"],"ans":0,"exp":{"why":"There are 3 + 5 + 2 = 10 marbles total, of which 2 are green. P(green) = 2/10 = 1/5.","traps":{"A":"Correct. 2 green out of 10 total = 1/5.","B":"1/2 = 5/10 is the probability of blue, not green.","C":"1/10 counts one green marble instead of two out of the total.","D":"2/8 uses 8 non-green marbles as the denominator instead of all 10."},"skill":"Probability","strat":"Probability = favorable outcomes ÷ total outcomes; count the full total."}},
{"id":"s3-ma-psda-14","sec":"math","dom":"psda","skill":"Probability","dif":"M","type":"mcq","stim":"<p>The two-way table shows 100 students grouped by grade and whether they play a school sport.</p><table><tr><th></th><th>Plays a sport</th><th>No sport</th><th>Total</th></tr><tr><td>Grade 9</td><td>30</td><td>10</td><td>40</td></tr><tr><td>Grade 10</td><td>25</td><td>35</td><td>60</td></tr><tr><td>Total</td><td>55</td><td>45</td><td>100</td></tr></table>","prompt":"If one student is selected at random, what is the probability that the student is in Grade 10 and plays no sport?","choices":["7/20","35/45","35/60","11/20"],"ans":0,"exp":{"why":"The cell for Grade 10 and no sport is 35 students out of 100 total. P = 35/100 = 7/20.","traps":{"A":"Correct. 35/100 simplifies to 7/20.","B":"35/45 conditions on the ‘no sport’ column instead of the whole group of 100.","C":"35/60 conditions on Grade 10 instead of the whole group.","D":"11/20 = 55/100 is the probability a student plays a sport, the opposite category."},"skill":"Probability","strat":"For a plain (unconditional) probability from a table, divide the target cell by the grand total."}},
{"id":"s3-ma-psda-15","sec":"math","dom":"psda","skill":"Probability","dif":"H","type":"spr","stim":"<p>On any given day, the probability that it rains in a certain town is 0.4, independent of other days.</p>","prompt":"What is the probability that it rains on neither of two consecutive days? Give your answer as a decimal.","ans":["0.36","9/25"],"exp":{"why":"The probability it does not rain on a single day is the complement: 1 − 0.4 = 0.6. For two independent days, multiply: 0.6 × 0.6 = 0.36.","skill":"Probability","strat":"Use the complement for ‘does not’ on each day, then multiply probabilities for independent events."}},
{"id":"s3-ma-geo-01","sec":"math","dom":"geo","skill":"Area & volume","dif":"E","type":"mcq","stim":"<p>A landscaper is planning a rectangular garden bed.</p>","prompt":"A rectangular garden has a length of 15 meters and a width of 8 meters. What is the area of the garden, in square meters?","choices":["46","120","23","60"],"ans":1,"exp":{"why":"The area of a rectangle is length × width. Area = 15 × 8 = 120 square meters.","traps":{"A":"46 is the perimeter, 2(15 + 8), not the area.","B":"Correct: 15 × 8 = 120 square meters.","C":"23 just adds the length and width, 15 + 8.","D":"60 is half of the true area, as if the ½ from a triangle were applied."},"skill":"Area & volume","strat":"For a rectangle, multiply length by width — no ½ factor is involved."}},
{"id":"s3-ma-geo-02","sec":"math","dom":"geo","skill":"Area & volume","dif":"M","type":"mcq","stim":"","prompt":"A cylindrical can has a radius of 4 centimeters and a height of 9 centimeters. What is the volume of the can, in cubic centimeters? (The volume of a cylinder is V = πr²h.)","choices":["36π","144π","576π","72π"],"ans":1,"exp":{"why":"V = πr²h = π(4²)(9) = π(16)(9) = 144π cubic centimeters.","traps":{"A":"36π forgets to square the radius: π(4)(9).","B":"Correct: π(16)(9) = 144π.","C":"576π uses the diameter 8 in place of the radius: π(8²)(9).","D":"72π is the lateral surface area 2πrh, not the volume."},"skill":"Area & volume","strat":"Square the radius first, then multiply by π and the height."}},
{"id":"s3-ma-geo-03","sec":"math","dom":"geo","skill":"Area & volume","dif":"M","type":"mcq","stim":"","prompt":"A trapezoid has parallel sides of length 6 and 10 and a height of 5. What is the area of the trapezoid?","choices":["80","40","25","300"],"ans":1,"exp":{"why":"The area of a trapezoid is ½(b₁ + b₂)h = ½(6 + 10)(5) = ½(16)(5) = 40 square units.","traps":{"A":"80 forgets the ½ factor: (6 + 10)(5).","B":"Correct: ½(16)(5) = 40.","C":"25 uses only the longer base: ½(10)(5).","D":"300 multiplies all three numbers, 6 × 10 × 5."},"skill":"Area & volume","strat":"Average the two parallel sides, then multiply by the height."}},
{"id":"s3-ma-geo-04","sec":"math","dom":"geo","skill":"Area & volume","dif":"H","type":"mcq","stim":"","prompt":"A cone has a radius of 6 inches and a height of 14 inches. What is the volume of the cone, in cubic inches? (The volume of a cone is V = ⅓πr²h.)","choices":["504π","168π","672π","84π"],"ans":1,"exp":{"why":"V = ⅓πr²h = ⅓π(6²)(14) = ⅓π(36)(14) = ⅓(504π) = 168π cubic inches.","traps":{"A":"504π forgets the ⅓ factor: π(36)(14).","B":"Correct: ⅓π(36)(14) = 168π.","C":"672π uses the diameter 12 as the radius: ⅓π(12²)(14).","D":"84π applies ½ instead of ⅓ to a wrong base value."},"skill":"Area & volume","strat":"Compute πr²h as if it were a cylinder, then take one third."}},
{"id":"s3-ma-geo-05","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"E","type":"spr","stim":"","prompt":"In a triangle, two of the interior angles measure 50° and 60°. What is the measure, in degrees, of the third interior angle?","ans":["70"],"exp":{"why":"The interior angles of a triangle sum to 180°. The third angle = 180° − 50° − 60° = 70°.","skill":"Lines, angles & triangles","strat":"Subtract the two known angles from 180°."}},
{"id":"s3-ma-geo-06","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"M","type":"mcq","stim":"<p>Two parallel lines are cut by a transversal.</p>","prompt":"Lines l and m are parallel and are cut by a transversal. One interior angle measures 65°. What is the measure of the co-interior (same-side interior) angle?","choices":["65°","115°","25°","90°"],"ans":1,"exp":{"why":"Co-interior (same-side interior) angles formed by a transversal cutting parallel lines are supplementary, so they add to 180°. The angle = 180° − 65° = 115°.","traps":{"A":"65° treats the angles as equal, which is true for alternate interior angles, not same-side interior angles.","B":"Correct: 180° − 65° = 115°.","C":"25° takes the complement, 90° − 65°.","D":"90° wrongly assumes a right angle."},"skill":"Lines, angles & triangles","strat":"Same-side interior angles are supplementary; subtract from 180°."}},
{"id":"s3-ma-geo-07","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"M","type":"mcq","stim":"","prompt":"Triangle ABC is similar to triangle DEF, with side AB corresponding to side DE and side BC corresponding to side EF. If AB = 4, DE = 12, and BC = 6, what is the length of EF?","choices":["14","18","2","72"],"ans":1,"exp":{"why":"The scale factor from ABC to DEF is DE / AB = 12 / 4 = 3. Corresponding sides scale by the same factor, so EF = BC × 3 = 6 × 3 = 18.","traps":{"A":"14 adds the difference (12 − 4 = 8) to 6 instead of multiplying by the ratio.","B":"Correct: 6 × 3 = 18.","C":"2 divides by the scale factor instead of multiplying: 6 ÷ 3.","D":"72 multiplies 6 × 12 instead of using the ratio."},"skill":"Lines, angles & triangles","strat":"Find the scale factor from a known pair, then multiply the matching side by it."}},
{"id":"s3-ma-geo-08","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"H","type":"mcq","stim":"","prompt":"An isosceles triangle has two equal sides of length 13 and a base of length 10. What is the height of the triangle measured from the base to the opposite vertex?","choices":["√194","12","√69","5"],"ans":1,"exp":{"why":"The height to the base bisects the base, creating a right triangle with hypotenuse 13 and one leg 5 (half of 10). By the Pythagorean theorem, height = √(13² − 5²) = √(169 − 25) = √144 = 12.","traps":{"A":"√194 adds instead of subtracting: √(13² + 5²).","B":"Correct: √(169 − 25) = 12 (a 5-12-13 triangle).","C":"√69 uses the full base 10 instead of half: √(169 − 100).","D":"5 is just half the base, not the height."},"skill":"Lines, angles & triangles","strat":"Drop the altitude to bisect the base, then apply the Pythagorean theorem with half the base."}},
{"id":"s3-ma-geo-09","sec":"math","dom":"geo","skill":"Circles","dif":"E","type":"mcq","stim":"","prompt":"A circle has a radius of 5. What is the area of the circle?","choices":["10π","25π","100π","5π"],"ans":1,"exp":{"why":"The area of a circle is A = πr² = π(5²) = 25π.","traps":{"A":"10π is the circumference 2πr, not the area.","B":"Correct: π(5²) = 25π.","C":"100π squares the diameter 10 instead of the radius.","D":"5π uses the radius without squaring it."},"skill":"Circles","strat":"Area uses r squared; circumference uses r to the first power."}},
{"id":"s3-ma-geo-10","sec":"math","dom":"geo","skill":"Circles","dif":"M","type":"mcq","stim":"","prompt":"In a circle with radius 9, a central angle of 40° subtends an arc. What is the length of that arc? (Express your answer in terms of π.)","ans":0,"exp":{"why":"Arc length = (central angle / 360°) × circumference = (40 / 360) × 2π(9) = (1/9) × 18π = 2π.","skill":"Circles","strat":"Take the angle's fraction of 360°, then multiply by the full circumference 2πr.","traps":{"A":"Correct: (40/360)·2π·9 = (1/9)·18π = 2π.","B":"Doubles the correct arc length, as if the angle were 80°.","C":"Uses an area-style fraction of πr² instead of arc length.","D":"Gives the full circumference 2π·9 = 18π, ignoring the 40° fraction."}},"choices":["2π","4π","9π","18π"]},
{"id":"s3-ma-geo-11","sec":"math","dom":"geo","skill":"Circles","dif":"M","type":"mcq","stim":"","prompt":"A sector of a circle has a central angle of 90° and a radius of 8. What is the area of the sector?","choices":["64π","16π","32π","4π"],"ans":1,"exp":{"why":"Sector area = (central angle / 360°) × πr² = (90 / 360) × π(8²) = ¼ × 64π = 16π.","traps":{"A":"64π is the full circle's area, ignoring the 90° fraction.","B":"Correct: ¼ × 64π = 16π.","C":"32π uses ½ instead of ¼ of the circle.","D":"4π confuses the sector area with an arc-length style computation."},"skill":"Circles","strat":"Multiply the full circle area πr² by the angle's fraction of 360°."}},
{"id":"s3-ma-geo-12","sec":"math","dom":"geo","skill":"Circles","dif":"H","type":"mcq","stim":"","prompt":"A circle has a circumference of 36π. An arc of the circle has a length of 4π. What is the measure, in degrees, of the central angle that subtends this arc?","choices":["80°","40°","10°","9°"],"ans":1,"exp":{"why":"The arc is 4π / 36π = 1/9 of the circumference, so its central angle is 1/9 of 360°: (1/9)(360°) = 40°.","traps":{"A":"80° doubles the correct value.","B":"Correct: (1/9)(360°) = 40°.","C":"10° uses the fraction 1/36, ignoring the arc's factor of 4.","D":"9° reports the ratio's denominator as if it were degrees."},"skill":"Circles","strat":"The arc's fraction of the circumference equals the central angle's fraction of 360°."}},
{"id":"s3-ma-geo-13","sec":"math","dom":"geo","skill":"Right-triangle trig","dif":"E","type":"spr","stim":"","prompt":"A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?","ans":["10"],"exp":{"why":"By the Pythagorean theorem, hypotenuse = √(6² + 8²) = √(36 + 64) = √100 = 10. This is a 3-4-5 triangle scaled by 2.","skill":"Right-triangle trig","strat":"Square the legs, add, and take the square root; recognize the 3-4-5 pattern."}},
{"id":"s3-ma-geo-14","sec":"math","dom":"geo","skill":"Right-triangle trig","dif":"M","type":"mcq","stim":"<p>In right triangle ABC, the right angle is at C.</p>","prompt":"In right triangle ABC, the right angle is at vertex C. The side opposite angle A has length 5, and the hypotenuse has length 13. What is the value of sin A?","choices":["12/13","5/13","13/5","5/12"],"ans":1,"exp":{"why":"By SOH, sin A = opposite / hypotenuse = 5/13. (The remaining leg is 12, since it is a 5-12-13 triangle.)","traps":{"A":"12/13 is cos A (adjacent over hypotenuse), not sin A.","B":"Correct: opposite / hypotenuse = 5/13.","C":"13/5 inverts the sine ratio.","D":"5/12 is tan A (opposite over adjacent), not sin A."},"skill":"Right-triangle trig","strat":"Sine is opposite over hypotenuse — SOH."}},
{"id":"s3-ma-geo-15","sec":"math","dom":"geo","skill":"Right-triangle trig","dif":"H","type":"mcq","stim":"","prompt":"In a right triangle, angle A and angle B are the two acute angles. If sin A = 0.6, what is the value of cos B?","choices":["0.6","0.8","0.4","0.75"],"ans":0,"exp":{"why":"The two acute angles of a right triangle are complementary, so A + B = 90°, which means B = 90° − A. The cofunction identity gives cos B = cos(90° − A) = sin A = 0.6.","traps":{"A":"Correct: since A and B are complementary, cos B = sin A = 0.6.","B":"0.8 is cos A (the other ratio in the triangle), not cos B.","C":"0.4 comes from 1 − 0.6, a misuse of the identity.","D":"0.75 resembles a tangent value, 0.6/0.8, not cos B."},"skill":"Right-triangle trig","strat":"In a right triangle the acute angles are complementary, so the cosine of one equals the sine of the other."}},
];

/* DEEP:START — per-question deep teaching (concept, steps, another way, check) */
const DEEP={"ma-alg-01":{"concept":"A linear equation says two expressions are equal, and 'solving' means finding the one value of x that makes them balance. The golden rule is that whatever you do to one side you must do to the other, so the scale stays level. Your goal is to peel away everything around x until x sits alone. Here we first undo the parentheses using the distributive property, which says a(b − c) means a·b − a·c.","steps":["Distribute the 5 across (x − 2): 5·x − 5·2 = 5x − 10, so the equation becomes 5x − 10 = 3x + 4.","Get the x terms on one side. Subtract 3x from both sides: 5x − 3x − 10 = 4, which is 2x − 10 = 4.","Undo the −10 by adding 10 to both sides: 2x = 14.","Divide both sides by 2: x = 7. That matches choice B) 7."],"alt":"Because this is multiple choice, you can back-solve: try each answer in the original 5(x − 2) = 3x + 4. Test x = 7: left side 5(7 − 2) = 5·5 = 25; right side 3·7 + 4 = 21 + 4 = 25. Both sides equal 25, so 7 works. This is a great fallback when the algebra feels shaky.","check":"Plug x = 7 back in: 5(7 − 2) = 25 and 3(7) + 4 = 25. Equal sides confirm the answer."},"ma-alg-02":{"concept":"This is a linear equation with x on both sides. To solve it, collect all the x terms on one side and all the plain numbers on the other, always doing the same operation to both sides. A negative answer is perfectly normal — it just means x sits to the left of zero on the number line.","steps":["Start with 4x + 9 = x − 3. Move the smaller x term: subtract x from both sides to get 3x + 9 = −3.","Undo the +9 by subtracting 9 from both sides: 3x = −3 − 9 = −12.","Divide both sides by 3: x = −12/3 = −4.","So the answer is x = −4."],"alt":"Plug in the answer to sanity-check with easy numbers. If x = −4, the left side is 4(−4) + 9 = −16 + 9 = −7, and the right side is −4 − 3 = −7. Matching values tell you −4 is correct. Thinking of it as a balance scale that stays level helps you trust the result.","check":"Substitute x = −4 into the original: 4(−4) + 9 = −7 and (−4) − 3 = −7. Both sides give −7."},"ma-alg-03":{"concept":"Solving 'for a in terms of b' means rearranging the equation so a is alone on one side and everything else (made of b and numbers) is on the other. You use the same balancing moves as normal solving; you just stop when a is isolated instead of getting a single number. The order to undo operations is the reverse of PEMDAS: peel off addition/subtraction first, then multiplication/division.","steps":["Start with 3a − b = 12. The b is subtracted, so add b to both sides: 3a = 12 + b.","Now a is multiplied by 3, so divide both sides by 3: a = (12 + b)/3.","Notice the whole right side (12 + b) is divided by 3, which is why it stays grouped in parentheses over 3.","This matches choice A) (12 + b)/3."],"alt":"Plug in a friendly number to test the choices. Let b = 3; then 3a − 3 = 12 gives 3a = 15, so a = 5. Now test each choice with b = 3: A) (12 + 3)/3 = 15/3 = 5 ✓. Choice B gives 3, C gives 3, D gives −3, so only A produces 5.","check":"Substitute the result back: 3·[(12 + b)/3] − b = (12 + b) − b = 12, which matches the original equation for any b."},"ma-alg-04":{"concept":"Word problems become solvable once you translate them into an equation. A 'flat fee' is a fixed amount charged once, and a 'per mile' rate is multiplied by the number of miles. So total cost = flat fee + (rate per mile × miles). Assign a letter to the unknown you want, then solve as a normal linear equation.","steps":["Let m = number of miles. Total cost is 3.00 + 0.40m, and it equals 9.40: 3.00 + 0.40m = 9.40.","Subtract the flat fee 3.00 from both sides: 0.40m = 6.40.","Divide both sides by 0.40: m = 6.40/0.40 = 16.","The ride was 16 miles long."],"alt":"Reason in plain money terms. After the $3 flat fee, $9.40 − $3.00 = $6.40 was charged for distance. Since each mile costs $0.40, count how many 40-cent chunks fit in $6.40: 6.40 ÷ 0.40 = 16 miles. Tip: 6.40/0.40 is the same as 640/40 = 16, which avoids decimal division.","check":"Plug m = 16 back: 3.00 + 0.40(16) = 3.00 + 6.40 = 9.40, exactly the cost given."},"ma-alg-05":{"concept":"Rearranging a formula uses the same balancing rules as solving an equation — you isolate the letter you want. A key trap: when you divide by a number, EVERY term on both sides must be divided by it, not just one. The perimeter formula P = 2L + 2W adds two lengths and two widths.","steps":["Start with P = 2L + 2W. Isolate the 2L term by subtracting 2W from both sides: P − 2W = 2L.","Divide EVERY term by 2: (P)/2 − (2W)/2 = (2L)/2, which gives P/2 − W = L.","So L = P/2 − W, which is choice A.","Watch the trap: choice C, (P − W)/2, forgot to double the W before dividing — that is wrong."],"alt":"Test with real numbers. Imagine a rectangle with L = 3 and W = 2; then P = 2(3) + 2(2) = 10. Now which formula returns L = 3? A) 10/2 − 2 = 5 − 2 = 3 ✓. B) 10 − 4 = 6 ✗. C) (10 − 2)/2 = 4 ✗. D) 20 − 2 = 18 ✗. Only A works.","check":"Substitute L = P/2 − W into 2L + 2W: 2(P/2 − W) + 2W = P − 2W + 2W = P. It rebuilds the original formula."},"ma-alg-06":{"concept":"This is a two-part problem: first solve for x, then use that x to evaluate a second expression. A common mistake is answering the value of x when the question actually asks for something built from x (here, 4x + 1). Always circle what the question really wants before finalizing.","steps":["Solve 2(x + 3) = 14. The fastest move is to divide both sides by 2: x + 3 = 7.","Subtract 3 from both sides: x = 4.","Now substitute into the requested expression 4x + 1: 4(4) + 1 = 16 + 1 = 17.","The answer is 17, choice B. (Note that x = 4 is a trap if you stop too early.)"],"alt":"You can distribute instead: 2(x + 3) = 2x + 6 = 14, so 2x = 8 and x = 4, then 4x + 1 = 17. Either route lands on x = 4. A quick sanity check: 4x + 1 must be an odd number (an even 4x plus 1), which rules out the even choices and points toward 17.","check":"Verify x: 2(4 + 3) = 2·7 = 14 ✓. Then re-evaluate 4(4) + 1 = 17 to confirm the final answer."},"ma-alg-07":{"concept":"Slope measures how steep a line is: it's the change in y divided by the change in x, often called 'rise over run.' For two points (x₁, y₁) and (x₂, y₂), slope = (y₂ − y₁)/(x₂ − x₁). It tells you how many units y climbs for every 1 unit x moves right. Keep the points in the same order on top and bottom.","steps":["Label the points: (1, 2) is (x₁, y₁) and (4, 11) is (x₂, y₂).","Compute the rise (change in y): 11 − 2 = 9.","Compute the run (change in x): 4 − 1 = 3.","Slope = rise/run = 9/3 = 3, which is choice A."],"alt":"Picture it: going from x = 1 to x = 4 you move 3 steps right, while y jumps from 2 up to 11, a climb of 9. Sharing 9 units of climb over 3 steps means 3 units up per step — that's slope 3. Sketching the two points on Desmos and reading the steepness confirms a fairly steep upward line.","check":"Use the slope to predict: from (1, 2), going right 3 with slope 3 adds 3·3 = 9, giving y = 2 + 9 = 11, which is exactly the second point (4, 11)."},"ma-alg-08":{"concept":"In a linear model like h = 12 − 1.5t, each number has a real-world meaning. The constant (12) is the starting value when t = 0, and the coefficient attached to t is the rate of change — how much h changes for each 1-unit increase in t. Because the term is −1.5t, the height goes DOWN by 1.5 for each added hour.","steps":["Identify the parts: 12 is the height at t = 0 (when first lit), and −1.5 is the rate of change per hour.","The minus sign means the height is decreasing as time increases.","So every 1 hour of burning removes 1.5 cm of candle height.","That is exactly choice B: the candle burns down by 1.5 cm each hour."],"alt":"Test with numbers to feel the rate. At t = 0, h = 12. At t = 1, h = 12 − 1.5 = 10.5. At t = 2, h = 12 − 3 = 9. Each hour the height drops by 1.5 cm — you can literally watch the 1.5 subtracting once per hour. That eliminates the 'starting height' choices, which describe the 12 instead.","check":"Reasonableness: a candle should get shorter over time, so the rate must be a decrease. Choice B is the only one describing a per-hour decrease of 1.5 cm, matching the −1.5t term."},"ma-alg-09":{"concept":"Function notation f(x) is just a name for the output when you feed in x. Writing f(x) = 5 means 'find the input x that makes the output equal 5.' So you set the rule equal to 5 and solve the resulting linear equation for x. Don't let the f(x) notation intimidate you — it behaves like an ordinary equation.","steps":["The rule is f(x) = 2x − 7, and we want f(x) = 5, so write 2x − 7 = 5.","Add 7 to both sides to undo the subtraction: 2x = 12.","Divide both sides by 2: x = 6.","So f(6) = 5, and the answer is 6."],"alt":"Back-solve by testing inputs. Try x = 6: f(6) = 2(6) − 7 = 12 − 7 = 5 ✓. If you had guessed x = 5, you'd get 2(5) − 7 = 3, too small, nudging you upward to 6. Testing candidate inputs is reliable when you're unsure of the algebra.","check":"Substitute x = 6 into the original rule: 2(6) − 7 = 12 − 7 = 5, which is the target output."},"ma-alg-10":{"concept":"The slope-intercept form of a line is y = mx + b, where m is the slope and b is the y-intercept (where the line crosses the y-axis). If you know the slope and one point, you can find b by plugging the point's x and y into the equation and solving. Point-slope form y − y₁ = m(x − x₁) is a shortcut that builds the equation directly.","steps":["Start with point-slope form using slope m = −2 and point (3, 4): y − 4 = −2(x − 3).","Distribute the −2 on the right: y − 4 = −2x + 6.","Add 4 to both sides to isolate y: y = −2x + 10.","This matches choice A) y = −2x + 10."],"alt":"Use y = mx + b directly. The slope is −2, so y = −2x + b. Plug in the point (3, 4): 4 = −2(3) + b = −6 + b, so b = 10, giving y = −2x + 10. Both choices B and D have slope −2 but wrong intercepts, so plugging the point in is what pins down b.","check":"Confirm the point lies on the line: substitute x = 3 into y = −2x + 10 to get y = −6 + 10 = 4, matching the given point (3, 4)."},"ma-alg-11":{"concept":"In a cost model C = 25m + 50, the coefficient of m (25) is the repeating per-unit cost — here, dollars per month. The constant term (50) is what you pay when m = 0, meaning before any months pass. A cost charged at zero months and not tied to how long you stay is a one-time fixed fee, like an initiation or sign-up charge.","steps":["Set m = 0 to see the constant's meaning: C = 25(0) + 50 = 50.","So even with zero months of membership, the cost is $50 — it isn't part of the monthly rate.","The 25 is the monthly fee (it multiplies the number of months); the 50 stands apart from time.","Therefore 50 is a one-time initiation fee charged regardless of months, which is choice B."],"alt":"Contrast the two numbers to avoid the trap. The monthly fee is whatever multiplies m, and that's 25, not 50 — so choice A (monthly fee) is wrong. Test months: 1 month costs 25 + 50 = 75, 2 months costs 100; the extra $25 each month is the recurring part, leaving the fixed $50 as the sign-up cost.","check":"Reasonableness: a fee that appears even at 0 months and never repeats is by definition a one-time upfront charge, matching choice B's description of an initiation fee."},"ma-alg-12":{"concept":"A linear function has a constant rate of change: as x increases by a fixed step, f(x) increases by a fixed amount. That fixed amount per 1-step is the slope. Once you know the slope, use any table point in y = mx + b to solve for the y-intercept b. This lets you rebuild the whole equation from just a few table values.","steps":["Find the slope: as x goes 1→2→3, f(x) goes 5→8→11, rising 3 each time, so slope m = 3.","Write f(x) = 3x + b and plug in a known point, say x = 1, f(1) = 5: 5 = 3(1) + b.","Solve: 5 = 3 + b, so b = 2.","Thus f(x) = 3x + 2, which is choice A."],"alt":"Just test the choices against the table. Choice A: f(1) = 3(1) + 2 = 5 ✓, f(2) = 8 ✓, f(3) = 11 ✓. Choice B gives f(1) = 8, wrong. Choice D gives f(1) = 5 but f(2) = 7, wrong. Only A matches every row, so it wins.","check":"Verify another row: f(3) = 3(3) + 2 = 9 + 2 = 11, exactly the table value for x = 3."},"ma-alg-13":{"concept":"A system of equations is two equations that must be true at the same time. The elimination method adds or subtracts the equations to cancel one variable, leaving a single equation in the other. It works because adding equal things to equal things keeps equality. Here the +y and −y are perfectly set up to cancel when you add.","steps":["Line up the equations: x + y = 10 and x − y = 4.","Add them straight down: (x + x) + (y − y) = 10 + 4, which is 2x + 0 = 14.","So 2x = 14, giving x = 7.","The value of x is 7, choice C."],"alt":"Think of it as averaging. Two numbers with sum 10 and difference 4: the larger is the average plus half the difference, so x = 10/2 + 4/2 = 5 + 2 = 7. You can also back-solve choices: x = 7 forces y = 3 (from x + y = 10), and 7 − 3 = 4 ✓ satisfies the second equation.","check":"Find y = 3 and test both originals: 7 + 3 = 10 ✓ and 7 − 3 = 4 ✓. Both hold, so x = 7 is correct."},"ma-alg-14":{"concept":"When two equations share a variable that appears as +y in one and −y in the other, adding the equations cancels that variable — this is elimination. You're allowed to add the left sides together and the right sides together because each side of each equation is equal. That collapses two equations into one you can solve immediately.","steps":["Write them aligned: 3x + y = 10 and x − y = 2.","Add the equations: (3x + x) + (y − y) = 10 + 2, giving 4x = 12.","Divide by 4: x = 3.","The answer is x = 3. (If needed, y = x − 2 = 1.)"],"alt":"Substitution as a cross-check: from x − y = 2 we get y = x − 2. Put that into 3x + y = 10: 3x + (x − 2) = 10, so 4x − 2 = 10, 4x = 12, x = 3. Two different methods agreeing gives you confidence.","check":"With x = 3, y = 1: test both originals — 3(3) + 1 = 10 ✓ and 3 − 1 = 2 ✓."},"ma-alg-15":{"concept":"Mixture and ticket problems turn into a system: one equation counts items, the other counts money. Let variables stand for each quantity, write 'total count' and 'total value' equations, then eliminate one variable. A slick trick is to multiply the count equation by one price so subtracting cancels a variable cleanly.","steps":["Let a = adult tickets and c = child tickets. Count: a + c = 200. Revenue: 12a + 8c = 2080.","Multiply the count equation by 8 (the child price): 8a + 8c = 1600.","Subtract this from the revenue equation: (12a + 8c) − (8a + 8c) = 2080 − 1600, giving 4a = 480.","Divide by 4: a = 120, choice C."],"alt":"Back-solve the choices, which is fast here. Try a = 120 adults, so c = 80 children. Revenue = 12(120) + 8(80) = 1440 + 640 = 2080 ✓, exactly the target. If you'd tried a = 100, revenue would be 1200 + 800 = 2000, too low, pushing you higher to 120.","check":"Confirm both conditions: 120 + 80 = 200 tickets ✓ and 12(120) + 8(80) = 2080 dollars ✓."},"ma-alg-16":{"concept":"Two linear equations graph as two lines. They have NO solution when the lines are parallel — same slope but different intercepts, so they never cross. In standard form Ax + By = C, parallel-but-different means the coefficient ratios match (A₁/A₂ = B₁/B₂) but the constant ratio differs. Matching all three ratios instead would mean the same line (infinitely many solutions).","steps":["Compare kx + 6y = 8 and 2x + 3y = 5. For parallel lines, match the x and y coefficient ratios: k/2 = 6/3.","Since 6/3 = 2, set k/2 = 2, so k = 4.","Check that the lines aren't identical: the constant ratio is 8/5, which is not 2, so they're truly parallel, not the same line.","Therefore k = 4 gives no solution, choice C."],"alt":"Think in slopes. Rewrite each as y = mx + b: from 2x + 3y = 5, slope = −2/3. From kx + 6y = 8, slope = −k/6. Parallel means −k/6 = −2/3, so k/6 = 2/3, giving k = 4. Same answer, viewed through slope.","check":"With k = 4, first line 4x + 6y = 8 simplifies to 2x + 3y = 4, versus 2x + 3y = 5. Same left side, different right side (4 ≠ 5) means no point satisfies both — confirmed no solution."},"ma-alg-17":{"concept":"A system has infinitely many solutions when the two equations are really the same line in disguise — every point on one is on the other. To test this, substitute one equation into the other; if the result reduces to a statement true for all x (like −2 = c that is always satisfied), the value of the constant must make both sides identical. Here we find the c that turns the second equation into the first.","steps":["Substitute y = 2x + 1 into 4x − 2y = c: 4x − 2(2x + 1) = c.","Distribute: 4x − 4x − 2 = c, which simplifies to −2 = c.","For the equation to hold for every x (infinitely many solutions), c must equal −2.","So c = −2, choice A."],"alt":"Match the lines directly. Rewrite y = 2x + 1 into the second's form: 4x − 2y should collapse. Multiply y = 2x + 1 by −2: −2y = −4x − 2, then 4x − 2y = 4x + (−4x − 2) = −2. For 4x − 2y = c to be the same line, c = −2. Any x you plug in gives −2, confirming it.","check":"Test a random point on y = 2x + 1, say x = 3, y = 7: 4(3) − 2(7) = 12 − 14 = −2 = c ✓. Try x = 0, y = 1: 0 − 2 = −2 ✓. It works for all x."},"ma-alg-18":{"concept":"Some SAT systems ask for a combination like x + y rather than x or y alone. You can still solve the system fully, then add. Substitution works well: solve one equation for a variable, plug into the other, find both values, then compute the requested expression. Always answer the exact quantity asked.","steps":["From x + 2y = 7, solve for x: x = 7 − 2y.","Substitute into 3x − y = 7: 3(7 − 2y) − y = 7, which is 21 − 6y − y = 7, so 21 − 7y = 7.","Subtract 21: −7y = −14, so y = 2. Then x = 7 − 2(2) = 3.","Finally x + y = 3 + 2 = 5."],"alt":"Elimination is quick here too: add the two equations, (x + 2y) + (3x − y) = 7 + 7, giving 4x + y = 14 — not directly x + y, so instead solve normally. A cleaner shortcut: with x = 3 and y = 2, just add. Either way you can verify by testing that (3, 2) satisfies both original equations.","check":"Check (x, y) = (3, 2): 3 + 2(2) = 7 ✓ and 3(3) − 2 = 7 ✓. Then x + y = 5."},"ma-alg-19":{"concept":"Solving a linear inequality is almost like solving an equation, with ONE crucial rule: whenever you multiply or divide both sides by a negative number, you must FLIP the inequality sign. This is because multiplying by a negative reverses the order of numbers on the number line (for example 2 < 3 but −2 > −3). Forgetting to flip is the most common inequality mistake.","steps":["Start with −3x + 5 > 14. Subtract 5 from both sides: −3x > 9.","Divide both sides by −3. Because −3 is negative, flip the > to <: x < 9/(−3).","Simplify: x < −3.","That is choice A) x < −3."],"alt":"Test a value to catch a flip error. Pick x = −5 (which should satisfy x < −3): −3(−5) + 5 = 15 + 5 = 20 > 14 ✓, so numbers less than −3 work. Now try x = 0: −3(0) + 5 = 5, not > 14, so x = 0 fails — confirming the solution is x < −3, not x > −3.","check":"Boundary test at x = −3: −3(−3) + 5 = 9 + 5 = 14, which is exactly 14, not greater — so −3 itself is excluded and everything below works, matching x < −3."},"ma-alg-20":{"concept":"Constraint word problems become inequalities. 'At least $10' means the leftover money must be ≥ 10. Set up: money spent = price × quantity, and leftover = starting money − spent. Then solve the inequality and, since you can't buy a fraction of a notebook, round to the largest whole number that fits.","steps":["Let n = notebooks. Money left is 50 − 4n, and it must be at least 10: 50 − 4n ≥ 10.","Subtract 50 from both sides: −4n ≥ −40.","Divide by −4 and flip the sign (negative divisor): n ≤ 10.","The greatest whole number of notebooks is 10, choice C."],"alt":"Reason with money directly. The student must keep $10, so at most $50 − $10 = $40 is available for notebooks. Each costs $4, so 40 ÷ 4 = 10 notebooks. Buying 10 leaves exactly $10, which satisfies 'at least $10.' Buying 11 would cost $44, leaving only $6 — not allowed.","check":"Test n = 10: cost 4(10) = 40, leftover 50 − 40 = 10 ≥ 10 ✓. Test n = 11: leftover 50 − 44 = 6, which is less than 10, so 11 fails. 10 is the max."},"ma-alg-21":{"concept":"'Satisfies BOTH' means you need the value that lands in the overlap of two solution sets — the intersection. Solve each inequality separately to get a range, then find where the ranges overlap. Only a value inside both ranges qualifies. Pay attention to whether endpoints are included (≤ or ≥) or excluded (< or >).","steps":["First inequality: 2x − 1 ≤ 3. Add 1: 2x ≤ 4. Divide by 2: x ≤ 2.","Second inequality: x + 4 > 2. Subtract 4: x > −2.","Combine: the overlap is −2 < x ≤ 2 (greater than −2 but at most 2).","Among the choices, only 2 falls in this range (−3 is too low; 3 and 4 are too high). Answer: B) 2."],"alt":"Just test each choice in both inequalities. x = 2: 2(2) − 1 = 3 ≤ 3 ✓ and 2 + 4 = 6 > 2 ✓ — passes both. x = 3: 2(3) − 1 = 5 ≤ 3 ✗ — fails the first. x = −3: −3 + 4 = 1 > 2 ✗ — fails the second. Only 2 survives both tests.","check":"Reconfirm 2 in the combined range −2 < x ≤ 2: since 2 equals the upper bound and the upper bound is included (≤), it qualifies."},"ma-alg-22":{"concept":"A compound inequality like −2 ≤ 3 − x < 5 is two inequalities stacked, and x is trapped in the middle. Whatever you do, do it to all THREE parts at once to keep them aligned. The critical rule still applies: multiplying or dividing all parts by a negative flips BOTH inequality signs, and it also swaps which end is larger.","steps":["Start with −2 ≤ 3 − x < 5. Subtract 3 from all three parts: −2 − 3 ≤ −x < 5 − 3, giving −5 ≤ −x < 2.","Multiply all parts by −1 and flip both signs: 5 ≥ x > −2.","Rewrite in normal left-to-right order (smallest to largest): −2 < x ≤ 5.","That is choice A) −2 < x ≤ 5."],"alt":"Test endpoints and a middle value. Try x = 5: 3 − 5 = −2, and −2 ≤ −2 ✓ (included). Try x = −2: 3 − (−2) = 5, but the middle must be < 5, and 5 is not < 5 ✗ (excluded). Try x = 0: 3 − 0 = 3, and −2 ≤ 3 < 5 ✓. This confirms −2 is excluded and 5 is included, matching choice A.","check":"Plug the boundaries into 3 − x: at x = 5 you get −2 (hits the ≤ −2 edge, allowed); at x = −2 you get 5 (hits the < 5 edge, not allowed). The included/excluded ends match −2 < x ≤ 5."},"ma-alg-23":{"concept":"'Directly proportional' means y = kx for some constant k, so y and x grow together at a fixed ratio — double x and you double y. The number k is the constant of proportionality, found by dividing a known y by its matching x. Once you have k, you can find y for any x.","steps":["Write the relationship: y = kx. Use the given pair y = 15 when x = 6: 15 = k(6).","Solve for k: k = 15/6 = 2.5.","Now find y when x = 10: y = 2.5 × 10 = 25.","So y = 25."],"alt":"Use a proportion instead of finding k. Since y/x stays constant, set 15/6 = y/10. Cross-multiply: 6y = 150, so y = 25. Intuition check: x grew from 6 to 10, a factor of 10/6, so y grows by the same factor: 15 × (10/6) = 25.","check":"Confirm the ratio is constant: 15/6 = 2.5 and 25/10 = 2.5. Same ratio means the proportionality holds, so y = 25 is right."},"ma-alg-24":{"concept":"Parallel lines have exactly the same slope but different positions — they never meet. So a line parallel to y = 3x − 4 must also have slope 3. In y = mx + b, the m is the slope and b is the y-intercept. A point of the form (0, something) is right on the y-axis, so that 'something' IS the y-intercept b.","steps":["Read the slope of y = 3x − 4: it's 3. A parallel line shares this, so m = 3.","The new line passes through (0, 2). Since x = 0 there, this point is the y-intercept, so b = 2.","Assemble y = mx + b: y = 3x + 2.","That is choice A) y = 3x + 2."],"alt":"Eliminate by slope and intercept. Parallel requires slope 3, which knocks out choice B (slope −1/3) and D (slope 2). Between A (y = 3x + 2) and C (y = 3x − 4), only A passes through (0, 2), since C hits (0, −4). So A is the answer.","check":"Test the point in y = 3x + 2: at x = 0, y = 3(0) + 2 = 2 ✓, matching (0, 2), and the slope 3 matches the given line's slope."},"ma-alg-25":{"concept":"Elimination shines when one variable already has opposite coefficients. Here y appears as +2y in one equation and −2y in the other; adding the equations makes the y terms cancel (+2y − 2y = 0), instantly leaving an equation in x alone. This works because you're adding equal quantities to both sides.","steps":["Align the equations: 5x + 2y = 16 and 3x − 2y = 8.","Add straight down: (5x + 3x) + (2y − 2y) = 16 + 8, giving 8x = 24.","Divide by 8: x = 3.","The value of x is 3, choice B."],"alt":"Back-solve the choices. Try x = 3: from 5(3) + 2y = 16, 15 + 2y = 16, so 2y = 1, y = 0.5. Check the second: 3(3) − 2(0.5) = 9 − 1 = 8 ✓. It satisfies both, so x = 3 is correct.","check":"With x = 3, y = 0.5: test both originals — 5(3) + 2(0.5) = 15 + 1 = 16 ✓ and 3(3) − 2(0.5) = 9 − 1 = 8 ✓."},"ma-alg-26":{"concept":"A budget cap is a 'less than or equal to' inequality: the total cost must stay at or below the limit. Solve it exactly like a linear equation to isolate the variable — but since dividing here is by a positive number (25), the inequality sign does NOT flip. Because guests come in whole people, round DOWN to the largest whole number allowed.","steps":["Start with 25g + 300 ≤ 2000. Subtract the fixed 300 from both sides: 25g ≤ 1700.","Divide both sides by 25 (positive, so no flip): g ≤ 1700/25 = 68.","Since g must be a whole number of guests and g ≤ 68, the greatest allowed is 68.","The answer is 68 guests."],"alt":"Reason from the budget. After the fixed $300, there's 2000 − 300 = 1700 left for guests at $25 each, so 1700 ÷ 25 = 68 guests fit exactly. Trying 69 would cost 25(69) + 300 = 1725 + 300 = 2025, over budget, so 68 is the ceiling.","check":"Test g = 68: 25(68) + 300 = 1700 + 300 = 2000 ≤ 2000 ✓ (right at the limit). Test g = 69: 2025 > 2000 ✗. So 68 is the greatest valid number."},"s2-ma-alg-01":{"concept":"A linear equation is just a balance scale: whatever you do to one side you must do to the other so the two sides stay equal. To 'solve for x' means to peel away everything attached to x — using opposite operations — until x sits alone. The opposite of adding is subtracting, and the opposite of multiplying is dividing.","steps":["Start with 3x + 7 = 22. The 7 is being added to 3x, so undo it by subtracting 7 from both sides: 3x + 7 − 7 = 22 − 7, which gives 3x = 15.","Now x is multiplied by 3, so undo it by dividing both sides by 3: 3x/3 = 15/3.","This gives x = 5, which is choice A."],"alt":"Back-solving: since this is multiple choice, you can test the answers. Try A) x = 5: plug in to get 3(5) + 7 = 15 + 7 = 22. That matches the right side exactly, so A is correct. This is a great safety net when you doubt your algebra.","check":"Substitute x = 5 back into the original: 3·5 + 7 = 15 + 7 = 22. ✓ It matches, so 5 is right."},"s2-ma-alg-02":{"concept":"When an equation has parentheses, first 'distribute' — multiply the number outside by each term inside — to clear them. When x appears on BOTH sides, the goal is to gather all the x terms on one side and all the plain numbers on the other, then isolate x. Moving a term across the equals sign flips its sign, because you're really adding or subtracting it from both sides.","steps":["Distribute the 2 on the left: 2·x − 2·4 = 2x − 8, so the equation is 2x − 8 = 5x + 7.","Get x terms together: subtract 2x from both sides to leave −8 = 3x + 7.","Get numbers together: subtract 7 from both sides to get −15 = 3x.","Divide both sides by 3: x = −15/3 = −5."],"alt":"You could instead move x to the left and numbers to the right. From 2x − 8 = 5x + 7, subtract 5x: −3x − 8 = 7. Add 8: −3x = 15. Divide by −3: x = −5. Same answer either way — pick whichever keeps the x coefficient positive if you dislike negatives.","check":"Plug x = −5 into both original sides. Left: 2(−5 − 4) = 2(−9) = −18. Right: 5(−5) + 7 = −25 + 7 = −18. Both equal −18. ✓"},"s2-ma-alg-03":{"concept":"When two fractions are set equal, the fastest tool is cross-multiplication: a/b = c/d means a·d = b·c. This works because multiplying both sides by both denominators clears the fractions in one move. After that it's an ordinary linear equation you solve by balancing.","steps":["Cross-multiply (2x − 1)/3 = (x + 4)/2 to get 2·(2x − 1) = 3·(x + 4).","Distribute both sides: 4x − 2 = 3x + 12.","Subtract 3x from both sides: x − 2 = 12.","Add 2 to both sides: x = 14, which is choice A."],"alt":"Back-solve with the choices. The answer 14 is largest, and both sides grow as x grows, so test A) 14: left = (2·14 − 1)/3 = 27/3 = 9; right = (14 + 4)/2 = 18/2 = 9. Both give 9, so A works instantly.","check":"With x = 14: (2·14 − 1)/3 = 27/3 = 9 and (14 + 4)/2 = 9. Both sides equal 9. ✓"},"s2-ma-alg-04":{"concept":"Slope-intercept form is y = mx + b, where m is the slope (how steep the line is: rise over run) and b is the y-intercept (the y-value where the line crosses the vertical axis, i.e. where x = 0). A point written (0, 3) has x = 0, so its y-value 3 is exactly the y-intercept.","steps":["Identify the slope: m = 2, given directly.","Identify the y-intercept: the line passes through (0, 3), and since x = 0 there, b = 3.","Plug into y = mx + b: y = 2x + 3, which is choice A."],"alt":"Test the point in each choice. The line must pass through (0, 3), so set x = 0 and see which gives y = 3. A) y = 2(0) + 3 = 3 ✓. B) y = 3(0) + 2 = 2 ✗. Only A also has slope 2, confirming A.","check":"Confirm both facts: at x = 0, y = 2(0) + 3 = 3 (matches the point), and the coefficient of x is 2 (matches the slope). ✓"},"s2-ma-alg-05":{"concept":"A linear function changes at a constant rate, so it fits f(x) = mx + b, where m is the slope and b = f(0) is the starting value. The slope between two known points is the change in output divided by the change in input: (f of second − f of first)/(second input − first input). Once you have m, use one known point to find b.","steps":["Find the slope: m = (17 − 5)/(6 − 2) = 12/4 = 3.","Write f(x) = 3x + b.","Use f(2) = 5: 3(2) + b = 5, so 6 + b = 5, giving b = −1.","Since f(0) = b, we get f(0) = −1, which is choice A."],"alt":"Think in steps of x. Going from x = 2 to x = 6 (4 steps of 1) raised f by 12, so each step of 1 in x adds 3. To get from x = 2 back to x = 0 you take 2 steps DOWN, subtracting 3 twice: 5 − 3 − 3 = −1. So f(0) = −1.","check":"With f(x) = 3x − 1: f(2) = 6 − 1 = 5 ✓ and f(6) = 18 − 1 = 17 ✓. Both given values match, so f(0) = −1 is trustworthy."},"s2-ma-alg-06":{"concept":"Two lines are perpendicular when their slopes are negative reciprocals — flip the fraction and change its sign, so the product of the slopes is −1. To find a line's slope from standard form Ax + By = C, solve for y to reach y = mx + b. Then use point-slope form y − y₁ = m(x − x₁) with the given point to build the new line.","steps":["Rewrite ℓ: 4x − 3y = 12 → −3y = −4x + 12 → y = (4/3)x − 4, so slope of ℓ is 4/3.","Perpendicular slope = negative reciprocal of 4/3 = −3/4.","Use point (2, −1): y − (−1) = −3/4(x − 2), so y + 1 = −3/4 x + 3/2.","Subtract 1: y = −3/4 x + 3/2 − 1 = −3/4 x + 1/2.","The y-intercept is 1/2, which is choice A."],"alt":"Use y = mx + b directly. You know m = −3/4 and the point (2, −1), so −1 = −3/4(2) + b = −3/2 + b. Add 3/2: b = −1 + 3/2 = 1/2. The y-intercept is b = 1/2.","check":"Does line m pass through (2, −1)? y = −3/4(2) + 1/2 = −3/2 + 1/2 = −1 ✓. And its slope −3/4 times ℓ's slope 4/3 = −1, confirming perpendicularity. ✓"},"s2-ma-alg-07":{"concept":"A constant burn rate means the height is a linear function of time: h = (rate)·t + b, where b is the starting height at t = 0. The rate (slope) is the change in height divided by the change in time; here it's negative because the candle shrinks. Once you know the rate, back up to t = 0 to find the original height.","steps":["Rate = (9 − 18)/(5 − 2) = −9/3 = −3 cm per hour (it loses 3 cm each hour).","Write h = −3t + b.","Use the point (2, 18): 18 = −3(2) + b = −6 + b, so b = 24.","At t = 0, h = b = 24 cm."],"alt":"Reason backward in time. At t = 2 the candle is 18 cm, and it burns 3 cm per hour, so going back 2 hours to t = 0 it was TALLER by 3 cm twice: 18 + 3 + 3 = 24 cm.","check":"With h = −3t + 24: at t = 2, h = −6 + 24 = 18 ✓; at t = 5, h = −15 + 24 = 9 ✓. Both data points fit, so 24 cm is correct."},"s2-ma-alg-08":{"concept":"A system of equations is two equations that must be true at the same time. The substitution method solves one equation for a single variable, then plugs that expression into the other equation so only one variable remains. Solving that gives one value, which you feed back to get the other.","steps":["From x − y = 1, solve for x: x = y + 1.","Substitute into 2x + 3y = 12: 2(y + 1) + 3y = 12.","Expand and combine: 2y + 2 + 3y = 12 → 5y + 2 = 12 → 5y = 10 → y = 2.","Find x: x = y + 1 = 2 + 1 = 3, which is choice A."],"alt":"Elimination is even faster here. Multiply x − y = 1 by 3 to get 3x − 3y = 3, then add it to 2x + 3y = 12: the y's cancel, giving 5x = 15, so x = 3.","check":"Plug x = 3, y = 2 into both originals: 2(3) + 3(2) = 6 + 6 = 12 ✓ and 3 − 2 = 1 ✓. Both hold, so x = 3."},"s2-ma-alg-09":{"concept":"When the same variable appears with opposite-signed coefficients (+2y and −2y), the elimination method shines: add the two equations and that variable vanishes, leaving one equation in the other variable. Solve for that, then substitute back to find the one you eliminated.","steps":["Add the equations: (3x + 2y) + (5x − 2y) = 16 + 8. The +2y and −2y cancel, giving 8x = 24.","Divide by 8: x = 3.","Substitute into 3x + 2y = 16: 3(3) + 2y = 16 → 9 + 2y = 16 → 2y = 7.","Divide by 2: y = 7/2 = 3.5."],"alt":"Solve for y directly by eliminating x instead: multiply the first equation by 5 and the second by 3, then subtract, but that's messier. Simplest sanity route is to just find x = 3 first (via adding), then read y off either equation — both give y = 3.5.","check":"Use the second equation you didn't lean on: 5(3) − 2(3.5) = 15 − 7 = 8 ✓. Matches the given right side, so y = 7/2."},"s2-ma-alg-10":{"concept":"Two linear equations have infinitely many solutions only when they are really the SAME line — one is just a scaled copy of the other. That means every coefficient (the x-term, the y-term, and the constant) is multiplied by the same number. So you can scale one equation until its y-term and constant match the other, and the x-coefficients must then match too.","steps":["Look at the y-terms and constants: the first equation 4x + 6y = 14 has 6y and 14; the second kx + 3y = 7 has 3y and 7.","Notice 6y is twice 3y, and 14 is twice 7 — so the first equation is exactly 2 times the second.","Divide the first equation by 2: 2x + 3y = 7.","For it to match kx + 3y = 7, we need k = 2, which is choice A."],"alt":"Use the proportion rule for coincident lines: 4/k = 6/3 = 14/7. Since 6/3 = 2 and 14/7 = 2, all ratios must equal 2, so 4/k = 2, giving k = 2.","check":"With k = 2 the second equation is 2x + 3y = 7; doubling it gives 4x + 6y = 14, exactly the first equation. Identical lines mean infinitely many solutions. ✓"},"s2-ma-alg-11":{"concept":"Word problems become systems when there are two unknowns and two facts. Here the unknowns are the counts of nickels and dimes. One fact counts the coins (n + d = 30); the other counts the money in cents (a nickel is 5¢, a dime is 10¢). Converting dollars to cents avoids decimals and keeps arithmetic clean.","steps":["Let n = nickels, d = dimes. Count equation: n + d = 30. Value equation (in cents): 5n + 10d = 230.","Solve the count equation for n: n = 30 − d.","Substitute: 5(30 − d) + 10d = 230 → 150 − 5d + 10d = 230 → 150 + 5d = 230.","Subtract 150: 5d = 80. Divide by 5: d = 16, which is choice A."],"alt":"Back-solve the choices. Try A) 16 dimes: then 30 − 16 = 14 nickels. Value = 16·10¢ + 14·5¢ = 160 + 70 = 230¢ = $2.30 ✓. It matches, so 16 dimes.","check":"16 dimes = $1.60 and 14 nickels = $0.70; total = $2.30 with 16 + 14 = 30 coins. Both facts hold. ✓"},"s2-ma-alg-12":{"concept":"An inequality is solved almost exactly like an equation — isolate x with opposite operations — with ONE crucial rule: if you multiply or divide both sides by a NEGATIVE number, you must flip the inequality sign. Here we only add and divide by positives, so the sign stays the same.","steps":["Start with 3x − 4 ≤ 11. Add 4 to both sides: 3x ≤ 15.","Divide both sides by 3, which is positive, so ≤ stays ≤: x ≤ 5.","That is choice A."],"alt":"Test a boundary and a sample. At x = 5: 3(5) − 4 = 11, and 11 ≤ 11 is true, so 5 is included. Try x = 6 (bigger): 3(6) − 4 = 14, and 14 ≤ 11 is false. So solutions are x at most 5 — x ≤ 5.","check":"Pick x = 0 (which is ≤ 5): 3(0) − 4 = −4 ≤ 11 ✓. Pick x = 10 (not ≤ 5): 26 ≤ 11 is false ✓. The boundary behaves correctly."},"s2-ma-alg-13":{"concept":"Real-world 'no more than' means ≤ (at most that amount). Model the total cost with a linear inequality: a fixed fee plus a per-item charge. After solving, remember the context — you can't take a fraction of a class — so a non-integer answer must be rounded DOWN to the greatest whole number that still fits the budget.","steps":["Let c = number of classes. Total cost: 25 + 4c ≤ 100.","Subtract 25 from both sides: 4c ≤ 75.","Divide by 4: c ≤ 18.75.","Classes must be whole numbers, so the greatest allowed is 18, which is choice A."],"alt":"Reason with money directly. After the $25 fee, $75 is left for classes. Each class is $4, and 75 ÷ 4 = 18.75, so 18 full classes cost 18·$4 = $72 (total $97, under budget) while 19 classes cost $76 (total $101, over). The answer is 18.","check":"18 classes: 25 + 4(18) = 25 + 72 = 97 ≤ 100 ✓. 19 classes: 25 + 76 = 101 > 100 ✗. So 18 is the greatest that works."},"s2-ma-alg-14":{"concept":"A compound inequality like −3 < 2x − 5 ≤ 7 means x makes the middle expression fall between two bounds at once. You solve it by doing the SAME operation to all THREE parts, keeping x trapped in the middle until it's alone. As with any inequality, flip both signs only if you multiply or divide by a negative (not needed here).","steps":["Add 5 to all three parts: −3 + 5 < 2x − 5 + 5 ≤ 7 + 5, which gives 2 < 2x ≤ 12.","Divide all three parts by 2 (positive, so signs stay): 2/2 < x ≤ 12/2.","This simplifies to 1 < x ≤ 6, which is choice A."],"alt":"Handle it as two separate inequalities. Left: −3 < 2x − 5 → 2 < 2x → 1 < x. Right: 2x − 5 ≤ 7 → 2x ≤ 12 → x ≤ 6. Combine: 1 < x ≤ 6. Note x = 1 is excluded (strict <) but x = 6 is included (≤).","check":"Test x = 6 (should be included): 2(6) − 5 = 7, and 7 ≤ 7 ✓ while −3 < 7 ✓. Test x = 1 (should be excluded): 2(1) − 5 = −3, but −3 < −3 is false ✓. Bounds behave right."},"s2-ma-alg-15":{"concept":"This inequality has x multiplied by a negative number, so watch for the key rule: dividing (or multiplying) both sides by a negative FLIPS the inequality sign. 'Least integer value' means the smallest whole number in the solution set — so after solving you look for where the solutions begin.","steps":["Start with 5 − 2x ≤ −9. Subtract 5 from both sides: −2x ≤ −14.","Divide both sides by −2, and FLIP ≤ to ≥ because −2 is negative: x ≥ 7.","The solutions are all numbers 7 or larger, so the least integer is 7."],"alt":"Avoid the flip by moving x to the positive side. From 5 − 2x ≤ −9, add 2x to both sides: 5 ≤ 2x − 9. Add 9: 14 ≤ 2x. Divide by 2: 7 ≤ x, i.e. x ≥ 7. Same result, no sign-flip worries.","check":"Plug x = 7 into the original: 5 − 2(7) = 5 − 14 = −9, and −9 ≤ −9 ✓. Try x = 6: 5 − 12 = −7, and −7 ≤ −9 is false, so 6 is too small. Thus 7 is the least integer."},"s3-ma-alg-01":{"concept":"To solve a linear equation, isolate x by undoing operations in reverse order with their opposites. Here 3 is multiplying x and 7 is added on; you peel off the added 7 first, then the multiplying 3. Keeping both sides balanced guarantees the equation stays true.","steps":["Start with 3x + 7 = 22. Subtract 7 from both sides: 3x = 15.","Divide both sides by 3: x = 15/3.","So x = 5, which is choice A."],"alt":"Back-solve: test A) x = 5 → 3(5) + 7 = 15 + 7 = 22 ✓. Note the trap choice −5 gives 3(−5) + 7 = −8, not 22, so it's wrong.","check":"Substitute x = 5: 3·5 + 7 = 22 ✓, matching the right side."},"s3-ma-alg-02":{"concept":"When a number multiplies a whole parenthesis, you have two clean routes: divide both sides by that number first (undoing the multiplication before touching what's inside), or distribute the number in. Dividing first is fastest when the right side divides evenly.","steps":["Start with 5(x − 2) = 20. Divide both sides by 5: x − 2 = 4.","Add 2 to both sides: x = 6, which is choice A."],"alt":"Distribute instead: 5x − 10 = 20. Add 10: 5x = 30. Divide by 5: x = 6. Same answer; use whichever feels safer.","check":"Plug x = 6 into 5(x − 2): 5(6 − 2) = 5·4 = 20 ✓, matching the right side."},"s3-ma-alg-03":{"concept":"Here x is divided by 4 and then 3 is added. Undo in reverse: first remove the added 3 by subtracting, then undo the division by 4 by multiplying by 4. Multiplication and division are opposites, just like addition and subtraction.","steps":["Start with x/4 + 3 = 10. Subtract 3 from both sides: x/4 = 7.","Multiply both sides by 4: x = 7·4.","So x = 28."],"alt":"Clear the fraction first by multiplying every term by 4: x + 12 = 40. Then subtract 12: x = 28. Same result.","check":"Substitute x = 28: 28/4 + 3 = 7 + 3 = 10 ✓, matching the right side."},"s3-ma-alg-04":{"concept":"This mixes a fraction coefficient and a subtracted number. Peel operations off x in reverse: first undo the subtraction of 5, then clear the /3 by multiplying, then undo the ×2 by dividing. Do the same to both sides at every step to keep balance.","steps":["Start with (2x)/3 − 5 = 1. Add 5 to both sides: (2x)/3 = 6.","Multiply both sides by 3: 2x = 18.","Divide both sides by 2: x = 9, which is choice A."],"alt":"Back-solve: test A) x = 9 → (2·9)/3 − 5 = 18/3 − 5 = 6 − 5 = 1 ✓. The trap choice 6 gives 12/3 − 5 = −1, not 1.","check":"Substitute x = 9: (2·9)/3 − 5 = 6 − 5 = 1 ✓, matching the
