  choices:[' — / —',': / :',', / ;',' — / ,'],
  ans:0,
  exp:{ why:`The list "cumin, coriander, and smoked paprika" is a nonessential appositive that already contains commas, so a matched pair of dashes sets it off cleanly.`,
    traps:{ B:'Two colons cannot bracket an interruption in the middle of a sentence.', C:'A comma before and a semicolon after are mismatched and ungrammatical here.', D:'A dash must be paired with another dash, not a comma.' },
    skill:'Boundaries', strat:'Use paired dashes to fence off a nonessential phrase that itself contains commas.' } },

{ id:'rw-conv-07', sec:'rw', dom:'conv', skill:'Boundaries', dif:'M', type:'mcq',
  stim:`<p>The telescope captured images no one had seen before ______ its mirror, polished to within a fraction of a wavelength, gathered light from galaxies billions of years old.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[', because',';',', and then',' (no punctuation)'],
  ans:1,
  exp:{ why:`Both parts are independent clauses, and a semicolon correctly joins two closely related independent clauses without a conjunction.`,
    traps:{ A:'", because" is possible in meaning but the item tests boundary punctuation; a bare comma with "because" would still need care, and the semicolon is the clean grammatical join offered.', C:'", and then" adds a comma splice risk and an unneeded sequence marker.', D:'No punctuation fuses two independent clauses into a run-on.' },
    skill:'Boundaries', strat:'Two independent clauses with a close relationship can be joined by a semicolon alone.' } },

{ id:'rw-conv-08', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'E', type:'mcq',
  stim:`<p>Each of the dancers ______ hours perfecting a single turn before the company's opening night.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['spend','spends','have spent','are spending'],
  ans:1,
  exp:{ why:`The subject "Each" is singular, so it takes the singular verb "spends"; the phrase "of the dancers" does not change the subject’s number.`,
    traps:{ A:'"spend" is plural and does not agree with singular "Each."', C:'"have spent" is plural and mismatches "Each."', D:'"are spending" is plural and mismatches "Each."' },
    skill:'Form, Structure & Sense', strat:'"Each," "every," and "one" are singular — ignore the prepositional phrase and match a singular verb.' } },

{ id:'rw-conv-09', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'M', type:'mcq',
  stim:`<p>The collection of rare coins, gathered by three generations of one family, ______ finally being donated to the national museum.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['are','were','is','have been'],
  ans:2,
  exp:{ why:`The subject is "The collection" (singular); the interrupting phrase "of rare coins ... one family" does not change it, so the singular "is" agrees.`,
    traps:{ A:'"are" agrees with a plural subject, but "collection" is singular.', B:'"were" is plural and past; the sentence needs singular present "is."', D:'"have been" is plural and mismatches "collection."' },
    skill:'Form, Structure & Sense', strat:'Find the true subject before the interrupting "of..." phrase; a collective noun like "collection" is singular here.' } },

{ id:'rw-conv-10', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'M', type:'mcq',
  stim:`<p>Walking home through the quiet streets, ______ noticed how the shop windows had all been decorated for the festival.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['the decorations','it','Priya','there'],
  ans:2,
  exp:{ why:`The opening modifier "Walking home..." must describe the subject that follows. Only a person can be walking, so "Priya" correctly receives the modifier.`,
    traps:{ A:'"the decorations" cannot be "walking home," creating a dangling modifier.', B:'"it" cannot walk and leaves the modifier dangling.', D:'"there" is not a person and cannot perform the walking.' },
    skill:'Form, Structure & Sense', strat:'After an "-ing" opener, the very next noun must be the one doing the action — check who can logically walk.' } },

{ id:'rw-conv-11', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'H', type:'mcq',
  stim:`<p>By the time the researchers published their findings, the technology they had studied ______ obsolete, replaced by a faster method few had anticipated.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['becomes','has become','had become','will become'],
  ans:2,
  exp:{ why:`The publishing happened in the past, and the technology became obsolete before that point, so the past perfect "had become" correctly marks the earlier past action.`,
    traps:{ A:'"becomes" is present tense and clashes with the past-time frame.', B:'"has become" (present perfect) does not fit an action completed before another past event.', D:'"will become" is future and contradicts "By the time ... published."' },
    skill:'Form, Structure & Sense', strat:'For an action finished before another past action, use the past perfect ("had" + participle).' } },

{ id:'rw-conv-12', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'M', type:'mcq',
  stim:`<p>Neither the coach nor the players ______ satisfied with the referee's final call, though none of them protested aloud.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['was','were','is','has been'],
  ans:1,
  exp:{ why:`In "neither ... nor," the verb agrees with the nearer subject, "players" (plural), so "were" is correct.`,
    traps:{ A:'"was" is singular; the nearer subject "players" is plural.', C:'"is" is singular and mismatches the plural nearer subject.', D:'"has been" is singular and mismatches "players."' },
    skill:'Form, Structure & Sense', strat:'With "neither...nor" or "either...or," match the verb to the subject closest to it.' } },

{ id:'rw-conv-13', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'M', type:'mcq',
  stim:`<p>The city council praised the volunteers for ______ tireless work restoring the flooded library over the summer.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['their','its','they’re','there'],
  ans:0,
  exp:{ why:`The pronoun refers to "the volunteers" (plural), so the plural possessive "their" agrees.`,
    traps:{ B:'"its" is singular and cannot refer to plural "volunteers."', C:'"they’re" means "they are," which cannot precede a noun as a possessive.', D:'"there" indicates place and is not a possessive.' },
    skill:'Form, Structure & Sense', strat:'Match the pronoun to its antecedent’s number, and distinguish possessive "their" from "they’re"/"there."' } },

{ id:'rw-conv-14', sec:'rw', dom:'conv', skill:'Boundaries', dif:'M', type:'mcq',
  stim:`<p>The bridge, an engineering marvel of its time ______ still carries commuter trains across the river every day.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[',',';',':',' and'],
  ans:0,
  exp:{ why:`"an engineering marvel of its time" is a nonessential appositive opened by a comma after "bridge," so it must be closed with a comma before "still."`,
    traps:{ B:'A semicolon would need an independent clause after it; "still carries..." lacks a subject of its own here.', C:'A colon does not close a mid-sentence appositive.', D:'Adding "and" without closing the appositive leaves it unbalanced.' },
    skill:'Boundaries', strat:'Close a nonessential appositive with the same comma that opened it.' } },

{ id:'rw-conv-15', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'H', type:'mcq',
  stim:`<p>The scientist argued that her rivals' model, however elegant, could not account for the anomaly ______ her own model, she insisted, predicted it precisely.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[', whereas',', and','; which',', which'],
  ans:0,
  exp:{ why:`Two independent clauses are contrasted; ", whereas" is a subordinating conjunction that both joins them and signals the contrast, yielding a grammatical complex sentence.`,
    traps:{ B:'", and" is grammatical but "whereas" is needed to mark the contrast the sentence sets up; among the choices the boundary must be correct AND logical.', C:'"; which" wrongly attaches a relative clause to the whole prior clause and misuses the semicolon.', D:'", which" creates a comma splice/relative-clause confusion between two independent ideas.' },
    skill:'Form, Structure & Sense', strat:'When two clauses contrast, a subordinator like "whereas" joins them correctly and conveys the relationship.' } },

{ id:'rw-conv-16', sec:'rw', dom:'conv', skill:'Boundaries', dif:'E', type:'mcq',
  stim:`<p>The museum's newest exhibit features artifacts from ancient ______ pottery, jewelry, and tools unearthed near the old trade routes.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['trade:','trade;','trade,','trade'],
  ans:0,
  exp:{ why:`The clause "The museum’s newest exhibit features artifacts from ancient trade" is independent, and a colon properly introduces the list of examples that follows.`,
    traps:{ B:'A semicolon would need an independent clause after it, but a list follows.', C:'A comma is too weak to formally introduce the explanatory list.', D:'No punctuation runs the list into the sentence unclearly.' },
    skill:'Boundaries', strat:'Independent clause + colon + list is the standard way to introduce examples.' } },

{ id:'rw-conv-17', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'M', type:'mcq',
  stim:`<p>The findings from the decade-long study, along with data from several smaller trials, ______ that the treatment is both safe and effective.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['suggests','suggest','is suggesting','has suggested'],
  ans:1,
  exp:{ why:`The subject is plural "findings"; "along with data from several smaller trials" is a nonessential phrase that does not change the number, so plural "suggest" agrees.`,
    traps:{ A:'"suggests" is singular and mismatches plural "findings."', C:'"is suggesting" is singular and mismatches the plural subject.', D:'"has suggested" is singular and mismatches "findings."' },
    skill:'Form, Structure & Sense', strat:'Phrases like "along with," "as well as," and "in addition to" do not make a subject plural — locate the real subject.' } },

{ id:'rw-conv-18', sec:'rw', dom:'conv', skill:'Boundaries', dif:'H', type:'mcq',
  stim:`<p>The startup's first product failed ______ its founders learned from the collapse, regrouped, and built a second company that thrived.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['. However,','. However','; however','however,'],
  ans:0,
  exp:{ why:`"However" begins a new independent clause here; ending the first sentence with a period and starting the next with "However," is fully correct.`,
    traps:{ B:'"However" as a sentence-opening conjunctive adverb needs a comma after it.', C:'"; however" without a following comma is incomplete for a conjunctive adverb starting a clause.', D:'A bare "however," with no boundary mark before it splices the two independent clauses.' },
    skill:'Boundaries', strat:'Sentence-initial "However," takes a comma after it; between two clauses use ". However," or "; however,".' } },

{ id:'rw-conv-19', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'M', type:'mcq',
  stim:`<p>If the town had installed the flood barriers earlier, the damage from last spring's storm ______ far less severe.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['would have been','will be','would be','has been'],
  ans:0,
  exp:{ why:`This is a past unreal conditional: "If ... had installed" pairs with "would have been" in the main clause.`,
    traps:{ B:'"will be" fits a real future condition, not a past hypothetical.', C:'"would be" fits a present/future unreal condition, not the past "had installed."', D:'"has been" is present perfect and does not complete the hypothetical.' },
    skill:'Form, Structure & Sense', strat:'"If ... had [verb]" signals a past unreal conditional; the result clause takes "would have + participle."' } },

{ id:'rw-conv-20', sec:'rw', dom:'conv', skill:'Form, Structure & Sense', dif:'E', type:'mcq',
  stim:`<p>The engineers tested the prototype repeatedly, refining the design until ______ performed flawlessly under pressure.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:['it','they','one','those'],
  ans:0,
  exp:{ why:`The pronoun refers to "the prototype," a singular thing, so the singular "it" agrees.`,
    traps:{ B:'"they" is plural and cannot refer to the singular "prototype."', C:'"one" is vague and does not clearly point back to "prototype."', D:'"those" is plural and lacks a plural antecedent.' },
    skill:'Form, Structure & Sense', strat:'Trace the pronoun to its antecedent; a single device takes singular "it."' } },

{ id:'rw-conv-21', sec:'rw', dom:'conv', skill:'Boundaries', dif:'M', type:'mcq',
  stim:`<p>The chef sources her ingredients locally ______ she buys greens from a farm two miles away and fish from the morning's catch at the nearby dock.</p>`,
  prompt:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
  choices:[':',',',' and',' so'],
  ans:0,
  exp:{ why:`The first clause is independent, and what follows explains or elaborates it, so a colon (which can join an independent clause to an explanation) is correct.`,
    traps:{ B:'A comma alone between two independent clauses is a splice.', C:'"and" without a comma before it still risks a run-on between two full clauses.', D:'"so" would need a comma and changes the logical relationship to cause-effect, which the elaboration does not require.' },
    skill:'Boundaries', strat:'A colon can link an independent clause to a second clause that explains or illustrates it.' } },

/* ===================== R&W · EXPRESSION OF IDEAS (20%) ===================== */
{ id:'rw-expr-01', sec:'rw', dom:'expr', skill:'Transitions', dif:'E', type:'mcq',
  stim:`<p>The new bus line was expected to ease downtown congestion. ______ traffic in the district actually increased in the months after it opened.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['Therefore,','Instead,','Likewise,','For instance,'],
  ans:1,
  exp:{ why:`The expectation (ease congestion) is reversed by the outcome (traffic increased), so a contrast/reversal transition — "Instead," — is logical.`,
    traps:{ A:'"Therefore" signals a result that follows logically, but the outcome contradicts the expectation.', C:'"Likewise" signals similarity, yet the two ideas oppose each other.', D:'"For instance" introduces an example, not a reversal.' },
    skill:'Transitions', strat:'Name the logical relationship first — here expectation vs. contrary result — then pick the matching connector.' } },

{ id:'rw-expr-02', sec:'rw', dom:'expr', skill:'Transitions', dif:'M', type:'mcq',
  stim:`<p>Solar panels produce no emissions while generating electricity. Manufacturing them, ______ requires energy and raw materials that carry an environmental cost of their own.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['as a result,','however,','in addition,','for example,'],
  ans:1,
  exp:{ why:`The clean-in-operation point is qualified by a hidden cost in manufacturing — a contrast — so "however," fits.`,
    traps:{ A:'"as a result" implies the manufacturing cost is caused by clean operation, which is illogical.', C:'"in addition" would signal a similar added point, but this is a countervailing drawback.', D:'"for example" would introduce an instance of the first idea, not a qualification of it.' },
    skill:'Transitions', strat:'When the second sentence complicates or qualifies the first, use a contrast transition like "however."' } },

{ id:'rw-expr-03', sec:'rw', dom:'expr', skill:'Transitions', dif:'M', type:'mcq',
  stim:`<p>The desert receives almost no rainfall for most of the year. ______ when the rare storms do arrive, dormant seeds erupt into a brief, brilliant carpet of wildflowers.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['Consequently,','Yet','Similarly,','In other words,'],
  ans:1,
  exp:{ why:`The near-total dryness contrasts with the sudden burst of flowers after rare storms, so a contrast transition "Yet" is logical.`,
    traps:{ A:'"Consequently" signals a result, but flowering is a surprising exception, not a direct consequence of dryness.', C:'"Similarly" marks likeness, while these ideas contrast.', D:'"In other words" restates, but the second idea adds new, contrasting information.' },
    skill:'Transitions', strat:'A surprising exception to a stated condition calls for "Yet" or "However."' } },

{ id:'rw-expr-04', sec:'rw', dom:'expr', skill:'Transitions', dif:'H', type:'mcq',
  stim:`<p>The committee gathered extensive public feedback before drafting the proposal. The final document, ______ reflected almost none of the concerns residents had raised at the hearings.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['accordingly,','nonetheless,','in particular,','for instance,'],
  ans:1,
  exp:{ why:`Despite gathering feedback, the document ignored it — an unexpected contrast — so the concessive "nonetheless," fits.`,
    traps:{ A:'"accordingly" implies the document logically followed from the feedback, but it did the opposite.', C:'"in particular" narrows to a detail, not a contrast.', D:'"for instance" introduces an example, not a reversal of expectation.' },
    skill:'Transitions', strat:'"Nonetheless" and "nevertheless" fit when an action’s outcome defies what its setup implied.' } },

{ id:'rw-expr-05', sec:'rw', dom:'expr', skill:'Transitions', dif:'M', type:'mcq',
  stim:`<p>The two composers never met and worked on different continents. Their late symphonies, ______ share a striking structural resemblance that scholars still puzzle over.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['nevertheless,','therefore,','for example,','in short,'],
  ans:0,
  exp:{ why:`Despite never meeting, their works resemble each other — a surprising contrast — so "nevertheless," is logical.`,
    traps:{ B:'"therefore" implies the resemblance results from their separation, which is illogical.', C:'"for example" would introduce an instance, not a contrast.', D:'"in short" summarizes, but a new contrasting fact follows.' },
    skill:'Transitions', strat:'"Nevertheless" signals that a result holds despite an obstacle — here, similarity despite total separation.' } },

{ id:'rw-expr-06', sec:'rw', dom:'expr', skill:'Transitions', dif:'E', type:'mcq',
  stim:`<p>The hikers had trained for months and studied the trail maps closely. ______ they reached the summit hours ahead of the schedule they had set.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['As a result,','In contrast,','Nevertheless,','Meanwhile,'],
  ans:0,
  exp:{ why:`Their preparation leads to the good outcome (arriving ahead of schedule), so a cause-effect transition "As a result," fits.`,
    traps:{ B:'"In contrast" signals opposition, but the outcome follows naturally from the preparation.', C:'"Nevertheless" implies the result defies the setup, but here it fulfills it.', D:'"Meanwhile" marks simultaneous events, not a consequence.' },
    skill:'Transitions', strat:'Preparation → success is a cause-effect chain; use "As a result" or "Therefore."' } },

{ id:'rw-expr-07', sec:'rw', dom:'expr', skill:'Transitions', dif:'M', type:'mcq',
  stim:`<p>The library extended its evening hours to serve students studying for exams. ______ it added a quiet study wing and doubled the number of power outlets at each desk.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['Instead,','However,','In addition,','By contrast,'],
  ans:2,
  exp:{ why:`Adding a study wing and outlets is a further step in the same effort to serve students, so an additive transition "In addition," fits.`,
    traps:{ A:'"Instead" implies replacement, but these measures accompany the extended hours.', B:'"However" signals contrast, yet both ideas point the same direction.', D:'"By contrast" marks opposition, which is not present.' },
    skill:'Transitions', strat:'When the second sentence piles on a similar supporting measure, use an additive transition.' } },

{ id:'rw-expr-08', sec:'rw', dom:'expr', skill:'Transitions', dif:'H', type:'mcq',
  stim:`<p>Early critics dismissed the painter's blurred edges as a failure of technique. Later scholars, studying her letters, concluded that the blurring was deliberate. ______ what one generation read as incompetence, another recognized as innovation.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['Thus,','Instead,','Meanwhile,','Nevertheless,'],
  ans:0,
  exp:{ why:`The final sentence draws a conclusion that summarizes the shift just described, so the summarizing/resulting transition "Thus," is logical.`,
    traps:{ B:'"Instead" would replace the prior idea, but the sentence sums it up.', C:'"Meanwhile" marks simultaneous events, not a conclusion.', D:'"Nevertheless" signals contrast, but this sentence agrees with and generalizes what precedes it.' },
    skill:'Transitions', strat:'A closing sentence that distills the point takes "Thus" or "In short," not a contrast word.' } },

{ id:'rw-expr-09', sec:'rw', dom:'expr', skill:'Transitions', dif:'M', type:'mcq',
  stim:`<p>Bamboo can grow nearly a meter in a single day under ideal conditions. Steel, ______ takes months of industrial processing before it is ready for construction.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['similarly,','by comparison,','as a result,','for example,'],
  ans:1,
  exp:{ why:`The rapid growth of bamboo is set against the slow processing of steel — a comparison highlighting a difference — so "by comparison," fits.`,
    traps:{ A:'"similarly" claims likeness, but the two rates differ sharply.', C:'"as a result" implies causation between the two facts, which does not exist.', D:'"for example" would treat steel as an instance of bamboo’s growth, which is illogical.' },
    skill:'Transitions', strat:'"By comparison" flags a contrast drawn by juxtaposing two measurements.' } },

{ id:'rw-expr-10', sec:'rw', dom:'expr', skill:'Rhetorical Synthesis', dif:'M', type:'mcq',
  stim:`<p>While researching tidal energy, a student took these notes:</p><ul>
    <li>Tidal turbines generate electricity from the movement of ocean tides.</li>
    <li>Tides are highly predictable, unlike wind or sunlight.</li>
    <li>This predictability lets grid operators plan output far in advance.</li>
    <li>Building turbines that withstand seawater is costly.</li></ul>`,
  prompt:`The student wants to emphasize an advantage of tidal energy over other renewables. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
  choices:['Building tidal turbines that withstand seawater is costly, which limits their use.','Unlike wind or sunlight, tides are highly predictable, allowing grid operators to plan output far in advance.','Tidal turbines generate electricity from the movement of ocean tides.','Tidal turbines and wind turbines both convert natural motion into electricity.'],
  ans:1,
  exp:{ why:`The goal is to stress an advantage over other renewables. Predictability "unlike wind or sunlight," enabling advance planning, is precisely such a comparative advantage.`,
    traps:{ A:'Cost is a disadvantage, the opposite of the goal.', C:'This defines tidal energy but names no advantage over other renewables.', D:'This states a similarity, not an advantage.' },
    skill:'Rhetorical Synthesis', strat:'Match the sentence to the stated goal — here an advantage over rivals — and reject notes that are neutral or negative.' } },

{ id:'rw-expr-11', sec:'rw', dom:'expr', skill:'Rhetorical Synthesis', dif:'M', type:'mcq',
  stim:`<p>A student is writing about the sculptor Ruth Asawa. Notes:</p><ul>
    <li>Asawa (1926–2013) was an American artist.</li>
    <li>She is best known for looped-wire hanging sculptures.</li>
    <li>She learned wire-looping techniques from basket makers in Mexico.</li>
    <li>Her sculptures create intricate shadows on gallery walls.</li></ul>`,
  prompt:`The student wants to introduce Ruth Asawa and her signature work to an audience unfamiliar with her. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
  choices:['Ruth Asawa learned techniques from basket makers in Mexico.','Ruth Asawa (1926–2013) was an American artist best known for her looped-wire hanging sculptures.','Ruth Asawa’s sculptures create intricate shadows on gallery walls.','Ruth Asawa was born in 1926 and died in 2013.'],
  ans:1,
  exp:{ why:`An introduction to an unfamiliar audience needs who she was and what she is known for; this pairs her identity ("American artist") with her signature work ("looped-wire hanging sculptures").`,
    traps:{ A:'The Mexico detail is background, not a general introduction to her signature work.', C:'The shadows detail is a specific effect, not an overview.', D:'Bare dates identify her but omit her signature work.' },
    skill:'Rhetorical Synthesis', strat:'For an introduction, choose the sentence combining identity + defining achievement, not a narrow detail.' } },

{ id:'rw-expr-12', sec:'rw', dom:'expr', skill:'Rhetorical Synthesis', dif:'H', type:'mcq',
  stim:`<p>Notes on a study of urban trees:</p><ul>
    <li>Researchers measured summer temperatures on 40 city blocks.</li>
    <li>Blocks with heavy tree cover averaged 5°C cooler than bare blocks.</li>
    <li>Trees cool streets by providing shade and releasing water vapor.</li>
    <li>The study was conducted over a single summer in one city.</li></ul>`,
  prompt:`The student wants to present the study's finding while acknowledging a limitation. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
  choices:['Blocks with heavy tree cover averaged 5°C cooler than bare blocks, though the study covered only one summer in a single city.','Trees cool streets by providing shade and releasing water vapor.','Researchers measured summer temperatures on 40 city blocks in one city.','The study, conducted over a single summer, measured temperatures on 40 blocks.'],
  ans:0,
  exp:{ why:`The goal is finding + limitation. This states the result (5°C cooler) and then acknowledges the limit ("only one summer in a single city").`,
    traps:{ B:'This gives a mechanism, not the finding, and states no limitation.', C:'This describes the method and setting but not the finding or its cooling result.', D:'This notes scope but omits the actual finding (the 5°C difference).' },
    skill:'Rhetorical Synthesis', strat:'When the goal names two elements (finding AND limitation), the answer must contain both.' } },

{ id:'rw-expr-13', sec:'rw', dom:'expr', skill:'Rhetorical Synthesis', dif:'M', type:'mcq',
  stim:`<p>Notes for an article on the honeyguide bird:</p><ul>
    <li>Honeyguide birds lead humans to wild bees’ nests.</li>
    <li>The birds eat wax and larvae left after humans harvest the honey.</li>
    <li>In some regions, people call to the birds with special sounds.</li>
    <li>The birds respond to these calls by flying toward the nests.</li></ul>`,
  prompt:`The student wants to explain the mutually beneficial relationship between the birds and humans. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
  choices:['Honeyguide birds lead humans to bees’ nests and then feed on the wax and larvae the harvesters leave behind.','People in some regions call to honeyguide birds with special sounds.','Honeyguide birds fly toward nests when they hear certain calls.','Honeyguide birds eat wax and larvae.'],
  ans:0,
  exp:{ why:`Mutual benefit means both sides gain. This shows humans getting guided to honey and birds getting the leftover wax and larvae — a two-sided benefit.`,
    traps:{ B:'This describes only the human signal, not the mutual payoff.', C:'This shows the birds’ response but not what each party gains.', D:'This gives only the birds’ benefit, not the human side.' },
    skill:'Rhetorical Synthesis', strat:'"Mutually beneficial" requires the sentence to show what BOTH parties get.' } },

{ id:'rw-expr-14', sec:'rw', dom:'expr', skill:'Rhetorical Synthesis', dif:'M', type:'mcq',
  stim:`<p>Notes on a local history project:</p><ul>
    <li>The Ironton rail depot was built in 1887.</li>
    <li>It served freight trains until it closed in 1962.</li>
    <li>Volunteers restored the building between 2015 and 2019.</li>
    <li>It now houses a museum of regional railroad history.</li></ul>`,
  prompt:`The student wants to emphasize the building's transformation over time. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
  choices:['The Ironton rail depot was built in 1887.','Once a working freight depot that closed in 1962, the Ironton building was restored by volunteers and now houses a railroad museum.','Volunteers restored the Ironton building between 2015 and 2019.','The Ironton rail depot served freight trains until 1962.'],
  ans:1,
  exp:{ why:`Transformation requires before-and-after. This traces the depot from working freight station to closure to restored museum — the full arc of change.`,
    traps:{ A:'A single construction date shows no transformation.', C:'The restoration alone omits what the building became and what it was.', D:'Its freight use alone omits the later change into a museum.' },
    skill:'Rhetorical Synthesis', strat:'For "transformation over time," pick the sentence that spans the earlier state and the later state.' } },

{ id:'rw-expr-15', sec:'rw', dom:'expr', skill:'Transitions', dif:'M', type:'mcq',
  stim:`<p>Most of the volcano's eruptions have been small and slow, releasing lava that residents can easily avoid. Its geologic record, ______ contains evidence of at least two catastrophic explosions in the distant past.</p>`,
  prompt:`Which choice completes the text with the most logical transition?`,
  choices:['though,','so,','likewise,','thus,'],
  ans:0,
  exp:{ why:`The mostly mild eruptions contrast with buried evidence of catastrophic ones, so a concessive contrast — "though," — is logical.`,
    traps:{ B:'"so" signals a result, but the two facts contrast rather than cause each other.', C:'"likewise" claims similarity, yet the events differ in scale.', D:'"thus" draws a conclusion, but this sentence introduces a contrasting fact.' },
    skill:'Transitions', strat:'A hidden or surprising counter-fact to a general pattern takes a concessive transition like "though" or "however."' } },

{ id:'rw-expr-16', sec:'rw', dom:'expr', skill:'Rhetorical Synthesis', dif:'H', type:'mcq',
  stim:`<p>Notes on a materials-science finding:</p><ul>
    <li>A new alloy is as strong as steel but 40% lighter.</li>
    <li>It resists corrosion better than most existing metals.</li>
    <li>Producing it currently costs about three times as much as steel.</li>
    <li>Researchers are testing cheaper production methods.</li></ul>`,
  prompt:`The student wants to make a case that the alloy is promising despite a current drawback. Which choice most effectively uses relevant information from the notes to accomplish this goal?`,
  choices:['Producing the alloy currently costs about three times as much as steel.','As strong as steel yet 40% lighter and highly corrosion-resistant, the alloy is promising, even if it currently costs about three times as much to produce.','The alloy resists corrosion better than most existing metals.','Researchers are testing cheaper ways to produce the new alloy.'],
  ans:1,
  exp:{ why:`"Promising despite a drawback" needs the strengths plus the acknowledged cost. This lists the advantages (strength, lightness, corrosion resistance) and concedes the higher cost.`,
    traps:{ A:'This states only the drawback, not the promise.', C:'This gives one strength but omits both the overall case and the drawback.', D:'This mentions ongoing work but not the alloy’s promise or its current cost.' },
    skill:'Rhetorical Synthesis', strat:'"Promising despite a drawback" needs the strengths AND a concession of the weakness in one sentence.' } },

/* ===================== MATH · ALGEBRA (35%) ===================== */
{ id:'ma-alg-01', sec:'math', dom:'alg', skill:'Linear equations', dif:'E', type:'mcq',
  prompt:`If \\(5(x-2)=3x+4\\), what is the value of \\(x\\)?`,
  choices:['3','7','−3','2'],
  ans:1,
  exp:{ why:`Distribute: 5x − 10 = 3x + 4. Subtract 3x: 2x − 10 = 4. Add 10: 2x = 14, so x = 7.`,
    traps:{ A:'Comes from forgetting to distribute the 5 across both terms in the parentheses.', C:'A sign error when moving −10 across the equals sign.', D:'Dividing 4 by 2 without first collecting the x terms and the constants.' },
    skill:'Linear equations', strat:'Distribute first, then gather variables on one side and constants on the other before dividing.' } },

{ id:'ma-alg-02', sec:'math', dom:'alg', skill:'Linear equations', dif:'E', type:'spr',
  prompt:`Solve for \\(x\\): \\(4x + 9 = x - 3\\).`,
  ans:['-4'],
  exp:{ why:`Subtract x from both sides: 3x + 9 = −3. Subtract 9: 3x = −12. Divide by 3: x = −4.`,
    skill:'Linear equations', strat:'Move all variable terms to one side and constants to the other, then divide.' } },

{ id:'ma-alg-03', sec:'math', dom:'alg', skill:'Linear equations', dif:'M', type:'mcq',
  prompt:`If \\(3a - b = 12\\), which expression gives \\(a\\) in terms of \\(b\\)?`,
  choices:['\\((12 + b)/3\\)','\\((12 - b)/3\\)','\\(12 - 3b\\)','\\((b - 12)/3\\)'],
  ans:0,
  exp:{ why:`Add b to both sides: 3a = 12 + b. Divide by 3: a = (12 + b)/3.`,
    traps:{ B:'Subtracts b instead of adding it when isolating 3a.', C:'Multiplies by 3 and drops the division that isolating a requires.', D:'Reverses the subtraction, giving the negative of the correct numerator.' },
    skill:'Linear equations', strat:'To "solve for a," isolate a with inverse operations; do not plug in numbers.' } },

{ id:'ma-alg-04', sec:'math', dom:'alg', skill:'Linear equations', dif:'M', type:'spr',
  prompt:`A taxi charges a flat fee of $3.00 plus $0.40 per mile. If a ride cost $9.40, how many miles long was the ride?`,
  ans:['16'],
  exp:{ why:`Let m be miles: 3.00 + 0.40m = 9.40. Subtract 3.00: 0.40m = 6.40. Divide: m = 16.`,
    skill:'Linear equations', strat:'Translate the words into cost = flat fee + rate × quantity, then solve for the quantity.' } },

{ id:'ma-alg-05', sec:'math', dom:'alg', skill:'Linear equations', dif:'M', type:'mcq',
  prompt:`The perimeter of a rectangle is given by \\(P = 2L + 2W\\). Which equation correctly solves for \\(L\\)?`,
  choices:['\\(L = P/2 - W\\)','\\(L = P - 2W\\)','\\(L = (P - W)/2\\)','\\(L = 2P - W\\)'],
  ans:0,
  exp:{ why:`Subtract 2W: 2L = P − 2W. Divide every term by 2: L = P/2 − W.`,
    traps:{ B:'Divides only the 2L term, forgetting to divide P − 2W by 2.', C:'Subtracts only one W instead of 2W before dividing.', D:'Multiplies P by 2 instead of dividing, inverting the operation.' },
    skill:'Linear equations', strat:'Isolate the target term, then divide the ENTIRE other side by the coefficient.' } },

{ id:'ma-alg-06', sec:'math', dom:'alg', skill:'Linear equations', dif:'H', type:'mcq',
  prompt:`If \\(2(x + 3) = 14\\), what is the value of \\(4x + 1\\)?`,
  choices:['9','17','25','33'],
  ans:1,
  exp:{ why:`Divide by 2: x + 3 = 7, so x = 4. Then 4x + 1 = 4(4) + 1 = 17.`,
    traps:{ A:'Uses x = 2 (from dividing 14 by 2 without subtracting 3) giving 4(2)+1.', C:'Uses x = 6, mis-solving the first equation.', D:'Uses x = 8, treating 2(x+3) as 2x·3 or similar.' },
    skill:'Linear equations', strat:'Solve for x fully, then substitute into the requested expression — do not stop at x.' } },

{ id:'ma-alg-07', sec:'math', dom:'alg', skill:'Linear functions', dif:'E', type:'mcq',
  prompt:`A line passes through the points \\((1, 2)\\) and \\((4, 11)\\). What is the slope of the line?`,
  choices:['3','\\(1/3\\)','9','−3'],
  ans:0,
  exp:{ why:`Slope = (11 − 2)/(4 − 1) = 9/3 = 3.`,
    traps:{ B:'Inverts the slope formula, dividing the change in x by the change in y.', C:'Uses only the change in y (11 − 2) and forgets to divide by the change in x.', D:'A sign error in one of the subtractions.' },
    skill:'Linear functions', strat:'Slope = (y₂ − y₁)/(x₂ − x₁); keep the coordinates in the same order top and bottom.' } },

{ id:'ma-alg-08', sec:'math', dom:'alg', skill:'Linear functions', dif:'M', type:'mcq',
  stim:`<p>A candle's height, in centimeters, after burning for \\(t\\) hours is modeled by \\(h = 12 - 1.5t\\).</p>`,
  prompt:`Which statement best interprets the number 1.5 in this model?`,
  choices:['The candle is 1.5 centimeters tall when first lit.','The candle burns down by 1.5 centimeters each hour.','The candle takes 1.5 hours to burn out completely.','The candle starts at a height of 1.5 centimeters.'],
  ans:1,
  exp:{ why:`In h = 12 − 1.5t, the coefficient of t is the rate of change: the height decreases by 1.5 cm for each additional hour.`,
    traps:{ A:'12, the constant, is the starting height, not 1.5.', C:'Burnout time comes from setting h = 0 (t = 8 hours), not from the coefficient.', D:'Confuses the rate 1.5 with a starting height, which is 12.' },
    skill:'Linear functions', strat:'In y = b + mt, the slope m is the per-unit rate of change; the constant b is the starting value.' } },

{ id:'ma-alg-09', sec:'math', dom:'alg', skill:'Linear functions', dif:'M', type:'spr',
  prompt:`The function \\(f\\) is defined by \\(f(x) = 2x - 7\\). For what value of \\(x\\) does \\(f(x) = 5\\)?`,
  ans:['6'],
  exp:{ why:`Set 2x − 7 = 5. Add 7: 2x = 12. Divide: x = 6.`,
    skill:'Linear functions', strat:'"For what x does f(x) = k" means set the expression equal to k and solve.' } },

{ id:'ma-alg-10', sec:'math', dom:'alg', skill:'Linear functions', dif:'M', type:'mcq',
  prompt:`A line has slope \\(-2\\) and passes through the point \\((3, 4)\\). Which is the equation of the line?`,
  choices:['\\(y = -2x + 10\\)','\\(y = -2x + 4\\)','\\(y = 2x - 2\\)','\\(y = -2x - 2\\)'],
  ans:0,
  exp:{ why:`Use point-slope: y − 4 = −2(x − 3) → y − 4 = −2x + 6 → y = −2x + 10.`,
    traps:{ B:'Uses the point’s y-value 4 as the y-intercept, skipping the point-slope substitution.', C:'Uses +2 for the slope, ignoring the given negative sign.', D:'A sign error distributing −2(x − 3), giving −6 instead of +6.' },
    skill:'Linear functions', strat:'Plug the slope and point into y − y₁ = m(x − x₁), then simplify to slope-intercept form.' } },

{ id:'ma-alg-11', sec:'math', dom:'alg', skill:'Linear functions', dif:'H', type:'mcq',
  stim:`<p>A gym models the total cost of a membership, in dollars, as \\(C = 25m + 50\\), where \\(m\\) is the number of months.</p>`,
  prompt:`What does the number 50 most likely represent in this model?`,
  choices:['The monthly membership fee','A one-time initiation fee charged regardless of the number of months','The total cost after 50 months','The number of months in the membership'],
  ans:1,
  exp:{ why:`50 is the constant term — the cost when m = 0 — so it is a fixed, one-time charge (an initiation fee) that applies before any monthly fees.`,
    traps:{ A:'The monthly fee is the slope, 25, not the constant 50.', C:'The cost after 50 months would be 25(50) + 50 = 1300, not 50.', D:'50 is a dollar amount, not a count of months.' },
    skill:'Linear functions', strat:'The y-intercept (value at input 0) is the up-front, fixed amount in a cost model.' } },

{ id:'ma-alg-12', sec:'math', dom:'alg', skill:'Linear functions', dif:'M', type:'mcq',
  stim:`<p>The table shows several values of a linear function \\(f\\).</p>
    <table><tr><th>\\(x\\)</th><th>1</th><th>2</th><th>3</th></tr>
    <tr><th>\\(f(x)\\)</th><td>5</td><td>8</td><td>11</td></tr></table>`,
  prompt:`Which equation defines \\(f(x)\\)?`,
  choices:['\\(f(x) = 3x + 2\\)','\\(f(x) = 3x + 5\\)','\\(f(x) = 5x - 3\\)','\\(f(x) = 2x + 3\\)'],
  ans:0,
  exp:{ why:`Each step of 1 in x raises f(x) by 3, so the slope is 3. Using x = 1, f(1) = 5: 5 = 3(1) + b → b = 2. So f(x) = 3x + 2.`,
    traps:{ B:'Uses the first output 5 as the intercept without solving for b.', C:'Uses slope 5, misreading the constant difference between outputs.', D:'Swaps slope and intercept (2 and 3).' },
    skill:'Linear functions', strat:'Find slope from the constant output difference, then solve for b using any (x, f(x)) pair.' } },

{ id:'ma-alg-13', sec:'math', dom:'alg', skill:'Systems of equations', dif:'E', type:'mcq',
  prompt:`If \\(x + y = 10\\) and \\(x - y = 4\\), what is the value of \\(x\\)?`,
  choices:['3','5','7','10'],
  ans:2,
  exp:{ why:`Add the two equations: (x + y) + (x − y) = 10 + 4 → 2x = 14 → x = 7.`,
    traps:{ A:'This is y (found after x), not x.', B:'Comes from averaging 10 and 4 incorrectly or a sign slip.', D:'Uses the sum 10 as x without eliminating y.' },
    skill:'Systems of equations', strat:'When variables have opposite coefficients, add the equations to eliminate one instantly.' } },

{ id:'ma-alg-14', sec:'math', dom:'alg', skill:'Systems of equations', dif:'M', type:'spr',
  prompt:`If \\(3x + y = 10\\) and \\(x - y = 2\\), what is the value of \\(x\\)?`,
  ans:['3'],
  exp:{ why:`Add the equations: 4x = 12, so x = 3. (Then y = 1.)`,
    skill:'Systems of equations', strat:'Adding eliminates y because its coefficients are +1 and −1.' } },

{ id:'ma-alg-15', sec:'math', dom:'alg', skill:'Systems of equations', dif:'M', type:'mcq',
  stim:`<p>A theater sold 200 tickets for a show. Adult tickets cost $12 each and child tickets cost $8 each. The total revenue was $2,080.</p>`,
  prompt:`How many adult tickets were sold?`,
  choices:['80','100','120','140'],
  ans:2,
  exp:{ why:`Let a = adult, c = child. a + c = 200 and 12a + 8c = 2080. Multiply the first by 8: 8a + 8c = 1600. Subtract: 4a = 480, so a = 120.`,
    traps:{ A:'This is the number of child tickets (c = 80), not adult.', B:'Comes from splitting 200 evenly, ignoring the revenue equation.', D:'An arithmetic slip in the elimination step.' },
    skill:'Systems of equations', strat:'Write a count equation and a value equation, then eliminate the variable you are not asked about.' } },

{ id:'ma-alg-16', sec:'math', dom:'alg', skill:'Systems of equations', dif:'H', type:'mcq',
  prompt:`For what value of \\(k\\) does the system \\(kx + 6y = 8\\) and \\(2x + 3y = 5\\) have NO solution?`,
  choices:['2','3','4','6'],
  ans:2,
  exp:{ why:`No solution means the lines are parallel: equal coefficient ratios but a different constant ratio. Set k/2 = 6/3 = 2, so k = 4. Check constants: 8/5 ≠ 2, confirming parallel (not identical) lines.`,
    traps:{ A:'Sets k equal to the coefficient 2 rather than matching the ratio 6/3.', B:'Uses the coefficient 3 from the second equation directly.', D:'Uses 6 (the y-coefficient) as k without forming the ratio.' },
    skill:'Systems of equations', strat:'Parallel (no solution): coefficient ratios equal, constant ratio different. Identical (infinite): all three equal.' } },

{ id:'ma-alg-17', sec:'math', dom:'alg', skill:'Systems of equations', dif:'M', type:'mcq',
  prompt:`The system \\(y = 2x + 1\\) and \\(4x - 2y = c\\) has infinitely many solutions. What is the value of \\(c\\)?`,
  choices:['−2','2','1','0'],
  ans:0,
  exp:{ why:`Substitute y = 2x + 1 into 4x − 2y: 4x − 2(2x + 1) = 4x − 4x − 2 = −2. For infinitely many solutions the equation must hold for all x, so c = −2.`,
    traps:{ B:'A sign error on the −2 term from distributing −2.', C:'Uses the constant 1 from the first equation directly.', D:'Assumes the constant is 0 without substituting.' },
    skill:'Systems of equations', strat:'Infinitely many solutions means the second equation is a multiple of the first — substitute and force an identity.' } },

{ id:'ma-alg-18', sec:'math', dom:'alg', skill:'Systems of equations', dif:'H', type:'spr',
  prompt:`If \\(x + 2y = 7\\) and \\(3x - y = 7\\), what is the value of \\(x + y\\)?`,
  ans:['5'],
  exp:{ why:`From the first, x = 7 − 2y. Substitute: 3(7 − 2y) − y = 7 → 21 − 7y = 7 → y = 2, so x = 3. Then x + y = 5.`,
    skill:'Systems of equations', strat:'Solve for both variables, then combine as the question asks (here, the sum).' } },

{ id:'ma-alg-19', sec:'math', dom:'alg', skill:'Linear inequalities', dif:'E', type:'mcq',
  prompt:`Which of the following describes all solutions to \\(-3x + 5 > 14\\)?`,
  choices:['\\(x < -3\\)','\\(x > -3\\)','\\(x < 3\\)','\\(x > 3\\)'],
  ans:0,
  exp:{ why:`Subtract 5: −3x > 9. Divide by −3 and flip the inequality: x < −3.`,
    traps:{ B:'Forgets to flip the inequality sign when dividing by a negative.', C:'Drops the negative sign on the solution.', D:'Both keeps the wrong direction and the wrong sign.' },
    skill:'Linear inequalities', strat:'Dividing or multiplying an inequality by a negative reverses the inequality sign.' } },

{ id:'ma-alg-20', sec:'math', dom:'alg', skill:'Linear inequalities', dif:'M', type:'mcq',
  stim:`<p>A student has $50 and wants to buy notebooks that cost $4 each while keeping at least $10 for other supplies.</p>`,
  prompt:`What is the greatest number of notebooks the student can buy?`,
  choices:['8','9','10','12'],
  ans:2,
  exp:{ why:`Money spent must leave at least $10: 50 − 4n ≥ 10 → 40 ≥ 4n → n ≤ 10. The greatest whole number is 10.`,
    traps:{ A:'Over-reserves money, perhaps requiring $18 left over.', B:'Rounds down unnecessarily from a correct n ≤ 10.', D:'Ignores the $10 reserve and spends the full $50 (12.5 → 12).' },
    skill:'Linear inequalities', strat:'Translate "at least $10 left" into (money − cost) ≥ 10, solve, then take the largest allowed integer.' } },

{ id:'ma-alg-21', sec:'math', dom:'alg', skill:'Linear inequalities', dif:'M', type:'mcq',
  prompt:`Which value of \\(x\\) satisfies BOTH \\(2x - 1 \\le 3\\) and \\(x + 4 > 2\\)?`,
  choices:['−3','2','3','4'],
  ans:1,
  exp:{ why:`First: 2x − 1 ≤ 3 → x ≤ 2. Second: x + 4 > 2 → x > −2. The overlap is −2 < x ≤ 2, and only 2 lies in that range.`,
    traps:{ A:'−3 fails x > −2.', C:'3 fails x ≤ 2.', D:'4 fails x ≤ 2.' },
    skill:'Linear inequalities', strat:'Solve each inequality, intersect the solution sets, then test the choices against the combined range.' } },

{ id:'ma-alg-22', sec:'math', dom:'alg', skill:'Linear inequalities', dif:'H', type:'mcq',
  prompt:`Which describes all values of \\(x\\) that satisfy \\(-2 \\le 3 - x < 5\\)?`,
  choices:['\\(-2 < x \\le 5\\)','\\(-2 \\le x < 5\\)','\\(-5 < x \\le 2\\)','\\(x \\le 5\\)'],
  ans:0,
  exp:{ why:`Subtract 3 from all parts: −5 ≤ −x < 2. Multiply by −1 and flip both inequalities: 5 ≥ x > −2, which is −2 < x ≤ 5.`,
    traps:{ B:'Fails to swap the endpoints’ open/closed status when multiplying by −1.', C:'Forgets to subtract 3 before flipping signs.', D:'Solves only one side of the compound inequality.' },
    skill:'Linear inequalities', strat:'In a compound inequality, apply each step to all three parts; multiplying by −1 flips BOTH signs and endpoint inclusivity.' } },

{ id:'ma-alg-23', sec:'math', dom:'alg', skill:'Linear equations', dif:'M', type:'spr',
  prompt:`The variable \\(y\\) is directly proportional to \\(x\\). If \\(y = 15\\) when \\(x = 6\\), what is \\(y\\) when \\(x = 10\\)?`,
  ans:['25'],
  exp:{ why:`Direct proportion: y = kx. From 15 = k(6), k = 2.5. Then y = 2.5(10) = 25.`,
    skill:'Linear equations', strat:'Direct proportion means y = kx; find k from the given pair, then apply it.' } },

{ id:'ma-alg-24', sec:'math', dom:'alg', skill:'Linear functions', dif:'M', type:'mcq',
  prompt:`A line is parallel to \\(y = 3x - 4\\) and passes through the point \\((0, 2)\\). What is its equation?`,
  choices:['\\(y = 3x + 2\\)','\\(y = -\\tfrac{1}{3}x + 2\\)','\\(y = 3x - 4\\)','\\(y = 2x + 3\\)'],
  ans:0,
  exp:{ why:`Parallel lines share a slope, so the slope is 3. The line crosses (0, 2), making 2 the y-intercept: y = 3x + 2.`,
    traps:{ B:'Uses the perpendicular (negative-reciprocal) slope instead of the parallel slope.', C:'Reuses the original line’s intercept −4 rather than passing through (0, 2).', D:'Swaps slope and intercept.' },
    skill:'Linear functions', strat:'Parallel ⇒ same slope; perpendicular ⇒ negative reciprocal slope. Then use the given point for b.' } },

{ id:'ma-alg-25', sec:'math', dom:'alg', skill:'Systems of equations', dif:'M', type:'mcq',
  prompt:`If \\(5x + 2y = 16\\) and \\(3x - 2y = 8\\), what is the value of \\(x\\)?`,
  choices:['2','3','4','8'],
  ans:1,
  exp:{ why:`Add the equations to eliminate y: 8x = 24, so x = 3.`,
    traps:{ A:'An arithmetic slip dividing 24 by 8.', C:'Comes from adding 16 and 8 to get 24 but dividing by 6.', D:'Uses the sum 24 divided by 3, or the constant 8 directly.' },
    skill:'Systems of equations', strat:'Opposite y-coefficients (+2 and −2) mean adding the equations eliminates y at once.' } },

{ id:'ma-alg-26', sec:'math', dom:'alg', skill:'Linear inequalities', dif:'M', type:'spr',
  prompt:`An event planner's budget requires that \\(25g + 300 \\le 2000\\), where \\(g\\) is the number of guests. What is the greatest number of guests allowed?`,
  ans:['68'],
  exp:{ why:`Subtract 300: 25g ≤ 1700. Divide by 25: g ≤ 68. The greatest whole number of guests is 68.`,
    skill:'Linear inequalities', strat:'Isolate the variable, then take the largest integer that satisfies a "≤" bound.' } },

{ id:'ma-adv-01', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'E', type:'mcq',
  prompt:`What are the solutions to \\(x^2 - 5x + 6 = 0\\)?`,
  choices:['\\(x = 2\\) and \\(x = 3\\)','\\(x = -2\\) and \\(x = -3\\)','\\(x = 1\\) and \\(x = 6\\)','\\(x = 2\\) and \\(x = -3\\)'],
  ans:0,
  exp:{ why:`Factor: x² − 5x + 6 = (x − 2)(x − 3) = 0, so x = 2 or x = 3.`,
    traps:{ B:'Uses the wrong signs; (x + 2)(x + 3) expands to x² + 5x + 6, not the given trinomial.', C:'Uses factors of 6 that sum to 7, not 5.', D:'Mixed signs give a −6 constant term, not +6.' },
    skill:'Quadratics & nonlinear', strat:'Find two numbers that multiply to the constant and add to the middle coefficient.' } },

{ id:'ma-adv-02', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'E', type:'spr',
  prompt:`If \\(x^2 = 49\\) and \\(x > 0\\), what is the value of \\(x\\)?`,
  ans:['7'],
  exp:{ why:`x² = 49 gives x = ±7; since x > 0, x = 7.`,
    skill:'Quadratics & nonlinear', strat:'Take the square root of both sides and apply any sign restriction given.' } },

{ id:'ma-adv-03', sec:'math', dom:'adv', skill:'Equivalent expressions', dif:'M', type:'mcq',
  prompt:`Which expression is equivalent to \\((x + 4)(x - 3)\\)?`,
  choices:['\\(x^2 + x - 12\\)','\\(x^2 - x - 12\\)','\\(x^2 + 7x - 12\\)','\\(x^2 + x + 12\\)'],
  ans:0,
  exp:{ why:`FOIL: x·x + x·(−3) + 4·x + 4·(−3) = x² − 3x + 4x − 12 = x² + x − 12.`,
    traps:{ B:'Reverses the sign of the middle term by mishandling +4x − 3x.', C:'Adds the outer and inner terms as 4 + 3 instead of 4 − 3.', D:'Keeps the constant positive, forgetting 4·(−3) = −12.' },
    skill:'Equivalent expressions', strat:'FOIL carefully and combine the outer and inner products with their signs.' } },

{ id:'ma-adv-04', sec:'math', dom:'adv', skill:'Equivalent expressions', dif:'M', type:'mcq',
  prompt:`Which is a factored form of \\(2x^2 + 7x + 3\\)?`,
  choices:['\\((2x + 1)(x + 3)\\)','\\((2x + 3)(x + 1)\\)','\\((2x - 1)(x - 3)\\)','\\((x + 1)(x + 3)\\)'],
  ans:0,
  exp:{ why:`(2x + 1)(x + 3) = 2x² + 6x + x + 3 = 2x² + 7x + 3, matching the trinomial.`,
    traps:{ B:'(2x + 3)(x + 1) = 2x² + 5x + 3 — wrong middle term.', C:'Negative factors give +3 but a −7x middle term.', D:'Ignores the leading coefficient 2, so it cannot produce 2x².' },
    skill:'Equivalent expressions', strat:'When a ≠ 1, test factor pairs by expanding to check the middle term.' } },

{ id:'ma-adv-05', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'M', type:'mcq',
  prompt:`What is the vertex of the parabola \\(y = x^2 - 6x + 5\\)?`,
  choices:['\\((3, -4)\\)','\\((-3, -4)\\)','\\((3, 5)\\)','\\((6, 5)\\)'],
  ans:0,
  exp:{ why:`The x-coordinate of the vertex is −b/(2a) = 6/2 = 3. Then y = 3² − 6(3) + 5 = 9 − 18 + 5 = −4, giving (3, −4).`,
    traps:{ B:'Uses +b/(2a) sign error, giving x = −3.', C:'Uses the constant 5 as the y-value without substituting x = 3.', D:'Uses b = 6 directly as the x-coordinate.' },
    skill:'Quadratics & nonlinear', strat:'Vertex x = −b/(2a); substitute back to get the y-coordinate.' } },

{ id:'ma-adv-06', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'M', type:'spr',
  prompt:`What is the minimum value of \\(y = x^2 - 6x + 5\\)?`,
  ans:['-4'],
  exp:{ why:`The parabola opens upward, so its minimum is the vertex y-value. At x = −b/(2a) = 3, y = 9 − 18 + 5 = −4.`,
    skill:'Quadratics & nonlinear', strat:'For an upward parabola, the minimum equals the y-coordinate of the vertex.' } },

{ id:'ma-adv-07', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'H', type:'mcq',
  prompt:`For what value of \\(c\\) does \\(x^2 + 4x + c = 0\\) have exactly one real solution?`,
  choices:['2','4','8','16'],
  ans:1,
  exp:{ why:`Exactly one solution means the discriminant b² − 4ac = 0: 4² − 4(1)c = 16 − 4c = 0, so c = 4.`,
    traps:{ A:'Divides 16 by 8 instead of 4.', C:'Uses 16 − 2c = 0 by mis-forming the discriminant.', D:'Sets c = b² = 16 without dividing by 4a.' },
    skill:'Quadratics & nonlinear', strat:'One repeated solution ⇔ discriminant equals zero. Set b² − 4ac = 0 and solve.' } },

{ id:'ma-adv-08', sec:'math', dom:'adv', skill:'Equivalent expressions', dif:'H', type:'spr',
  prompt:`If \\(x + y = 8\\) and \\(x - y = 3\\), what is the value of \\(x^2 - y^2\\)?`,
  ans:['24'],
  exp:{ why:`x² − y² = (x + y)(x − y) = 8 · 3 = 24 — no need to find x and y separately.`,
    skill:'Equivalent expressions', strat:'Recognize x² − y² as a difference of squares to reuse the given sums directly.' } },

{ id:'ma-adv-09', sec:'math', dom:'adv', skill:'Exponential & rational', dif:'M', type:'mcq',
  stim:`<p>A colony of 500 microbes doubles in number every 3 hours.</p>`,
  prompt:`Which function models the number of microbes, \\(N\\), after \\(t\\) hours?`,
  choices:['\\(N = 500 \\cdot 2^{\\,t/3}\\)','\\(N = 500 \\cdot 2^{\\,3t}\\)','\\(N = 500 + 2t/3\\)','\\(N = 500 \\cdot 3^{\\,t/2}\\)'],

{ id:'ma-adv-10', sec:'math', dom:'adv', skill:'Exponential & rational', dif:'M', type:'mcq',
  stim:`<p>A car purchased for $20,000 loses 15% of its value each year.</p>`,
  prompt:`Which function gives the car's value, \\(V\\), after \\(t\\) years?`,

{ id:'ma-adv-11', sec:'math', dom:'adv', skill:'Exponential & rational', dif:'H', type:'spr',
  prompt:`If \\(3^x = 81\\), what is the value of \\(x\\)?`,
  ans:['4'],

{ id:'ma-adv-12', sec:'math', dom:'adv', skill:'Exponential & rational', dif:'M', type:'mcq',
  prompt:`For \\(x \\neq 2\\), which expression is equivalent to \\(\\dfrac{x^2 - 4}{x - 2}\\)?`,
  choices:['\\(x + 2\\)','\\(x - 2\\)','\\(x^2 - 2\\)','\\(2\\)'],

  exp:{ why:`Factor the numerator as a difference of squares: (x − 2)(x + 2)/(x − 2) = x + 2 (for x ≠ 2).`,

    skill:'Exponential & rational', strat:'Factor numerator and denominator, then cancel the common factor.' } },

{ id:'ma-adv-13', sec:'math', dom:'adv', skill:'Nonlinear functions', dif:'H', type:'mcq',
  prompt:`What is the solution to \\(\\sqrt{x + 6} = x\\)?`,
  choices:['\\(x = 3\\) only','\\(x = -2\\) only','\\(x = 3\\) and \\(x = -2\\)','No solution'],
  ans:0,
  exp:{ why:`Square both sides: x + 6 = x² → x² − x − 6 = 0 → (x − 3)(x + 2) = 0, giving x = 3 or x = −2. Check: √9 = 3 ✓, but √4 = 2 ≠ −2, so x = −2 is extraneous. Only x = 3 works.`,
    traps:{ B:'Keeps the extraneous root and discards the valid one.', C:'Fails to check both roots against the original equation.', D:'Assumes squaring created no valid solution at all.' },
    skill:'Nonlinear functions', strat:'After squaring, always substitute each candidate back — squaring can introduce extraneous roots.' } },

{ id:'ma-adv-14', sec:'math', dom:'adv', skill:'Nonlinear functions', dif:'M', type:'spr',
  prompt:`The function \\(f\\) is defined by \\(f(x) = x^2 + 1\\). What is the value of \\(f(-3)\\)?`,

  exp:{ why:`f(−3) = (−3)² + 1 = 9 + 1 = 10. Note (−3)² is positive 9.`,

{ id:'ma-adv-15', sec:'math', dom:'adv', skill:'Nonlinear functions', dif:'M', type:'mcq',
  prompt:`What is the vertex of the graph of \\(y = (x - 2)^2 + 3\\)?`,
  choices:['\\((2, 3)\\)','\\((-2, 3)\\)','\\((2, -3)\\)','\\((3, 2)\\)'],
  ans:0,
  exp:{ why:`In vertex form y = a(x − h)² + k, the vertex is (h, k). Here h = 2 and k = 3, so the vertex is (2, 3).`,

    skill:'Nonlinear functions', strat:'In y = a(x − h)² + k, read the vertex directly as (h, k), watching the sign inside the parentheses.' } },

{ id:'ma-adv-16', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'M', type:'mcq',
  stim:`<p>A ball is thrown upward, and its height in feet after \\(t\\) seconds is \\(h = -16t^2 + 32t\\).</p>`,
  prompt:`After how many seconds does the ball return to the ground (\\(h = 0\\))?`,
  choices:['1','2','16','32'],
  ans:1,
  exp:{ why:`Set h = 0: −16t² + 32t = 0 → −16t(t − 2) = 0 → t = 0 or t = 2. The ball lands at t = 2 seconds (t = 0 is the launch).`,
    traps:{ A:'t = 1 is when the ball reaches its peak height, not the ground.', C:'Uses the coefficient 16 rather than solving for t.', D:'Uses the coefficient 32 rather than solving.' },
    skill:'Quadratics & nonlinear', strat:'Ground level means h = 0; factor out t and take the nonzero root for landing time.' } },

{ id:'ma-adv-17', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'H', type:'mcq',
  stim:`<p>A ball's height in feet after \\(t\\) seconds is \\(h = -16t^2 + 32t\\).</p>`,
  prompt:`What is the maximum height, in feet, that the ball reaches?`,
  choices:['8','16','24','32'],
  ans:1,
  exp:{ why:`Max height is at the vertex: t = −b/(2a) = −32/(2·−16) = 1 second. Then h = −16(1)² + 32(1) = 16 feet.`,
    traps:{ A:'Uses t = 0.5 by mis-computing the vertex time.', C:'Adds 8 + 16 or similar arithmetic slip.', D:'Uses the coefficient 32 as the height without evaluating.' },
    skill:'Quadratics & nonlinear', strat:'Peak of a projectile is the vertex; find t = −b/(2a), then evaluate h at that t.' } },

{ id:'ma-adv-18', sec:'math', dom:'adv', skill:'Equivalent expressions', dif:'H', type:'mcq',
  prompt:`Which expression is equivalent to \\((2x^2 + 3x) - (x^2 - 5x + 4)\\)?`,

    skill:'Equivalent expressions', strat:'Distribute the subtraction to EVERY term in the second polynomial before combining like terms.' } },

{ id:'ma-adv-19', sec:'math', dom:'adv', skill:'Exponential & rational', dif:'M', type:'spr',
  prompt:`A sample starts with 800 bacteria and triples every hour. How many bacteria are there after 2 hours?`,
  ans:['7200'],

{ id:'ma-adv-20', sec:'math', dom:'adv', skill:'Equivalent expressions', dif:'M', type:'mcq',
  prompt:`Which is equivalent to \\(x^{1/2} \\cdot x^{3/2}\\) for \\(x > 0\\)?`,

{ id:'ma-adv-21', sec:'math', dom:'adv', skill:'Nonlinear functions', dif:'H', type:'spr',
  prompt:`The function \\(f\\) is defined by \\(f(x) = x^2 - 4\\). If \\(f(a) = 12\\) and \\(a > 0\\), what is the value of \\(a\\)?`,

{ id:'ma-adv-22', sec:'math', dom:'adv', skill:'Exponential & rational', dif:'M', type:'mcq',
  prompt:`For what value of \\(x\\) is \\(\\dfrac{x - 5}{x + 2} = 0\\)?`,

    skill:'Exponential & rational', strat:'A rational expression is zero when the numerator is zero and the denominator is nonzero.' } },

{ id:'ma-adv-23', sec:'math', dom:'adv', skill:'Quadratics & nonlinear', dif:'M', type:'mcq',
  prompt:`What is the product of the solutions to \\(x^2 - 7x + 10 = 0\\)?`,

{ id:'ma-adv-24', sec:'math', dom:'adv', skill:'Exponential & rational', dif:'H', type:'mcq',

{ id:'ma-adv-25', sec:'math', dom:'adv', skill:'Equivalent expressions', dif:'M', type:'mcq',
  prompt:`Which is the complete factorization of \\(3x^2 - 12\\)?`,
  choices:['\\(3(x - 2)(x + 2)\\)','\\((3x - 6)(x + 2)\\)','\\(3(x^2 - 4)\\)','\\((x - 2)(x + 2)\\)'],

{ id:'ma-adv-26', sec:'math', dom:'adv', skill:'Nonlinear functions', dif:'M', type:'spr',

{ id:'ma-psda-01', sec:'math', dom:'psda', skill:'Ratios, rates & proportions', dif:'E', type:'mcq',

{ id:'ma-psda-03', sec:'math', dom:'psda', skill:'Percentages', dif:'M', type:'mcq',

{ id:'ma-psda-04', sec:'math', dom:'psda', skill:'Percentages', dif:'M', type:'spr',

{ id:'ma-psda-05', sec:'math', dom:'psda', skill:'Ratios, rates & proportions', dif:'M', type:'mcq',

{ id:'ma-psda-06', sec:'math', dom:'psda', skill:'Data & statistics', dif:'M', type:'mcq',

{ id:'ma-psda-07', sec:'math', dom:'psda', skill:'Data & statistics', dif:'H', type:'mcq',

{ id:'ma-psda-08', sec:'math', dom:'psda', skill:'Data & statistics', dif:'M', type:'mcq',

{ id:'ma-psda-09', sec:'math', dom:'psda', skill:'Probability', dif:'M', type:'mcq',

{ id:'ma-psda-10', sec:'math', dom:'psda', skill:'Probability', dif:'M', type:'spr',

{ id:'ma-psda-11', sec:'math', dom:'psda', skill:'Ratios, rates & proportions', dif:'M', type:'spr',

{ id:'ma-geo-06', sec:'math', dom:'geo', skill:'Lines, angles & triangles', dif:'M', type:'mcq',

{ id:'ma-geo-07', sec:'math', dom:'geo', skill:'Right-triangle trig', dif:'M', type:'mcq',

{ id:'ma-geo-09', sec:'math', dom:'geo', skill:'Right-triangle trig', dif:'H', type:'mcq',

  ans:0,
  exp:{ why:`Sine = opposite / hypotenuse = 6 / 10 = 0.6.`,
    traps:{ B:'Uses the adjacent side (8) over hypotenuse — that is cosine, not sine.', C:'Computes opposite/adjacent (6/8) — that is tangent.', D:'Inverts the ratio, using hypotenuse/opposite.' },
    skill:'Right-triangle trig', strat:'SOH: sine = opposite ÷ hypotenuse. Keep the ratio right-side up.' } },

{ id:'ma-geo-10', sec:'math', dom:'geo', skill:'Circles', dif:'M', type:'mcq',
  stim:`<p>A circle has a radius of 5.</p>`,
  prompt:`What is the area of the circle?`,
  choices:['\\(25\\pi\\)','\\(10\\pi\\)','\\(5\\pi\\)','\\(100\\pi\\)'],
  ans:0,
  exp:{ why:`Area of a circle = π r² = π (5)² = 25π.`,
    traps:{ B:'Computes the circumference (2πr = 10π) instead of the area.', C:'Uses π r without squaring.', D:'Squares the diameter (10² ) instead of the radius.' },
    skill:'Circles', strat:'Circle area = π r² (square the radius); circumference = 2 π r.' } },

{ id:'ma-geo-11', sec:'math', dom:'geo', skill:'Circles', dif:'M', type:'spr',
  stim:`<p>A circle has a circumference of \\(12\\pi\\).</p>`,
  prompt:`What is the radius of the circle?`,
  ans:['6'],
  exp:{ why:`Circumference = 2 π r, so 2 π r = 12π gives r = 6.`,
    skill:'Circles', strat:'Divide the circumference by 2π to recover the radius.' } },

/* ===================== SET 2 — agent-authored, validated (140 items) ===================== */
{"id":"s2-rw-craft-01","sec":"rw","dom":"craft","skill":"Words in Context","dif":"E","type":"mcq","stim":"<p>The octopus is remarkably ______: within seconds it can shift the color and texture of its skin to match a jagged rock, a patch of coral, or the smooth, sandy seafloor, vanishing before a predator can fix on its shape.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["predictable","reluctant","adaptable","permanent"],"ans":2,"exp":{"why":"The sentence describes an animal that can change its color and texture within seconds to match very different backgrounds. The blank needs a word meaning able to change to suit circumstances, and adaptable captures exactly that flexibility.","traps":{"A":"Opposite in spirit: rapid, situation-driven change is the reverse of predictable.","B":"Reluctant conveys unwillingness, not the swift ability to change the passage describes.","D":"Permanent contradicts the quick, repeated transformations the octopus performs."},"skill":"Words in Context","strat":"Let the concrete details after the blank define the trait the missing word must name."}},
{"id":"s2-rw-craft-02","sec":"rw","dom":"craft","skill":"Words in Context","dif":"E","type":"mcq","stim":"<p>Rivera's murals were anything but ______; each enormous wall teemed with dozens of figures, layered scenes, and blazing colors that pulled the viewer's eye in every direction at once.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["lively","sparse","crowded","modern"],"ans":1,"exp":{"why":"The phrase anything but signals that the blank is the opposite of the crowded scene described. Because the walls teemed with dozens of figures, the murals were anything but sparse.","traps":{"A":"The murals were lively, so saying they were anything but lively would wrongly deny their energy.","C":"Crowded describes the murals accurately, but anything but requires the opposite word.","D":"Modern is unrelated to the visual density the sentence emphasizes."},"skill":"Words in Context","strat":"When a sentence says anything but, the blank must be the reverse of the description that follows."}},
{"id":"s2-rw-craft-03","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>Although the treaty was celebrated across Europe as a triumph of patient diplomacy, its terms proved so ______ that within a single decade the rival nations were once again massing troops along the border.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["durable","generous","precarious","elaborate"],"ans":2,"exp":{"why":"Although sets up a contrast between the celebrated treaty and its actual instability, which is shown by renewed war within a decade. Precarious captures that fragile, unstable quality.","traps":{"A":"Durable is the opposite; a durable treaty would not collapse into war so quickly.","B":"Generous describes the terms favorably and misses the failure the sentence stresses.","D":"Elaborate refers to complexity, not the instability that led to renewed conflict."},"skill":"Words in Context","strat":"A contrast word like although tells you the blank clashes with the positive framing before it."}},
{"id":"s2-rw-craft-04","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>The senator was known for her ______ approach to lawmaking: rather than pushing sweeping reforms that might collapse under their own weight, she preferred small, incremental bills that were easier to pass and harder to repeal.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["reckless","hostile","theatrical","measured"],"ans":3,"exp":{"why":"The contrast with sweeping reforms and the stated preference for small, incremental bills point to a careful, restrained style. Measured names that cautious, deliberate method.","traps":{"A":"Reckless is the opposite of the caution her incremental strategy shows.","B":"Hostile describes antagonism, not a legislative style built on restraint.","C":"Theatrical suggests showiness, clashing with her quiet, gradual method."},"skill":"Words in Context","strat":"Read the rather than clause as a definition of the missing character trait."}},
{"id":"s2-rw-craft-05","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>To early sky-watchers, Mars seemed ______: its brightness and its position among the stars shifted so unpredictably from season to season that several cultures came to link the reddish planet with disorder and war.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["dim","erratic","stationary","invisible"],"ans":1,"exp":{"why":"The passage says the planet's brightness and position shifted unpredictably, and the cultural link to disorder reinforces this. Erratic precisely names that irregular, unpredictable behavior.","traps":{"A":"Mars is described as bright, and dim ignores the unpredictability that is the point.","C":"Stationary contradicts the shifting position the sentence describes.","D":"Invisible is impossible, since observers watched the planet move."},"skill":"Words in Context","strat":"Match the blank to the behavior the sentence explicitly reports, not to a loosely related trait."}},
{"id":"s2-rw-craft-06","sec":"rw","dom":"craft","skill":"Words in Context","dif":"M","type":"mcq","stim":"<p>The wetland functions as a natural ______, soaking up floodwaters during heavy storms and then releasing them slowly through drier weeks, so that the region's rivers neither overflow nor run dry.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["obstacle","pollutant","monument","buffer"],"ans":3,"exp":{"why":"Something that absorbs excess water and releases it gradually to keep rivers steady acts as a buffer, cushioning the extremes of flood and drought.","traps":{"A":"Obstacle implies simple blocking, but the wetland moderates flow rather than merely halting it.","B":"Pollutant is negative and contradicts the wetland's stabilizing, protective role.","C":"Monument is unrelated to the water-regulating function described."},"skill":"Words in Context","strat":"Choose the noun whose meaning covers both actions in the sentence, here absorbing and releasing."}},
{"id":"s2-rw-craft-07","sec":"rw","dom":"craft","skill":"Words in Context","dif":"H","type":"mcq","stim":"<p>Critics of the poet's early work dismissed its spare, unadorned lines as ______, mistaking restraint for a lack of substance. Only later did readers come to admire the discipline behind such rigorous economy of language.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["impoverished","ornate","chaotic","conventional"],"ans":0,"exp":{"why":"The critics dismissed the plainness negatively, mistaking restraint for a lack of substance. Impoverished conveys that the spareness was wrongly read as poverty, a judgment later readers overturned.","traps":{"B":"Ornate is the opposite of spare, unadorned lines.","C":"Spare, rigorous lines are orderly, not chaotic.","D":"Conventional is not the dismissal the passage sets up, and later praise concerns discipline, not convention."},"skill":"Words in Context","strat":"For a dismissive judgment, pick the negative word that matches how the critics misread the described quality."}},
{"id":"s2-rw-craft-08","sec":"rw","dom":"craft","skill":"Words in Context","dif":"H","type":"mcq","stim":"<p>The researcher was careful to present her conclusions as ______: drawing on data from only a single field season, she could point to suggestive patterns in the animals' behavior but could make no definitive claims about their long-term habits.</p>","prompt":"Which choice completes the text with the most logical and precise word or phrase?","choices":["exhaustive","biased","tentative","fabricated"],"ans":2,"exp":{"why":"Limited data and the explicit absence of definitive claims mean the conclusions can only be offered provisionally. Tentative names that cautious, unfinished status.","traps":{"A":"Exhaustive is the opposite, since one field season is far from complete data.","B":"Biased implies distortion, but the passage cites limited data, not prejudice.","D":"Fabricated implies dishonesty, which the passage never suggests."},"skill":"Words in Context","strat":"When a sentence stresses limited evidence and no firm claims, the blank signals provisional certainty."}},
{"id":"s2-rw-craft-09","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"E","type":"mcq","stim":"<p>For centuries, sailors navigated by the stars, memorizing the positions of the constellations as they wheeled across the seasons. The invention of the marine chronometer in the eighteenth century changed everything, allowing sailors to calculate longitude precisely and freeing them from complete dependence on a clear night sky.</p>","prompt":"Which choice best describes the overall structure of the text?","choices":["It lists several competing navigation tools in order of importance.","It contrasts an older method with an innovation that improved upon it.","It argues that traditional navigation was more reliable than modern methods.","It describes a single sailor's voyage in chronological order."],"ans":1,"exp":{"why":"The text first describes the older star-based method and then presents the marine chronometer as an innovation that made navigation more precise. It moves from an established method to an improvement on it.","traps":{"A":"Only two approaches appear, and they are ordered by time, not ranked by importance.","C":"The text credits the chronometer with greater precision, the opposite of this claim.","D":"No individual sailor or voyage is narrated."},"skill":"Text Structure & Purpose","strat":"Track how the text moves from one idea to the next, then name that movement as the structure."}},
{"id":"s2-rw-craft-10","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"E","type":"mcq","stim":"<p>This guide explains how to prune a young apple tree. First, remove any branches that are dead or crossing one another. Next, shorten the central leader to encourage growth lower on the trunk. Finally, thin the remaining shoots so that sunlight can reach the interior of the canopy.</p>","prompt":"What is the main purpose of the text?","choices":["To argue that apple trees require frequent pruning.","To compare different varieties of apple tree.","To provide step-by-step instructions for completing a task.","To describe the history of orchard cultivation."],"ans":2,"exp":{"why":"The text gives ordered directions, marked by first, next, and finally, for pruning a young apple tree. Its purpose is to walk a reader through the steps of the task.","traps":{"A":"The text explains how to prune, not how often, and makes no argument.","B":"Only one general task is covered, not a comparison of varieties.","D":"No historical account of orchards appears."},"skill":"Text Structure & Purpose","strat":"Sequence words like first and finally usually signal a how-to purpose."}},
{"id":"s2-rw-craft-11","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>Many people assume that deserts are lifeless, but this impression is misleading. The Sonoran Desert, for example, supports more than two thousand plant species, from towering saguaro cacti to delicate wildflowers that bloom only in the days after a rare rain.</p>","prompt":"Which choice best describes the function of the second sentence in the text?","choices":["It introduces an objection that the rest of the passage refutes.","It defines the term desert for readers unfamiliar with it.","It concedes that the opening generalization is largely accurate.","It provides a specific example that supports the claim that deserts are not lifeless."],"ans":3,"exp":{"why":"The first sentence claims the belief that deserts are lifeless is misleading. The second sentence offers the Sonoran Desert's two thousand plant species as concrete evidence backing that corrective claim.","traps":{"A":"The second sentence supports the opening point rather than raising an objection to it.","B":"It gives an illustrative example, not a definition of the word desert.","C":"It undercuts the lifeless assumption instead of conceding that it is accurate."},"skill":"Text Structure & Purpose","strat":"Ask what job a sentence does for the claim beside it, such as proving, qualifying, or opposing it."}},
{"id":"s2-rw-craft-12","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>Bioluminescence, the production of light by living organisms, serves a surprising range of functions. In some deep-sea fish, a glowing lure draws prey toward waiting jaws. In certain fireflies, timed flashes signal a readiness to mate. In some squid, a sudden burst of light startles a predator just long enough to allow an escape.</p>","prompt":"Which choice best describes the overall structure of the text?","choices":["A problem is presented and a single solution is proposed.","A historical debate is summarized and then resolved.","A general phenomenon is introduced and then illustrated with varied examples.","A common misconception is stated and then corrected."],"ans":2,"exp":{"why":"The text names a general phenomenon, bioluminescence, and then illustrates it with distinct examples in fish, fireflies, and squid. It moves from a broad concept to specific instances.","traps":{"A":"No problem is posed and no single solution is offered.","B":"There is no debate to summarize or resolve.","D":"Nothing is framed as a misconception that the text then corrects."},"skill":"Text Structure & Purpose","strat":"A definition followed by cases signals a concept-then-examples structure."}},
{"id":"s2-rw-craft-13","sec":"rw","dom":"craft","skill":"Text Structure & Purpose","dif":"M","type":"mcq","stim":"<p>The town council's new ordinance may seem minor, but its implications are broad. By requiring that every public meeting be livestreamed and archived online, the rule extends real participation to residents who cannot attend in person, among them shift workers, caregivers at home, and those without reliable transportation.</p>","prompt":"What is the main purpose of the text?","choices":["To criticize residents who fail to attend public meetings.","To explain how a seemingly small policy expands civic access.","To compare livestreaming technologies used by local governments.","To argue that in-person meetings should be eliminated."],"ans":1,"exp":{"why":"The text says a seemingly minor ordinance has broad implications because livestreaming lets residents who cannot attend in person take part. Its purpose is to show how a small policy broadens civic access.","traps":{"A":"The passage sympathizes with residents who cannot attend rather than criticizing them.","C":"No livestreaming technologies are compared.","D":"The ordinance adds a livestream option; it does not call for removing in-person meetings."},"skill":"Text Structure & Purpose","strat":"Purpose questions reward the sentence that states why the topic matters, not a side detail."}},
