{"id":"s3-ma-adv-37","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"M","type":"mcq","stim":"","prompt":"What is the solution to 2/(x − 1) = 3/(x + 1)?","choices":["x = 5","x = −5","x = 1","x = 0"],"ans":0,"exp":{"why":"Cross-multiply: 2(x + 1) = 3(x − 1), so 2x + 2 = 3x − 3. Then 5 = x, i.e., x = 5. Check: denominators 4 and 6 are nonzero, so it is valid.","traps":{"A":"Correct solution x = 5.","B":"Sign error when isolating x.","C":"x = 1 makes the left denominator 0.","D":"x = 0 does not satisfy the equation."},"skill":"Exponential & rational","strat":"Cross-multiply the proportion, solve, and check the denominators."}},
{"id":"s3-ma-adv-38","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"mcq","stim":"","prompt":"If 4^x = 2^(x + 3), what is the value of x?","choices":["3","1","6","−3"],"ans":0,"exp":{"why":"Rewrite 4 as 2²: 4^x = (2²)^x = 2^(2x). So 2^(2x) = 2^(x + 3), giving 2x = x + 3, thus x = 3.","traps":{"A":"Correct: 2x = x + 3 gives x = 3.","B":"Did not rewrite 4 as 2².","C":"Set 2x = 3 + x·? arithmetic error.","D":"Sign error solving 2x = x + 3."},"skill":"Exponential & rational","strat":"Express both sides with base 2, then equate exponents."}},
{"id":"s3-ma-adv-39","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"mcq","stim":"","prompt":"If 8^x = 4^(x + 1), what is the value of x?","choices":["2","1","3","−2"],"ans":0,"exp":{"why":"Write both sides with base 2: 8^x = 2^(3x) and 4^(x + 1) = 2^(2x + 2). So 3x = 2x + 2, giving x = 2.","traps":{"A":"Correct: 3x = 2x + 2 gives x = 2.","B":"Arithmetic error isolating x.","C":"Miscomputed one of the exponents.","D":"Sign error solving the exponent equation."},"skill":"Exponential & rational","strat":"Convert 8 and 4 to powers of 2, then equate exponents."}},
{"id":"s3-ma-adv-40","sec":"math","dom":"adv","skill":"Exponential & rational","dif":"H","type":"mcq","stim":"<p>A bacteria culture starts with 300 cells and doubles every 4 hours.</p>","prompt":"How many cells are present after 12 hours?","choices":["2,400","1,200","900","3,600"],"ans":0,"exp":{"why":"In 12 hours there are 12/4 = 3 doubling periods, so the amount is 300·2³ = 300·8 = 2,400 cells.","traps":{"A":"Correct: 300·2³ = 2,400.","B":"Doubled only twice (300·2² = 1,200).","C":"Tripled the start instead of doubling three times.","D":"Used 300·2·6 or a similar miscount of periods."},"skill":"Exponential & rational","strat":"Count the number of doubling periods, then multiply by 2 raised to that count."}},
{"id":"s3-ma-psda-01","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"E","type":"mcq","stim":"<p>A printer prints 24 pages in 3 minutes at a constant rate.</p>","prompt":"At this rate, how many pages will the printer print in 10 minutes?","choices":["80","72","8","240"],"ans":0,"exp":{"why":"First find the unit rate: 24 pages ÷ 3 minutes = 8 pages per minute. Then multiply by the new time: 8 × 10 = 80 pages.","traps":{"A":"Correct. 24 ÷ 3 = 8 pages/min, and 8 × 10 = 80.","B":"72 = 24 × 3; this multiplies the given values instead of finding and applying the rate.","C":"8 is only the unit rate (pages per minute), not the total for 10 minutes.","D":"240 = 24 × 10; this ignores the 3-minute time frame of the given amount."},"skill":"Ratios, rates & proportions","strat":"Convert the given ratio to a unit rate, then multiply by the new quantity."}},
{"id":"s3-ma-psda-02","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"M","type":"spr","stim":"<p>On a scale drawing, a length of 2 centimeters represents an actual length of 5 meters.</p>","prompt":"On the drawing, how many centimeters represent an actual wall that is 18 meters long?","ans":["7.2"],"exp":{"why":"Set up a proportion with drawing-cm over actual-m: 2/5 = x/18. Cross-multiply: 5x = 36, so x = 36 ÷ 5 = 7.2 centimeters.","skill":"Ratios, rates & proportions","strat":"Write a proportion keeping the same units in matching positions, then cross-multiply."}},
{"id":"s3-ma-psda-03","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"M","type":"mcq","stim":"<p>A car travels 108 kilometers in 1.5 hours at a constant speed.</p>","prompt":"What is the car’s speed in meters per second?","choices":["20","30","72","40"],"ans":0,"exp":{"why":"Speed = 108 km ÷ 1.5 h = 72 km/h. Convert: 72 km/h × 1000 m per km ÷ 3600 s per h = 72000 ÷ 3600 = 20 meters per second.","traps":{"A":"Correct. 72 km/h × (1000/3600) = 20 m/s.","B":"30 = 108 ÷ 3.6; this converts distance to m/s but forgets to divide by the 1.5 hours first.","C":"72 is the speed in km/h, not converted to meters per second.","D":"40 doubles the correct value, a common conversion slip."},"skill":"Ratios, rates & proportions","strat":"Find speed in km/h first, then convert units by dividing km/h by 3.6."}},
{"id":"s3-ma-psda-04","sec":"math","dom":"psda","skill":"Ratios, rates & proportions","dif":"H","type":"spr","stim":"<p>Working at a constant rate, 3 identical machines together produce 450 parts in 5 hours.</p>","prompt":"At the same rate, how many parts will 5 of these machines produce in 8 hours?","ans":["1200"],"exp":{"why":"Find the rate per machine per hour: 450 ÷ (3 machines × 5 hours) = 450 ÷ 15 = 30 parts per machine-hour. Then 5 machines × 8 hours × 30 = 1200 parts.","skill":"Ratios, rates & proportions","strat":"Reduce to a per-machine, per-hour rate, then scale up by the new number of machines and hours."}},
{"id":"s3-ma-psda-05","sec":"math","dom":"psda","skill":"Percentages","dif":"E","type":"mcq","stim":"<p>A quantity is described below.</p>","prompt":"What is 15% of 60?","choices":["9","90","45","4"],"ans":0,"exp":{"why":"15% = 0.15, and 0.15 × 60 = 9.","traps":{"A":"Correct. 0.15 × 60 = 9.","B":"90 = 15 × 60 ÷ 10; this misplaces the decimal point.","C":"45 = 60 − 15, subtracting instead of taking a percent.","D":"4 = 60 ÷ 15, dividing instead of multiplying by 0.15."},"skill":"Percentages","strat":"Convert the percent to a decimal and multiply by the whole."}},
{"id":"s3-ma-psda-06","sec":"math","dom":"psda","skill":"Percentages","dif":"M","type":"mcq","stim":"<p>The price of a shirt increased from $40 to $50.</p>","prompt":"What was the percent increase in the price of the shirt?","choices":["25%","20%","10%","125%"],"ans":0,"exp":{"why":"Percent increase = (change ÷ original) × 100 = (50 − 40)/40 × 100 = 10/40 × 100 = 25%.","traps":{"A":"Correct. 10/40 = 0.25 = 25%.","B":"20% = 10/50; this divides the change by the new price instead of the original.","C":"10% mistakes the dollar amount of change ($10) for the percent.","D":"125% = 50/40; this is the new price as a percent of the old, not the increase."},"skill":"Percentages","strat":"Divide the amount of change by the original value, not the new value."}},
{"id":"s3-ma-psda-07","sec":"math","dom":"psda","skill":"Percentages","dif":"H","type":"spr","stim":"<p>A stock is worth $50. During one week its value increases by 20%. The following week its new value decreases by 20%.</p>","prompt":"What is the value of the stock, in dollars, after these two changes?","ans":["48"],"exp":{"why":"Apply the changes as multipliers: 50 × 1.20 = 60 after the increase, then 60 × 0.80 = 48 after the decrease. Because the 20% decrease acts on the larger $60 value, the result is below the original $50.","skill":"Percentages","strat":"Treat each successive percent change as a multiplier and apply them in order — do not just add and subtract the percents."}},
{"id":"s3-ma-psda-08","sec":"math","dom":"psda","skill":"Percentages","dif":"M","type":"mcq","stim":"<p>After a 30% discount, a jacket costs $56.</p>","prompt":"What was the original price of the jacket?","choices":["$80","$72.80","$86","$186.67"],"ans":0,"exp":{"why":"A 30% discount means the sale price is 70% of the original: 0.70 × p = 56, so p = 56 ÷ 0.70 = $80.","traps":{"A":"Correct. 56 ÷ 0.70 = 80.","B":"$72.80 = 56 × 1.30; this adds 30% to the sale price instead of reversing a 30% discount.","C":"$86 = 56 + 30, adding a flat $30 rather than a percent.","D":"$186.67 = 56 ÷ 0.30, dividing by the discount rate instead of the paid fraction."},"skill":"Percentages","strat":"The sale price equals (100% − discount) of the original; divide by that decimal to reverse it."}},
{"id":"s3-ma-psda-09","sec":"math","dom":"psda","skill":"Data & statistics","dif":"E","type":"mcq","stim":"<p>A data set is shown: 4, 7, 7, 10, 14.</p>","prompt":"What is the median of the data set?","choices":["7","8.4","10","7.5"],"ans":0,"exp":{"why":"The values are already in order: 4, 7, 7, 10, 14. With 5 values, the median is the 3rd (middle) value, which is 7.","traps":{"A":"Correct. The middle of five ordered values is 7.","B":"8.4 = (4+7+7+10+14)/5 is the mean, not the median.","C":"10 is the fourth value, not the middle one.","D":"7.5 averages two central-looking values but is not needed with an odd count of data."},"skill":"Data & statistics","strat":"Order the data, then pick the middle value for an odd number of entries."}},
{"id":"s3-ma-psda-10","sec":"math","dom":"psda","skill":"Data & statistics","dif":"M","type":"mcq","stim":"<p>The table shows the scores earned by 10 students on a quiz.</p><table><tr><th>Score</th><th>Number of students</th></tr><tr><td>6</td><td>2</td></tr><tr><td>7</td><td>3</td></tr><tr><td>8</td><td>4</td></tr><tr><td>9</td><td>1</td></tr></table>","prompt":"What is the mean score for these 10 students?","choices":["7.4","7.5","7","8"],"ans":0,"exp":{"why":"Weight each score by its frequency: (6×2 + 7×3 + 8×4 + 9×1) = 12 + 21 + 32 + 9 = 74. Divide by the total of 10 students: 74 ÷ 10 = 7.4.","traps":{"A":"Correct. 74 ÷ 10 = 7.4.","B":"7.5 = (6+7+8+9)/4; this averages the distinct scores and ignores how many students earned each.","C":"7 is the median score, not the mean.","D":"8 is the most frequent (mode) score, not the mean."},"skill":"Data & statistics","strat":"For a frequency table, multiply each value by its frequency, sum, then divide by the total frequency."}},
{"id":"s3-ma-psda-11","sec":"math","dom":"psda","skill":"Data & statistics","dif":"H","type":"mcq","stim":"<p>A data set is 12, 14, 15, 16, 18, which has a mean of 15 and a median of 15. The value 60 is then added to the data set.</p>","prompt":"After 60 is added, which measure increases more, and by how much?","choices":["The mean, by 7.5","The median, by 0.5","The mean, by 22.5","The median, by 15.5"],"ans":0,"exp":{"why":"New mean: the sum was 75, now 75 + 60 = 135 over 6 values, so 135 ÷ 6 = 22.5, an increase of 22.5 − 15 = 7.5. New median: with six ordered values 12, 14, 15, 16, 18, 60, the median is (15 + 16)/2 = 15.5, an increase of 0.5. The mean increases far more because the outlier 60 pulls it up strongly, while the median barely moves.","traps":{"A":"Correct. The mean rises by 7.5; the median rises by only 0.5, so the mean changes more.","B":"The median does increase by 0.5, but that is the smaller change, not the larger.","C":"22.5 is the new mean itself, not the amount of increase (which is 22.5 − 15 = 7.5).","D":"15.5 is the new median value, not the size of the median’s increase."},"skill":"Data & statistics","strat":"An outlier shifts the mean much more than the median; compute each before and after to compare."}},
{"id":"s3-ma-psda-12","sec":"math","dom":"psda","skill":"Data & statistics","dif":"M","type":"mcq","stim":"<p>The two-way table shows the preferred drink of 150 surveyed adults.</p><table><tr><th></th><th>Coffee</th><th>Tea</th><th>Total</th></tr><tr><td>Male</td><td>40</td><td>20</td><td>60</td></tr><tr><td>Female</td><td>30</td><td>60</td><td>90</td></tr><tr><td>Total</td><td>70</td><td>80</td><td>150</td></tr></table>","prompt":"Of the adults who prefer tea, what fraction are female?","choices":["3/4","2/3","3/5","8/15"],"ans":0,"exp":{"why":"The tea column total is 80, of whom 60 are female. The fraction is 60/80 = 3/4.","traps":{"A":"Correct. 60 female tea-drinkers out of 80 tea-drinkers = 3/4.","B":"2/3 = 60/90, the fraction of females who prefer tea — the wrong denominator (all females).","C":"3/5 = 90/150, the fraction of all adults who are female, not restricted to tea.","D":"8/15 = 80/150, the fraction of all adults who prefer tea, ignoring gender."},"skill":"Data & statistics","strat":"‘Of those who…’ tells you the denominator — use only that row or column total."}},
{"id":"s3-ma-psda-13","sec":"math","dom":"psda","skill":"Probability","dif":"E","type":"mcq","stim":"<p>A bag contains 3 red marbles, 5 blue marbles, and 2 green marbles. One marble is drawn at random.</p>","prompt":"What is the probability that the marble drawn is green?","choices":["1/5","1/2","1/10","2/8"],"ans":0,"exp":{"why":"There are 3 + 5 + 2 = 10 marbles total, of which 2 are green. P(green) = 2/10 = 1/5.","traps":{"A":"Correct. 2 green out of 10 total = 1/5.","B":"1/2 = 5/10 is the probability of blue, not green.","C":"1/10 counts one green marble instead of two out of the total.","D":"2/8 uses 8 non-green marbles as the denominator instead of all 10."},"skill":"Probability","strat":"Probability = favorable outcomes ÷ total outcomes; count the full total."}},
{"id":"s3-ma-psda-14","sec":"math","dom":"psda","skill":"Probability","dif":"M","type":"mcq","stim":"<p>The two-way table shows 100 students grouped by grade and whether they play a school sport.</p><table><tr><th></th><th>Plays a sport</th><th>No sport</th><th>Total</th></tr><tr><td>Grade 9</td><td>30</td><td>10</td><td>40</td></tr><tr><td>Grade 10</td><td>25</td><td>35</td><td>60</td></tr><tr><td>Total</td><td>55</td><td>45</td><td>100</td></tr></table>","prompt":"If one student is selected at random, what is the probability that the student is in Grade 10 and plays no sport?","choices":["7/20","35/45","35/60","11/20"],"ans":0,"exp":{"why":"The cell for Grade 10 and no sport is 35 students out of 100 total. P = 35/100 = 7/20.","traps":{"A":"Correct. 35/100 simplifies to 7/20.","B":"35/45 conditions on the ‘no sport’ column instead of the whole group of 100.","C":"35/60 conditions on Grade 10 instead of the whole group.","D":"11/20 = 55/100 is the probability a student plays a sport, the opposite category."},"skill":"Probability","strat":"For a plain (unconditional) probability from a table, divide the target cell by the grand total."}},
{"id":"s3-ma-psda-15","sec":"math","dom":"psda","skill":"Probability","dif":"H","type":"spr","stim":"<p>On any given day, the probability that it rains in a certain town is 0.4, independent of other days.</p>","prompt":"What is the probability that it rains on neither of two consecutive days? Give your answer as a decimal.","ans":["0.36","9/25"],"exp":{"why":"The probability it does not rain on a single day is the complement: 1 − 0.4 = 0.6. For two independent days, multiply: 0.6 × 0.6 = 0.36.","skill":"Probability","strat":"Use the complement for ‘does not’ on each day, then multiply probabilities for independent events."}},
{"id":"s3-ma-geo-01","sec":"math","dom":"geo","skill":"Area & volume","dif":"E","type":"mcq","stim":"<p>A landscaper is planning a rectangular garden bed.</p>","prompt":"A rectangular garden has a length of 15 meters and a width of 8 meters. What is the area of the garden, in square meters?","choices":["46","120","23","60"],"ans":1,"exp":{"why":"The area of a rectangle is length × width. Area = 15 × 8 = 120 square meters.","traps":{"A":"46 is the perimeter, 2(15 + 8), not the area.","B":"Correct: 15 × 8 = 120 square meters.","C":"23 just adds the length and width, 15 + 8.","D":"60 is half of the true area, as if the ½ from a triangle were applied."},"skill":"Area & volume","strat":"For a rectangle, multiply length by width — no ½ factor is involved."}},
{"id":"s3-ma-geo-02","sec":"math","dom":"geo","skill":"Area & volume","dif":"M","type":"mcq","stim":"","prompt":"A cylindrical can has a radius of 4 centimeters and a height of 9 centimeters. What is the volume of the can, in cubic centimeters? (The volume of a cylinder is V = πr²h.)","choices":["36π","144π","576π","72π"],"ans":1,"exp":{"why":"V = πr²h = π(4²)(9) = π(16)(9) = 144π cubic centimeters.","traps":{"A":"36π forgets to square the radius: π(4)(9).","B":"Correct: π(16)(9) = 144π.","C":"576π uses the diameter 8 in place of the radius: π(8²)(9).","D":"72π is the lateral surface area 2πrh, not the volume."},"skill":"Area & volume","strat":"Square the radius first, then multiply by π and the height."}},
{"id":"s3-ma-geo-03","sec":"math","dom":"geo","skill":"Area & volume","dif":"M","type":"mcq","stim":"","prompt":"A trapezoid has parallel sides of length 6 and 10 and a height of 5. What is the area of the trapezoid?","choices":["80","40","25","300"],"ans":1,"exp":{"why":"The area of a trapezoid is ½(b₁ + b₂)h = ½(6 + 10)(5) = ½(16)(5) = 40 square units.","traps":{"A":"80 forgets the ½ factor: (6 + 10)(5).","B":"Correct: ½(16)(5) = 40.","C":"25 uses only the longer base: ½(10)(5).","D":"300 multiplies all three numbers, 6 × 10 × 5."},"skill":"Area & volume","strat":"Average the two parallel sides, then multiply by the height."}},
{"id":"s3-ma-geo-04","sec":"math","dom":"geo","skill":"Area & volume","dif":"H","type":"mcq","stim":"","prompt":"A cone has a radius of 6 inches and a height of 14 inches. What is the volume of the cone, in cubic inches? (The volume of a cone is V = ⅓πr²h.)","choices":["504π","168π","672π","84π"],"ans":1,"exp":{"why":"V = ⅓πr²h = ⅓π(6²)(14) = ⅓π(36)(14) = ⅓(504π) = 168π cubic inches.","traps":{"A":"504π forgets the ⅓ factor: π(36)(14).","B":"Correct: ⅓π(36)(14) = 168π.","C":"672π uses the diameter 12 as the radius: ⅓π(12²)(14).","D":"84π applies ½ instead of ⅓ to a wrong base value."},"skill":"Area & volume","strat":"Compute πr²h as if it were a cylinder, then take one third."}},
{"id":"s3-ma-geo-05","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"E","type":"spr","stim":"","prompt":"In a triangle, two of the interior angles measure 50° and 60°. What is the measure, in degrees, of the third interior angle?","ans":["70"],"exp":{"why":"The interior angles of a triangle sum to 180°. The third angle = 180° − 50° − 60° = 70°.","skill":"Lines, angles & triangles","strat":"Subtract the two known angles from 180°."}},
{"id":"s3-ma-geo-06","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"M","type":"mcq","stim":"<p>Two parallel lines are cut by a transversal.</p>","prompt":"Lines l and m are parallel and are cut by a transversal. One interior angle measures 65°. What is the measure of the co-interior (same-side interior) angle?","choices":["65°","115°","25°","90°"],"ans":1,"exp":{"why":"Co-interior (same-side interior) angles formed by a transversal cutting parallel lines are supplementary, so they add to 180°. The angle = 180° − 65° = 115°.","traps":{"A":"65° treats the angles as equal, which is true for alternate interior angles, not same-side interior angles.","B":"Correct: 180° − 65° = 115°.","C":"25° takes the complement, 90° − 65°.","D":"90° wrongly assumes a right angle."},"skill":"Lines, angles & triangles","strat":"Same-side interior angles are supplementary; subtract from 180°."}},
{"id":"s3-ma-geo-07","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"M","type":"mcq","stim":"","prompt":"Triangle ABC is similar to triangle DEF, with side AB corresponding to side DE and side BC corresponding to side EF. If AB = 4, DE = 12, and BC = 6, what is the length of EF?","choices":["14","18","2","72"],"ans":1,"exp":{"why":"The scale factor from ABC to DEF is DE / AB = 12 / 4 = 3. Corresponding sides scale by the same factor, so EF = BC × 3 = 6 × 3 = 18.","traps":{"A":"14 adds the difference (12 − 4 = 8) to 6 instead of multiplying by the ratio.","B":"Correct: 6 × 3 = 18.","C":"2 divides by the scale factor instead of multiplying: 6 ÷ 3.","D":"72 multiplies 6 × 12 instead of using the ratio."},"skill":"Lines, angles & triangles","strat":"Find the scale factor from a known pair, then multiply the matching side by it."}},
{"id":"s3-ma-geo-08","sec":"math","dom":"geo","skill":"Lines, angles & triangles","dif":"H","type":"mcq","stim":"","prompt":"An isosceles triangle has two equal sides of length 13 and a base of length 10. What is the height of the triangle measured from the base to the opposite vertex?","choices":["√194","12","√69","5"],"ans":1,"exp":{"why":"The height to the base bisects the base, creating a right triangle with hypotenuse 13 and one leg 5 (half of 10). By the Pythagorean theorem, height = √(13² − 5²) = √(169 − 25) = √144 = 12.","traps":{"A":"√194 adds instead of subtracting: √(13² + 5²).","B":"Correct: √(169 − 25) = 12 (a 5-12-13 triangle).","C":"√69 uses the full base 10 instead of half: √(169 − 100).","D":"5 is just half the base, not the height."},"skill":"Lines, angles & triangles","strat":"Drop the altitude to bisect the base, then apply the Pythagorean theorem with half the base."}},
{"id":"s3-ma-geo-09","sec":"math","dom":"geo","skill":"Circles","dif":"E","type":"mcq","stim":"","prompt":"A circle has a radius of 5. What is the area of the circle?","choices":["10π","25π","100π","5π"],"ans":1,"exp":{"why":"The area of a circle is A = πr² = π(5²) = 25π.","traps":{"A":"10π is the circumference 2πr, not the area.","B":"Correct: π(5²) = 25π.","C":"100π squares the diameter 10 instead of the radius.","D":"5π uses the radius without squaring it."},"skill":"Circles","strat":"Area uses r squared; circumference uses r to the first power."}},
{"id":"s3-ma-geo-10","sec":"math","dom":"geo","skill":"Circles","dif":"M","type":"mcq","stim":"","prompt":"In a circle with radius 9, a central angle of 40° subtends an arc. What is the length of that arc? (Express your answer in terms of π.)","ans":0,"exp":{"why":"Arc length = (central angle / 360°) × circumference = (40 / 360) × 2π(9) = (1/9) × 18π = 2π.","skill":"Circles","strat":"Take the angle's fraction of 360°, then multiply by the full circumference 2πr.","traps":{"A":"Correct: (40/360)·2π·9 = (1/9)·18π = 2π.","B":"Doubles the correct arc length, as if the angle were 80°.","C":"Uses an area-style fraction of πr² instead of arc length.","D":"Gives the full circumference 2π·9 = 18π, ignoring the 40° fraction."}},"choices":["2π","4π","9π","18π"]},
{"id":"s3-ma-geo-11","sec":"math","dom":"geo","skill":"Circles","dif":"M","type":"mcq","stim":"","prompt":"A sector of a circle has a central angle of 90° and a radius of 8. What is the area of the sector?","choices":["64π","16π","32π","4π"],"ans":1,"exp":{"why":"Sector area = (central angle / 360°) × πr² = (90 / 360) × π(8²) = ¼ × 64π = 16π.","traps":{"A":"64π is the full circle's area, ignoring the 90° fraction.","B":"Correct: ¼ × 64π = 16π.","C":"32π uses ½ instead of ¼ of the circle.","D":"4π confuses the sector area with an arc-length style computation."},"skill":"Circles","strat":"Multiply the full circle area πr² by the angle's fraction of 360°."}},
{"id":"s3-ma-geo-12","sec":"math","dom":"geo","skill":"Circles","dif":"H","type":"mcq","stim":"","prompt":"A circle has a circumference of 36π. An arc of the circle has a length of 4π. What is the measure, in degrees, of the central angle that subtends this arc?","choices":["80°","40°","10°","9°"],"ans":1,"exp":{"why":"The arc is 4π / 36π = 1/9 of the circumference, so its central angle is 1/9 of 360°: (1/9)(360°) = 40°.","traps":{"A":"80° doubles the correct value.","B":"Correct: (1/9)(360°) = 40°.","C":"10° uses the fraction 1/36, ignoring the arc's factor of 4.","D":"9° reports the ratio's denominator as if it were degrees."},"skill":"Circles","strat":"The arc's fraction of the circumference equals the central angle's fraction of 360°."}},
{"id":"s3-ma-geo-13","sec":"math","dom":"geo","skill":"Right-triangle trig","dif":"E","type":"spr","stim":"","prompt":"A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?","ans":["10"],"exp":{"why":"By the Pythagorean theorem, hypotenuse = √(6² + 8²) = √(36 + 64) = √100 = 10. This is a 3-4-5 triangle scaled by 2.","skill":"Right-triangle trig","strat":"Square the legs, add, and take the square root; recognize the 3-4-5 pattern."}},
{"id":"s3-ma-geo-14","sec":"math","dom":"geo","skill":"Right-triangle trig","dif":"M","type":"mcq","stim":"<p>In right triangle ABC, the right angle is at C.</p>","prompt":"In right triangle ABC, the right angle is at vertex C. The side opposite angle A has length 5, and the hypotenuse has length 13. What is the value of sin A?","choices":["12/13","5/13","13/5","5/12"],"ans":1,"exp":{"why":"By SOH, sin A = opposite / hypotenuse = 5/13. (The remaining leg is 12, since it is a 5-12-13 triangle.)","traps":{"A":"12/13 is cos A (adjacent over hypotenuse), not sin A.","B":"Correct: opposite / hypotenuse = 5/13.","C":"13/5 inverts the sine ratio.","D":"5/12 is tan A (opposite over adjacent), not sin A."},"skill":"Right-triangle trig","strat":"Sine is opposite over hypotenuse — SOH."}},
{"id":"s3-ma-geo-15","sec":"math","dom":"geo","skill":"Right-triangle trig","dif":"H","type":"mcq","stim":"","prompt":"In a right triangle, angle A and angle B are the two acute angles. If sin A = 0.6, what is the value of cos B?","choices":["0.6","0.8","0.4","0.75"],"ans":0,"exp":{"why":"The two acute angles of a right triangle are complementary, so A + B = 90°, which means B = 90° − A. The cofunction identity gives cos B = cos(90° − A) = sin A = 0.6.","traps":{"A":"Correct: since A and B are complementary, cos B = sin A = 0.6.","B":"0.8 is cos A (the other ratio in the triangle), not cos B.","C":"0.4 comes from 1 − 0.6, a misuse of the identity.","D":"0.75 resembles a tangent value, 0.6/0.8, not cos B."},"skill":"Right-triangle trig","strat":"In a right triangle the acute angles are complementary, so the cosine of one equals the sine of the other."}},

/* ---------------------------------------------------------------------------
   SPR numeric helpers
   ------------------------------------------------------------------------- */
function parseNum(raw){
  if(raw===null||raw===undefined) return null;
  let s=String(raw).trim().replace(/^\+/,'').replace(/\s+/g,'');
  if(s==='') return null;
  // percent sign tolerated
  s=s.replace(/%$/,'');
  // fraction a/b
  if(/^-?\d+\/\-?\d+$/.test(s)){
    const [a,b]=s.split('/').map(Number);
    if(b===0) return null;
    return a/b;
  }
  // mixed or plain decimal / integer (allow leading dot)
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return null;
}
function sprCorrect(input, accepted){
  const v=parseNum(input);
  if(v===null) return false;
  const inputHasFrac=String(input).includes('/');
  for(const a of accepted){
    const av=parseNum(a);
    if(av===null) continue;
    if(Math.abs(v-av) < 1e-6) return true;
    // Grid-rounding tolerance: the College Board grid accepts a rounded/truncated
    // decimal of a repeating value (e.g. .667 for 2/3). Only widen the tolerance
    // when a fraction is involved on either side, so distinct values stay rejected.
    if((inputHasFrac || String(a).includes('/')) && Math.abs(v-av) < 2e-3) return true;
  }
  return false;
}

/* ---------------------------------------------------------------------------
   STATE  (localStorage: scorelab_v2)
   ------------------------------------------------------------------------- */
const LS_KEY='scorelab_v2';
const DEFAULT_STATE={ name:'', target:'sat', log:[], streak:0, lastDay:null, history:[], haptics:true, coPilot:true, bestStreak:0, goal:1600 };
let STATE=loadState();

function loadState(){
  try{
    const raw=(typeof localStorage!=='undefined') && localStorage.getItem(LS_KEY);
    if(raw){ const s=JSON.parse(raw); return Object.assign({}, DEFAULT_STATE, s); }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState(){
  try{ if(typeof localStorage!=='undefined') localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function nowTs(){ return Date.now(); }

function recordAttempt(q, correct){
  STATE.log.push({ id:q.id, sec:q.sec, dom:q.dom, skill:q.skill, dif:q.dif, correct:!!correct, ts:nowTs() });
  // streak
  const t=todayStr();
  if(STATE.lastDay!==t){
    const y=new Date(Date.now()-864e5);
    const yStr=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    STATE.streak = (STATE.lastDay===yStr) ? STATE.streak+1 : 1;
    STATE.lastDay=t;
  }
  saveState();
}

/* ---------------------------------------------------------------------------
   MASTERY & SCORE PROJECTION
   mastery per domain = difficulty-weighted correct / difficulty-weighted seen
   ------------------------------------------------------------------------- */
function domainMastery(dom){
  const rows=STATE.log.filter(r=>r.dom===dom);
  if(!rows.length) return { m:0, seen:0, correct:0 };
  let wSum=0, wCorrect=0, correct=0;
  for(const r of rows){
    const w=CONFIG.difWeight[r.dif]||1;
    wSum+=w; if(r.correct){ wCorrect+=w; correct++; }
  }
  return { m: wSum? wCorrect/wSum : 0, seen:rows.length, correct };
}
function sectionMastery(sec){
  const doms=DOM_ORDER.filter(d=>CONFIG.domains[d].sec===sec);
  let wsum=0, msum=0;
  for(const d of doms){
    const wt=CONFIG.domains[d].wt;
    const {m,seen}=domainMastery(d);
    // unseen domains contribute 0 mastery but still weigh (so score starts near base)
    wsum+=wt; msum+=wt*m;
  }
  return wsum? msum/wsum : 0;
}
/* Friendlier projection: each domain's mastery is blended with an OPTIMISTIC
   PRIOR that fades as real evidence accumulates (a motivated-student prior of
   PSEUDO pseudo-answers at PRIOR accuracy). A concave curve makes early progress
   feel rewarding. A brand-new user sees a hopeful ~mid projection instead of the
   bare floor; strong work still climbs toward the top, weak work eases down. */
const PROJ_PRIOR=0.62, PROJ_PSEUDO=4, PROJ_CURVE=0.85;
function projectedSection(sec){
  const scale=CONFIG.scales[STATE.target];
  const [lo,hi]=scale.sec; const base=scale.base; const range=hi-lo;
  const doms=DOM_ORDER.filter(d=>CONFIG.domains[d].sec===sec);
  let wsum=0, msum=0;
  for(const d of doms){
    const wt=CONFIG.domains[d].wt;
    let seenW=0, corrW=0;
    for(const r of STATE.log){ if(r.dom!==d) continue; const w=CONFIG.difWeight[r.dif]||1; seenW+=w; if(r.correct) corrW+=w; }
    const mD=(corrW + PROJ_PRIOR*PROJ_PSEUDO)/(seenW + PROJ_PSEUDO);   // blended, prior fades with data
    wsum+=wt; msum+=wt*mD;
  }
  const m = wsum? msum/wsum : PROJ_PRIOR;
  const curved = Math.pow(m, PROJ_CURVE);
  const raw = base + curved*range;
  return Math.max(lo, Math.min(hi, Math.round(raw/10)*10));
}
function projectedTotal(){
  return projectedSection('rw')+projectedSection('math');
}
/* Aspirational goal score (settable), clamped to the current scale. */
function goalScore(){
  const sc=CONFIG.scales[STATE.target]; const [lo,hi]=sc.total;
  const g=Number(STATE.goal)||1600;
  return Math.max(lo+120, Math.min(hi, Math.round(g/10)*10));
}
/* Pure adaptive-exam helpers (unit-testable, no DOM) */
function routeDecision(correct, n){ return correct >= Math.ceil(n*0.6) ? 'hard' : 'easy'; }
function estimateSectionScore(target, route, correct, n){
  const scale=CONFIG.scales[target]; const [lo,hi]=scale.sec;
  const acc = n? correct/n : 0;
  const cap = route==='hard' ? 1.0 : 0.80;   // easier Module 2 caps the achievable top
  const eff = Math.min(acc, cap);
  return Math.max(lo, Math.min(hi, Math.round((lo + eff*(hi-lo))/10)*10));
}
function goalLine(total, goal, band){
  const gap=goal-total;
  if(gap<=0) return `Goal reached — you’re projecting ${band}! Aim even higher.`;
  if(gap<=60) return `Almost there — just ${gap} points to your ${goal} goal. 🔥`;
  if(gap<=180) return `On your way — ${gap} points to your ${goal} goal.`;
  return `${band} and climbing — ${gap} points to your ${goal} goal. Let’s go.`;
}
function scoreBand(total){
  const scale=CONFIG.scales[STATE.target];
  const [lo,hi]=scale.total;
  const pct=(total-lo)/(hi-lo);
  if(pct>=0.85) return 'Elite';
  if(pct>=0.68) return 'Competitive';
  if(pct>=0.5)  return 'On track';
  if(pct>=0.32) return 'Building';
  return 'Foundation';
}

/* ---------------------------------------------------------------------------
   DOM / RENDER helpers  (guarded so smoke harness can stub)
   ------------------------------------------------------------------------- */
const hasDoc = (typeof document!=='undefined' && document && document.getElementById);
function el(id){ return hasDoc? document.getElementById(id):null; }
function h(html){ return html; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Self-contained LaTeX-subset → HTML renderer (no external library).
   Handles \(..\), \frac/\dfrac/\tfrac, \sqrt, ^{..}/^x superscripts, and common symbols.
   `isHTML`=true trusts existing markup (stims with tables); otherwise escapes < > &. */
function mathConv(s){
  s=s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,
      (m,a,b)=>`<span class="frac"><span class="fnum">${a}</span><span class="fden">${b}</span></span>`);
  s=s.replace(/\\sqrt\{([^{}]*)\}/g,(m,a)=>`&radic;<span class="rad">${a}</span>`);
  s=s.replace(/\^\{([^{}]*)\}/g,(m,a)=>`<sup>${a}</sup>`);
  s=s.replace(/\^(-?[0-9A-Za-z]+)/g,(m,a)=>`<sup>${a}</sup>`);
  s=s.replace(/\\cdot/g,'·').replace(/\\times/g,'×').replace(/\\div/g,'÷')
     .replace(/\\leq?\b/g,'≤').replace(/\\geq?\b/g,'≥').replace(/\\neq/g,'≠')
     .replace(/\\pm/g,'±').replace(/\\pi\b/g,'π').replace(/\\theta\b/g,'θ')
     .replace(/\\approx/g,'≈').replace(/\\,/g,'').replace(/\\!/g,'').replace(/\\ /g,' ');
  s=s.replace(/\\[()\[\]]/g,'');       // strip \( \) \[ \] delimiters
  return s;
}
function mathHTML(s,isHTML){
  if(s==null) return '';
  s=String(s);
  return isHTML ? mathConv(s) : mathConv(esc(s));
}
function mathText(s){ // plain-text-ish for previews: convert then strip tags
  return mathHTML(s,false).replace(/<[^>]+>/g,'').replace(/&radic;/g,'√').replace(/&[a-z]+;/g,' ').trim();
}
function toast(msg){
  if(!hasDoc) return;
  const t=el('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1900);
}

/* ---------------------------------------------------------------------------
   SEEDED RNG — deterministic, reproducible test forms
   ------------------------------------------------------------------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(arr, seed){ const a=arr.slice(); const rnd=mulberry32(seed>>>0); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  return '“Every miss is a map. Let’s work the mistake bank together.”';
}

/* ---------------------------------------------------------------------------
   SVG SCORE GAUGE
   ------------------------------------------------------------------------- */
function gaugeSVG(value, lo, hi, mark){
  const size=230, cx=size/2, cy=size/2, r=92, sw=16;
  const start=135, sweep=270;                 // degrees
  const frac=Math.max(0,Math.min(1,(value-lo)/(hi-lo)));
  const toXY=(deg,rr)=>{ const a=(deg-90)*Math.PI/180; return [cx+(rr||r)*Math.cos(a), cy+(rr||r)*Math.sin(a)]; };
  const arc=(a0,a1)=>{
    const [x0,y0]=toXY(a0), [x1,y1]=toXY(a1);
    const large=(a1-a0)>180?1:0;
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  };
  const endDeg=start+sweep*frac;
  // ticks
  let ticks='';
  for(let i=0;i<=10;i++){
    const d=start+sweep*(i/10);
    const [x0,y0]=toXY(d,r+11);
    const [x1,y1]=toXY(d,r+3);
    ticks+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#2b4066" stroke-width="2"/>`;
  }
  // gold goal marker
  let marker='';
  if(mark!=null){
    const mf=Math.max(0,Math.min(1,(mark-lo)/(hi-lo)));
    const md=start+sweep*mf;
    const [gx0,gy0]=toXY(md,r-11), [gx1,gy1]=toXY(md,r+11);
    const [dotx,doty]=toXY(md,r+18);
    marker=`<line x1="${gx0.toFixed(1)}" y1="${gy0.toFixed(1)}" x2="${gx1.toFixed(1)}" y2="${gy1.toFixed(1)}" stroke="#f2c14e" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="${dotx.toFixed(1)}" cy="${doty.toFixed(1)}" r="4" fill="#f2c14e" stroke="#1a1405" stroke-width="1"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="220" height="220" role="img" aria-label="Projected score gauge with goal marker">
    <defs>
      <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1d6fce"/><stop offset=".55" stop-color="#2f9bff"/><stop offset="1" stop-color="#f2c14e"/>
      </linearGradient>
    </defs>
    ${ticks}
    <path d="${arc(start,start+sweep)}" fill="none" stroke="#16233b" stroke-width="${sw}" stroke-linecap="round"/>
    <path d="${arc(start,endDeg)}" fill="none" stroke="url(#gg)" stroke-width="${sw}" stroke-linecap="round"/>
    ${marker}
    <circle cx="${cx}" cy="${cy}" r="60" fill="#0b1526" stroke="#1c2c48"/>
  </svg>`;
}

/* ---------------------------------------------------------------------------
   QUESTION RUNNER (shared by practice / drills)
   opts: { queue:[q...], onDone, title, showPacing, secForPace }
   ------------------------------------------------------------------------- */
function runQueue(container, opts){
  const queue=opts.queue.slice();
  let idx=0, correctCount=0, runStreak=0;
  let timer=null, elapsed=0;

  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function startTimer(){
    if(!opts.showPacing) return;
    stopTimer(); elapsed=0;
    timer=setInterval(()=>{ elapsed++; paintClock(); }, 1000);
  }
  function paintClock(){
    const c=container.querySelector('#pace-clock'); if(!c) return;
    const mm=String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss=String(elapsed%60).padStart(2,'0');
    c.textContent=`${mm}:${ss}`;
    const budget=opts.secForPace||90;
    c.className='clock'+(elapsed>budget?' crit':elapsed>budget*0.75?' warn':'');
  }

  function paint(){
    if(idx>=queue.length){ stopTimer(); return finish(); }
    const q=queue[idx];
    const dom=CONFIG.domains[q.dom];
    const pacing = opts.showPacing? `
      <div class="pacing">
        <div><div class="pace-lbl">Time on item</div><div class="clock" id="pace-clock">00:00</div></div>
        <div class="progressbar"><i style="width:${(idx/queue.length*100).toFixed(0)}%"></i></div>
        <div class="pace-lbl">${idx+1} / ${queue.length}</div>
      </div>`:'';
    container.innerHTML=`
      <div class="runner">
        ${opts.title?`<div class="exam-hud"><h2>${opts.title}</h2>
           <button class="btn ghost sm" onclick="go('${opts.back||'practice'}')">Exit</button></div>`:''}
        ${pacing}
        <div class="qmeta">
          <span class="pill ${q.dif}">${({E:'Easy',M:'Medium',H:'Hard'})[q.dif]}</span>
          <span class="pill">${dom.name}</span>
          <span class="pill">${q.skill}</span>
          <span class="pill">${q.type==='spr'?'Student response':'Multiple choice'}</span>
        </div>
        ${q.stim?`<div class="stim">${mathHTML(q.stim,true)}</div>`:''}
        <div class="prompt">${mathHTML(q.prompt,false)}</div>
        <div id="answerzone"></div>
        <div id="expzone"></div>
      </div>`;
    renderAnswer(q);
    startTimer();
  }

  function renderAnswer(q){
    const zone=container.querySelector('#answerzone');
    if(q.type==='spr'){
      zone.innerHTML=`
        <input class="spr-in" id="spr" autocomplete="off" placeholder="answer" />
        <div class="spr-hint">Enter a number, fraction (like 3/4), or decimal. Press Enter or Submit.</div>
        <div class="spacer"></div>
        <button class="btn" id="submit">Submit</button>`;
      const inp=zone.querySelector('#spr');
      const submit=()=>grade(q, inp.value);
      zone.querySelector('#submit').onclick=submit;
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
      if(inp.focus) inp.focus();
    } else {
      zone.innerHTML=`<div class="choices">${q.choices.map((c,i)=>
        `<button class="choice" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${mathHTML(c,false)}</span></button>`).join('')}</div>`;
      zone.querySelectorAll('.choice').forEach(b=>b.onclick=()=>grade(q, Number(b.dataset.i)));
    }
  }

  function grade(q, raw){
    stopTimer();
    let correct;
    if(q.type==='spr'){ correct=sprCorrect(raw, q.ans); }
    else { correct = Number(raw)===q.ans; }
    recordAttempt(q, correct);
    if(correct){ correctCount++; runStreak++; } else { runStreak=0; }
    if(runStreak>(STATE.bestStreak||0)){ STATE.bestStreak=runStreak; saveState(); }
    haptic(correct ? (runStreak>=3?'streak':'correct') : 'wrong');
    // lock UI + mark
    const zone=container.querySelector('#answerzone');
    if(q.type==='spr'){
      zone.querySelectorAll('input,button').forEach(x=>x.disabled=true);
    } else {
      zone.querySelectorAll('.choice').forEach(b=>{
        const i=Number(b.dataset.i); b.disabled=true;
        if(i===q.ans) b.classList.add('correct');
        else if(i===Number(raw)) b.classList.add('wrong');
      });
    }
    showExplanation(q, correct, raw);
  }

  function showExplanation(q, correct, raw){
    const zone=container.querySelector('#expzone');
    const e=q.exp;
    const react = (STATE.coPilot!==false) ? vegaReact(correct, runStreak) : null;
    const vega = react ? vegaBubble(react.mood, react.line) : '';
    let traps='';
    if(q.type!=='spr' && e.traps){
      traps=`<div class="traps"><div class="eyebrow" style="margin-bottom:6px">Why the distractors tempt</div>${
        ['A','B','C','D'].map((L,i)=> e.traps[L]&&i!==q.ans?
          `<div class="t"><b>${L}</b> ${mathHTML(e.traps[L],false)}</div>`:'').join('')}</div>`;
    }
    zone.innerHTML=`
      <div class="exp ${correct?'ok':'no'}">
        <div class="band">${correct?'✓ Correct':'✗ Not quite'} — ${correct?'nice read':'let’s lock it in'}</div>
        <div class="body">
          ${vega}
          <p class="why">${mathHTML(e.why,false)}</p>
          ${traps}
          <div style="margin-top:10px">
            <span class="tag2">Skill · ${q.skill}</span>
            <span class="tag2">Difficulty · ${({E:'Easy',M:'Medium',H:'Hard'})[q.dif]}</span>
          </div>
          <div class="strat"><b>Strategy —</b> ${mathHTML(e.strat,false)}</div>
          <div class="spacer"></div>
          <div class="btnrow">
            <button class="btn" id="next">${idx+1<queue.length?'Next question':'See results'}</button>
          </div>
        </div>
      </div>`;
    zone.querySelector('#next').onclick=()=>{ idx++; paint(); };
  }

  function finish(){
    if(opts.onDone) return opts.onDone({total:queue.length, correct:correctCount});
    const pct=queue.length? Math.round(100*correctCount/queue.length):0;
    container.innerHTML=`
      <div class="runner center card">
        <div class="eyebrow">Set complete</div>
        <div class="result-big">${correctCount}/${queue.length}</div>
        <p class="muted">${pct}% correct · logged to your mastery profile</p>
        <div class="btnrow" style="justify-content:center">
          <button class="btn gold" onclick="go('practice')">More practice</button>
          <button class="btn ghost" onclick="go('dashboard')">Dashboard</button>
          ${mistakeIds().length?`<button class="btn ghost" onclick="go('mistakes')">Review mistakes</button>`:''}
        </div>
      </div>`;
  }

  paint();
}

function pickN(pool,n){
  const a=pool.slice();
  // Fisher–Yates
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,Math.min(n,a.length));
}
function weightedDraw(sec,n){
  const doms=DOM_ORDER.filter(d=> sec==='all'? true : CONFIG.domains[d].sec===sec);
  const out=[];
  // proportional to blueprint weight
  const totalWt=doms.reduce((s,d)=>s+CONFIG.domains[d].wt,0);
  for(const d of doms){
    const share=Math.round(n*CONFIG.domains[d].wt/totalWt);
    out.push(...pickN(QUESTIONS.filter(q=>q.dom===d), share));
  }
  // top up / trim to n
  let pool=QUESTIONS.filter(q=> sec==='all'||CONFIG.domains[q.dom].sec===sec);
  while(out.length<n){ const extra=pickN(pool,1)[0]; if(!extra) break; if(!out.includes(extra)) out.push(extra); else break; }
  return pickN(out,n);
}
function startSkill(enc){

  const pool=QUESTIONS.filter(q=>q.skill===skill);

  const v=el('view');
  runQueue(v,{ queue:pickN(pool,Math.min(8,pool.length)), title:skill, showPacing:true,
    secForPace: pool[0].sec==='math'?95:75, back:'practice' });
}
function startMixed(sec,n){

  if(!q.length){ toast('No questions available'); return; }

function buildModule1(sec,n){
  // balanced difficulty sample
  const pool=QUESTIONS.filter(q=>q.sec===sec);
  const byDif=g=>pool.filter(q=>q.dif===g);
  let out=[...pickN(byDif('E'),Math.ceil(n/3)),...pickN(byDif('M'),Math.ceil(n/3)),...pickN(byDif('H'),Math.floor(n/3))];
  out=pickN(out,n);
  while(out.length<n){ const e=pickN(pool,1)[0]; if(!e||out.includes(e))break; out.push(e);}
  return out;
}
function buildModule2(sec,n,hard,exclude){
  const pool=QUESTIONS.filter(q=>q.sec===sec && !exclude.includes(q.id));
  let tier = hard? pool.filter(q=>q.dif==='H'||q.dif==='M') : pool.filter(q=>q.dif==='E'||q.dif==='M');
  let out=pickN(tier,n);
  while(out.length<n){ const e=pickN(pool,1)[0]; if(!e||out.includes(e))break; out.push(e);}
  return out;
}

function fillModule(sec,count,tier,exclude,seed,basePool){
  // tier: 'mix' | 'hard' | 'easy'  — recycle only if the pool is smaller than count.
  // seed: deterministic order when provided (stable forms); basePool: restrict to a
  // specific disjoint slice (used by named test forms so they never share items).
  let pool=(basePool||QUESTIONS.filter(q=>q.sec===sec)).slice();
  if(tier==='hard') pool=pool.filter(q=>q.dif!=='E').concat(pool);
  if(tier==='easy') pool=pool.filter(q=>q.dif!=='H').concat(pool);
  if(exclude&&exclude.length) pool=pool.filter(q=>!exclude.includes(q.id)).concat(pool.filter(q=>exclude.includes(q.id)));
  const shuffled = (seed!=null) ? seededShuffle(pool, seed) : pickN(pool,pool.length);
  const out=[];
  let i=0;
  while(out.length<count && shuffled.length){ out.push(shuffled[i%shuffled.length]); i++; }
  return out;
}
/* Partition each section into 5 disjoint form pools (round-robin over a seeded
   shuffle => even size and difficulty spread; stable across sessions). */
const FORM_SEED=20260721;
let _formPools={};
function formPools(sec){
  if(_formPools[sec]) return _formPools[sec];
  const shuffled=seededShuffle(QUESTIONS.filter(q=>q.sec===sec), FORM_SEED+(sec==='rw'?1:2));
  const parts=[[],[],[],[],[]];
  shuffled.forEach((q,i)=>parts[i%5].push(q));
  _formPools[sec]=parts; return parts;
}

      az.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ haptic('tap'); answers[idx]=Number(b.dataset.i); paint(); });

    container.querySelector('#next').onclick=()=>{ if(idx+1<queue.length){idx++;paint();} else { stop(); autoFinish(); } };

    </div>`).join('') : `<div class="empty">No completed full-length runs yet.</div>`;

  // per-difficulty accuracy
  const dstat=['E','M','H'].map(d=>{

    return `<div class="k"><div class="v">${rows.length?acc+'%':'—'}</div><div class="l">${({E:'Easy',M:'Medium',H:'Hard'})[d]} acc</div></div>`;
  }).join('');

      <div class="chart-wrap">${spark}</div>
    </div>
    <div class="card">
      <h2>Accuracy by difficulty</h2>
      <div class="kpi" style="margin-top:12px">${dstat}</div>
    </div>
    <div class="card"><h2>Completed runs</h2><div class="sub">Full-length and exam estimates.</div>${runs}</div>
  </div>`;
}
function projectionSeries(){
  // recompute projected total at each 5-question checkpoint by replaying the log
  const log=STATE.log;
  if(log.length<2) return [];
  const saved=STATE.log;
  const out=[];
  const step=Math.max(1,Math.floor(log.length/24));
  for(let i=step;i<=log.length;i+=step){
    STATE.log=saved.slice(0,i);
    out.push(projectedTotal());
  }
  STATE.log=saved;
  return out;
}
function sparkSVG(series){
  const w=560,hgt=180,pad=28;
  const scale=CONFIG.scales[STATE.target];
  const lo=scale.total[0],hi=scale.total[1];
  const n=series.length;
  const x=i=>pad+(w-2*pad)*(i/(n-1));
  const y=val=>hgt-pad-(hgt-2*pad)*((val-lo)/(hi-lo));
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${pad},${hgt-pad} ${pts} ${(w-pad)},${hgt-pad}`;
  const grid=[0,.25,.5,.75,1].map(f=>{
    const yy=hgt-pad-(hgt-2*pad)*f; const val=Math.round(lo+f*(hi-lo));
    return `<line x1="${pad}" y1="${yy}" x2="${w-pad}" y2="${yy}" stroke="#1a2c48" stroke-width="1"/>
            <text x="4" y="${yy+3}" fill="#6d84a6" font-size="9">${val}</text>`;
  }).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none" role="img" aria-label="Score trend">
    <defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(47,155,255,.4)"/><stop offset="1" stop-color="rgba(47,155,255,0)"/></linearGradient></defs>
    ${grid}
    <polygon points="${area}" fill="url(#sp)"/>
    <polyline points="${pts}" fill="none" stroke="#2f9bff" stroke-width="2.5"/>
    ${series.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#f2c14e"/>`).join('')}
  </svg>`;
}

      <div class="center"><div class="gauge-score" style="font-size:44px">${total}</div><div class="muted">projected ${scale.name}</div>
        <div style="color:var(--gold);font-size:12.5px;font-weight:600;margin-top:2px">Goal ${goal}</div></div>
    </div>
    <div class="kpi" style="margin:16px 0">
      <div class="k"><div class="v">${rw}</div><div class="l">Reading/Writing</div></div>
      <div class="k"><div class="v">${math}</div><div class="l">Math</div></div>
      <div class="k"><div class="v">${answered}</div><div class="l">Questions done</div></div>
      <div class="k"><div class="v">${acc}%</div><div class="l">Overall accuracy</div></div>
    </div>
    <h3 style="margin:8px 0">Domain mastery (blueprint-weighted)</h3>
    ${bars}
    <h3 style="margin:16px 0 6px">Recent full-length runs</h3>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="text-align:left;color:var(--muted)"><th style="padding:6px">Section</th><th>Est.</th><th>Raw</th><th>Route</th></tr></thead>
      <tbody>${runs}</tbody>
    </table>
    <p class="muted" style="font-size:12px;margin-top:14px">The projection blends your difficulty-weighted accuracy with a motivated-student baseline that fades as you complete more questions, then scales to the ${scale.name} range. Goal is your chosen target. These are practice indicators, not official scores.</p>
  </div>`;
  if(typeof window!=='undefined' && window.scrollTo) window.scrollTo(0,0);
}

/* ---------------------------------------------------------------------------
   BOOT
   ------------------------------------------------------------------------- */
function boot(){ renderNav(); go('dashboard'); }
if(hasDoc){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
}

/* expose for smoke harness / console */
if(typeof window!=='undefined'){
  window.ScoreLab={ QUESTIONS, CONFIG, parseNum, sprCorrect, projectedTotal, projectedSection,
    domainMastery, sectionMastery, recordAttempt, mistakeIds, get STATE(){return STATE;}, go, buildReport,
    mathHTML, mathText, buildModule1, buildModule2, fillModule, routeDecision, estimateSectionScore,
    weightedDraw, FULL_SPEC, formPools, FORMS };
}
if(typeof module!=='undefined' && module.exports){
  module.exports={ QUESTIONS, CONFIG, parseNum, sprCorrect, projectedTotal, projectedSection,
    domainMastery, sectionMastery, mistakeIds };
}
</script>
